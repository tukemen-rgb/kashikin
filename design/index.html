<title>貸金業務取扱主任者 デザインシステム</title>
<style>
:root{
  --pri:#0F7A3C; --hdr:#0A5A2C;
  --bg:#F1F2F4; --surface:#FFFFFF; --sunken:#EDEFF2;
  --ink:#14181D; --ink-2:#4E5560; --ink-3:#7C838F;
  --rule:#D4D8DE; --rule-2:#E3E6EA;
  --f:Meiryo,"メイリオ","Meiryo UI","Hiragino Sans","Noto Sans JP",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --pri:#4FC182; --hdr:#0B2318;
  --bg:#111419; --surface:#191D23; --sunken:#22272F;
  --ink:#E9ECF1; --ink-2:#A6ADB9; --ink-3:#79808C;
  --rule:#2E343D; --rule-2:#242931;
}}
:root[data-theme="dark"]{
  --pri:#4FC182; --hdr:#0B2318;
  --bg:#111419; --surface:#191D23; --sunken:#22272F;
  --ink:#E9ECF1; --ink-2:#A6ADB9; --ink-3:#79808C;
  --rule:#2E343D; --rule-2:#242931;
}
:root[data-theme="light"]{
  --pri:#0F7A3C; --hdr:#0A5A2C;
  --bg:#F1F2F4; --surface:#FFFFFF; --sunken:#EDEFF2;
  --ink:#14181D; --ink-2:#4E5560; --ink-3:#7C838F;
  --rule:#D4D8DE; --rule-2:#E3E6EA;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);
     font-size:14px;line-height:1.7;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:var(--hdr);color:#fff;
     border-bottom:2px solid #C6402A;display:flex;align-items:center;gap:10px;
     padding:8px 14px;min-height:48px}
.top h1{font-size:15.5px;font-weight:700;margin:0}
.top .sub{font-size:10.5px;opacity:.72;font-weight:400;display:block;margin-top:1px}
.top .sp{flex:1}
.tb{background:transparent;border:1px solid rgba(255,255,255,.34);border-radius:3px;
    padding:5px 9px;font-size:12.5px;color:#fff;white-space:nowrap}
.tb:hover{background:rgba(255,255,255,.12)}
.lay{display:grid;grid-template-columns:246px minmax(0,1fr);
     height:calc(100vh - 50px);height:calc(100dvh - 50px)}
nav{border-right:1px solid var(--rule);background:var(--surface);overflow-y:auto;padding-bottom:20px}
.grp{font-size:10.5px;color:var(--ink-3);padding:14px 14px 6px;letter-spacing:.06em}
.nv{display:block;width:100%;text-align:left;background:none;border:none;
    border-top:1px solid var(--rule-2);padding:9px 14px}
.nv:hover{background:var(--sunken)}
.nv[aria-current="true"]{background:var(--sunken);
    box-shadow:inset 4px 0 0 var(--pri)}
.nv .n{display:block;font-size:13.5px;font-weight:700;line-height:1.45}
.nv .s{display:block;font-size:10.5px;color:var(--ink-3);line-height:1.55;margin-top:1px}
main{overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.meta{padding:11px 16px;border-bottom:1px solid var(--rule);background:var(--surface)}
.meta b{font-size:14.5px}
.meta code{font-family:ui-monospace,monospace;font-size:11px;color:var(--ink-3);margin-left:9px}
iframe{flex:1;width:100%;border:none;background:var(--bg)}
@media (max-width:720px){
  .lay{grid-template-columns:1fr;height:auto}
  nav{border-right:none;border-bottom:1px solid var(--rule);max-height:210px}
  iframe{height:78vh;flex:none}
}
</style>
<header class="top">
  <h1>貸金業務取扱主任者<span class="sub">デザインシステム ／ 過去問1000</span></h1>
  <div class="sp"></div>
  <button class="tb" id="tg" type="button">表示</button>
</header>
<div class="lay">

  <main><div class="meta" id="meta"></div><iframe id="fr" title="プレビュー"></iframe></main>
</div>

x;font-weight:700\">弱点診断</span></div><div><span class=\"k\">h2 / 13.5px 700</span><span style=\"font-size:13.5px;font-weight:700\">足を引っ張っているところ</span></div><div><span class=\"k\">本文 / 14.5px</span><span>解答履歴から弱点と復習期日を見て出題します</span></div><div><span class=\"k\">設問 / 15.5px 1.95</span><span style=\"font-family:var(--disp);font-size:var(--qsize)\">貸金業法第13条の2第2項に規定する</span></div><div><span class=\"k\">補足 / 11.5px</span><span style=\"font-size:11.5px;color:var(--ink-3)\">20回中19回・計33問出ています</span></div><div><span class=\"k\">数字 / tabular</span><span style=\"font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:22px\">0/1000</span></div></div><p class=\"ds-note\">日本語の資格試験アプリで確実に入っている書体がメイリオなので、ヒラギノ・Noto Sans JP へ落ちる場合も含めて1系統に統一している。数字が縦に揃う箇所はすべて <code>font-variant-numeric: tabular-nums</code>。</p><div class=\"ds-h\">長文の組み方（本文は一字も変えない）</div><div class=\"qbox\"><div class=\"stem\"><span class=\"s lead\">貸金業者であるＡ社は、Ｂとの間で貸付けに係る契約<span class=\"dim\">（以下、本問において「本件貸付契約」という。）</span>を締結するに当たり、その内容が<span class=\"cue\">適切でないもの</span>を1つだけ選びなさい。</span><span class=\"s\">なお、本問におけるすべての貸付けに係る契約は、住宅資金貸付契約ではないものとする。</span></div></div><p class=\"ds-note\">括弧の外にある「。」で文を割って改行し、字下げする。定義の括弧書きは濃度を落とす。着目語は朱の下線。足す・削る・置き換えるは一切していない（全1000問で自動検証、不一致0件）。</p>\n</div>\n"}, {"path": "components/buttons.html", "group": "Components", "name": "ボタン", "sub": "主動線・下部バー・解答後の枝分かれ・出題条件", "html": "<!-- @dsCard group=\"Components\" name=\"ボタン\" subtitle=\"主動線・下部バー・解答後の枝分かれ・出題条件\" -->\n<style>\n/* 配色は市販の過去問アプリ／問題集にならい、主色1色＋朱の強調で組んでいる。\n   影とグラデーションは使わず、面は罫線だけで区切る。 */\n:root{\n  /* 使う色は4つだけ。深緑＝操作、朱＝先へ進む／誤り、紺＝できた、紫＝あとで見直す。\n     主色の深緑は、同ジャンル上位（宅建・行政書士・ITパスポートの過去問アプリ）の実測値に合わせた。 */\n  --pri:#0F7A3C; --pri-2:#0A5C2C; --pri-soft:#E5F1E9;\n  --acc:#C6402A; --acc-2:#A93321;\n  --ok:#215DB3; --ok-2:#184A93;\n  --vio:#A463D8; --vio-2:#8A4CBD; --vio-soft:#F2EAF9;\n  --ng:var(--acc); --gold:var(--ok);\n  --sec1:var(--pri); --sec2:var(--acc); --sec3:var(--ok); --sec4:var(--vio);\n  --bg:#F1F2F4; --surface:#FFFFFF; --s </span><span class=\"bd\">個人顧客を相手方とする不動産の建設もしくは購入に必要な資金に係る契約は、個人顧客の利益の保護に支障を生ずることがない契約に該当しない。</span></button><button class=\"opt\"><span class=\"m\">②</span><span class=\"bd\">売却を予定している個人顧客の不動産の売却代金により弁済される貸付けに係る契約であって、当該個人顧客の返済能力を超えないと認められるもの。</span></button></div><div class=\"ds-h\">解答後</div><div class=\"verdict ng\"><span class=\"r\">不正解</span><span class=\"a\">正答 ①　選択 ②　0:41</span></div><div class=\"opts\"><button class=\"opt correct\" disabled><span class=\"m\">①</span><span class=\"bd\">個人顧客を相手方とする不動産の建設もしくは購入に必要な資金に係る契約。</span><svg class=\"mark\" viewBox=\"0 0 40 40\" style=\"--len:100\"><circle cx=\"20\" cy=\"20\" r=\"15\"/></svg></button><button class=\"opt wrong picked\" disabled><span class=\"m\">②</span><span class=\"bd\">売却を予定している個人顧客の不動産の売却代金により弁済される貸付けに係る契約。</span><svg class=\"mark\" viewBox=\"0 0 40 40\" style=\"--len:40\"><path d=\"M9 9 L31 31\"/><path class=\"s2\" d=\"M31 9 L9 31\"/></svg></button></div><div class=\"ds-h\">この問題で狙われている点</div><div class=\"traps\"><div class=\"tl\">この問題で狙われている点</div><div class=\"ti\"><b>含む・含まない</b>「含まれる」と「含まれない」の入れ替えです。定義に何が入って何が入らないかを、境界の例で押さえてください。</div></div><p class=\"ds-note\">正解は紺、不正解は朱。〇と✕はどちらも朱で手書き風に引く（日本の採点は〇も✕も赤ペンなので、色では区別しない）。本文は原文のまま。改行・濃度・下線だけで読みやすさを作る。</p>\n</div>\n"}, {"path": "components/statements.html", "group": "Components", "name": "記述カード", "sub": "ａ〜ｄに○×を付ける（個数・組合せ問題）", "html": "<!-- @dsCard group=\"Components\" name=\"記述カード\" subtitle=\"ａ〜ｄに○×を付ける（個数・組合せ問題）\" -->\n<style>\n/* 配色は市販の過去問アプリ／問題集にならい、主色1色＋朱の強調で組んでいる。\n   影とグラデーションは使わず、面は罫線だけで区切る。 */\n:root{\n  /* 使う色は4つだけ。深緑＝操作、朱＝先へ進む／誤り、紺＝できた、紫＝あとで見直す。\n     主色の深緑は、同ジャンル上位（宅建・行政書士・ITパスポートの過去問アプリ）の実測値に合わせた。 */\n  --pri:#0F7A3C; --pri-2:#0A5C2C; --pri-soft:#E5F1E9;\n  --acc:#C6402A; --acc-2:#A93321;\n  --ok:#215DB3; --ok-2:#184A93;\n  --vio:#A463D8; --vio-2:#8A4CBD; --vio-soft:#F2EAF9;\n  --ng:var(--acc); --gold:var(--ok);\n  --sec1:var(--pri); --sec2:var(--acc); --sec3:var(--ok); --sec4:var(--vio);\n  --bg:#F1F2F4; --surface:#FFFFFF; --sunken:#EDEFF2 v><div class=\"tally\">○ <b>1</b> ／ × 1 ／ 未 2</div><p class=\"ds-note\">個数問題・組合せ問題では、記述を1枚ずつのカードにして○×を切り替えられるようにしている。○の数がその場で出るので、「適切なものの個数」を数え直さずに済む。</p>\n</div>\n"}, {"path": "components/tags.html", "group": "Components", "name": "タグ", "sub": "分野・出題形式・否定形・頻出・診断の種別", "html": "<!-- @dsCard group=\"Components\" name=\"タグ\" subtitle=\"分野・出題形式・否定形・頻出・診断の種別\" -->\n<style>\n/* 配色は市販の過去問アプリ／問題集にならい、主色1色＋朱の強調で組んでいる。\n   影とグラデーションは使わず、面は罫線だけで区切る。 */\n:root{\n  /* 使う色は4つだけ。深緑＝操作、朱＝先へ進む／誤り、紺＝できた、紫＝あとで見直す。\n     主色の深緑は、同ジャンル上位（宅建・行政書士・ITパスポートの過去問アプリ）の実測値に合わせた。 */\n  --pri:#0F7A3C; --pri-2:#0A5C2C; --pri-soft:#E5F1E9;\n  --acc:#C6402A; --acc-2:#A93321;\n  --ok:#215DB3; --ok-2:#184A93;\n  --vio:#A463D8; --vio-2:#8A4CBD; --vio-soft:#F2EAF9;\n  --ng:var(--acc); --gold:var(--ok);\n  --sec1:var(--pri); --sec2:var(--acc); --sec3:var(--ok); --sec4:var(--vio);\n  --bg:#F1F2F4; --surface:#FFFFFF; --sunken:#EDEFF2;\n  --ink:#14181D; --ink-2:#4E5560; --ink-3:#7C838F; --ink-4:#A9B0BA;\n  --rule:#D4D8DE; --rule-2:#E3E6EA; --on-pri:#fff;\n  --hdr:#0A5A2C; --hdr-ink:#FFFFFF; --hdr-line:rgba(255,255,255,.34); --on-acc:#fff;\n  --foil:#A8791F; --foil-2:#E3C46A;       /* 段位・実績・合格証の箔。分野色ではない */\n  --field-1:#0C5730; --field-2:#083D22;   /* 合格証の地 */\n  --seal:#B3301F;                          /* 朱印 */\n  --shadow:none;\n  --disp:Meiryo,\"メイリオ\",\"Meiryo UI\",\"Hiragino Sans\",\"Noto Sans JP\",sans-serif;\n  --gothic:Meiryo,\"メイリオ\",\"Meiryo UI\",\"Hiragino Sans\",\"Noto Sans JP\",sans-serif;\n  --mono:Meiryo,\"メイリオ\",\"Meiryo UI\",ui-monospace,monospace;\n  --r:4px; --rs:3px; --qsize:15.5px; --qlh:1.95;\n}\n@media (prefers-color-scheme:dark){:root{\n  --pri:#3BA968; --pri-2:#59C184; --pri-soft:#132A1E;\n  --acc:#DE6446; --acc-2:#F07E60;\n  --ok:#4C7FD6; --ok-2:#6E9AE4;\n  --vio:#C662BC; --vio-2:#D67FCD; --vio-soft:#2C1F2B;\n  --ng:var(--acc); --gold:var(--ok);\n  --sec1:var(--pri); --sec2:var(--acc); --sec3:var(--ok); --sec4:var(--vio);\n  --bg:#111419; --surface:#191D23; --sunken:#22272F;\n  --in e:18.5px;--qlh:2.1}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);\n     font-family:var(--gothic);font-size:14.5px;line-height:1.8;\n     -webkit-text-size-adjust:100%}\nbutton,select{font:inherit;color:inherit;cursor:pointer}\n:focus-visible{outline:2px solid var(--pri-2);outline-offset:2px}\n@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\n.ds{padding:20px 18px;display:flex;flex-direction:column;gap:18px;max-width:820px}\n.ds-h{font-size:11px;letter-spacing:.06em;color:var(--ink-3);\n      border-left:3px solid var(--pri);padding-left:8px;line-height:1.5}\n.ds-note{font-size:11.5px;color:var(--ink-3);line-height:1.75}\n.tag.theme{border-color:var(--pri);background:var(--pri-soft);color:var(--pri)}\n.dk{font-size:10.5px;color:var(--on-pri);background:var(--pri);\n    border-radius:2px;padding:3px 8px;font-weight:700}\n.qmeta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:11px;font-size:11.5px}\n.tag{border:1px solid var(--rule);border-radius:2px;padding:2px 8px;color:var(--ink-2);\n     font-size:11px;font-weight:600}\n.tag.sec{border:none;color:var(--on-pri);font-family:var(--gothic);letter-spacing:.04em}\n.tag.neg{border-color:var(--ng);color:var(--ng)}\n.tag.hot{border-color:var(--vio);color:var(--vio)}\n.dk{display:inline-block}\n\n</style>\n<div class=\"ds\">\n<div class=\"ds-h\">設問の見出しに付くもの</div><div class=\"qmeta\"><span class=\"tag sec\" style=\"background:var(--sec1)\">法令</span><span class=\"tag\">第7回 問22</span><span class=\"tag\">単純択一</span><span class=\"tag neg\">否定形</span></div><div class=\"qmeta\"><span class=\"tag theme\">総量規制・過剰貸付けの禁止</span><span class=\"tag hot\">頻出</span><span class=\"tag\">2回目・誤1</span></div><div class=\"ds-h\">4分野</div><div class=\"qmeta\"><span class=\"tag sec\" style=\"background:var(--sec1)\">法令</span><span class=\"tag sec\" style=\"background:var(--sec2)\">貸付実務</span><span class=\"tag sec\" style=\"background:var(--sec3)\">資金需要者保護</span><span class=\"tag sec\" style=\"background:var(--sec4)\">財務会計</span></div><div class=\"ds-h\">診断カードの種別</div><div class=\"qmeta\"><span class=\"dk\">テーマ</span>　<span class=\"dk\">引っかけ</span>　<span class=\"dk\">読み方</span>　<span class=\"dk\">形式</span></div><p class=\"ds-note\">分野のタグだけがベタ塗り。ほかは枠線のみで、否定形は朱、頻出は紫。ベタ塗りを1種類に絞ることで、どれが分野なのかを色を覚えなくても判別できる。</p>\n</div>\n"}];
const fr=document.getElementById('fr'),meta=document.getElementById('meta');
const btns=[...document.querySelectorAll('.nv')];
function show(i){
  const c=CARDS[i];
  btns.forEach(b=>b.setAttribute('aria-current',String(+b.dataset.i===i)));
  meta.innerHTML='<b>'+c.name+'</b><code>'+c.path+'</code>';
  const t=document.documentElement.getAttribute('data-theme');
  fr.srcdoc=(t?'<script>document.documentElement.setAttribute("data-theme","'+t+'")<\/script>':'')+c.html;
  try{location.hash=c.path}catch(e){}
}
fr.addEventListener('load',()=>{
  const t=document.documentElement.getAttribute('data-theme');
  const d=fr.contentDocument;
  if(d){ if(t) d.documentElement.setAttribute('data-theme',t);
          else d.documentElement.removeAttribute('data-theme'); }
});
btns.forEach(b=>b.onclick=()=>show(+b.dataset.i));
const tg=document.getElementById('tg');
tg.onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme')
    ||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  document.documentElement.setAttribute('data-theme',cur==='dark'?'light':'dark');
  show(btns.findIndex(b=>b.getAttribute('aria-current')==='true')||0);
};
const h=decodeURIComponent(location.hash.slice(1));
show(Math.max(0,CARDS.findIndex(c=>c.path===h)));
</script>
