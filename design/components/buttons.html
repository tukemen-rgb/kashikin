<style>
/* 配色は市販の過去問アプリ／問題集にならい、主色1色＋朱の強調で組んでいる。
   影とグラデーションは使わず、面は罫線だけで区切る。 */
:root{
  /* 使う色は4つだけ。深緑＝操作、朱＝先へ進む／誤り、紺＝できた、紫＝あとで見直す。
     主色の深緑は、同ジャンル上位（宅建・行政書士・ITパスポートの過去問アプリ）の実測値に合わせた。 */
  --pri:#0F7A3C; --pri-2:#0A5C2C; --pri-soft:#E5F1E9;
  --acc:#C6402A; --acc-2:#A93321;
  --ok:#215DB3; --ok-2:#184A93;
  --vio:#A463D8; --vio-2:#8A4CBD; --vio-soft:#F2EAF9;
  --ng:var(--acc); --gold:var(--ok);
  --sec1:var(--pri); --sec2:var(--acc); --sec3:var(--ok); --sec4:var(--vio);
  --bg:#F1F2F4; --surface:#FFFFFF; --sunken:#EDEFF2;
  --ink:#14181D; --ink-2:#4E5560; --ink-3:#7C838F; --ink-4:#A9B0BA;
  --rule:#D4D8DE; --rule-2:#E3E6EA; --on-pri:#fff;
  --hdr:#0A5A2C; --hdr-ink:#FFFFFF; --hdr-line:rgba(255,255,255,.34); --on-acc:#fff;
  --foil:#A8791F; --foil-2:#E3C46A;       /* 段位・実績・合格証の箔。分野色ではない */
  --field-1:#0C5730; --field-2:#083D22;   /* 合格証の地 */
  --seal:#B3301F;                          /* 朱印 */
  --shadow:none;
  --disp:Meiryo,"メイリオ","Meiryo UI","Hiragino Sans","Noto Sans JP",sans-serif;
  --gothic:Meiryo,"メイリオ","Meiryo UI","Hiragino Sans","Noto Sans JP",sans-serif;
  --mono:Meiryo,"メイリオ","Meiryo UI",ui-monospace,monospace;
  --r:4px; --rs:3px; --qsize:15.5px; --qlh:1.95;
}
@media (prefers-color-scheme:dark){:root{
  --pri:#3BA968; --pri-2:#59C184; --pri-soft:#132A1E;
  --acc:#DE6446; --acc-2:#F07E60;
  --ok:#4C7FD6; --ok-2:#6E9AE4;
  --vio:#C662BC; --vio-2:#D67FCD; --vio-soft:#2C1F2B;
  --ng:var(--acc); --gold:var(--ok);
  --sec1:var(--pri); --sec2:var(--acc); --sec3:var(--ok); --sec4:var(--vio);
  --bg:#111419; --surface:#191D23; --sunken:#22272F;
  --ink:#E9ECF1; --ink-2:#A6ADB9; --ink-3:#79808C; --ink-4:#565D68;
  --rule:#2E343D; --rule-2:#242931; --on-pri:#111419;
  --hdr:#0B2318; --hdr-ink:#E9ECF1; --hdr-line:rgba(255,255,255,.22); --on-acc:#111419;
  --foil:#D9B45C; --foil-2:#F0DB9E;
  --field-1:#0E4A2C; --field-2:#07301C;
  --seal:#E05A46;
  --shadow:none;
}}
:root[data-theme="dark"]{
  --pri:#3BA968; --pri-2:#59C184; --pri-soft:#132A1E;
  --acc:#DE6446; --acc-2:#F07E60;
  --ok:#4C7FD6; --ok-2:#6E9AE4;
  --vio:#C662BC; --vio-2:#D67FCD; --vio-soft:#2C1F2B;
  --ng:var(--acc); --gold:var(--ok);
  --sec1:var(--pri); --sec2:var(--acc); --sec3:var(--ok); --sec4:var(--vio);
  --bg:#111419; --surface:#191D23; --sunken:#22272F;
  --ink:#E9ECF1; --ink-2:#A6ADB9; --ink-3:#79808C; --ink-4:#565D68;
  --rule:#2E343D; --rule-2:#242931; --on-pri:#111419;
  --hdr:#0B2318; --hdr-ink:#E9ECF1; --hdr-line:rgba(255,255,255,.22); --on-acc:#111419;
  --foil:#D9B45C; --foil-2:#F0DB9E;
  --field-1:#0E4A2C; --field-2:#07301C;
  --seal:#E05A46;
  --shadow:none;
}
:root[data-theme="light"]{
  /* 使う色は4つだけ。深緑＝操作、朱＝先へ進む／誤り、紺＝できた、紫＝あとで見直す。
     主色の深緑は、同ジャンル上位（宅建・行政書士・ITパスポートの過去問アプリ）の実測値に合わせた。 */
  --pri:#0F7A3C; --pri-2:#0A5C2C; --pri-soft:#E5F1E9;
  --acc:#C6402A; --acc-2:#A93321;
  --ok:#215DB3; --ok-2:#184A93;
  --vio:#A463D8; --vio-2:#8A4CBD; --vio-soft:#F2EAF9;
  --ng:var(--acc); --gold:var(--ok);
  --sec1:var(--pri); --sec2:var(--acc); --sec3:var(--ok); --sec4:var(--vio);
  --bg:#F1F2F4; --surface:#FFFFFF; --sunken:#EDEFF2;
  --ink:#14181D; --ink-2:#4E5560; --ink-3:#7C838F; --ink-4:#A9B0BA;
  --rule:#D4D8DE; --rule-2:#E3E6EA; --on-pri:#fff;
  --hdr:#0A5A2C; --hdr-ink:#FFFFFF; --hdr-line:rgba(255,255,255,.34); --on-acc:#fff;
  --foil:#A8791F; --foil-2:#E3C46A;       /* 段位・実績・合格証の箔。分野色ではない */
  --field-1:#0C5730; --field-2:#083D22;   /* 合格証の地 */
  --seal:#B3301F;                          /* 朱印 */
  --shadow:none;
}
:root[data-size="s"]{--qsize:15px;--qlh:1.85}
:root[data-size="l"]{--qsize:18.5px;--qlh:2.1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
     font-family:var(--gothic);font-size:14.5px;line-height:1.8;
     -webkit-text-size-adjust:100%}
button,select{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--pri-2);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.ds{padding:20px 18px;display:flex;flex-direction:column;gap:18px;max-width:820px}
.ds-h{font-size:11px;letter-spacing:.06em;color:var(--ink-3);
      border-left:3px solid var(--pri);padding-left:8px;line-height:1.5}
.ds-note{font-size:11.5px;color:var(--ink-3);line-height:1.75}
.tbtn{background:transparent;border:1px solid var(--hdr-line);border-radius:3px;
      padding:5px 9px;font-size:12.5px;color:var(--hdr-ink);white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.12)}
.cta{width:100%;background:var(--acc);color:var(--on-acc);border:none;border-radius:var(--rs);
     padding:15px;font-size:16.5px;font-weight:700;letter-spacing:.04em}
.cta:hover{background:var(--acc-2)}
.cta[disabled]{opacity:.4;cursor:not-allowed}
.setrow{display:flex;gap:6px;flex-wrap:wrap}
.setrow label{flex:1;min-width:104px;display:flex;flex-direction:column;gap:3px}
.setrow .lb{font-size:10.5px;color:var(--ink-3)}
.setrow select{width:100%;background:var(--surface);border:1px solid var(--rule);
               border-radius:var(--rs);padding:8px 9px;font-size:13px;color:var(--ink);font-weight:600}
.setrow select:hover{border-color:var(--pri)}
.dgo{margin-top:11px;background:var(--pri);border:none;border-radius:var(--rs);
     padding:8px 16px;font-size:12.5px;color:var(--on-pri);font-weight:700}
.dgo:hover{background:var(--pri-2)}
.after{display:flex;gap:7px;flex-wrap:wrap;margin:-6px 0 15px}
.after button{background:var(--pri-soft);border:1px solid var(--rule);border-radius:2px;
              padding:6px 13px;font-size:12px;color:var(--pri);font-weight:600}
.after button:hover:not([disabled]){border-color:var(--pri);color:var(--pri)}
.after button[disabled]{cursor:default;color:var(--ink-4);border-style:dashed}
.next{background:var(--acc);color:var(--on-acc);border:none;border-radius:var(--rs);
      padding:11px 34px;font-size:14.5px;font-weight:700;letter-spacing:.04em}
.next:hover{background:var(--acc-2)}
.ghost{background:none;border:1px solid var(--rule);border-radius:2px;
       padding:9px 15px;font-size:13px;color:var(--ink-2)}
.ghost:hover{border-color:var(--pri);color:var(--pri)}
.ghost[aria-pressed="true"]{border-color:var(--vio);color:var(--vio);background:var(--vio-soft)}
.ghost[disabled]{opacity:.4}
.setrow label{min-width:88px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar-demo{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:8px 14px}
.bar-demo .inner{display:flex;gap:8px;align-items:center}
.bar-demo .spacer{flex:1}

</style>
<div class="ds">
<div class="ds-h">主動線（1画面に1つだけ）</div><button class="cta">学習をはじめる</button><div class="ds-h">演習中の下部バー</div><div class="bar-demo"><div class="inner"><button class="ghost">前へ</button><button class="ghost" aria-pressed="true">付箋</button><span class="spacer"></span><button class="next">次へ</button></div></div><div class="ds-h">解答後の枝分かれ</div><div class="after"><button>似ている問題 5問</button><button>「総量規制・過剰貸付けの禁止」をまとめて</button><button disabled>貸金業法第13条の2</button></div><div class="ds-h">診断からの導線</div><div class="row"><button class="dgo">この型だけ演習する</button></div><div class="ds-h">出題条件</div><div class="setrow"><label><span class="lb">問題数</span><select><option>20問</option></select></label><label><span class="lb">出題の狙い</span><select><option>おまかせ（弱点＋復習）</option></select></label><label><span class="lb">範囲</span><select><option>全1000問</option></select></label></div><p class="ds-note">朱は「先へ進む」だけに使う。ホームの「学習をはじめる」と演習中の「次へ」がそれに当たり、同じ画面に2つ出ることはない。付箋は押されているあいだ紫（あとで見直す）。</p>
</div>
