<!-- @dsCard group="Components" name="ヘッダーバー" subtitle="ホーム／演習中／模試の3状態" -->
<style>
/* 配色は市販の過去問アプリ／問題集にならい、主色1色＋朱の強調で組んでいる。
   影とグラデーションは使わず、面は罫線だけで区切る。 */
:root{
  /* 使う色は4つだけ。深緑＝操作、朱＝先へ進む／誤り、紺＝できた、紫＝あとで見直す。
     主色の深緑は、同ジャンル上位（宅建・行政書士・ITパスポートの過去問アプリ）の実測値に合わせた。 */
  --pri:#0F7A3C; --pri-2:#0A5C2C; --pri-soft:#E5F1E9;
  --acc:#C6402A; --acc-2:#A93321;
  --ok:#215DB3; --ok-2:#184A93;
  --vio:#A463D8; --vio-2:#8A4CBD; --vio-soft:#F2EAF9;
  --ng:var(--acc); --gold:var(--ok);
  --sec1:var(--pri); --sec2:var(--acc); --sec3:var(--ok); --sec4:var(--vio);
  --bg:#F1F2F4; --surface:#FFFFFF; --sunken:#EDEFF2;
  --ink:#14181D; --ink-2:#4E5560; --ink-3:#7C838F; --ink-4:#A9B0BA;
  --rule:#D4D8DE; --rule-2:#E3E6EA; --on-pri:#fff;
  --hdr:#0A5A2C; --hdr-ink:#FFFFFF; --hdr-line:rgba(255,255,255,.34); --on-acc:#fff;
  --shadow:none;
  --disp:Meiryo,"メイリオ","Meiryo UI","Hiragino Sans","Noto Sans JP",sans-serif;
  --gothic:Meiryo,"メイリオ","Meiryo UI","Hiragino Sans","Noto Sans JP",sans-serif;
  --mono:Meiryo,"メイリオ","Meiryo UI",ui-monospace,monospace;
  --r:4px; --rs:3px; --qsize:15.5px; --qlh:1.95;
}
@media (prefers-color-scheme:dark){:root{
  --pri:#3BA968; --pri-2:#59C184; --pri-soft:#132A1E;
  --acc:#DE6446; --acc-2:#F07E60;
  --ok:#4C7FD6; --ok-2:#6E9AE4;
  --vio:#C662BC; --vio-2:#D67FCD; --vio-soft:#2C1F2B;
  --ng:var(--acc); --gold:var(--ok);
  --sec1:var(--pri); --sec2:var(--acc); --sec3:var(--ok); --sec4:var(--vio);
  --bg:#111419; --surface:#191D23; --sunken:#22272F;
  --ink:#E9ECF1; --ink-2:#A6ADB9; --ink-3:#79808C; --ink-4:#565D68;
  --rule:#2E343D; --rule-2:#242931; --on-pri:#111419;
  --hdr:#0B2318; --hdr-ink:#E9ECF1; --hdr-line:rgba(255,255,255,.22); --on-acc:#111419;
  --shadow:none;
}}
:root[data-theme="dark"]{
  --pri:#3BA968; --pri-2:#59C184; --pri-soft:#132A1E;
  --acc:#DE6446; --acc-2:#F07E60;
  --ok:#4C7FD6; --ok-2:#6E9AE4;
  --vio:#C662BC; --vio-2:#D67FCD; --vio-soft:#2C1F2B;
  --ng:var(--acc); --gold:var(--ok);
  --sec1:var(--pri); --sec2:var(--acc); --sec3:var(--ok); --sec4:var(--vio);
  --bg:#111419; --surface:#191D23; --sunken:#22272F;
  --ink:#E9ECF1; --ink-2:#A6ADB9; --ink-3:#79808C; --ink-4:#565D68;
  --rule:#2E343D; --rule-2:#242931; --on-pri:#111419;
  --hdr:#0B2318; --hdr-ink:#E9ECF1; --hdr-line:rgba(255,255,255,.22); --on-acc:#111419;
  --shadow:none;
}
:root[data-theme="light"]{
  /* 使う色は4つだけ。深緑＝操作、朱＝先へ進む／誤り、紺＝できた、紫＝あとで見直す。
     主色の深緑は、同ジャンル上位（宅建・行政書士・ITパスポートの過去問アプリ）の実測値に合わせた。 */
  --pri:#0F7A3C; --pri-2:#0A5C2C; --pri-soft:#E5F1E9;
  --acc:#C6402A; --acc-2:#A93321;
  --ok:#215DB3; --ok-2:#184A93;
  --vio:#A463D8; --vio-2:#8A4CBD; --vio-soft:#F2EAF9;
  --ng:var(--acc); --gold:var(--ok);
  --sec1:var(--pri); --sec2:var(--acc); --sec3:var(--ok); --sec4:var(--vio);
  --bg:#F1F2F4; --surface:#FFFFFF; --sunken:#EDEFF2;
  --ink:#14181D; --ink-2:#4E5560; --ink-3:#7C838F; --ink-4:#A9B0BA;
  --rule:#D4D8DE; --rule-2:#E3E6EA; --on-pri:#fff;
  --hdr:#0A5A2C; --hdr-ink:#FFFFFF; --hdr-line:rgba(255,255,255,.34); --on-acc:#fff;
  --shadow:none;
}
:root[data-size="s"]{--qsize:15px;--qlh:1.85}
:root[data-size="l"]{--qsize:18.5px;--qlh:2.1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
     font-family:var(--gothic);font-size:14.5px;line-height:1.8;
     -webkit-text-size-adjust:100%}
button,select{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--pri-2);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.ds{padding:20px 18px;display:flex;flex-direction:column;gap:18px;max-width:820px}
.ds-h{font-size:11px;letter-spacing:.06em;color:var(--ink-3);
      border-left:3px solid var(--pri);padding-left:8px;line-height:1.5}
.ds-note{font-size:11.5px;color:var(--ink-3);line-height:1.75}
.top{position:sticky;top:0;z-index:30;background:var(--hdr);color:var(--hdr-ink);
     border-bottom:2px solid var(--acc);display:flex;align-items:center;gap:10px;
     padding:7px 14px;min-height:48px}
.brand{font-family:var(--disp);font-size:16px;letter-spacing:.01em;color:var(--hdr-ink);
       font-weight:700;white-space:nowrap;background:none;border:none;padding:0;text-align:left}
.brand .sub{display:block;font-family:var(--gothic);font-size:10px;letter-spacing:.14em;
            color:var(--hdr-ink);opacity:.7;font-weight:400;margin-top:1px}
.top .spacer{flex:1}
.tbtn{background:transparent;border:1px solid var(--hdr-line);border-radius:3px;
      padding:5px 9px;font-size:12.5px;color:var(--hdr-ink);white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.12)}
.counter{font-family:var(--mono);font-size:13px;color:var(--hdr-ink);opacity:.78;
         font-variant-numeric:tabular-nums;white-space:nowrap}
.counter b{color:var(--hdr-ink);font-weight:700}
.timer{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;
       padding:3px 9px;border:1px solid var(--hdr-line);border-radius:3px;color:var(--hdr-ink)}
.timer.warn{background:var(--ng);border-color:var(--ng);color:var(--on-pri)}
.combo{font-family:var(--mono);font-size:12px;color:var(--on-acc);background:var(--acc);
       border-radius:3px;padding:2px 8px;white-space:nowrap;font-weight:700}
.topics{display:flex;flex-direction:column;background:var(--surface);
        border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.brand{font-size:13.5px;letter-spacing:.05em}
.top{gap:7px;padding:8px 11px}
.counter .who{display:none}
.top{position:static}

</style>
<div class="ds">
<div class="ds-h">ホーム</div><header class="top"><button class="brand" type="button">貸金業務取扱主任者<span class="sub">過去問1000 ／ 第1〜20回</span></button><div class="spacer"></div><button class="tbtn" type="button">表示</button></header><div class="ds-h">演習中</div><header class="top"><button class="brand" type="button">貸金業務取扱主任者</button><div class="spacer"></div><span class="counter"><b>7</b> / 20</span><span class="combo">4連正解</span><button class="tbtn" type="button">読みやすさ</button><button class="tbtn" type="button">中断</button></header><div class="ds-h">模試（残り時間つき）</div><header class="top"><button class="brand" type="button">貸金業務取扱主任者</button><div class="spacer"></div><span class="timer">残り 12:04</span><span class="timer warn">残り 0:48</span><button class="tbtn" type="button">中断</button></header><p class="ds-note">ヘッダーは主色より一段濃い深緑のベタ塗り（<code>--hdr</code>）に朱の下罫。中の操作は枠線だけの透明ボタンで、白抜き文字を主役から外さない。</p>
