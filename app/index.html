<title>貸金業務取扱主任者 過去問演習</title>
<style>
:root{
  --ai:#26456E; --ai-soft:#3E6296; --suou:#9C3A4B; --wakatake:#3E7D62; --shu:#C6462F;
  --sec1:#26456E; --sec2:#8A5A3B; --sec3:#3E7D62; --sec4:#6B5B8E;
  --bg:#F5F7F4; --surface:#FFFFFF; --sunken:#EDF0EC;
  --ink:#1A1F26; --ink-2:#4A5560; --ink-3:#7A858F;
  --rule:#D7DCD6; --rule-2:#E7EBE5;
  --focus:#3E6296;
  --mincho:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP","Songti SC",serif;
  --gothic:"Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,"Noto Sans JP",Meiryo,system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:3px;
}
@media (prefers-color-scheme:dark){
  :root{
    --ai:#7FA3D1; --ai-soft:#5C82B4; --suou:#D2707F; --wakatake:#6DB395; --shu:#E2705C;
    --sec1:#7FA3D1; --sec2:#C09068; --sec3:#6DB395; --sec4:#A292C4;
    --bg:#14181C; --surface:#1B2127; --sunken:#232A31;
    --ink:#E2E7EB; --ink-2:#A6B0B9; --ink-3:#78838D;
    --rule:#2E3740; --rule-2:#242C33; --focus:#7FA3D1;
  }
}
:root[data-theme="dark"]{
  --ai:#7FA3D1; --ai-soft:#5C82B4; --suou:#D2707F; --wakatake:#6DB395; --shu:#E2705C;
  --sec1:#7FA3D1; --sec2:#C09068; --sec3:#6DB395; --sec4:#A292C4;
  --bg:#14181C; --surface:#1B2127; --sunken:#232A31;
  --ink:#E2E7EB; --ink-2:#A6B0B9; --ink-3:#78838D;
  --rule:#2E3740; --rule-2:#242C33; --focus:#7FA3D1;
}
:root[data-theme="light"]{
  --ai:#26456E; --ai-soft:#3E6296; --suou:#9C3A4B; --wakatake:#3E7D62; --shu:#C6462F;
  --sec1:#26456E; --sec2:#8A5A3B; --sec3:#3E7D62; --sec4:#6B5B8E;
  --bg:#F5F7F4; --surface:#FFFFFF; --sunken:#EDF0EC;
  --ink:#1A1F26; --ink-2:#4A5560; --ink-3:#7A858F;
  --rule:#D7DCD6; --rule-2:#E7EBE5; --focus:#3E6296;
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--gothic);
     font-size:15px;line-height:1.75;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- 天板 ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--surface);
     border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:14px;
     padding:10px 16px;min-height:52px}
.brand{font-family:var(--mincho);font-size:15px;letter-spacing:.14em;color:var(--ai);
       font-weight:600;white-space:nowrap}
.brand .sub{display:block;font-family:var(--gothic);font-size:10px;letter-spacing:.22em;
            color:var(--ink-3);font-weight:400;margin-top:1px}
.top .spacer{flex:1}
.tbtn{background:none;border:1px solid var(--rule);border-radius:var(--r);
      padding:5px 11px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.tbtn:hover{border-color:var(--ai);color:var(--ai)}
.counter{font-family:var(--mono);font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.counter b{color:var(--ink);font-weight:600}
.timer{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;
       padding:3px 9px;border:1px solid var(--rule);border-radius:var(--r)}
.timer.warn{color:var(--suou);border-color:var(--suou)}

.wrap{max-width:820px;margin:0 auto;padding:26px 16px 96px}
.wrap.wide{max-width:1040px}

/* ---------- 見出し ---------- */
.h1{font-family:var(--mincho);font-size:23px;font-weight:600;margin:0 0 4px;
    letter-spacing:.04em;text-wrap:balance}
.lede{color:var(--ink-2);font-size:13.5px;margin:0 0 26px}
.h2{font-family:var(--gothic);font-size:11.5px;font-weight:600;letter-spacing:.19em;
    color:var(--ink-3);margin:34px 0 12px;display:flex;align-items:center;gap:11px}
.h2::after{content:"";flex:1;height:1px;background:var(--rule-2)}

/* ---------- ダッシュボード ---------- */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:1px;
         background:var(--rule-2);border:1px solid var(--rule-2);border-radius:var(--r);overflow:hidden}
.stat{background:var(--surface);padding:13px 14px}
.stat .k{font-size:10.5px;letter-spacing:.13em;color:var(--ink-3)}
.stat .v{font-family:var(--mono);font-size:25px;font-variant-numeric:tabular-nums;
         line-height:1.25;margin-top:3px}
.stat .v small{font-size:12px;color:var(--ink-3);margin-left:2px}

/* 年度 × 分野 の到達度マトリクス */
.matrix{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
.matrix th{font-weight:500;color:var(--ink-3);font-size:10.5px;letter-spacing:.06em;
           padding:5px 4px;text-align:center;line-height:1.35}
.matrix col.lab{width:72px}
.matrix col.tot{width:52px}
.matrix th.row{text-align:right;padding-right:11px;color:var(--ink-2);font-size:11.5px;
               font-family:var(--mincho);white-space:nowrap}
.matrix td{padding:2px}
.cell{display:block;width:100%;border:1px solid var(--rule-2);border-radius:2px;
      background:var(--sunken);padding:7px 2px;text-align:center;font-family:var(--mono);
      font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--ink-3);
      transition:transform .12s ease}
.cell:hover{transform:translateY(-1px);border-color:var(--ai)}
.cell.has{color:#fff;border-color:transparent}
.matrix caption{caption-side:bottom;font-size:11px;color:var(--ink-3);padding-top:10px;text-align:left}

/* ---------- モード選択 ---------- */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(216px,1fr));gap:11px}
.mode{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);
      padding:16px 17px;text-align:left;display:flex;flex-direction:column;gap:5px;
      transition:border-color .14s ease,transform .14s ease}
.mode:hover{border-color:var(--ai);transform:translateY(-2px)}
.mode .t{font-family:var(--mincho);font-size:16.5px;font-weight:600;letter-spacing:.05em}
.mode .d{font-size:12px;color:var(--ink-2);line-height:1.6}
.mode .n{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:3px}
.mode[disabled]{opacity:.45;cursor:not-allowed;transform:none}

/* ---------- 絞り込み ---------- */
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:17px}
.frow{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:13px}
.frow .lab{font-size:11px;letter-spacing:.13em;color:var(--ink-3);width:74px;flex-shrink:0}
.chip{border:1px solid var(--rule);background:var(--surface);border-radius:99px;
      padding:4px 12px;font-size:12.5px;color:var(--ink-2);transition:.12s}
.chip:hover{border-color:var(--ai-soft)}
.chip[aria-pressed="true"]{background:var(--ai);border-color:var(--ai);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"],
.chip[aria-pressed="true"]{color:#fff}
@media (prefers-color-scheme:dark){.chip[aria-pressed="true"]{color:#11161B}}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#11161B}
:root[data-theme="light"] .chip[aria-pressed="true"]{color:#fff}

.go{width:100%;margin-top:6px;background:var(--ai);color:#fff;border:none;
    border-radius:var(--r);padding:12px;font-size:14.5px;font-weight:600;letter-spacing:.1em}
@media (prefers-color-scheme:dark){.go{color:#11161B}}
:root[data-theme="dark"] .go{color:#11161B}
:root[data-theme="light"] .go{color:#fff}
.go:hover{background:var(--ai-soft)}
.go[disabled]{opacity:.4;cursor:not-allowed}

/* ---------- 設問 ---------- */
.qmeta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:13px;font-size:11.5px}
.tag{border:1px solid var(--rule);border-radius:2px;padding:2px 8px;color:var(--ink-2);
     font-family:var(--mono);font-size:11px}
.tag.sec{border:none;color:#fff;font-family:var(--gothic);letter-spacing:.06em}
@media (prefers-color-scheme:dark){.tag.sec{color:#11161B}}
:root[data-theme="dark"] .tag.sec{color:#11161B}
:root[data-theme="light"] .tag.sec{color:#fff}
.tag.neg{border-color:var(--suou);color:var(--suou)}

.stem{font-family:var(--mincho);font-size:16.5px;line-height:2.0;margin:0 0 18px;
      letter-spacing:.02em}
.stem .neg{background:linear-gradient(transparent 62%,rgba(198,70,47,.28) 62%);font-weight:600}
.stmts{font-family:var(--mincho);font-size:15.5px;line-height:1.95;margin:0 0 18px;
       border-left:2px solid var(--rule);padding-left:15px;display:flex;flex-direction:column;gap:9px}
.stmts .k{color:var(--ai);font-weight:600;margin-right:6px}
.qtable{margin:0 0 18px;overflow-x:auto}
.qtable table{border-collapse:collapse;font-size:13.5px;min-width:250px}
.qtable caption{font-family:var(--mincho);font-size:14px;text-align:left;padding-bottom:5px}
.qtable th,.qtable td{border:1px solid var(--rule);padding:5px 13px}
.qtable td:last-child{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.qtable thead th{background:var(--sunken);font-size:11.5px;color:var(--ink-2)}
.note{font-size:12.5px;color:var(--ink-2);line-height:1.85;background:var(--sunken);
      border-radius:var(--r);padding:11px 14px;margin:0 0 18px}

.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.opt{position:relative;display:flex;gap:12px;text-align:left;width:100%;
     background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);
     padding:13px 15px;font-family:var(--mincho);font-size:15.5px;line-height:1.85;
     transition:border-color .12s ease,background .12s ease}
.opt:hover:not([disabled]){border-color:var(--ai);background:var(--sunken)}
.opt .m{font-family:var(--gothic);font-size:15px;color:var(--ai);flex-shrink:0;
        font-weight:600;line-height:1.85}
.opt[disabled]{cursor:default}
.opt.correct{border-color:var(--wakatake);background:color-mix(in srgb,var(--wakatake) 9%,var(--surface))}
.opt.wrong{border-color:var(--suou);background:color-mix(in srgb,var(--suou) 9%,var(--surface))}
.opt.picked{border-width:2px}
/* 採点印を置く分だけ本文の右を空ける */
.opt.correct,.opt.wrong{padding-right:56px}
.mark{position:absolute;right:10px;top:50%;width:38px;height:38px;margin-top:-19px;
      pointer-events:none;overflow:visible}
.mark path,.mark circle{fill:none;stroke:var(--shu);stroke-width:2.6;stroke-linecap:round;
      opacity:.85;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);
      animation:draw .42s cubic-bezier(.4,0,.2,1) forwards}
.mark .s2{animation-delay:.16s}
@keyframes draw{to{stroke-dashoffset:0}}

.verdict{display:flex;align-items:baseline;gap:11px;margin-bottom:14px;
         font-family:var(--mincho);font-size:16px}
.verdict .r{font-weight:600;letter-spacing:.08em}
.verdict.ok .r{color:var(--wakatake)}
.verdict.ng .r{color:var(--suou)}
.verdict .a{font-family:var(--mono);font-size:13px;color:var(--ink-2)}

/* ---------- 下部操作 ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);
     border-top:1px solid var(--rule);padding:10px 16px;display:flex;gap:9px;
     align-items:center;z-index:20}
.bar .inner{max-width:820px;margin:0 auto;width:100%;display:flex;gap:9px;align-items:center}
.bar .spacer{flex:1}
.next{background:var(--ai);color:#fff;border:none;border-radius:var(--r);
      padding:10px 26px;font-size:14px;font-weight:600;letter-spacing:.08em}
@media (prefers-color-scheme:dark){.next{color:#11161B}}
:root[data-theme="dark"] .next{color:#11161B}
:root[data-theme="light"] .next{color:#fff}
.next:hover{background:var(--ai-soft)}
.ghost{background:none;border:1px solid var(--rule);border-radius:var(--r);
       padding:9px 14px;font-size:13px;color:var(--ink-2)}
.ghost:hover{border-color:var(--ai);color:var(--ai)}
.ghost[aria-pressed="true"]{border-color:var(--shu);color:var(--shu)}

/* ---------- 答案用紙（模試） ---------- */
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:5px;margin-top:14px}
.sq{border:1px solid var(--rule);border-radius:2px;background:var(--surface);padding:7px 2px;
    font-family:var(--mono);font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.sq.done{border-color:var(--ai);color:var(--ai)}
.sq.flag{border-color:var(--shu);color:var(--shu)}
.sq.cur{background:var(--ai);color:#fff;border-color:var(--ai)}
@media (prefers-color-scheme:dark){.sq.cur{color:#11161B}}
:root[data-theme="dark"] .sq.cur{color:#11161B}
:root[data-theme="light"] .sq.cur{color:#fff}

/* ---------- 成績表 ---------- */
.result{text-align:center;padding:26px 0 8px}
.result .score{font-family:var(--mono);font-size:60px;line-height:1;font-variant-numeric:tabular-nums}
.result .score small{font-size:22px;color:var(--ink-3)}
.result .judge{font-family:var(--mincho);font-size:20px;letter-spacing:.22em;margin-top:12px;font-weight:600}
.result .judge.pass{color:var(--wakatake)}
.result .judge.fail{color:var(--suou)}
.result .line{font-size:12.5px;color:var(--ink-2);margin-top:7px}

.breakdown{display:flex;flex-direction:column;gap:9px;margin-top:8px}
.br{display:grid;grid-template-columns:130px 1fr 62px;gap:11px;align-items:center;font-size:12.5px}
.br .n{color:var(--ink-2)}
.br .track{display:block;height:8px;background:var(--sunken);border-radius:99px;overflow:hidden}
.br .fill{display:block;height:100%;border-radius:99px;min-width:2px}
.br .v{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.br.sub{margin-top:-4px;font-size:11px}
.br.sub .n{color:var(--ink-3)}
.br.sub .track{height:3px}
.br.sub .v{color:var(--ink-3)}

.list{display:flex;flex-direction:column;gap:1px;background:var(--rule-2);
      border:1px solid var(--rule-2);border-radius:var(--r);overflow:hidden;margin-top:8px}
.li{background:var(--surface);padding:11px 14px;display:flex;gap:12px;align-items:flex-start;
    text-align:left;width:100%;font-size:13px;line-height:1.7}
.li:hover{background:var(--sunken)}
.li .id{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);flex-shrink:0;padding-top:2px}
.li .ans{font-family:var(--mono);font-size:11.5px;flex-shrink:0;padding-top:2px}
.li .ans .no{color:var(--suou)}
.li .ans .yes{color:var(--wakatake)}
.li .tx{flex:1;color:var(--ink-2)}

.empty{text-align:center;color:var(--ink-3);padding:44px 16px;font-size:13.5px}
.foot{margin-top:44px;padding-top:18px;border-top:1px solid var(--rule-2);
      font-size:11.5px;color:var(--ink-3);line-height:1.9}
.foot a{color:var(--ai-soft)}

@media (max-width:560px){
  .wrap{padding:20px 13px 92px}
  .stem{font-size:15.5px;line-height:1.95}
  .opt{font-size:15px;padding:12px 13px}
  .opt.correct,.opt.wrong{padding-right:50px}
  .br{grid-template-columns:96px 1fr 56px}
  .brand{font-size:13.5px;letter-spacing:.06em}
  .brand .sub{display:none}
  .top{gap:8px;padding:8px 11px}
  .tbtn{padding:5px 8px;font-size:12px}
  .counter .who{display:none}          /* 狭い画面ではセッション名を省く */
  .counter{font-size:12.5px}
  .timer{font-size:12.5px;padding:2px 6px}
  .mark{width:32px;height:32px;margin-top:-16px;right:8px}
}
</style>

<header class="top">
  <div class="brand">貸金業務取扱主任者<span class="sub">過去問演習 第14〜20回</span></div>
  <div class="spacer"></div>
  <span id="topInfo"></span>
  <button class="tbtn" id="themeBtn" type="button">表示</button>
  <button class="tbtn" id="homeBtn" type="button" hidden>中断</button>
</header>

<main id="app"></main>
<div id="barSlot"></div>

<script>
const DB = [{"id":"R14-01","kai":14,"era":"令和元年度","num":1,"sectionShort":"法令","stem":"貸金業法上の用語の定義等に関する次のａ～ｄの記述のうち、その内容が適切なものの個数を①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"貸金業とは、金銭の貸付け又は金銭の貸借の媒介で業として行うものをいい、手形の割引、売渡担保その他これらに類する方法によってする金銭の交付で業として行うものは貸金業に含まれない。","ｂ":"貸付けの契約とは、貸付けに係る契約又は当該契約に係る保証契約をいう。","ｃ":"顧客等とは、資金需要者である顧客又は保証人となろうとする者をいう。","ｄ":"信用情報とは、資金需要者である顧客又は債務者の借入金の返済能力に関する情報及び保証人となろうとする者又は保証人の保証能力に関する情報をいう。"},"options":{"①":"1個","②":"2個","③":"3個","④":"4個"},"note":"","answer":2,"format":"count","negative":false},{"id":"R14-02","kai":14,"era":"令和元年度","num":2,"sectionShort":"法令","stem":"株式会社であるＡは、甲県知事の登録を受けた貸金業者である。次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"Ａは、その商号の変更をしようとするときは、あらかじめ、その旨を甲県知事に届け出なければならない。","②":"Ａは、金銭の貸借の媒介を新たに行うとともに媒介手数料の割合を定めるなど、その業務の種類及び方法を変更したときは、その日から2週間以内に、その旨を甲県知事に届け出なければならない。","③":"Ａは、Ｂ営業所の所在地を変更したときは、その日から2週間以内に、その旨を甲県知事に届け出なければならない。","④":"Ａは、その業務に関して広告又は勧誘をする際に表示等をするＣ営業所の電話番号を変更したときは、その日から2週間以内に、その旨を甲県知事に届け出なければならない。"},"note":"","answer":2,"format":"single","negative":false},{"id":"R14-03","kai":14,"era":"令和元年度","num":3,"sectionShort":"法令","stem":"貸金業務取扱主任者に関する次のａ～ｄの記述のうち、その内容が適切なものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"貸金業者が営業所等ごとに置かなければならない貸金業務取扱主任者は、当該営業所等において「常時勤務する者」でなければならないが、貸金業者向けの総合的な監督指針（以下、本問において「監督指針」という。）によれば、貸金業法施行規則第10条の7（貸金業務取扱主任者の設置）第1号の「常時勤務する者」とは、営業時間内に営業所等に常時駐在する必要はないが、単に所属する営業所等が1つに決まっていることだけでは足りず、社会通念に照らし、常時勤務していると認められるだけの実態を必要とするとされている。","ｂ":"貸金業者は、内閣府令で定めるところにより、営業所等ごとに、従業者名簿を備え、従業者の氏名、住所、貸金業法第12条の4（証明書の携帯等）第1項の証明書の番号その他貸金業法施行規則第10条の9の2（従業者名簿の記載事項等）第1項で定める貸金業務取扱主任者であるか否かの別を記載しなければならないが、貸金業務取扱主任者である従業者について、その貸金業務取扱主任者の登録番号を記載する必要はない。","ｃ":"貸金業者は、「予見し難い事由」により、営業所等における貸金業務取扱主任者の数が貸金業法第12条の3（貸金業務取扱主任者の設置）第1項の内閣府令で定める数を下回るに至ったときは、2週間以内に、同項の規定に適合させるために同条第3項に定める「必要な措置」をとらなければならないが、監督指針によれば、同条第3項に定める「予見し難い事由」とは、個別具体的に判断されるが、急な死亡や失踪など限定的に解釈されるべきであり、会社の都合や定年による退職など会社として予見できると思われるものは含まれないとされている。","ｄ":"監督指針によれば、貸金業法第12条の3第3項に定める「必要な措置」とは、営業所等への主任者の求人募集、新たな貸付けの停止又は当該営業所等の廃止が該当するとされている。"},"options":{"①":"ａｂ","②":"ａｃ","③":"ｂｄ","④":"ｃｄ"},"note":"","answer":2,"format":"combo","negative":false},{"id":"R14-04","kai":14,"era":"令和元年度","num":4,"sectionShort":"法令","stem":"貸金業法第12条の6（禁止行為）に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"貸金業者向けの総合的な監督指針（以下、本問において「監督指針」という。）によれば、例えば、資金需要者等から契約の内容について問合せがあった場合において、当該内容について口頭で回答したに留まり、書面で回答しなかったときは、貸金業法第12条の6第1号に規定する「貸付けの契約の内容のうち重要な事項を告げない」行為に該当するおそれが大きいことに留意する必要があるとされている。","②":"監督指針によれば、貸金業法第12条の6第4号に定める「偽りその他不正又は著しく不当な行為」にいう「不正な」行為とは、違法な行為には該当しないが、客観的に見て、実質的に妥当性を欠く又は適当でない行為、「不当な」行為とは、不正な程度にまで達していない行為をいうとされている。","③":"貸金業者が、その貸金業の業務に関し、資金需要者等に対し、虚偽のことを告げる行為は、貸金業法上、行政処分の対象となるだけでなく、刑事罰の対象となる。","④":"貸金業者が、その貸金業の業務に関し、資金需要者等に対し、不確実な事項について断定的判断を提供する行為は、貸金業法上、行政処分の対象となるだけでなく、刑事罰の対象となる。"},"note":"","answer":3,"format":"single","negative":false},{"id":"R14-05","kai":14,"era":"令和元年度","num":5,"sectionShort":"法令","stem":"Ａは貸金業者、ＢはＡの顧客、Ｃは保証業者である。貸金業法第12条の8（利息、保証料等に係る制限等）に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"Ａが、Ｂとの間で元本を50万円とし利率を年2割（20％）とする貸付けに係る契約を締結した場合、貸金業法上、その行為は刑事罰の対象となる。","②":"Ａが、Ｂから利息制限法第1条（利息の制限）に規定する利率により計算した金額を超える利息を受領した場合、その行為は行政処分の対象とはならない。","③":"Ａは、Ｂとの間の貸付けに係る契約について、Ｃとの間で保証契約を締結した場合、遅滞なく、Ｃへの照会その他の方法により、ＢとＣとの間の保証料に係る契約の締結の有無、及び当該保証料に係る契約で定めた保証料の額を確認しなければならない。","④":"Ａは、Ｂとの間の一定の範囲に属する不特定の貸付けに係る契約について、Ｃとの間で、根保証契約(注)を締結しようとする場合、当該根保証契約の締結の日から5年を経過した日を主たる債務の元本確定期日として定める根保証契約を締結してはならない。"},"note":"(注) 根保証契約とは、一定の範囲に属する不特定の貸付けに係る債務を主たる債務とする保証契約をいう。","answer":4,"format":"single","negative":false},{"id":"R14-06","kai":14,"era":"令和元年度","num":6,"sectionShort":"法令","stem":"次のａ～ｄの記述のうち、貸金業者が、貸金業法第13条に規定する返済能力の調査を行うに際し、指定信用情報機関が保有する信用情報を使用しなければならないものの個数を①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。なお、本問における貸金業者は、非営利特例対象法人及び特定非営利金融法人ではないものとする。","statements":{"ａ":"個人顧客との間で極度方式貸付けに係る契約を締結しようとする場合","ｂ":"個人である保証人となろうとする者との間で貸付けに係る契約について保証契約を締結しようとする場合","ｃ":"個人顧客との間で手形（融通手形を除く。）の割引を内容とする契約を締結しようとする場合","ｄ":"個人顧客との間で他の貸金業者を債権者とする金銭の貸借の媒介に係る契約を締結しようとする場合"},"options":{"①":"1個","②":"2個","③":"3個","④":"4個"},"note":"","answer":1,"format":"count","negative":false},{"id":"R14-07","kai":14,"era":"令和元年度","num":7,"sectionShort":"法令","stem":"貸金業法第13条第3項及び同法第13条の3第3項に規定する源泉徴収票その他の収入又は収益その他の資力を明らかにする事項を記載し、又は記録した書面又は電磁的記録として内閣府令で定めるもの（以下、本問において「資力を明らかにする書面等」という。）に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。なお、本問における貸付けに係る契約は、貸金業法施行規則第10条の16（指定信用情報機関が保有する信用情報の使用義務の例外）で定める貸付けの契約ではないものとする。","statements":{},"options":{"①":"貸金業者は、個人顧客との間で、貸付けの金額が80万円の貸付けに係る契約を締結しようとする場合において、その1年前に当該顧客との間で貸付けに係る契約を締結するに当たり当該顧客からその資力を明らかにする書面等として源泉徴収票の提出を受けていたときは、改めて、当該顧客からその資力を明らかにする書面等の提出又は提供を受ける必要はない。","②":"貸金業者が、個人顧客との間で、貸付けの金額が50万円の貸付けに係る契約を新たに締結しようとする場合において、当該貸金業者の他の貸付けについて当該顧客が行っている保証の残高が30万円であるときは、他の貸金業者による貸付けがないことを確認したときであっても、当該貸金業者は、当該顧客からその資力を明らかにする書面等の提出又は提供を受けなければならない。","③":"貸金業者は、個人顧客との間で締結した極度方式基本契約が基準額超過極度方式基本契約に該当するかどうかの調査をしなければならない場合において、当該顧客に係る極度方式個人顧客合算額が110万円であるときは、その1年前に当該顧客との間で当該調査を行うに当たり当該顧客からその資力を明らかにする書面等として源泉徴収票の提出を受け、かつ、その後も当該顧客の資力に変更がないことを確認したときであっても、改めて当該顧客からその資力を明らかにする書面等の提出又は提供を受けなければならない。","④":"貸金業者は、個人顧客との間で締結した極度方式基本契約が基準額超過極度方式基本契約に該当するかどうかの調査をしなければならない場合において、当該極度方式基本契約の極度額（他に極度方式基本契約の締結はないものとする。）が50万円であること、当該顧客に対する他の貸付けの残高が30万円であること、住宅資金貸付契約に係る貸付けの残高が30万円であること、及び他の貸金業者による貸付けがないことを確認したときは、当該顧客からその資力を明らかにする書面等の提出又は提供を受ける必要はない。"},"note":"","answer":4,"format":"single","negative":false},{"id":"R14-08","kai":14,"era":"令和元年度","num":8,"sectionShort":"法令","stem":"次のａ～ｄの記述のうち、貸金業法上、刑事罰及び行政処分のいずれの対象ともなるものの個数を①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"貸金業者は、個人顧客との間で、貸付けに係る契約を締結しようとする場合において、当該顧客の返済能力の調査により、当該貸付けに係る契約が貸金業法第13条の2（過剰貸付け等の禁止）第1項に規定する個人過剰貸付契約その他顧客等の返済能力を超える貸付けの契約と認められるにもかかわらず、当該貸付けに係る契約を当該顧客と締結した。","ｂ":"貸金業者は、個人顧客との間で、貸付けに係る契約を締結しようとする場合において、当該顧客の返済能力の調査を行うに際し、指定信用情報機関が保有する信用情報を使用した調査が必要であるにもかかわらず、当該調査を行わずに当該貸付けに係る契約を当該顧客と締結した。","ｃ":"貸金業者は、個人顧客との間で、貸付けに係る契約を締結しようとする場合において、当該顧客から源泉徴収票その他の当該顧客の収入又は収益その他の資力を明らかにする事項を記載し、又は記録した書面又は電磁的記録として内閣府令で定めるもの（以下、本問において「資力を明らかにする書面等」という。）の提出又は提供を受けなければならないにもかかわらず、当該顧客からその資力を明らかにする書面等の提出又は提供を受けずに当該貸付けに係る契約を当該顧客と締結した。","ｄ":"貸金業者は、個人顧客との間で、貸付けに係る契約を締結した場合において、貸金業法第13条（返済能力の調査）第1項の規定による調査に関する記録を作成しなかった。"},"options":{"①":"1個","②":"2個","③":"3個","④":"4個"},"note":"","answer":3,"format":"count","negative":false},{"id":"R14-09","kai":14,"era":"令和元年度","num":9,"sectionShort":"法令","stem":"次のａ～ｄの記述のうち、貸金業者Ａが個人顧客Ｂとの間で締結する貸付けに係る契約が貸金業法第13条の2（過剰貸付け等の禁止）第2項に規定する個人過剰貸付契約から除かれる契約として貸金業法施行規則第10条の21に定める契約に該当するものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"Ｂの配偶者が所有し売却を予定している土地の売却代金により弁済される貸付けに係る契約であって、当該土地を当該貸付けの担保としないもの","ｂ":"Ｂの居宅の改良に必要な資金の貸付けに係る契約であって、当該居宅を当該貸付けの担保としないもの","ｃ":"Ｂの居宅を担保とする貸付けに係る契約であって、貸付けの金額が当該貸付けに係る契約の締結時における当該居宅の価格(注)の範囲を超えないもの","ｄ":"Ｂの直系尊属が所有する別荘を担保とする貸付けに係る契約であって、Ｂの返済能力を超えないと認められ、かつ、貸付けの金額が当該貸付けに係る契約の締結時における当該別荘の価格(注)の範囲内であるもの"},"options":{"①":"ａｂ","②":"ａｃ","③":"ｂｄ","④":"ｃｄ"},"note":"(注) 価格は、鑑定評価額、公示価格、路線価、固定資産税評価額（地方税法第381条第1項又は第2項の規定により土地課税台帳又は土地補充課税台帳に登録されている価格をいう。）その他の資料に基づき合理的に算出した額であるものとする。","answer":3,"format":"combo","negative":false},{"id":"R14-10","kai":14,"era":"令和元年度","num":10,"sectionShort":"法令","stem":"貸金業法第16条の2（契約締結前の書面の交付）に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。なお、本問における貸付けに係る契約は、金銭の貸付けに係る契約であって、手形の割引の契約及び売渡担保の契約ではないものとする。","statements":{},"options":{"①":"貸金業者は、極度方式基本契約を締結している顧客との間で極度方式貸付けに係る契約を締結しようとする場合には、当該契約を締結するまでに、内閣府令で定めるところにより、貸金業法第16条の2第1項に規定する書面（契約締結前の書面）を当該顧客に交付しなければならない。","②":"貸金業者は、貸付けに係る契約について保証契約を締結しようとする場合には、当該保証契約を締結するまでに、内閣府令で定めるところにより、当該保証契約についての貸金業法第16条の2第3項に規定する書面（保証契約における契約締結前の書面）及び当該貸付けに係る契約についての貸金業法第16条の2第1項に規定する書面（契約締結前の書面）を、当該保証契約の保証人となろうとする者に同時に交付しなければならない。","③":"貸金業者が、貸金業法第16条の2第1項の規定に基づき貸付けに係る契約の相手方となろうとする者に交付すべき契約締結前の書面の記載事項には、「貸付けに関し貸金業者が受け取る書面の内容」は含まれない。","④":"貸金業者が、貸金業法第16条の2第1項の規定に基づき貸付けに係る契約の相手方となろうとする者に交付すべき契約締結前の書面の記載事項には、「保証人となろうとする者の商号、名称又は氏名及び住所」が含まれる。"},"note":"","answer":3,"format":"single","negative":false},{"id":"R14-11","kai":14,"era":"令和元年度","num":11,"sectionShort":"法令","stem":"貸金業者Ａが、個人顧客Ｂとの間で貸付けに係る契約を締結し、Ｂに貸金業法第17条第1項に規定する書面（以下、本問において「契約締結時の書面」という。）を交付した。この場合に関する次のａ～ｄの記述のうち、その内容が適切なものの個数を①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。なお、本問における貸付けに係る契約は、金銭の貸付けに係る契約であって、極度方式基本契約、極度方式貸付けに係る契約、手形の割引の契約及び売渡担保の契約ではないものとする。","statements":{"ａ":"Ａは、契約締結時の書面に記載した「貸金業者の商号、名称又は氏名及び住所」を変更した場合、変更後の内容を記載した契約締結時の書面をＢに再交付する必要はない。","ｂ":"Ａは、Ｂとの合意に基づき、契約締結時の書面に記載した「各回の返済期日及び返済金額」を変更した場合、その内容がＢにとって不利なものであるときに限り、変更後の内容を記載した契約締結時の書面をＢに再交付しなければならない。","ｃ":"Ａは、Ｂとの間の貸付けに係る契約の締結に際し、Ｃとの間で、当該貸付けに係る契約について保証契約を締結し、Ｂに対して契約締結時の書面を交付した。その後、Ａは、Ｄとの間で、当該貸付けに係る契約について保証契約を締結し、Ｃに加えてＤを保証人に追加した。この場合、Ａは、Ｃ及びＤに係る事項が記載された契約締結時の書面をＢに再交付する必要はない。","ｄ":"Ａは、Ｂとの合意に基づき、契約締結時の書面に記載した「期限の利益の喪失の定めがあるときは、その旨及びその内容」を変更した場合、当該変更がＢの利益となる変更であるか否かにかかわらず、変更後の内容を記載した契約締結時の書面をＢに再交付しなければならない。"},"options":{"①":"1個","②":"2個","③":"3個","④":"4個"},"note":"","answer":1,"format":"count","negative":false},{"id":"R14-12","kai":14,"era":"令和元年度","num":12,"sectionShort":"法令","stem":"株式会社である貸金業者が貸金業法に基づき保存すべきものに関する次のａ～ｄの記述のうち、その内容が適切なものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"貸金業者は、貸付けに係る契約（極度方式基本契約及び極度方式貸付けに係る契約を除く。）について、保証人となろうとする者と保証契約を締結した場合には、内閣府令で定めるところにより、当該保証人となろうとする者の返済能力の調査に関する記録を作成し、当該記録を、当該貸付けに係る契約に定められた最終の返済期日（当該貸付けに係る契約に基づく債権が弁済その他の事由により消滅したときにあっては、当該債権の消滅した日）又は当該保証契約に基づく債務が消滅した日のうちいずれか早い日までの間保存しなければならない。","ｂ":"加入貸金業者(注)は、貸金業法第41条の36第1項及び第2項に規定する同意（指定信用情報機関への信用情報の提供等に係る同意）を得た場合には、内閣府令で定めるところにより、当該同意に関する記録を作成し、当該記録を、当該同意に基づき指定信用情報機関が信用情報を保有している間保存しなければならない。","ｃ":"貸金業者は、貸金業法第19条の帳簿を、貸付けの契約ごとに、当該契約を締結した日から少なくとも7年間保存しなければならない。","ｄ":"貸金業者は、個人顧客との間で締結した極度方式基本契約が基準額超過極度方式基本契約に該当するかどうかの調査をした場合、内閣府令で定めるところにより、当該調査に関する記録を作成し、当該記録をその作成後7年間保存しなければならない。"},"options":{"①":"ａｂ","②":"ａｃ","③":"ｂｄ","④":"ｃｄ"},"note":"(注) 加入貸金業者とは、指定信用情報機関と信用情報提供契約を締結した相手方である貸金業者をいう。","answer":1,"format":"combo","negative":false},{"id":"R14-13","kai":14,"era":"令和元年度","num":13,"sectionShort":"法令","stem":"生命保険契約等の締結に係る制限等に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"貸金業を営む者は、住宅資金貸付契約の相手方又は相手方となろうとする者の死亡によって保険金の支払を受けることとなる保険契約を締結しようとする場合、当該保険契約において、自殺による死亡を保険事故としてはならない。","②":"貸金業を営む者は、貸付けの契約について、公的給付(注1)がその受給権者である債務者等又は債務者等の親族その他の者（以下、本問において「特定受給権者」という。）の預金又は貯金の口座に払い込まれた場合に当該預金又は貯金の口座に係る資金から当該貸付けの契約に基づく債権の弁済を受けることを目的として、特定受給権者に当該預金又は貯金の払出しとその払い出した金銭による当該債権の弁済をその預金又は貯金の口座のある金融機関に委託して行うことを求める行為をしてはならない。","③":"貸金業を営む者は、特定公正証書(注2)の効力について債務者等にあらかじめ説明したときは、当該債務者等から、当該債務者等が特定公正証書の作成を公証人に嘱託することを代理人に委任することを証する書面（委任状）を取得することができる。","④":"貸金業を営む者は、貸付けの契約について、債務者等が特定公正証書の作成を公証人に嘱託することを代理人に委任する場合には、当該代理人を推薦することができる。"},"note":"(注1)公的給付とは、法令の規定に基づき国又は地方公共団体がその給付に要する費用又はその給付の事業に関する事務に要する費用の全部又は一部を負担し、又は補助することとされている給付（給与その他対価の性質を有するものを除く。）であって、法令の規定により譲り渡し、担保に供し、又は差し押さえることができないこととされているものをいう。(注2)特定公正証書とは、債務者等が貸付けの契約に基づく債務の不履行の場合に直ちに強制執行に服する旨の陳述が記載された公正証書をいう。","answer":2,"format":"single","negative":false},{"id":"R14-14","kai":14,"era":"令和元年度","num":14,"sectionShort":"法令","stem":"次のａ～ｄの記述のうち、貸金業者が、貸金業法第24条の6の2（開始等の届出）に基づき、その登録をした内閣総理大臣又は都道府県知事に届け出なければならない事由に該当するものの個数を①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"日本以外の国にその本拠地を置く外国法人との合弁により、日本国外において合弁事業として金銭の貸付けを行うこととなった場合","ｂ":"役員又は使用人に貸金業の業務に関し法令に違反する行為又は貸金業の業務の適正な運営に支障を来す行為があったことを知った場合","ｃ":"特定の保証業者との保証契約の締結を貸付けに係る契約の締結の通常の条件とすることとなった場合","ｄ":"他人から貸付けに係る契約に基づく債権の譲渡を受けた場合"},"options":{"①":"1個","②":"2個","③":"3個","④":"4個"},"note":"","answer":2,"format":"count","negative":false},{"id":"R14-15","kai":14,"era":"令和元年度","num":15,"sectionShort":"法令","stem":"次の①～④の記述のうち、内閣総理大臣又は都道府県知事が、貸金業法第24条の6の5（登録の取消し）の規定に基づき、その登録を受けた貸金業者の登録を取り消さなければならない場合に該当するものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"自己の名義をもって、他人に貸金業を営ませたとき。","②":"純資産額が貸金業の業務を適正に実施するため必要かつ適当なものとして政令で定める金額に満たなくなったとき。","③":"貸金業法第24条第3項に規定する取立て制限者に対して貸付けに係る契約に基づく債権を譲渡したとき。","④":"貸金業者について破産手続開始の決定があったとき。"},"note":"","answer":1,"format":"single","negative":false},{"id":"R14-16","kai":14,"era":"令和元年度","num":16,"sectionShort":"法令","stem":"貸金業法第41条の35（個人信用情報の提供）に関する次のａ～ｄの記述のうち、その内容が適切なものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。なお、本問における貸金業者は、非営利特例対象法人及び特定非営利金融法人ではないものとする。","statements":{"ａ":"加入貸金業者(注1)は、資金需要者である個人の顧客を相手方とする極度方式基本契約を締結したときは、遅滞なく、当該極度方式基本契約に係る個人信用情報を、加入指定信用情報機関(注2)に提供しなければならない。","ｂ":"加入貸金業者は、資金需要者である個人の顧客を相手方とする貸付けに係る契約を締結し、当該貸付けに係る契約に係る個人信用情報を加入指定信用情報機関に提供した後、当該個人顧客の勤務先の商号又は名称に変更があった場合、その変更内容を当該加入指定信用情報機関に提供する必要はない。","ｃ":"加入貸金業者が加入指定信用情報機関に提供する個人信用情報には、「運転免許証等(注3)の番号（当該個人顧客が運転免許証等の交付を受けている場合に限る。）」が含まれる。","ｄ":"貸金業者向けの総合的な監督指針によれば、貸金業者は、貸付けに係る契約を締結した際に取得した個人信用情報の指定信用情報機関への提供については、取得当日中に指定信用情報機関に提供することを原則とする等に留意するものとされている。"},"options":{"①":"ａｂ","②":"ａｃ","③":"ｂｄ","④":"ｃｄ"},"note":"(注1)加入貸金業者とは、指定信用情報機関と信用情報提供契約を締結した相手方である貸金業者をいう。(注2)加入指定信用情報機関とは、加入貸金業者と信用情報提供契約を締結した指定信用情報機関をいう。(注3)運転免許証等とは、道路交通法第92条第1項に規定する運転免許証又は同法第104条の4第5項に規定する運転経歴証明書をいう。","answer":4,"format":"combo","negative":false},{"id":"R14-17","kai":14,"era":"令和元年度","num":17,"sectionShort":"法令","stem":"Ａは貸金業者、ＢはＡの顧客、Ｃは保証業者である。次の①～④の記述のうち、利息制限法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"Ａは、Ｂとの間で、元本を8万円とし利息を年2割（20％）とする営業的金銭消費貸借契約（第一契約）を初めて締結し8万円をＢに貸し付けた後、第一契約に基づく債務の残高が5万円である時点において、元本を5万円とし利息を年2割（20％）とする営業的金銭消費貸借契約（第二契約）を締結し5万円をＢに貸し付けた。この場合、第一契約及び第二契約における利息の約定は、いずれも年1割8分（18％）を超過する部分に限り、無効となる。","②":"Ａは、Ｂとの間で、元本を9万円とし利息を年2割（20％）とする営業的金銭消費貸借契約（第一契約）を締結し9万円をＢに貸し付けると同時に元本を100万円とし利息を年1割4分（14％）とする営業的金銭消費貸借契約（第二契約）を締結し100万円をＢに貸し付けた。この場合、第一契約における利息の約定は、年1割8分（18％）を超過する部分に限り、無効となる。","③":"Ａは、Ｂとの間で、元本を50万円、利息を年1割3分（13％）、期間を1年、元利一括返済とする営業的金銭消費貸借契約を締結して50万円をＢに貸し付け、当該契約について、Ｃとの間で、保証契約を締結した。この場合において、Ｃは、Ｂとの間で、ＣがＢから65,000円の保証料の支払を受ける旨の保証料の契約を締結したときは、当該保証料の約定は、45,000円を超過する部分に限り、無効となる。","④":"Ａは、Ｂとの間で、元本を20万円、利息を年1割3分（13％）、期間を1年、元利一括返済とする営業的金銭消費貸借契約を締結して20万円をＢに貸し付け、当該契約について、Ｃとの間で、保証契約を締結した。また、Ｃは、Ｂとの間で、ＣがＢから8,000円の保証料の支払を受ける旨の保証料の契約を締結した。この場合において、ＡとＢとの合意により、当該営業的金銭消費貸借契約の利息を年1割8分（18％）に変更したときは、当該変更後の利息の約定は、年1割4分（14％）を超過する部分に限り、無効となる。−17−"},"note":"","answer":4,"format":"single","negative":false},{"id":"R14-18","kai":14,"era":"令和元年度","num":18,"sectionShort":"法令","stem":"みなし利息に関する次の①～④の記述のうち、利息制限法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"貸金業者は、顧客との間で締結した営業的金銭消費貸借契約において、貸金業法第17条第1項に規定する契約の内容を明らかにする書面（以下、本問において「契約締結時の書面」という。）を交付した後、返済の方式の変更を行ったため、変更後の内容を記載した契約締結時の書面の再交付に要した費用を当該顧客から受領した。この場合、当該費用は、利息とみなされる。","②":"貸金業者は、顧客との間で締結した営業的金銭消費貸借契約において、金銭の貸付け及び弁済に用いるため当該契約締結時に当該顧客に交付したカードを当該顧客の要請により再発行しその手数料を当該顧客から受領した。この場合、当該手数料は、利息とみなされる。","③":"貸金業者は、顧客との間で締結した営業的金銭消費貸借契約において、契約の締結及び債務の弁済の費用として公租公課の支払に充てられるべきものを当該顧客から受領した。この場合、当該費用は、利息とみなされる。","④":"貸金業者は、顧客との間で締結した営業的金銭消費貸借契約において、口座振替の方法による弁済につき、当該顧客が弁済期に弁済できなかったため、当該顧客の要請を受けて行った再度の口座振替手続に要した費用を当該顧客から受領した。この場合、当該費用は、利息とみなされる。"},"note":"","answer":1,"format":"single","negative":false},{"id":"R14-19","kai":14,"era":"令和元年度","num":19,"sectionShort":"法令","stem":"株式会社であるＡが貸金業の登録の申請をした。次の①～④の記述のうち、その事由が貸金業法第6条（登録の拒否）第1項各号のいずれにも該当しないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"Ａの取締役の中に、Ｂ株式会社の営業秘密を不正に取得し、不正競争防止法第21条（罰則）第1項第1号の罪を犯して罰金の刑に処せられ、その刑の執行を終わった日から5年を経過しない者がいる。","②":"Ａの取締役の中に、貸金業法第24条の6の4（監督上の処分）第1項の規定により貸金業の登録を取り消されたＢ株式会社の取締役を当該取消しの日の2週間前に退任した者であって、当該取消しの日から5年を経過しないものがいる。","③":"Ａの取締役の中に、道路交通法の規定に違反し、懲役の刑に処せられ、その刑の執行を終わった日から5年を経過しない者がいる。","④":"Ａの常務に従事する取締役が3名であり、いずれの取締役も貸付けの業務に3年以上従事した経験を有しない。"},"note":"","answer":1,"format":"single","negative":true},{"id":"R14-20","kai":14,"era":"令和元年度","num":20,"sectionShort":"法令","stem":"貸金業法第10条（廃業等の届出）に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"個人である貸金業者が死亡した場合、その相続人は、その日から30日以内に、その旨をその登録をした内閣総理大臣又は都道府県知事（以下、本問において「登録行政庁」という。）に届け出なければならない。","②":"法人である貸金業者が他の貸金業者との合併により消滅した場合、当該消滅した法人を代表する役員であった者は、その日から30日以内に、その旨を登録行政庁に届け出なければならない。","③":"貸金業者について破産手続開始の決定があった場合、その破産管財人は、その日から30日以内に、その旨を登録行政庁に届け出なければならない。","④":"株式会社である貸金業者がその株主総会における解散決議により解散した場合、その清算人は、その日から30日以内に、その旨を登録行政庁に届け出なければならない。"},"note":"","answer":1,"format":"single","negative":true},{"id":"R14-21","kai":14,"era":"令和元年度","num":21,"sectionShort":"法令","stem":"貸金業者向けの総合的な監督指針（以下、本問において「監督指針」という。）におけるシステムリスク管理態勢に関する次の①～④の記述のうち、サイバー攻撃に備えた多段階のサイバーセキュリティ対策として列挙されている入口対策、内部対策、出口対策の例として、その内容が監督指針の記載に合致しないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"ファイアウォールの設置、抗ウィルスソフトの導入、不正侵入検知システム・不正侵入防止システムの導入","②":"特権ＩＤ・パスワードの適切な管理、不要なＩＤの削除、特定コマンドの実行監視","③":"システム部門から独立した内部監査部門による実効性のある内部監査、外部監査人による第三者評価","④":"通信ログ・イベントログ等の取得と分析、不適切な通信の検知・遮断"},"note":"","answer":3,"format":"single","negative":true},{"id":"R14-22","kai":14,"era":"令和元年度","num":22,"sectionShort":"法令","stem":"次の①～④の記述のうち、貸金業法第13条の2（過剰貸付け等の禁止）第2項に規定する個人顧客の利益の保護に支障を生ずることがない契約として貸金業法施行規則第10条の23で定めるものに該当しないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"個人顧客又は当該個人顧客の親族で当該個人顧客と生計を一にする者の緊急に必要と認められる医療費（所得税法第73条第2項に規定する医療費をいう。）を支払うために必要な資金の貸付けに係る契約（貸金業法施行規則第10条の21第1項第4号に掲げる契約を除く。）であって、当該個人顧客の返済能力を超えないと認められるもの（当該個人顧客が現に当該貸付けに係る契約を締結していない場合に限る。）","②":"現に事業を営んでいない個人顧客に対する新たな事業を行うために必要な資金の貸付けに係る契約であって、事業計画、収支計画及び資金計画の確認その他の方法により確実に当該事業の用に供するための資金の貸付けであると認められ、かつ、当該個人顧客の事業計画、収支計画及び資金計画に照らし、当該個人顧客の返済能力を超えない貸付けに係る契約であると認められるもの","③":"金融機関（預金保険法第2条第1項に規定する金融機関をいう。）からの貸付け（以下、本問において「正規貸付け」という。）が行われるまでのつなぎとして行う貸付けに係る契約（極度方式基本契約を除く。）であって、正規貸付けが行われることが確実であると認められ、かつ、返済期間が1か月を超えないもの","④":"個人顧客が外国において緊急に必要となった費用（特定費用）を支払うために必要な資金の貸付けに係る契約として当該個人顧客と貸金業者との間に締結される契約（極度方式基本契約ではないものとする。）であって、当該契約が当該個人顧客の返済能力を超えない貸付けに係る契約であると認められ、当該契約の貸付けの金額が30万円を超えず、返済期間が1年を超えないもの"},"note":"","answer":4,"format":"single","negative":true},{"id":"R14-23","kai":14,"era":"令和元年度","num":23,"sectionShort":"法令","stem":"株式会社である貸金業者Ａが、貸金業法第13条の3第2項に基づき、3か月以内の一定の期間（以下、本問において「所定の期間」という。）ごとに、個人顧客Ｂとの間で締結している極度方式基本契約（以下、本問において「本件基本契約」という。）について行う、本件基本契約が基準額超過極度方式基本契約に該当するかどうかの調査（以下、本問において「本件調査」という。）に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"Ａは、所定の期間の末日において、「Ｂと連絡することができないこと」等の合理的な理由により本件基本契約に基づく新たな極度方式貸付けの停止に係る措置を講じ、かつ当該措置を講じた旨、その年月日及び当該理由が貸金業法第19条の帳簿に貸付けの契約に基づく債権に関する債務者等その他の者との交渉の経過の記録として記載されているときは、本件調査を行う必要はない。","②":"Ａは、所定の期間の末日において、本件基本契約に基づく極度方式貸付けの残高が10万円以下である場合は、ＡがＢとの間で締結している他の極度方式基本契約に基づく極度方式貸付けの残高にかかわらず、本件調査を行う必要はない。","③":"Ａは、本件調査を行わなければならない場合、所定の期間の末日から3週間を経過する日までに、指定信用情報機関にＢの個人信用情報の提供の依頼をしなければならない。","④":"Ａは、本件調査により、本件基本契約が基準額超過極度方式基本契約に該当すると認められるときは、本件基本契約が基準額超過極度方式基本契約に該当しないようにするため必要な本件基本契約の極度額を減額する措置、又は本件基本契約に基づく新たな極度方式貸付けを停止する措置を講じなければならない。"},"note":"","answer":2,"format":"single","negative":true},{"id":"R14-24","kai":14,"era":"令和元年度","num":24,"sectionShort":"法令","stem":"貸付条件の広告等に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"貸金業者向けの総合的な監督指針によれば、貸金業法第15条（貸付条件の広告等）第1項に規定する「貸付けの条件について広告をする」とは、同法第15条第1項第2号、同法施行規則第12条（貸付条件の広告等）第1項第1号及び第2号に掲げる事項（担保の内容が貸付けの種類名となっている場合にあっては、同法施行規則第11条（貸付条件の掲示）第3項第1号ロの「担保に関する事項」には当たらない。）又は貸付限度額、その他の貸付けの条件の具体的内容を1つでも表示した広告をすることをいう。","②":"貸金業者は、貸付けの条件について広告をする場合において、貸金業者登録簿に登録されたホームページアドレス又は電子メールアドレスを表示するときは、貸金業者登録簿に登録された電話番号を併せて表示しなければならない。","③":"貸金業者が貸付けの条件について広告をするときは、「期限の利益の喪失の定めがあるときは、その旨及びその内容」を表示しなければならない。","④":"貸金業者が、多数の者に対して同様の内容でダイレクトメールを送付して貸付けの契約の締結について勧誘をする場合において、そのダイレクトメールに電話番号を表示するときは、貸金業者登録簿に登録された電話番号以外のものを表示してはならない。"},"note":"","answer":3,"format":"single","negative":true},{"id":"R14-25","kai":14,"era":"令和元年度","num":25,"sectionShort":"法令","stem":"次の①～④の記述のうち、貸付けに係る契約を締結する場合における貸金業法第17条第1項に規定する書面（契約締結時の書面）の記載事項に含まれないものを1つだけ選び、解答欄にその番号をマークしなさい。なお、本問における貸付けに係る契約は、金銭の貸付けに係る契約であって、極度方式貸付けに係る契約、手形の割引の契約及び売渡担保の契約ではないものとする。","statements":{},"options":{"①":"債務者が金銭の受領のために利用する現金自動支払機その他の機械の利用料などの、債務者が負担すべき元本及び利息以外の金銭に関する事項","②":"運転免許証の写しなどの、貸付けに関し貸金業者が受け取る書面の内容","③":"契約上、返済期日前の返済ができるか否か及び返済ができるときは、その内容","④":"将来支払う返済金額とその内訳（元本及び利息の別）"},"note":"","answer":4,"format":"single","negative":true},{"id":"R14-26","kai":14,"era":"令和元年度","num":26,"sectionShort":"法令","stem":"貸金業法第24条（債権譲渡等の規制）に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。なお、本問における債権は、抵当証券法第1条第1項に規定する抵当証券に記載された債権ではないものとする。","statements":{},"options":{"①":"貸金業者は、貸付けに係る契約に基づく債権を他人に譲渡するに当たっては、その者に対し、当該債権が貸金業者の貸付けに係る契約に基づいて発生したことその他内閣府令で定める事項、及びその者が当該債権に係る貸付けの契約に基づく債権に関してする行為について貸金業法第24条第1項に規定する条項の適用がある旨を、内閣府令で定める方法により、通知しなければならない。","②":"貸金業者は、貸付けに係る契約（極度方式基本契約及び極度方式貸付けに係る契約ではないものとする。）に基づく債権を貸金業者ではない者に譲渡した。この場合、貸金業法第24条第2項により準用される同法第17条第1項に規定する当該債権の内容を明らかにする書面を当該債権の債務者に遅滞なく交付しなければならないのは、当該債権の譲受人であり、当該債権の譲渡人である当該貸金業者ではない。","③":"貸金業者が、貸付けに係る契約に基づく債権を貸金業者ではない者に譲渡した場合、貸金業法第24条第2項により準用される当該債権に係る譲受け後の同法第19条（帳簿の備付け）に規定する帳簿は、当該債権の譲受人が作成し保存する義務を負い、当該債権の譲渡人である当該貸金業者は、引き続き貸金業を営むときであっても、当該債権を譲渡するまでの間に当該債権の債務者ごとに作成していた同法第19条に規定する帳簿を保存する必要はない。","④":"貸金業者が、貸付けに係る契約に基づく債権を他人に譲渡した場合、当該債権の譲受人は、当該貸付けに係る契約に基づく債権の全部又は一部について弁済を受けたときに、貸金業法第24条第2項により準用される同法第18条（受取証書の交付）第1項に規定する書面に、当該債権の譲受年月日、当該債権に係る貸付けの契約の契約年月日等を記載し、当該書面を当該弁済をした者に直ちに交付しなければならない。−26−"},"note":"","answer":3,"format":"single","negative":true},{"id":"R14-27","kai":14,"era":"令和元年度","num":27,"sectionShort":"法令","stem":"出資法(注)及び利息制限法に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。なお、本問における保証は、業として行うものとする。","statements":{},"options":{"①":"出資法上、金銭の貸借の媒介を行う者が、その媒介に係る貸借（貸借の期間が1年以上であるものとする。）の金額の100分の5に相当する金額を超える手数料の契約をし、又はこれを超える手数料を受領する行為は、刑事罰の対象となる。","②":"出資法第5条（高金利の処罰）、第5条の2（高保証料の処罰）及び第5条の3（保証料がある場合の高金利の処罰）の規定の適用については、1年分に満たない利息を元本に組み入れる契約がある場合においては、元利金のうち当初の元本を超える金額は利息とみなされる。","③":"営業的金銭消費貸借の債権者が保証契約を締結しようとする場合において、主たる債務について既に他の保証契約があるときは、あらかじめ、保証人となるべき者に対し、その旨の通知をしなければならない。","④":"営業的金銭消費貸借上の債務の不履行による賠償額の予定は、その賠償額の元本に対する割合が利息制限法第1条（利息の制限）に規定する率の1.46倍を超えるときは、その超過部分について、無効となる。"},"note":"(注) 出資法とは、出資の受入れ、預り金及び金利等の取締りに関する法律をいう。","answer":4,"format":"single","negative":true},{"id":"R14-28","kai":14,"era":"令和元年度","num":28,"sectionShort":"貸付実務","stem":"行為能力に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"制限行為能力者の相手方は、その制限行為能力者が行為能力者となった後、その者に対し、1か月以上の期間を定めて、その期間内にその取り消すことができる行為を追認するかどうかを確答すべき旨の催告をすることができる。この場合において、その者がその期間内に確答を発しないときは、その行為を追認したものとみなされる。","②":"被保佐人とは、精神上の障害により事理を弁識する能力を欠く常況にある者をいい、被保佐人が借財又は保証をするには、その保佐人の同意を得なければならない。","③":"未成年者は、単に権利を得る法律行為をする場合には、その法定代理人の同意を得る必要はないが、義務を免れる法律行為をする場合には、その法定代理人の同意を得なければならない。","④":"成年被後見人の法律行為は、その成年後見人の同意を得て行われたときは、取り消すことができない。"},"note":"","answer":1,"format":"single","negative":false},{"id":"R14-29","kai":14,"era":"令和元年度","num":29,"sectionShort":"貸付実務","stem":"代理に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"委任による代理人は、やむを得ない事由があるときであっても、本人の許諾を得なければ、復代理人を選任することができない。","②":"法定代理人は、自己の責任で復代理人を選任することができる。この場合において、法定代理人は、やむを得ない事由があるときであっても、復代理人の行為についてすべての責任を負う。","③":"代理権を有しない者がした契約は、本人が追認をしない間は、相手方が取り消すことができる。ただし、契約の時において代理権を有しないことを相手方が知っていたときは、この限りでない。","④":"他人の代理人として契約をした者は、自己の代理権を証明することができず、かつ、本人の追認を得ることができなかった場合、他人の代理人として契約をした者が代理権を有しないことを相手方が知っていたときであっても、相手方の選択に従い、相手方に対して履行又は損害賠償の責任を負う。"},"note":"","answer":3,"format":"single","negative":false},{"id":"R14-30","kai":14,"era":"令和元年度","num":30,"sectionShort":"貸付実務","stem":"Ａは、Ｂとの間で、元本を10万円とする利息付金銭消費貸借契約（以下、本問において「本件契約」という。）を締結しようとしている。この場合に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"Ａが、10月1日の午前10時に、1か月間を貸付期間として、本件契約を締結し10万円をＢに貸し付けた場合、本件契約に基づく返済期限は同年10月31日である。","②":"Ａが、10月15日の午前10時に、15日間を貸付期間として、本件契約を締結し10万円をＢに貸し付けた場合、ＡとＢとの間に特約がない限り、Ｂは10月15日から利息を支払う義務を負う。","③":"Ａは、10月15日の正午に、返済期限を定めずに、本件契約を締結し10万円をＢに貸し付けた場合、Ｂに対し、相当の返済期間を定めることなく、いつでも貸し付けた金銭の返還を請求することができ、Ｂは、返還請求があれば直ちに借入金をＡに返還しなければならない。","④":"Ａは、6か月間を貸付期間として、本件契約を締結し10万円をＢに貸し付けた。当該期間の末日が日曜日に当たる場合において、日曜日に取引をしない慣習があるときは、本件契約に基づく返済期限は、当該期間の末日の前日である土曜日である。"},"note":"","answer":2,"format":"single","negative":false},{"id":"R14-31","kai":14,"era":"令和元年度","num":31,"sectionShort":"貸付実務","stem":"債権の効力に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"債務の履行について不確定期限があるときは、債務者は、その期限の到来を知っているか否かを問わず、その期限が到来した時から遅滞の責任を負う。","②":"債権者が、債務の不履行に基づく損害賠償として、その債権の目的である物又は権利の価額の全部の支払を受けた場合であっても、債務者は、その支払と同時に債権者の承諾を得なければ、その物又は権利について債権者に代位することはできない。","③":"金銭の給付を目的とする債務の不履行の損害賠償については、債権者は、損害の証明をしなければならず、債務者は、不可抗力をもって抗弁とすることができる。","④":"当事者は、債務の不履行について損害賠償の額を予定することができる。賠償額の予定は、履行の請求又は解除権の行使を妨げない。"},"note":"","answer":4,"format":"single","negative":false},{"id":"R14-32","kai":14,"era":"令和元年度","num":32,"sectionShort":"貸付実務","stem":"保証に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"保証債務は、当事者間に特約がなければ、主たる債務の元本及び主たる債務に関する利息を包含するが、主たる債務に関する違約金及び損害賠償を包含しない。","②":"債権者が保証人に催告をした場合、当該保証人は、当該債権者自身が、主たる債務者に弁済をする資力があり、かつ、執行が容易であることを調査し、まず主たる債務者の財産について執行すべき旨を、当該債権者に請求することができる。","③":"債務者が保証人を立てる義務に従い保証人を立てた後に、当該保証人が保佐開始の審判を受け被保佐人となった場合であっても、債権者は、「保証人が行為能力者であり、かつ弁済をする資力を有すること」という要件を具備する者をもって当該保証人に代えることを請求することはできない。","④":"主たる債務者の意思に反して保証をすることは認められていない。"},"note":"","answer":3,"format":"single","negative":false},{"id":"R14-33","kai":14,"era":"令和元年度","num":33,"sectionShort":"貸付実務","stem":"弁済に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"弁済の費用について別段の意思表示がないときは、その費用は、債権者及び債務者が等しい割合で負担する。","②":"債務者が同一の債権者に対して同種の給付を目的とする数個の債務を負担する場合において、弁済として提供した給付がすべての債務を消滅させるのに足りないときは、弁済をする者は、給付の時に、その弁済を充当すべき債務を指定することができる。ただし、弁済を受領する者がその充当に対して直ちに異議を述べたときは、この限りでない。","③":"弁済の提供は、債権者があらかじめその受領を拒んでいるときであっても、債務の本旨に従って現実にしなければならない。","④":"弁済により債権者に代位した者は、自己の権利に基づいて求償をすることができる範囲内において、債権の効力及び担保としてその債権者が有していた一切の権利を行使することができる。"},"note":"","answer":4,"format":"single","negative":false},{"id":"R14-34","kai":14,"era":"令和元年度","num":34,"sectionShort":"貸付実務","stem":"ＡのＢに対する金銭債権を「甲債権」とし、ＢのＡに対する金銭債権を「乙債権」とする。甲債権と乙債権の相殺に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"Ａ及びＢは、甲債権と乙債権とを相殺しようとする場合、その相手方に対して相殺の意思表示をしなければならないが、その意思表示には、条件又は期限を付することができる。","②":"甲債権と乙債権の双方の債務の履行地が異なる場合、Ａ及びＢは、甲債権と乙債権とを相殺することができない。","③":"甲債権の弁済期が11月1日であり、乙債権の弁済期が同年11月25日である場合、Ａは、同年11月1日の時点で、乙債権についての期限の利益を放棄して、甲債権と乙債権とを相殺することができる。","④":"甲債権が貸付金債権であり、乙債権が不法行為に基づく損害賠償債権である場合、Ａは、甲債権と乙債権とを相殺することができる。"},"note":"","answer":3,"format":"single","negative":false},{"id":"R14-35","kai":14,"era":"令和元年度","num":35,"sectionShort":"貸付実務","stem":"約束手形及び電子記録債権に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。なお、本問におけるＡ、Ｂ及びＣは、いずれも法人であるものとする。","statements":{},"options":{"①":"Ａは、Ｂに対して、一定の金額を支払うべき旨の単純な約束（以下、本問において「支払約束文句」という。）に加え「商品の受領と引換えに手形金を支払う」旨の記載を付した約束手形を振り出した。この場合、支払約束文句に付加された記載は無効となるが、当該約束手形自体は無効とならない。","②":"Ａは、ＡのＢに対する電子記録債権をＣに譲渡する旨をＣとの間で合意した。この場合、当該電子記録債権の譲渡は、ＡとＣとの間の合意のみではその効力を生じず、譲渡記録をしなければ、その効力を生じない。","③":"Ａは、ＡのＢに対する電子記録債権（その発生記録において、電子記録債権法第20条（抗弁の切断）第1項の規定を適用しない旨の定めが記録されていないものとする。）をＣに譲渡した。Ｂは、当該電子記録債権の原因となった契約をＡの債務不履行を理由として解除した後、当該電子記録債権の支払期日において、Ｃから当該電子記録債権の支払を請求された場合、当該電子記録債権の原因となった契約が解除されたことを主張して、Ｃの請求を拒むことができる。","④":"Ａは、Ｂの詐欺により、Ｂに対して約束手形を振り出した。Ｃは、当該事情を知らず、かつ知らないことに過失なく、Ｂから当該約束手形の裏書譲渡を受けた。Ａは、Ｃから手形金の支払を請求された場合、Ｂの詐欺を理由とする手形行為取消しの抗弁をもって、Ｃに対抗することができる。"},"note":"","answer":2,"format":"single","negative":false},{"id":"R14-36","kai":14,"era":"令和元年度","num":36,"sectionShort":"貸付実務","stem":"無効及び取消しに関する次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"無効な行為は、追認によっても、その効力を生じない。ただし、当事者がその行為の無効であることを知って追認をしたときは、新たな行為をしたものとみなされる。","②":"成年被後見人は、行為能力者となった後であっても、成年後見人であった者の同意を得なければ、成年被後見人であったときに行った法律行為を追認することができない。","③":"取り消された行為は、初めから無効であったものとみなされる。","④":"民法第124条（追認の要件）の規定により追認をすることができる時以後に、取り消すことができる行為について履行の請求があったときは、追認をしたものとみなされる。ただし、異議をとどめたときは、この限りでない。"},"note":"","answer":2,"format":"single","negative":true},{"id":"R14-37","kai":14,"era":"令和元年度","num":37,"sectionShort":"貸付実務","stem":"条件及び期限に関する次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"債務者が担保を減少させた場合であっても、債務者は、期限の利益を主張することができる。","②":"条件の成否が未定である間における当事者の権利義務は、一般の規定に従い、処分し、相続し、もしくは保存し、又はそのために担保を供することができる。","③":"法律行為に始期を付したときは、その法律行為の履行は、期限が到来するまで、これを請求することができない。法律行為に終期を付したときは、その法律行為の効力は、期限が到来した時に消滅する。","④":"解除条件付法律行為は、解除条件が成就した時からその効力を失う。"},"note":"","answer":1,"format":"single","negative":true},{"id":"R14-38","kai":14,"era":"令和元年度","num":38,"sectionShort":"貸付実務","stem":"根抵当権に関する次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"根抵当権の担保すべき不特定の債権の範囲は、債務者との特定の継続的取引契約によって生ずるものその他債務者との一定の種類の取引によって生ずるものに限定して、定めなければならない。","②":"根抵当権の極度額の変更は、利害関係を有する者の承諾を得なければ、することができない。","③":"根抵当権の担保すべき元本については、その確定すべき期日を定め又は変更することができる。その期日は、これを定め又は変更した日から3年以内でなければならない。","④":"債務者又は根抵当権設定者が破産手続開始の決定を受けたときは、根抵当権の担保すべき元本は、確定する。"},"note":"","answer":3,"format":"single","negative":true},{"id":"R14-39","kai":14,"era":"令和元年度","num":39,"sectionShort":"貸付実務","stem":"Ａが、Ｂに対して有する貸付金債権（以下、本問において「本件債権」という。）をＣ及びＤに二重に譲渡した場合に関する次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。なお、本件債権について、ＡとＢとの間で譲渡禁止の特約はなされていないものとする。","statements":{},"options":{"①":"ＡＣ間の債権譲渡について、ＢがＡに対して確定日付のある証書によらないで承諾をし、Ｃに対して本件債権の弁済をした後に、ＡＤ間の債権譲渡について、ＡがＢに対して確定日付のある証書による通知をし、当該通知がＢに到達した。この場合において、Ｂは、Ｄから本件債権の弁済を請求されたときは、既にＣに弁済したことを主張して、Ｄに対する弁済を拒絶することはできない。","②":"ＡＣ間の債権譲渡について、ＡがＢに対して確定日付のある証書によらない通知をし、当該通知がＢに到達した後に、ＡＤ間の債権譲渡について、ＡがＢに対して確定日付のある証書による通知をし、当該通知がＢに到達した。この場合、Ｄは、ＡＤ間の債権譲渡をＣに対抗することができる。","③":"ＡＣ間の債権譲渡について、ＡがＢに対して確定日付のある証書によらない通知をし、当該通知がＢに到達した後に、ＡＤ間の債権譲渡について、ＡがＢに対して確定日付のある証書によらない通知をし、当該通知がＢに到達した。この場合において、ＢがＤに対して本件債権のすべてを弁済したときは、Ｂは、Ｃに対して本件債権の弁済を拒絶することができる。","④":"ＡＣ間の債権譲渡について、ＡがＢに対して確定日付のある証書による通知をし、当該通知がＢに到達した後に、ＡＤ間の債権譲渡について、ＡがＢに対して確定日付のある証書による通知をし、当該通知がＢに到達した。この場合、Ｃは、ＡＣ間の債権譲渡をＤに対抗することができる。"},"note":"","answer":1,"format":"single","negative":true},{"id":"R14-40","kai":14,"era":"令和元年度","num":40,"sectionShort":"貸付実務","stem":"契約に関する次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"承諾期間を定めて契約の申込みを受けた者（承諾者）が、承諾期間内において、申込みに条件を付し、その他変更を加えてこれを承諾したときは、その申込みの拒絶とともに新たな申込みをしたものとみなされる。","②":"契約又は法律の規定により当事者の一方が解除権を有するときは、その解除は、相手方に対する意思表示によってする。当該意思表示は、撤回することができない。","③":"契約の性質又は当事者の意思表示により、特定の日時又は一定の期間内に履行をしなければ契約をした目的を達することができない場合において、当事者の一方が履行をしないでその時期を経過したときは、相手方は、相当の期間を定めてその履行の催告をすることなく、直ちにその契約の解除をすることができる。","④":"当事者の一方がその解除権を行使したときは、各当事者は、未だ履行していない義務があるときはその義務を免れ、既に給付したものがあるときは現に利益を受けている限度において相手方にこれを返還する義務を負う。"},"note":"","answer":4,"format":"single","negative":true},{"id":"R14-41","kai":14,"era":"令和元年度","num":41,"sectionShort":"貸付実務","stem":"相続に関する次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"Ａは、配偶者Ｂ、弟Ｃの孫Ｄのみを遺して死亡した。Ｃ及びＣの子Ｅ（Ｄの直系尊属であるものとする。）は、Ａより先に死亡していた。この場合、Ｄは、Ａの相続人とならない。","②":"Ａは、配偶者Ｂ及び子Ｃのみを遺して死亡した。Ｂ及びＣは、遺産分割協議により、ＡのＤに対する借入金債務をＣのみが相続することとした。この場合、Ｄは、Ｂ及びＣに対して、当該借入金債務に係るそれぞれの法定相続分の割合に相当する債務の弁済を請求することができる。","③":"Ａは、配偶者Ｂ及び子Ｃのみを遺して死亡した。Ｂは、Ｃの同意を得ることなく、単独で限定承認をすることができる。","④":"Ａは、配偶者Ｂ、Ａの孫であるＣ及びＤのみを遺して死亡した。Ｃ及びＤの親でありＡの子であるＥは、Ａより先に死亡していた。この場合、Ｃの相続分は、4分の1である。"},"note":"","answer":3,"format":"single","negative":true},{"id":"R14-42","kai":14,"era":"令和元年度","num":42,"sectionShort":"貸付実務","stem":"倒産処理手続に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"破産法上、破産手続開始の決定があった場合において、当該決定と同時に破産手続廃止の決定がなされなかったときは、破産財団に属する財産の管理及び処分をする権利は、裁判所が選任した破産管財人に専属する。","②":"民事再生法上、再生手続開始の決定があった場合には、再生債務者の業務の遂行並びに財産（日本国内にあるかどうかを問わない。）の管理及び処分をする権利は、裁判所が選任した監督委員に専属する。","③":"会社更生法上、更生手続開始の決定があった場合には、更生会社の事業の経営並びに財産（日本国内にあるかどうかを問わない。）の管理及び処分をする権利は、裁判所が選任した管財人に専属する。","④":"会社法上、特別清算が開始された場合には、清算人は、債権者、清算株式会社及び株主に対し、公平かつ誠実に清算事務を行う義務を負う。"},"note":"","answer":2,"format":"single","negative":true},{"id":"R14-43","kai":14,"era":"令和元年度","num":43,"sectionShort":"資金需要者保護","stem":"個人情報の保護に関する法律についてのガイドライン（通則編）に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"個人情報とは生存する個人に関する情報をいうが、「個人に関する情報」とは、氏名、住所、性別、生年月日、顔画像等個人を識別する情報に限られず、個人の身体、財産、職種、肩書等の属性に関して、事実、判断、評価を表すすべての情報であり、評価情報、公刊物等によって公にされている情報や、映像、音声による情報が含まれるが、これらが暗号化等によって秘匿化されている場合には「個人に関する情報」には該当しない。","②":"個人データとは、個人情報取扱事業者が管理する個人情報データベース等を構成し、又は構成の用に供されるべき個人情報をいい、個人情報データベース等から外部記録媒体に保存された個人情報、個人情報データベース等から紙面に出力された帳票等に印字された個人情報、及び個人情報データベース等を構成する前の入力用の帳票等に記載されている個人情報は、すべて個人データに該当する。","③":"個人情報取扱事業者は、個人情報を取得した場合は、その利用目的を、本人に通知し、又は公表しなければならないが、「公表」とは、不特定多数の人々が知ることができるように発表することをいい、自社のホームページのトップページから5回程度の操作で到達できる場所への掲載は「公表」に該当するが、自社の店舗や事務所等、顧客が訪れることが想定される場所におけるポスター等の掲示は、自社の顧客という特定の者のみが知ることができるため「公表」には該当しない。","④":"個人情報取扱事業者は、個人情報の保護に関する法律第23条第1項各号に掲げる場合を除くほか、あらかじめ本人の同意を得ないで、個人データを第三者に提供してはならないが、「提供」とは、個人データ、保有個人データ又は匿名加工情報（以下、本問において「個人データ等」という。）を、自己以外の者が利用可能な状態に置くことをいい、個人データ等が、物理的に提供されていない場合であっても、ネットワーク等を利用することにより、個人データ等を利用できる状態にあれば（利用する権限が与えられていれば）、「提供」に該当する。"},"note":"","answer":4,"format":"single","negative":false},{"id":"R14-44","kai":14,"era":"令和元年度","num":44,"sectionShort":"資金需要者保護","stem":"消費者契約法に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"適格消費者団体とは、不特定かつ多数の消費者の利益のために消費者契約法の規定による取消権及び差止請求権を行使するのに必要な適格性を有する法人である消費者団体として内閣総理大臣の認定を受けた者をいう。","②":"消費者契約において、「事業者の債務不履行により消費者に生じた損害を賠償する責任の全部を免除する」旨の条項が定められた場合、消費者は、当該消費者契約を取り消すことができる。","③":"消費者契約の解除に伴う損害賠償の額を予定する条項であって、その額が、当該条項において設定された解除の事由、時期等の区分に応じ、当該消費者契約と同種の消費者契約の解除に伴い当該事業者に生ずべき平均的な損害の額を超えるものは、当該条項そのものを無効とする。","④":"消費者の不作為をもって当該消費者が新たな消費者契約の申込み又はその承諾の意思表示をしたものとみなす条項その他の法令中の公の秩序に関しない規定の適用による場合に比して消費者の権利を制限し又は消費者の義務を加重する消費者契約の条項であって、民法第1条第2項に規定する基本原則に反して消費者の利益を一方的に害するものは、無効とする。"},"note":"","answer":4,"format":"single","negative":false},{"id":"R14-45","kai":14,"era":"令和元年度","num":45,"sectionShort":"資金需要者保護","stem":"不当景品類及び不当表示防止法（以下、本問において「景品表示法」という。）に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"「景品類」とは、顧客を誘引するための手段として、くじの方法により、事業者が相手方に提供する物品、金銭その他の経済上の利益であって、内閣総理大臣が指定するものをいい、事業者が自己の供給する商品又は役務の取引に付随して相手方に提供する物品等に限られない。","②":"「表示」とは、顧客を誘引するための手段として、事業者が自己の供給する商品又は役務の内容又は取引条件その他これらの取引に関する事項について行う広告その他の表示であって、公正取引委員会が指定するものをいう。","③":"事業者は、自己の供給する商品又は役務の取引について、景品類の提供又は表示により不当に顧客を誘引し、一般消費者による自主的かつ合理的な選択を阻害することのないよう、景品類の価額の最高額、総額その他の景品類の提供に関する事項及び商品又は役務の品質、規格その他の内容に係る表示に関する事項を適正に管理するために必要な体制の整備その他の必要な措置を講じなければならない。","④":"事業者が、景品表示法第4条（景品類の制限及び禁止）及び第5条（不当な表示の禁止）の規定に違反する行為をした場合、内閣総理大臣は、当該事業者に対し、政令で定める方法により算定した額の課徴金を国庫に納付することを命じなければならない。"},"note":"","answer":3,"format":"single","negative":false},{"id":"R14-46","kai":14,"era":"令和元年度","num":46,"sectionShort":"資金需要者保護","stem":"個人情報の保護に関する法律（以下、本問において「個人情報保護法」という。）についての次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"個人情報取扱事業者は、個人データを第三者（個人情報保護法第2条（定義）第5項各号に掲げる者を除く。）に提供し、個人情報保護委員会規則で定めるところにより、当該個人データを提供した年月日、当該第三者の氏名又は名称その他の個人情報保護委員会規則で定める事項に関する記録を作成した。この場合、当該個人情報取扱事業者は、当該記録を、当該記録を作成した日から個人情報保護委員会規則で定める期間保存しなければならない。","②":"個人情報取扱事業者は、第三者（個人情報保護法第2条第5項各号に掲げる者を除く。）から個人データの提供を受けるに際しては、個人情報保護委員会規則で定めるところにより、「当該第三者の氏名又は名称及び住所並びに法人にあっては、その代表者（法人でない団体で代表者又は管理人の定めのあるものにあっては、その代表者又は管理人）の氏名」、「当該第三者による当該個人データの取得の経緯」の確認を行わなければならない。ただし、当該個人データの提供が個人情報保護法第23条（第三者提供の制限）第1項各号又は第5項各号のいずれかに該当する場合は、この限りでない。","③":"個人情報の保護に関する法律についてのガイドライン（通則編）によれば、個人情報取扱事業者は、あらかじめ本人の同意を得ないで個人データを第三者に提供してはならないが、フランチャイズ組織の本部と加盟店の間で個人データを交換する場合は、第三者提供に該当しないとされている。","④":"金融分野における個人情報保護に関するガイドラインによれば、金融分野における個人情報取扱事業者は、個人情報保護法第23条に従い、第三者提供についての同意を得る際には、原則として、書面（電磁的記録を含む。）によることとし、当該書面における記載を通じて、個人データを提供する第三者、提供を受けた第三者における利用目的、第三者に提供される情報の内容を本人に認識させた上で同意を得ることとされている。"},"note":"","answer":3,"format":"single","negative":true},{"id":"R14-47","kai":14,"era":"令和元年度","num":47,"sectionShort":"資金需要者保護","stem":"日本貸金業協会（以下、本問において「協会」という。）が定める貸付自粛対応に関する規則についての次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"貸付自粛とは、本人が、自らに浪費の習癖があることもしくはギャンブル等依存症により本人やその家族の生活に支障を生じさせるおそれがあることその他の理由により自らを自粛対象者(注1)とする旨又は親族のうち一定の範囲の者が金銭貸付による債務者を自粛対象者とする旨を協会もしくは全銀協センター(注2)に対して申告することにより、協会が、これに対応する情報を個人信用情報機関に登録を依頼し、当該情報を登録した個人信用情報機関が、一定期間、当該個人信用情報機関の会員に対して当該情報を提供することをいう。","②":"自粛対象者本人、自粛対象者の親権者、後見人、保佐人もしくは補助人又は自粛対象者の配偶者もしくは二親等内の親族は、いつでも、協会に対し、貸付自粛の申告をすることができる。","③":"自粛対象者の配偶者は、当該自粛対象者の同意を得ずに当該自粛対象者について貸付自粛の申告をした。この場合、当該自粛対象者は、いつでも当該申告を取り消すことができる。","④":"協会員は、個人信用情報機関と個人信用情報の提供を受けることに関し契約を締結している場合において、個人顧客との間で貸付けに係る契約（貸金業法施行規則第1条の2の3第2号から第5号のいずれかに該当する契約及び極度方式貸付けに係る契約を除く。）を締結しようとするときは、当該個人信用情報機関に対し、貸付自粛情報の提供を求めなければならない。"},"note":"(注1)自粛対象者とは、本人が貸金業者に対し金銭の貸付けを求めてもこれに応じないこととするよう求める対象となる個人をいう。(注2)全銀協センターとは、一般社団法人全国銀行協会全国銀行個人信用情報センターをいう。","answer":2,"format":"single","negative":true},{"id":"R14-48","kai":14,"era":"令和元年度","num":48,"sectionShort":"財務会計","stem":"企業会計原則（大蔵省企業会計審議会発表）の一般原則に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"株主総会提出のため、信用目的のため、租税目的のため等種々の目的のために異なる形式の財務諸表を作成してはならない。これを一般に単一性の原則という。","②":"資本と負債とを明確に区別し、特に資本金と借入金とを混同してはならない。これを一般に明確性の原則という。","③":"企業会計は、高額の取引につき、正規の簿記の原則に従って、公正な財務諸表を作成しなければならない。これを一般に公正性の原則という。","④":"企業会計は、その処理の原則及び手続を毎期継続して適用し、みだりにこれを変更してはならない。これを一般に継続性の原則という。"},"note":"","answer":4,"format":"single","negative":false},{"id":"R14-49","kai":14,"era":"令和元年度","num":49,"sectionShort":"財務会計","stem":"企業会計原則（大蔵省企業会計審議会発表）の貸借対照表原則に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"資産は、流動資産に属する資産、固定資産に属する資産及び繰延資産に属する資産に区別しなければならない。仮払金、未決算等の勘定を貸借対照表に記載するには、その性質を示す適当な科目で表示しなければならない。","②":"取引先との通常の商取引によって生じた支払手形、買掛金等の債務、社債、退職金給与引当金、特別修繕引当金及び期限が一年以内に到来する債務は、流動負債に属するものとする。","③":"資本は、資本金に属するものと剰余金に属するものとに区別しなければならない。資本金の区分には、法定資本の額を記載する。剰余金は、貸借対照表の欄外に資本準備金、利益準備金等の種類別に注記するものとする。","④":"貸借対照表に記載する資産の価額は、原則として、当該資産の期末時点における評価額を基礎として計上しなければならない。"},"note":"","answer":1,"format":"single","negative":false},{"id":"R14-50","kai":14,"era":"令和元年度","num":50,"sectionShort":"財務会計","stem":"企業会計原則（大蔵省企業会計審議会発表）の損益計算書原則に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"損益計算書は、企業の経営成績を明らかにするため、一会計期間に属するすべての収益とこれに対応するすべての費用とを記載して経常利益を表示し、これに特別損益に属する項目を加減して当期純利益を表示しなければならない。","②":"すべての費用及び収益は、その支出及び収入に基づいて計上し、その発生した期間に正しく割り当てられるように処理しなければならない。未実現収益も、当期の損益計算に計上しなければならない。","③":"前払費用及び前受収益は、これを当期の損益計算から除去し、未払費用及び未収収益は、当期の損益計算に計上しなければならない。","④":"費用及び収益は、総額によって記載することを原則とし、費用の項目と収益の項目とを直接に相殺することによってその全部又は一部を損益計算書から除去してはならない。"},"note":"","answer":2,"format":"single","negative":true},{"id":"R15-01","kai":15,"era":"令和2年度","num":1,"sectionShort":"法令","stem":"貸金業法上の用語の定義等に関する次のａ～ｄの記述のうち、その内容が適切なものの個数を①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"貸金業とは、金銭の貸付け又は金銭の貸借の媒介（手形の割引、売渡担保その他これらに類する方法によってする金銭の交付又は当該方法によってする金銭の授受の媒介を含む。）で業として行うものをいうが、貸金業から除かれるものの1つとして、事業者がその従業者に対して行うものがある。","ｂ":"資金需要者等とは、資金需要者である顧客又は債務者をいい、保証人となろうとする者及び保証人は、資金需要者等に含まれない。","ｃ":"個人信用情報とは、資金需要者である顧客又は債務者の借入金の返済能力に関する情報をいう。","ｄ":"住宅資金貸付契約とは、住宅の建設又は購入に必要な資金（住宅の用に供する土地又は借地権の取得に必要な資金を含む。）の貸付けに係る契約をいい、住宅の改良に必要な資金の貸付けに係る契約は、住宅資金貸付契約に含まれない。"},"options":{"①":"1個","②":"2個","③":"3個","④":"4個"},"note":"","answer":1,"format":"count","negative":false},{"id":"R15-02","kai":15,"era":"令和2年度","num":2,"sectionShort":"法令","stem":"貸金業者の登録等に関する次のａ～ｄの記述のうち、その内容が適切なものの個数を①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"貸金業法第4条（登録の申請）第1項第2号等に規定する政令で定める使用人は、貸金業の登録を受けようとする者の使用人で、貸金業に関し貸金業法第4条第1項に規定する営業所又は事務所の業務を統括する者その他これに準ずる者で内閣府令で定めるものである。","ｂ":"貸金業者は、貸金業の登録の更新を受けようとするときは、その者が現に受けている貸金業の登録の有効期間満了の日までに当該登録の更新を申請しなければならない。","ｃ":"貸金業者登録簿には、貸金業者の商号、名称又は氏名及び住所、営業所又は事務所の名称及び所在地等のほか、業務の種類及び方法も登録される。","ｄ":"貸金業法第4条第1項の登録申請書に記載する営業所又は事務所とは、貸金業者又はその代理人が一定の場所で貸付けに関する業務の全部又は一部を継続して営む施設又は設備をいうが、貸金業者が既存の営業所又は事務所の隣接地に新たに設置する、現金自動設備及び自動契約受付機は、いずれも営業所又は事務所には該当しない。"},"options":{"①":"1個","②":"2個","③":"3個","④":"4個"},"note":"","answer":2,"format":"count","negative":false},{"id":"R15-03","kai":15,"era":"令和2年度","num":3,"sectionShort":"法令","stem":"貸金業法第10条（廃業等の届出）に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"株式会社である貸金業者がその株主総会における解散決議により解散した場合、当該株式会社の貸金業の登録は、その清算人がその旨をその登録をした内閣総理大臣又は都道府県知事（以下、本問において「登録行政庁」という。）に届け出た時に、その効力を失う。","②":"株式会社である貸金業者が合併により消滅した場合、合併による存続会社又は新設会社を代表する役員は、その日から30日以内に、その旨を登録行政庁に届け出なければならない。","③":"個人である貸金業者について破産手続開始の決定があった場合、当該個人は、その日から30日以内に、その旨を登録行政庁に届け出なければならない。","④":"個人である貸金業者が死亡した場合においては、相続人（相続人が2人以上ある場合において、その全員の同意により事業を承継すべき相続人を選定したときは、その者）は、被相続人の死亡後60日間（当該期間内に貸金業法第6条第1項の規定による登録の拒否の処分があったときは、その日までの間）は、引き続き貸金業を営むことができる。"},"note":"","answer":4,"format":"single","negative":false},{"id":"R15-04","kai":15,"era":"令和2年度","num":4,"sectionShort":"法令","stem":"貸金業者向けの総合的な監督指針において、監督当局が、外部委託（貸金業者が貸金業の業務を第三者に委託すること）について貸金業者を監督するに当たって留意するものとされている事項に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"外部委託には、形式上、外部委託契約が結ばれていなくともその実態において外部委託と同視しうる場合や当該外部委託された業務等が海外で行われる場合も含まれる。","②":"委託業務に関して契約どおりサービスの提供が受けられず、顧客利便に支障が生じるおそれがある場合、直ちに外部委託先を変更して変更後の外部委託先に対応させるための態勢を整備しているか。","③":"外部委託先において漏えい事故等が発生した場合に、適切な対応がなされ、速やかに外部委託先から監督当局に報告される体制になっていることを確認しているか。","④":"二段階以上の委託が行われた場合であっても、再委託先等の事業者に対して貸金業者自身による直接の監督を行い、外部委託先に対して再委託先等の事業者への監督を行わせないような措置が講じられているか。"},"note":"","answer":1,"format":"single","negative":false},{"id":"R15-05","kai":15,"era":"令和2年度","num":5,"sectionShort":"法令","stem":"貸金業法第12条の3（貸金業務取扱主任者の設置）に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"貸金業者は、営業所又は事務所（自動契約受付機もしくは現金自動設備のみにより貸付けに関する業務を行う営業所もしくは事務所又は代理店を除く。以下、本問において「営業所等」という。）ごとに、貸金業の業務に従事する者50人に1人の割合で貸金業務取扱主任者を置かなければならないが、当該貸金業の業務に従事する者には、人事、労務、経理又はシステム管理等その業務遂行の影響が、通常、資金需要者等に及ばない業務に従事する者が含まれる。","②":"貸金業者向けの総合的な監督指針によれば、貸金業法施行規則第10条の7（貸金業務取扱主任者の設置）第1号の「常時勤務する者」とは、営業時間内に営業所等に常時駐在する必要はなく、2つの営業所等が同じ建物内にあり、貸金業務取扱主任者が常時往来できると認められる実態があれば、2つの営業所等を兼務する貸金業務取扱主任者を置くことができるとされている。","③":"貸金業者は、貸金業務取扱主任者が貸金業法第12条の3第1項の助言又は指導に係る職務を適切に遂行できるよう必要な配慮を行わなければならず、貸金業の業務に従事する使用人その他の従業者は、貸金業務取扱主任者が行う同項の助言を尊重するとともに、同項の指導に従わなければならない。","④":"貸金業者は、営業所等における唯一の貸金業務取扱主任者が定年退職により当該営業所等に常時勤務する者でなくなった場合において、その後も当該営業所等で貸金業の業務を継続するときは、当該貸金業務取扱主任者が常時勤務する者でなくなった日から2週間以内に、新たに貸金業務取扱主任者を当該営業所等に置かなければならない。"},"note":"","answer":3,"format":"single","negative":false},{"id":"R15-06","kai":15,"era":"令和2年度","num":6,"sectionShort":"法令","stem":"貸金業法第12条の6（禁止行為）に関する次のａ～ｄの記述のうち、その内容が適切なものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"貸金業者は、保証人となろうとする者に対し、主たる債務者が弁済することが確実であると誤解させるおそれのあることを告げる行為をした場合、その登録をした内閣総理大臣又は都道府県知事（以下、本問において「登録行政庁」という。）から、その登録を取り消され、又は1年以内の期間を定めて、その業務の全部もしくは一部の停止を命じられることがある。","ｂ":"貸金業者は、資金需要者等に対し、不確実な事項について断定的判断を提供し、又は確実であると誤認させるおそれのあることを告げる行為をした場合、貸金業法上、刑事罰の対象となる。","ｃ":"貸金業者向けの総合的な監督指針（以下、本問において「監督指針」という。）によれば、例えば、資金需要者等から契約の内容について問合せがあったにもかかわらず、当該内容について回答せず、資金需要者等に不利益を与えることは、貸金業法第12条の6第1号に規定する「貸付けの契約の内容のうち重要な事項を告げない」行為に該当するおそれが大きいことに留意する必要があるとされている。","ｄ":"監督指針によれば、貸金業法第12条の6第4号に規定する「偽りその他不正又は著しく不当な行為」にいう「不正な」行為とは、違法な行為には該当しないが、客観的に見て、実質的に妥当性を欠く又は適当でない行為、「不当な」行為とは、不正な程度にまで達していない行為をいうとされている。"},"options":{"①":"ａｂ","②":"ａｃ","③":"ｂｄ","④":"ｃｄ"},"note":"","answer":2,"format":"combo","negative":false},{"id":"R15-07","kai":15,"era":"令和2年度","num":7,"sectionShort":"法令","stem":"貸金業法第12条の8（利息、保証料等に係る制限等）に関する次のａ～ｄの記述のうち、その内容が適切なものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"貸金業者は、その利息（みなし利息を含む。）が利息制限法第1条に規定する金額を超える利息の契約を締結してはならない。また、貸金業者は、同条に規定する金額を超える利息を受領し、又はその支払を要求してはならない。","ｂ":"金銭の貸借の媒介を行った貸金業者は、当該媒介により締結された貸付けに係る契約の債務者から当該媒介の手数料を受領した。この場合において、当該貸付けに係る契約について更新があったときは、当該貸金業者は、当該更新に対する新たな手数料を当該債務者から受領することができる。","ｃ":"貸金業者は、貸付けに係る契約について、業として保証を行う者（以下、本問において「保証業者」という。）と保証契約を締結しようとするときは、あらかじめ、当該保証契約を締結するまでに、当該保証業者への照会その他の方法により、当該保証業者と当該貸付けに係る契約の相手方又は相手方となろうとする者との間における保証料に係る契約の締結の有無、及び当該保証料に係る契約を締結する場合には当該保証料の額を確認しなければならない。","ｄ":"貸金業者は、保証業者との間で根保証契約（一定の範囲に属する不特定の貸付けに係る債務を主たる債務とする保証契約をいう。）を締結しようとする場合において、当該根保証契約が、当該根保証契約において1年を経過した日より後の日を元本確定期日として定める根保証契約又は元本確定期日の定めがない根保証契約に当たるものであるときは、当該根保証契約を締結してはならない。"},"options":{"①":"ａｂ","②":"ａｃ","③":"ｂｄ","④":"ｃｄ"},"note":"","answer":2,"format":"combo","negative":false},{"id":"R15-08","kai":15,"era":"令和2年度","num":8,"sectionShort":"法令","stem":"貸金業法第13条（返済能力の調査）に関する次の記述のうち、その内容が適切なものを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。なお、本問における貸付けに係る契約は、極度方式基本契約及び極度方式貸付けに係る契約ではないものとする。また、本問における貸金業者は、非営利特例対象法人及び特定非営利金融法人ではないものとする。","statements":{},"options":{"①":"貸金業者は、個人である顧客との間で、他の貸金業者を債権者とする金銭の貸借の媒介に係る契約を締結しようとする場合、当該顧客の返済能力の調査を行うに際し、指定信用情報機関が保有する信用情報を使用しなければならない。","②":"貸金業者は、法人である顧客との間で、手形（融通手形を除く。）の割引を内容とする契約を締結しようとする場合、当該顧客の収入又は収益その他の資力、信用、借入れの状況、返済計画その他の返済能力に関する事項を調査する必要はない。","③":"貸金業者は、当該貸金業者とは他に貸付けに係る契約を締結していない個人である顧客との間で、貸付けの金額が30万円である貸付けに係る契約を締結しようとする場合において、指定信用情報機関が保有する信用情報を使用して返済能力の調査を行った結果、当該顧客の他の貸金業者に対する借入残高が70万円であることが判明したときは、当該契約を締結するに際して、当該顧客から、当該顧客の資力を明らかにする書面等の提出又は提供を受けなければならない。","④":"貸金業者は、個人である顧客との間で、貸付けに係る契約を締結した場合、内閣府令で定めるところにより、貸金業法第13条第1項の規定による調査に関する記録を作成し、これを当該貸付けに係る契約に定められた最終の返済期日（当該貸付けに係る契約に基づく債権が弁済その他の事由により消滅したときにあっては、当該債権の消滅した日）までの間保存しなければならない。"},"note":"","answer":4,"format":"single","negative":false},{"id":"R15-09","kai":15,"era":"令和2年度","num":9,"sectionShort":"法令","stem":"株式会社である貸金業者Ａは、個人顧客Ｂとの間で極度額を30万円とする極度方式基本契約（以下、本問において「本件基本契約」という。）を締結した。Ａは、Ｂとの間で本件基本契約以外の貸付けに係る契約を締結していない。この場合において、Ａが行う貸金業法第13条に規定する返済能力調査に関する次のａ～ｄの記述のうち、その内容が適切なものの個数を①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。なお、本件基本契約は、貸金業法施行規則第1条の2の3（個人信用情報の対象とならない契約）第2号から第5号までに掲げる契約ではないものとする。","statements":{"ａ":"Ａは、Ｂに返済能力の低下が認められたことを理由に極度額を一時的に10万円に減額した後、Ｂとの間の合意に基づき、極度額を、当該極度方式基本契約を締結した当初の30万円に戻そうとする場合、Ｂの返済能力の調査を行う必要はない。","ｂ":"Ａは、Ｂに対し本件基本契約に基づく極度方式貸付けの元本の残高の上限として極度額を下回る額を提示している場合において、当該下回る額を極度額まで増額するときは、Ｂの返済能力の調査を行うに際し、指定信用情報機関が保有する信用情報を使用しなければならない。","ｃ":"Ａは、Ｂとの間の合意に基づき、本件基本契約における極度額を50万円に増額しようとする場合において、指定信用情報機関から提供を受けた信用情報により判明したＢに対するＡ以外の貸金業者の貸付けの残高の合計額は0円であった。この場合、Ａは、Ｂから源泉徴収票その他の当該顧客の収入又は収益その他の資力を明らかにする事項を記載し、又は記録した書面又は電磁的記録として内閣府令で定めるものの提出又は提供を受けなければならない。","ｄ":"Ａは、本件基本契約の極度額を増額した時に作成した返済能力の調査に関する記録を、本件基本契約の解除の日又は本件基本契約に基づくすべての極度方式貸付けに係る契約に定められた最終の返済期日のうち最後のもの（これらの契約に基づく債権のすべてが弁済その他の事由により消滅したときは、その消滅した日）のうちいずれか早い日までの間保存しなければならない。"},"options":{"①":"1個","②":"2個","③":"3個","④":"4個"},"note":"","answer":1,"format":"count","negative":false},{"id":"R15-10","kai":15,"era":"令和2年度","num":10,"sectionShort":"法令","stem":"株式会社である貸金業者Ａが、個人顧客Ｂとの間で締結している極度方式基本契約（以下、本問において「本件基本契約」という。）について行う、本件基本契約が基準額超過極度方式基本契約に該当するかどうかの調査（以下、本問において「本件調査」という。）に関する次のａ～ｄの記述のうち、その内容が適切なものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。なお、Ａは、Ｂとの間で本件基本契約以外の極度方式基本契約を締結していないものとする。","statements":{"ａ":"Ａは、本件基本契約の契約期間を本件基本契約の締結日から同日以後1か月以内の一定の期日までの期間及び当該一定の期日の翌日以後1か月ごとの期間に区分したそれぞれの期間（以下、本問において「所定の期間」という。）において、直近の「所定の期間」内にＡが行った本件基本契約に基づく極度方式貸付けの金額の合計額が5万円で、当該「所定の期間」の末日における本件基本契約に基づく極度方式貸付けの残高の合計額が10万円であった場合、本件調査を行わなければならない。","ｂ":"Ａは、Ｂが本件基本契約に基づく極度方式貸付けに係る契約により負う債務の履行を遅滞したことにより本件基本契約に基づく新たな極度方式貸付けの停止に係る措置を講じていた場合において当該措置を解除したときは、その日から2週間を経過する日までに本件調査を行わなければならない。","ｃ":"Ａは、本件調査をしなければならない場合、「所定の期間」の末日から3週間を経過する日までに、指定信用情報機関にＢの個人信用情報の提供を依頼しなければならない。","ｄ":"Ａは、本件調査をしなければならない場合において、Ｂに係る極度方式個人顧客合算額が120万円である場合、当該調査を行うに際し、既にＢから源泉徴収票その他のＢの収入又は収益その他の資力を明らかにする事項を記載し、又は記録した書面又は電磁的記録として内閣府令で定めるものの提出又は提供を受けているときを除き、その提出又は提供を受けなければならない。"},"options":{"①":"ａｂ","②":"ａｃ","③":"ｂｄ","④":"ｃｄ"},"note":"","answer":4,"format":"combo","negative":false},{"id":"R15-11","kai":15,"era":"令和2年度","num":11,"sectionShort":"法令","stem":"貸金業法第14条（貸付条件等の掲示）に関する次のａ～ｄの記述のうち、その内容が適切なものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"貸金業者が、貸付条件等の掲示として、営業所又は事務所（以下、本問において「営業所等」という。）ごとに掲示しなければならない事項には、当該営業所等に置かれる貸金業務取扱主任者の氏名、役職名及び登録番号が含まれる。","ｂ":"貸金業者が、貸付条件等の掲示として、営業所等ごとに掲示しなければならない事項には、金銭の貸付けにおいて担保を供することが必要な場合における当該担保に関する事項が含まれる。","ｃ":"貸金業者は、貸付条件等の掲示として、営業所等ごとに貸付けの利率を掲示する場合において、その年率(注)を百分率で表示するときは、少なくとも小数点以下一位まで表示する方法により行わなければならない。","ｄ":"貸金業者が、貸付条件等の掲示をしなければならない営業所等には、あらかじめ定める条件により継続して貸付けを行う契約に基づく金銭の交付又は回収のみを行う現金自動設備が含まれる。"},"options":{"①":"ａｂ","②":"ａｄ","③":"ｂｃ","④":"ｃｄ"},"note":"(注) 年率とは、利息及び貸金業法第12条の8第2項に規定するみなし利息の総額（1年分に満たない利息及び同項に規定するみなし利息を元本に組み入れる契約がある場合にあっては、当該契約に基づき元本に組み入れられた金銭を含む。）を内閣府令で定める方法によって算出した元本の額で除して得た年率をいう。","answer":3,"format":"combo","negative":false},{"id":"R15-12","kai":15,"era":"令和2年度","num":12,"sectionShort":"法令","stem":"次のａ～ｄの記述のうち、貸付けに係る契約を締結しようとする場合における貸金業法第16条の2第1項に規定する書面（契約締結前の書面）に記載し、明らかにしなければならない事項に該当するものの個数を①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。なお、本問における貸付けに係る契約は、金銭の貸付けに係る契約であって、手形の割引の契約及び売渡担保の契約ではないものとする。","statements":{"ａ":"契約申込年月日","ｂ":"貸金業者の商号、名称又は氏名及び住所","ｃ":"契約の相手方となろうとする者の商号、名称又は氏名及び住所","ｄ":"保証人となろうとする者の商号、名称又は氏名及び住所"},"options":{"①":"1個","②":"2個","③":"3個","④":"4個"},"note":"","answer":1,"format":"count","negative":false},{"id":"R15-13","kai":15,"era":"令和2年度","num":13,"sectionShort":"法令","stem":"貸金業法第18条第1項に規定する書面（以下、本問において「受取証書」という。）の交付及び貸金業法第22条に規定する債権の証書（以下、本問において「債権証書」という。）の返還に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"貸金業者は、その営業所の窓口において、貸付けに係る契約に基づく債権の全部について、当該契約の債務者から弁済を受けたときは、遅滞なく、内閣府令で定めるところにより、受取証書を当該債務者に交付しなければならない。","②":"貸金業者は、預金又は貯金の口座に対する払込みにより、貸付けに係る契約に基づく債権の全部について、当該契約の債務者から弁済を受けた場合、当該債務者の請求があったときに限り、受取証書を当該債務者に交付しなければならない。","③":"貸金業者は、極度方式貸付けに係る契約に基づく債権の全部について、当該契約の債務者から弁済を受けた場合において、当該債務者の承諾を得て、内閣府令で定めるところにより、貸金業法第18条第3項に規定する一定期間における貸付け及び弁済その他の取引の状況を記載した書面（マンスリーステートメント）を交付するときは、弁済を受けた日から1か月以内に、受領年月日及び受領金額を記載した受取証書を当該債務者に交付しなければならない。","④":"貸金業者は、貸付けに係る契約につき債権証書を有する場合において、当該契約に基づく債権の全部について、当該契約の債務者以外の第三者から弁済を受けたときは、当該契約の債務者の請求があったときに限り、債権証書を当該債務者に返還しなければならない。"},"note":"","answer":2,"format":"single","negative":false},{"id":"R15-14","kai":15,"era":"令和2年度","num":14,"sectionShort":"法令","stem":"次のａ～ｄの記述のうち、日本貸金業協会が定める貸金業の業務運営に関する自主規制基本規則において、協会員が取立て行為を行うにあたり、貸金業法第21条第1項に定める「威迫」及び「その他の人の私生活もしくは業務の平穏を害するような言動」に該当するおそれがあるとされているものの個数を①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"多人数で訪問すること。例示として、3名以上が挙げられる。","ｂ":"不適当な時期に取立ての行為を行うこと。例示として、親族の冠婚葬祭時等が挙げられる。","ｃ":"反復継続した取立て行為を行うこと。例示として、電子メールや文書を用いた連絡を、前回送付又は送信から3日以内に行うこと等が挙げられる。","ｄ":"親族又は第三者に対し、支払の要求をすること。例示として、支払申し出があった際、支払義務がないことを伝えないこと等が挙げられる。"},"options":{"①":"1個","②":"2個","③":"3個","④":"4個"},"note":"","answer":4,"format":"count","negative":false},{"id":"R15-15","kai":15,"era":"令和2年度","num":15,"sectionShort":"法令","stem":"貸金業者に対する監督等に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"貸金業者は、貸金業を休止した場合は、内閣府令で定めるところにより、その旨を貸金業の登録をした内閣総理大臣又は都道府県知事（以下、本問において「登録行政庁」という。）に届け出る必要はないが、貸金業を廃止した場合は、その旨を登録行政庁に届け出なければならない。","②":"登録行政庁は、貸金業者の営業所もしくは事務所の所在地又は当該貸金業者の所在（法人である場合においては、その役員の所在）を確知できない場合において、内閣府令で定めるところにより、その事実を公告し、その公告の日から2週間を経過しても当該貸金業者から申出がないときは、その登録を取り消すことができる。","③":"貸金業法第24条の6の12第1項に規定する監督を行うため、登録行政庁は、貸金業協会に加入していない貸金業者に対して、貸金業協会の定款、業務規程その他の規則を考慮し、当該貸金業者又はその役員もしくは使用人が遵守すべき規則の作成又は変更を命ずることができる。","④":"登録行政庁は、その登録を受けた貸金業者の業務の運営に関し、資金需要者等の利益の保護を図るため必要があると認めるときは、貸金業法その他の法令に違反する事実があると認定した上で、当該貸金業者に対して、業務の方法の変更その他業務の運営の改善に必要な措置を命じなければならない。"},"note":"","answer":3,"format":"single","negative":false},{"id":"R15-16","kai":15,"era":"令和2年度","num":16,"sectionShort":"法令","stem":"Ａは貸金業者、ＢはＡの顧客、Ｃは保証業者である。保証料の制限等に関する次の①～④の記述のうち、利息制限法及び出資法(注)上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。なお、本問における営業的金銭消費貸借契約は、貸付期間を1年とし元利一括返済とする旨の約定がなされているものとする。","statements":{},"options":{"①":"Ａは、Ｂとの間で、元本額100万円、利率年1割3分（13％）とする営業的金銭消費貸借契約を締結して100万円をＢに貸し付け、当該契約について、Ｃとの間で、保証契約を締結した。この場合において、ＣがＢとの間で締結する保証料の契約は、その保証料が20,000円を超えるときは、その契約の全部が無効となる。","②":"Ａは、Ｂとの間で、元本額50万円、利率年1割4分（14％）とする営業的金銭消費貸借契約を締結して50万円をＢに貸し付け、当該契約について、Ｃとの間で、保証契約を締結した。その後、Ｃは、Ｂとの間で、ＣがＢから15,000円の保証料の支払を受ける旨の保証料の契約を締結した。この場合において、ＡとＢとの合意により、当該営業的金銭消費貸借契約の利息を利率年1割6分（16％）に変更したときは、当該変更後の利息の約定は、年1割5分（15％）を超える部分に限り無効となる。","③":"Ａは、Ｂとの間で、元本額80万円とする営業的金銭消費貸借契約を締結して80万円をＢに貸し付け、ＢがＡに支払う利息を変動利率をもって定めた。Ａは、当該契約について、Ｃとの間で、保証契約を締結し、当該保証契約においてＡがＢから支払を受けることができる利息の利率の上限を年1割6分（16％）とする定めをし、当該定めをＢに通知した。この場合、Ｃは、Ｂとの間で保証料の契約を締結し、Ｂから、24,000円の範囲内で保証料の支払を受けることができる。","④":"Ａは、Ｂとの間で、元本額20万円、利率年1割2分（12％）とする営業的金銭消費貸借契約を締結して20万円をＢに貸し付け、当該契約について、Ｃとの間で、保証契約を締結した。その後、Ｃは、Ｂとの間で、ＣがＢから20,000円の保証料の支払を受ける旨の保証料の契約を締結した。この場合、Ａ及びＣは、出資法上、刑事罰の対象となる。"},"note":"(注) 出資法とは、出資の受入れ、預り金及び金利等の取締りに関する法律をいう。","answer":2,"format":"single","negative":false},{"id":"R15-17","kai":15,"era":"令和2年度","num":17,"sectionShort":"法令","stem":"次の①～④の記述のうち、貸金業法第6条（登録の拒否）第1項各号のいずれにも該当しないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"貸金業法第24条の6の4（監督上の処分）第1項の規定により貸金業の登録を取り消された株式会社の取締役を当該取消しの日の60日前に退任した者であって、当該取消しの日から5年を経過しないもの","②":"破産手続開始の決定を受けて復権を得ない者","③":"禁錮以上の刑に処せられ、その刑の執行を終わり、又は刑の執行を受けることがなくなった日から5年を経過しない者","④":"株式会社であって、再生手続開始の決定又は更生手続開始の決定のいずれも受けておらず、その純資産額が3,000万円である者"},"note":"","answer":1,"format":"single","negative":true},{"id":"R15-18","kai":15,"era":"令和2年度","num":18,"sectionShort":"法令","stem":"貸金業法第8条（変更の届出）に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"貸金業者は、その商号、名称又は氏名に変更があった場合、その日から2週間以内に、その旨を貸金業の登録を受けた内閣総理大臣又は都道府県知事（以下、本問において「登録行政庁」という。）に届け出なければならない。","②":"株式会社である貸金業者は、その取締役の氏名に変更があったときは、その日から2週間以内に、その旨を登録行政庁に届け出なければならない。","③":"貸金業者は、営業所又は事務所に置いた貸金業務取扱主任者がその登録の更新を受けたときは、その日から2週間以内に、その旨を登録行政庁に届け出なければならない。","④":"貸金業者は、その業務に関して広告又は勧誘をする際に表示等をする営業所又は事務所のホームページアドレスを変更しようとするときは、あらかじめ、その旨を登録行政庁に届け出なければならない。"},"note":"","answer":3,"format":"single","negative":true},{"id":"R15-19","kai":15,"era":"令和2年度","num":19,"sectionShort":"法令","stem":"貸金業者向けの総合的な監督指針における反社会的勢力による被害の防止に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"反社会的勢力による不当要求への対処として、反社会的勢力からの不当要求があった場合には積極的に警察・暴力追放運動推進センター・弁護士等の外部専門機関に相談するとともに、暴力追放運動推進センター等が示している不当要求対応要領等を踏まえた対応を行うこととしているか。特に、脅迫・暴力行為の危険性が高く緊急を要する場合には直ちに警察に通報を行うこととしているか。","②":"反社会的勢力との関係を遮断するための対応を総括する部署において、反社会的勢力による被害を防止するための一元的な管理態勢が構築され、反社会的勢力に関する情報を積極的に収集・分析するとともに、当該情報を一元的に管理したデータベースを構築し、適切に更新する体制となっているか。ただし、当該情報の収集・分析等に際し、グループ内で情報の共有をすることは、個人情報の保護に関する法律への抵触を避けるために、行わないこととしているか。","③":"反社会的勢力との取引を未然に防止するため、反社会的勢力に関する情報等を活用した適切な事前審査を実施するとともに、契約書や取引約款への暴力団排除条項の導入を徹底するなど、反社会的勢力が取引先となることを防止しているか。また、提携ローンについては、暴力団排除条項の導入を徹底の上、貸金業者が自ら事前審査を実施する体制を整備し、かつ、提携先の信販会社における暴力団排除条項の導入状況や反社会的勢力に関するデータベースの整備状況等を検証する態勢となっているか。","④":"反社会的勢力との取引解消に向けた取組みとして、いかなる理由であれ、反社会的勢力であることが判明した場合には、資金提供や不適切・異例な取引を行わない態勢を整備しているか。"},"note":"","answer":2,"format":"single","negative":true},{"id":"R15-20","kai":15,"era":"令和2年度","num":20,"sectionShort":"法令","stem":"貸金業者Ａは、貸付けに係る契約について、個人である保証人となろうとする者Ｂとの間で保証契約を締結しようとしている。この場合に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。なお、本問における貸金業者Ａは、非営利特例対象法人及び特定非営利金融法人ではないものとする。","statements":{},"options":{"①":"Ａは、Ｂとの間で保証契約を締結しようとする場合、Ｂの収入又は収益その他の資力、信用、借入れの状況、返済計画その他の返済能力に関する事項を調査しなければならない。","②":"Ａは、Ｂとの間で保証契約を締結しようとする場合、Ｂの返済能力の調査を行うに際し、指定信用情報機関が保有する信用情報を使用しなければならない。","③":"Ａは、Ｂとの間で、貸付けの金額が100万円を超える貸付けに係る契約について保証契約を締結しようとする場合には、Ｂから、源泉徴収票その他のＢの収入又は収益その他の資力を明らかにする事項を記載し、又は記録した書面又は電磁的記録として内閣府令で定めるものの提出又は提供を受ける必要はない。","④":"Ａは、Ｂとの間で保証契約を締結した場合、内閣府令で定めるところにより、Ｂの返済能力の調査に関する記録を作成し、当該保証契約の解除の日又は当該保証契約に基づく債務が消滅した日のうちいずれか遅い日までの間、これを保存しなければならない。"},"note":"","answer":4,"format":"single","negative":true},{"id":"R15-21","kai":15,"era":"令和2年度","num":21,"sectionShort":"法令","stem":"次の①～④の記述のうち、貸金業法第13条の2（過剰貸付け等の禁止）第2項に規定する個人過剰貸付契約から除かれる契約として貸金業法施行規則第10条の21で定めるものに該当しないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"個人顧客又は当該個人顧客の親族で当該個人顧客と生計を一にする者の健康保険法第115条第1項及び第147条に規定する高額療養費を支払うために必要な資金の貸付けに係る契約","②":"自動車の購入に必要な資金の貸付けに係る契約のうち、当該自動車の所有権を貸金業者が取得し、又は当該自動車が譲渡により担保の目的となっているもの","③":"個人顧客のために担保を提供する者の居宅を担保とする貸付けに係る契約であって、当該個人顧客の返済能力を超えないと認められるもの（貸付けの金額が当該貸付けに係る契約の締結時における当該居宅の価格の範囲内であるものに限る。）","④":"手形の割引を内容とする契約であって、割引の対象となる手形が融通手形ではないもの"},"note":"","answer":3,"format":"single","negative":true},{"id":"R15-22","kai":15,"era":"令和2年度","num":22,"sectionShort":"法令","stem":"保証契約を締結する場合の書面の交付に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。なお、本問における貸付けに係る契約は、金銭の貸付けに係る契約であって、極度方式基本契約、極度方式貸付けに係る契約、手形の割引の契約及び売渡担保の契約ではないものとする。","statements":{},"options":{"①":"貸金業者は、貸付けに係る契約について保証契約を締結しようとする場合には、当該保証契約を締結するまでに、内閣府令で定めるところにより、貸金業法第16条の2第3項に規定する書面について、貸金業法施行規則第12条の2第6項の規定に基づき当該保証契約の概要を記載した書面及び詳細を記載した書面の2種類の書面を同時に、当該保証契約の保証人となろうとする者に交付しなければならない。","②":"貸金業者は、貸付けに係る契約について保証契約を締結したときは、遅滞なく、内閣府令で定めるところにより、貸金業法第17条第3項前段に規定する書面（以下、本問において「保証契約における契約締結時の書面」という。）に加えて、貸金業法第17条第1項各号に掲げる事項について当該貸付けに係る契約の内容を明らかにする書面を当該保証契約の保証人に交付しなければならない。","③":"貸金業者は、貸付けに係る契約について保証契約を締結したときは、遅滞なく、内閣府令で定めるところにより、貸金業法第17条第1項各号に掲げる事項について当該貸付けに係る契約の内容を明らかにする書面に加えて、保証契約における契約締結時の書面を当該貸付けに係る契約の相手方に交付しなければならない。","④":"貸金業者は、貸付けに係る契約について保証契約を締結した後に当該保証契約における保証期間を変更した場合、当該変更が当該保証契約の保証人の利益となる変更であるときを除き、変更後の保証期間が記載された保証契約における契約締結時の書面を当該保証人に再交付しなければならない。"},"note":"","answer":3,"format":"single","negative":true},{"id":"R15-23","kai":15,"era":"令和2年度","num":23,"sectionShort":"法令","stem":"貸金業者Ａが、個人顧客Ｂとの間で貸付けに係る契約を締結し金銭をＢに貸し付け、Ｂに貸金業法第17条第1項に規定する書面（以下、本問において「契約締結時の書面」という。）を交付した後に、Ｂとの合意に基づき契約締結時の書面に記載した事項を変更した。この場合に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。なお、本問における貸付けに係る契約は、金銭の貸付けに係る契約であって、極度方式基本契約、極度方式貸付けに係る契約、手形の割引の契約及び売渡担保の契約ではないものとする。","statements":{},"options":{"①":"Ａは、「貸付けの利率」を引き上げた場合、変更後の内容を記載した契約締結時の書面をＢに再交付しなければならない。","②":"Ａは、「返済の方式」を変更した場合、変更後の内容を記載した契約締結時の書面をＢに再交付しなければならない。","③":"Ａは、「返済の方法及び返済を受ける場所」を変更した場合、当該変更がＢの利益となるか否かを問わず、変更後の内容を記載した契約締結時の書面をＢに再交付しなければならない。","④":"Ａは、「契約上、返済期日前の返済ができるか否か及び返済ができるときはその内容」を変更した場合、当該変更がＢの利益となるか否かを問わず、変更後の内容を記載した契約締結時の書面をＢに再交付しなければならない。"},"note":"","answer":4,"format":"single","negative":true},{"id":"R15-24","kai":15,"era":"令和2年度","num":24,"sectionShort":"法令","stem":"貸金業者が貸金業法に基づき保存すべきものに関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"貸金業者は、貸金業法第12条の4（証明書の携帯等）第2項に規定する従業者名簿を、最終の記載をした日から10年間保存しなければならない。","②":"貸金業者は、貸金業法施行規則第10条の21（個人過剰貸付契約から除かれる契約）第1項第1号に規定する不動産の建設又は不動産の改良に必要な資金の貸付けに係る契約（極度方式基本契約及び極度方式貸付けに係る契約ではないものとする。）を締結した場合には、不動産の建設工事の請負契約書その他の締結した契約が当該規定に掲げる契約に該当することを証明する書面又はそれらの写しを、当該貸付けに係る契約に定められた最終の返済期日（当該貸付けに係る契約に基づく債権が弁済その他の事由により消滅したときにあっては、当該債権の消滅した日）までの間保存しなければならない。","③":"貸金業者は、個人顧客との間で締結した極度方式基本契約が基準額超過極度方式基本契約に該当するかどうかの調査をした場合、内閣府令で定めるところにより、当該調査に関する記録を作成し、これを当該極度方式基本契約に基づくすべての極度方式貸付けに係る契約に定められた最終の返済期日のうち最後のものが到来する日（これらの契約に基づく債権のすべてが弁済その他の事由により消滅したときは、その消滅した日）までの間保存しなければならない。","④":"貸金業者は、極度方式基本契約を締結した場合には、貸金業法第19条に規定する帳簿を、当該極度方式基本契約及び当該極度方式基本契約に基づくすべての極度方式貸付けに係る契約について、当該極度方式基本契約の解除の日又はこれらの契約に定められた最終の返済期日のうち最後のもの（これらの契約に基づく債権のすべてが弁済その他の事由により消滅したときにあっては、その消滅した日）のうちいずれか遅い日から少なくとも10年間保存しなければならない。"},"note":"","answer":3,"format":"single","negative":true},{"id":"R15-25","kai":15,"era":"令和2年度","num":25,"sectionShort":"法令","stem":"貸金業者向けの総合的な監督指針（以下、本問において「監督指針」という。）における不祥事件に対する監督上の対応に関する次の①～④の記述のうち、その内容が監督指針の記載に合致しないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"監督当局は、貸金業者において不祥事件が発覚し、当該貸金業者から第一報があった場合において、刑罰法令に抵触しているおそれのある事実が認められたときは、直ちに、当該貸金業者の営業所等への立入検査を実施し、警察等関係機関等への通報を行うに当たって必要となる不祥事件に関する証拠保全が実施されていることを確認するものとする。","②":"監督当局は、不祥事件と貸金業者の業務の適切性の関係については、「不祥事件の発覚後の対応は適切か」、「不祥事件への経営陣の関与はないか、組織的な関与はないか」、「不祥事件の内容が資金需要者等に与える影響はどうか」、「内部牽制機能が適切に発揮されているか」、「再発防止のための改善策の策定や自浄機能は十分か、関係者の責任の追及は明確に行われているか」、「資金需要者等に対する説明や問い合わせへの対応等は適切か」の着眼点に基づき検証を行うこととする。","③":"監督当局は、不祥事件の届出があった場合には、事実関係（当該行為が発生した営業所等、当該行為者の氏名・職名・職歴（貸金業務取扱主任者である場合にはその旨）、当該行為の概要、発覚年月日、発生期間、発覚の端緒）、発生原因分析、改善・対応策等について深度あるヒアリングを実施し、必要に応じて貸金業法第24条の6の10に基づき報告書を徴収することにより、貸金業者の自主的な業務改善状況を把握することとする。","④":"監督当局は、不祥事件の届出があった場合において、資金需要者等の利益の保護の観点から重大な問題があると認められるときには、貸金業者に対して、貸金業法第24条の6の3の規定に基づく業務改善命令を発出することとする。また、重大・悪質な法令違反行為が認められるときには、貸金業法第24条の6の4に基づく業務停止命令等の発出を検討するものとする。"},"note":"","answer":1,"format":"single","negative":true},{"id":"R15-26","kai":15,"era":"令和2年度","num":26,"sectionShort":"法令","stem":"貸金業法第41条の35（個人信用情報の提供）及び同法第41条の36（指定信用情報機関への信用情報の提供等に係る同意の取得等）に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。なお、本問における貸金業者は、非営利特例対象法人及び特定非営利金融法人ではないものとする。","statements":{},"options":{"①":"加入貸金業者(注1)は、資金需要者である個人の顧客を相手方とする極度方式基本契約を締結したときは、遅滞なく、当該極度方式基本契約に係る個人信用情報を加入指定信用情報機関(注2)に提供しなければならない。","②":"加入貸金業者は、加入指定信用情報機関に資金需要者等に係る信用情報の提供の依頼（当該資金需要者等に係る他の指定信用情報機関が保有する個人信用情報の提供の依頼を含む。）をする場合には、内閣府令で定める場合を除き、あらかじめ、当該資金需要者等から書面又は電磁的方法による同意を得なければならない。","③":"加入貸金業者は、資金需要者である個人の顧客を相手方とする貸付けに係る契約を締結し、当該貸付けに係る契約に係る個人信用情報を加入指定信用情報機関に提供した後、当該提供した個人信用情報に変更があった場合には、遅滞なく、その変更内容を当該指定信用情報機関に提供しなければならない。","④":"加入貸金業者は、貸金業法第41条の36第3項及び貸金業法施行規則第30条の15（信用情報の提供等に係る配偶者の同意の取得等）第3項に規定する同意に関する記録を、当該同意に基づき指定信用情報機関が信用情報を保有している間保存しなければならない。"},"note":"(注1)加入貸金業者とは、指定信用情報機関と信用情報提供契約を締結した相手方である貸金業者をいう。(注2)加入指定信用情報機関とは、加入貸金業者と信用情報提供契約を締結した指定信用情報機関をいう。","answer":1,"format":"single","negative":true},{"id":"R15-27","kai":15,"era":"令和2年度","num":27,"sectionShort":"法令","stem":"みなし利息に関する次の①～④の記述のうち、利息制限法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"Ａは、Ｂとの間で締結した営業的金銭消費貸借契約において、Ｂが金銭の受領又は弁済のために利用する現金自動支払機その他の機械の利用料として、10,000円の弁済を受ける際に110円（消費税額等相当額を含む。）をＢから受領した。この場合、当該利用料は、利息とみなされない。","②":"Ａは、Ｂとの間で締結した営業的金銭消費貸借契約において、金銭の貸付け及び弁済に用いるためＢに交付したカードのＢの要請に基づく再発行の手数料（消費税額等相当額を含む。）をＢから受領した。この場合、当該手数料は、利息とみなされない。","③":"Ａは、Ｂとの間で締結した営業的金銭消費貸借契約において、貸金業法第17条第1項に規定する契約締結時の書面をＢに交付した後、各回の返済期日及び返済金額の変更を行ったため、変更後の契約締結時の書面を作成しＢに再交付した費用（消費税額等相当額を含む。）をＢから受領した。この場合、当該費用は、利息とみなされる。","④":"Ａは、Ｂとの間で締結した営業的金銭消費貸借契約において、口座振替の方法による弁済につき、Ｂが弁済期に弁済できなかったため、Ｂの要請を受けて行った再度の口座振替手続に要した費用（消費税額等相当額を含む。）をＢから受領した。この場合、当該費用は、利息とみなされる。"},"note":"","answer":4,"format":"single","negative":true},{"id":"R15-28","kai":15,"era":"令和2年度","num":28,"sectionShort":"貸付実務","stem":"意思能力及び行為能力に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"成年被後見人の法律行為は、その成年後見人の同意を得て行われたときは、取り消すことができない。","②":"制限行為能力者が行為能力者であることを信じさせるため詐術を用いたときは、当該制限行為能力者の法定代理人はその行為を取り消すことができるが、当該制限行為能力者はその行為を取り消すことができない。","③":"未成年者は、一種又は数種の営業を許されたときは、これによって成年に達したものとみなされる。","④":"法律行為の当事者が意思表示をした時に意思能力を有しなかったときは、その法律行為は、無効とする。"},"note":"","answer":4,"format":"single","negative":false},{"id":"R15-29","kai":15,"era":"令和2年度","num":29,"sectionShort":"貸付実務","stem":"意思表示に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。なお、本問における契約等は、2020年4月1日以降に行われているものとする。","statements":{},"options":{"①":"Ａは、Ｂとの間で、実際には甲建物をＢに売却するつもりであるのに、誤って自己が所有する乙建物をＢに売却する旨の契約を締結した。この場合において、ＢがＡに錯誤があることを知っていたときは、Ａに重大な過失があったとしても、Ａは、錯誤による意思表示を理由として、当該契約を取り消すことができる。","②":"Ａは、第三者Ｃの詐欺により、Ｂとの間で、甲建物をＢに売却する旨の契約を締結した。この場合において、Ｂが、Ｃによる詐欺の事実を知らず、かつ、知ることができなかったとしても、Ａは、詐欺による意思表示を理由として、当該契約を取り消すことができる。","③":"Ａは、Ｂの強迫により、Ｂとの間でＢに甲建物を売却する旨の売買契約を締結し、ＡからＢへの甲建物の所有権移転登記を経た後、Ｂは、この事情を知らず、かつ、知らないことに過失のない第三者Ｃに甲建物を売却した。その後、Ａは、強迫による意思表示を理由としてAB間の売買契約を取り消した。この場合、Ａは、その取消しをＣに対抗することができない。","④":"Ａは、実際には甲建物をＢに売却する意思がないのに、Ｂと通謀して、Ｂに甲建物を売却する旨の虚偽の売買契約を締結し、ＡからＢへの甲建物の所有権移転登記を経た。その後、Ｂは、この事情を知っている第三者Ｃに甲建物を売却した。この場合、Ａは、Ｃに対し、AB間の売買契約が虚偽表示により無効であることを主張することができない。"},"note":"","answer":1,"format":"single","negative":false},{"id":"R15-30","kai":15,"era":"令和2年度","num":30,"sectionShort":"貸付実務","stem":"無効及び取消しに関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"無効な行為は、当事者がその行為の無効であることを知って追認をしたときは、初めから有効であったものとみなされる。","②":"行為能力の制限によって取り消すことができる行為は、制限行為能力者（他の制限行為能力者の法定代理人としてした行為にあっては、当該他の制限行為能力者を含む。）又はその代理人、承継人もしくは同意をすることができる者に限り、取り消すことができる。","③":"制限行為能力を理由に法律行為が取り消された場合、当該法律行為は取消しがあった時から将来に向かって無効となる。","④":"取消権は、追認をすることができる時から3年間行使しないときは、時効によって消滅する。行為の時から5年を経過したときも、同様である。"},"note":"","answer":2,"format":"single","negative":false},{"id":"R15-31","kai":15,"era":"令和2年度","num":31,"sectionShort":"貸付実務","stem":"抵当権に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"土地に設定された抵当権の効力は、当該抵当権の目的である土地の上に存する建物及び当該土地に付加して一体となっている物に及ぶ。","②":"同一の不動産について数個の抵当権が設定されたときは、その抵当権の順位は、抵当権設定契約の締結日付の先後による。","③":"抵当権者は、その抵当権を他の債権の担保とし、又は同一の債務者に対する他の債権者の利益のためにその抵当権もしくはその順位を譲渡し、もしくは放棄することができる。","④":"抵当権は、債務者及び抵当権設定者に対し、その担保する債権とは別に、時効によって消滅する。"},"note":"","answer":3,"format":"single","negative":false},{"id":"R15-32","kai":15,"era":"令和2年度","num":32,"sectionShort":"貸付実務","stem":"債権の目的及び効力に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"債務の不履行に対する損害賠償の請求は、これによって通常生ずべき損害の賠償をさせることをその目的とする。特別の事情によって生じた損害は、当事者がその事情を予見すべきであったときは、債権者は、その賠償を請求することができる。","②":"債務の履行について不確定期限があるときは、債務者は、その期限の到来したことを知り、かつ、債権者からその履行の請求を受けた時から遅滞の責任を負う。","③":"債務の不履行又はこれによる損害の発生もしくは拡大に関して債権者に過失があったときでも、裁判所は、これを考慮して、損害賠償の責任及びその額を減免することはできない。","④":"利息を生ずべき債権について別段の意思表示がないときは、その利率は、年5分となる。"},"note":"","answer":1,"format":"single","negative":false},{"id":"R15-33","kai":15,"era":"令和2年度","num":33,"sectionShort":"貸付実務","stem":"ＡのＢに対する金銭債権を「甲債権」とし、ＢのＡに対する金銭債権を「乙債権」とする。甲債権と乙債権との相殺に関する次の①～④の記述のうち、民法及び破産法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。なお、甲債権及び乙債権は、2020年4月1日以降に生じたものとする。","statements":{},"options":{"①":"甲債権の弁済期が10月15日であり、乙債権の弁済期が同年11月1日である場合、同年10月15日の時点においては、乙債権の弁済期が到来していないため、Ａは、甲債権と乙債権とを相殺することができない。","②":"甲債権が時効によって消滅した後は、甲債権が時効により消滅する以前に、甲債権と乙債権とが相殺に適するようになっていたときであっても、Ａは、甲債権と乙債権とを相殺することができない。","③":"Ａに対して金銭債権を有するＣの申立てに基づき甲債権が差し押さえられ、その差押命令がＢに送達されていた場合において、Ｂが乙債権を当該差押命令の送達後に取得したときは、Ｂは、甲債権と乙債権との相殺をもってＣに対抗することができる。","④":"Ａが破産債権者であり、Ｂが破産者である場合において、Ａが甲債権を破産手続開始前に取得し、Ｂが乙債権を破産手続開始前に取得していたときは、Ａは、破産手続によらないで、甲債権と乙債権とを相殺することができる。"},"note":"","answer":4,"format":"single","negative":false},{"id":"R15-34","kai":15,"era":"令和2年度","num":34,"sectionShort":"貸付実務","stem":"相続に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"被相続人の子が、民法第891条（相続人の欠格事由）の規定に該当したことにより相続人となることができなくなったときは、その者の子は、被相続人の直系卑属であっても、その者を代襲して相続人となることができない。","②":"被相続人の配偶者及び被相続人の兄弟姉妹が相続人である場合、当該兄弟姉妹の法定相続分は、3分の1である。","③":"被相続人の配偶者のみが相続人となる場合、当該配偶者は、遺留分として、被相続人の財産の2分の1に相当する額を受ける。","④":"相続人は、自己のために相続の開始があったことを知った時から6か月以内に、相続について、単純もしくは限定の承認又は放棄をしなければならない。"},"note":"","answer":3,"format":"single","negative":false},{"id":"R15-35","kai":15,"era":"令和2年度","num":35,"sectionShort":"貸付実務","stem":"手形法及び電子記録債権法に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"強迫によって振り出された約束手形を裏書により譲り受けた所持人は、当該事情を知っていた。この場合、当該約束手形の振出人は、当該所持人から手形金の支払を請求されたときは、強迫を理由とする手形行為取消しの抗弁をもって、当該所持人に対抗することができない。","②":"満期において手形金の支払がないときは、約束手形の所持人は、裏書人、振出人その他の債務者に対してその遡求権を行使することができるが、満期前においては、たとえ支払の全部又は一部の拒絶があっても、遡求権を行使することができない。","③":"電子記録債権の譲渡は、当事者間の合意のみによってその効力を生じるが、譲渡記録をしなけれ
