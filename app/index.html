t":"法令","stem":"貸金業法第8条（変更の届出）に関する次のａ～ｄの記述のうち、その内容が適切なものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"貸金業者は、他に行っている事業の種類を変更した場合、その日から2週間以内に、その旨をその登録をした内閣総理大臣又は都道府県知事（以下、本問において「登録行政庁」という。）に届け出なければならない。","ｂ":"貸金業者は、その業務に関して広告又は勧誘をする際に表示等をする営業所又は事務所の電子メールアドレスを変更した場合、その日から2週間以内に、その旨を登録行政庁に届け出なければならない。","ｃ":"貸金業者は、その業務の種類及び方法を変更した場合、その日から2週間以内に、その旨を登録行政庁に届け出なければならない。","ｄ":"貸金業者は、その営業所又は事務所の名称及び所在地を変更した場合、その日から2週間以内に、その旨を登録行政庁に届け出なければならない。"},"options":{"①":"ａｂ","②":"ａｃ","③":"ｂｄ","④":"ｃｄ"},"note":"","answer":2,"format":"combo","negative":false},{"id":"R20-05","kai":20,"era":"令和7年度","num":5,"sectionShort":"法令","stem":"貸金業者向けの総合的な監督指針において、経営管理等に関し、監督当局による貸金業者の監督に当たっての主な着眼点とされている事項等に関する次のａ～ｄの記述のうち、その内容が適切なものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"経営陣は、貸金業務に関する内部監査部門による内部監査（以下、本問において「内部監査」という。）の重要性を認識し、内部監査部門の機能が十分に発揮できる態勢を構築するために、営業部門の指揮命令系統の下に内部監査部門を設置し、その業務を監視するなど実効性のある内部監査が実施できる態勢となっているか。","ｂ":"内部監査部門において、業務運営全般に関し、法令及び社内規則等に則った適正な業務を遂行するための適切なモニタリング・検証が行われ、その結果に基づき内部監査部門の主導により事業計画を作成する態勢を構築しているか。","ｃ":"貸金業者の規模等を踏まえ、内部監査に代えて外部監査を利用する場合においては、外部監査人に対して、監査目的を明確に指示し、監査結果を業務改善に活用するための態勢を整備しているか。","ｄ":"他に貸金業の業務に従事する者がいない個人の貸金業者が内部監査に代わる措置として自己の行う貸金業に関する業務の検証を行う場合には、自己検証を実施するに際し、別添自己検証リストに基づき自社の社内規則等を参考に自己検証項目を設定しているか等の点を踏まえ、業務の適切性を確保するために十分な態勢を整備しているか。"},"options":{"①":"ａｂ","②":"ａｃ","③":"ｂｄ","④":"ｃｄ"},"note":"","answer":4,"format":"combo","negative":false},{"id":"R20-06","kai":20,"era":"令和7年度","num":6,"sectionShort":"法令","stem":"貸金業務取扱主任者制度に関する次のａ～ｄの記述のうち、その内容が適切なものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。なお、本問における営業所等は、自動契約受付機もしくは現金自動設備のみにより貸付けに関する業務を行う営業所等又は代理店（当該代理店が貸金業者である場合に限る。）ではないものとする。","statements":{"ａ":"貸金業者は、営業所等ごとに、営業所等において貸金業の業務に従事する者の数に対する貸金業務取扱主任者の数の割合が50分の1以上となる数の貸金業務取扱主任者を置かなければならない。","ｂ":"貸金業者が営業所等に貸金業務取扱主任者を置くときは、当該貸金業務取扱主任者は、当該営業所等において常時勤務する者でなければならず、かつ、他の営業所等の貸金業務取扱主任者として貸金業者登録簿に登録されている者であって貸金業法第8条（変更の届出）第1項の規定による届出がないものであってはならない。","ｃ":"貸金業者が貸付けに係る契約（極度方式基本契約を除く。）を締結した場合にその相手方に交付すべき貸金業法第17条第1項に規定する契約締結時の書面には、その営業所等に置かれる貸金業務取扱主任者の氏名及び登録番号を記載しなければならない。","ｄ":"貸金業者は、予見し難い事由により、営業所等における貸金業務取扱主任者の数が貸金業法第12条の3（貸金業務取扱主任者の設置）第1項の内閣府令で定める数を下回るに至ったときは、30日以内に、同項の規定に適合させるために必要な措置をとらなければならない。"},"options":{"①":"ａｂ","②":"ａｄ","③":"ｂｃ","④":"ｃｄ"},"note":"","answer":1,"format":"combo","negative":false},{"id":"R20-07","kai":20,"era":"令和7年度","num":7,"sectionShort":"法令","stem":"株式会社である貸金業者Ａが行う貸金業法第13条に規定する返済能力の調査に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"Ａは、個人である顧客Ｂとの間で金銭の貸借の媒介の契約を締結しようとする場合には、Ｂの収入又は収益その他の資力、信用、借入れの状況、返済計画その他の返済能力に関する事項の調査（以下、本問において、「返済能力の調査」という。）を行うことを要しない。","②":"Ａは、法人である顧客Ｂとの間で極度方式貸付けに係る契約を締結しようとする場合には、Ｂの返済能力の調査を行うことを要しない。","③":"Ａは、個人事業者である顧客Ｂとの間で、貸付けの契約を締結しようとする場合には、Ｂの返済能力の調査を行うに際し、指定信用情報機関が保有する信用情報を使用することを要しない。","④":"Ａは、個人である顧客Ｂと手形（融通手形を除く。）の割引を内容とする契約を締結しようとする場合には、Ｂの返済能力の調査を行うに際し、指定信用情報機関が保有する信用情報を使用することを要しない。"},"note":"","answer":4,"format":"single","negative":false},{"id":"R20-08","kai":20,"era":"令和7年度","num":8,"sectionShort":"法令","stem":"Ａは株式会社である貸金業者であり、Ｂは個人である顧客等である。貸金業法施行規則第10条の17（資力を明らかにする事項を記載した書面等）第1項に規定する書面等（以下、本問において「年収証明書」という。）の提出又は提供等に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。なお、本問における貸付けに係る契約は、貸金業法施行規則第10条の16（指定信用情報機関が保有する信用情報の使用義務の例外）に規定する貸付けの契約ではないものとする。","statements":{},"options":{"①":"Ａは、Ｂとの間で、貸付けの金額が100万円の貸付けに係る契約について保証契約を締結しようとする場合、Ｂから年収証明書の提出又は提供を受けなければならない。","②":"Ａは、Ｂとの間で、貸付けの金額が100万円の貸付けに係る契約を締結しようとする場合において、その1年前にＢとの間で貸付けの金額が80万円の貸付けに係る契約を締結するに当たりＢから年収証明書として源泉徴収票の提出を受けていたときには、改めて、Ｂから年収証明書の提出又は提供を受ける必要はない。","③":"Ａは、Ｂとの間で、貸付けに係る契約を締結するにあたり、Ｂから年収証明書として給与の支払明細書の提出又は提供を受ける場合には、当該給与の支払明細書に記載されている地方税額を基に合理的に算出する方法により直近の年間の給与の金額を算出するときを除き、直近2か月分以上のものの提出又は提供を受けなければならない。","④":"Ｂから提出又は提供を受ける年収証明書は、所得税法、地方税法等の法令を根拠として交付されたものに限られ、根拠法令なく、行政サービスの一環として、地方公共団体が交付する所得・課税証明書は年収証明書に該当しない。"},"note":"","answer":3,"format":"single","negative":false},{"id":"R20-09","kai":20,"era":"令和7年度","num":9,"sectionShort":"法令","stem":"貸金業者Ａが、個人顧客Ｂとの間で極度方式基本契約を締結している場合において、貸金業法第13条の3（基準額超過極度方式基本契約に係る調査）第2項に基づく、3か月以内の期間（以下、本問において「所定の期間」という。）ごとに、指定信用情報機関が保有するＢに係る信用情報を使用して、当該極度方式基本契約が基準額超過極度方式基本契約に該当するかどうかの調査（以下、本問において「本件調査」という。）を行う場合等に関する次のａ～ｄの記述のうち、その内容が適切なものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。なお、Ａは、Ｂとの間で、当該極度方式基本契約及び当該契約に基づく極度方式貸付けに係る契約のほかに、貸付けに係る契約を締結していないものとする。","statements":{"ａ":"Ａは、所定の期間の末日におけるＢの当該極度方式基本契約に基づく極度方式貸付けの残高の合計額が10万円以下である場合、本件調査をする必要がない。","ｂ":"Ａは、本件調査をしなければならない場合において、当該極度方式基本契約の極度額が50万円を超えるときは、Ｂから源泉徴収票その他のＢの収入又は収益その他の資力を明らかにする事項を記載し、又は記録した書面又は電磁的記録として内閣府令で定めるものの提出又は提供を受けなければならない。","ｃ":"Ａは、本件調査により、当該極度方式基本契約が基準額超過極度方式基本契約に該当すると認められるときは、当該極度方式基本契約が基準額超過極度方式基本契約に該当しないようにするため必要な当該極度方式基本契約の極度額の減額の措置又は当該極度方式基本契約に基づく新たな極度方式貸付けの停止の措置を講じなければならない。","ｄ":"Ａは、当該極度方式基本契約が基準額超過極度方式基本契約に該当しないようにするため必要な当該極度方式基本契約の極度額の減額の措置を講じた場合には、それ以後は所定の期間ごとに本件調査を行う必要はない。"},"options":{"①":"ａｂ","②":"ａｃ","③":"ｂｄ","④":"ｃｄ"},"note":"","answer":2,"format":"combo","negative":false},{"id":"R20-10","kai":20,"era":"令和7年度","num":10,"sectionShort":"法令","stem":"貸金業法第14条（貸付条件等の掲示等）及び同法第23条（標識の掲示等）に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"貸金業者は、営業所又は事務所（以下、本問において「営業所等」という。）ごとに、公衆の見やすい場所に、貸金業法第14条第1項各号に掲げる事項（以下、本問において「貸付条件等」という。）を掲示しなければならない。","②":"貸金業者が内閣府令で定めるところにより、営業所等ごとに掲示しなければならない貸付条件等には、金銭の貸付けにあっては、主な返済の例が含まれる。","③":"貸金業者は、その事業の規模にかかわらず、商号もしくは名称又は氏名、登録番号、登録有効期間等を当該貸金業者のウェブサイトに掲載する方法により公衆の閲覧に供しなければならない。","④":"貸金業者は、営業所等ごとに、公衆の見やすい場所に、内閣府令で定める様式の標識を掲示しなければならないが、当該営業所等が、現金自動設備であるときは、掲示することを要しない。"},"note":"","answer":2,"format":"single","negative":false},{"id":"R20-11","kai":20,"era":"令和7年度","num":11,"sectionShort":"法令","stem":"次のａ～ｄの記述のうち、貸金業者が金銭の貸付けの条件について広告をするとき、又は金銭の貸付けの契約の締結について勧誘をする場合において貸付けの条件を表示し、もしくは説明するときに、貸金業法第15条（貸付条件の広告等）の定めにより、表示し、又は説明しなければならない事項に該当するものの個数を①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。なお、本問における金銭の貸付けには、手形の割引及び売渡担保は含まれないものとする。","statements":{"ａ":"返済の方式並びに返済期間及び返済回数","ｂ":"貸付けの利率","ｃ":"賠償額の予定（違約金を含む。）に関する定めをする場合における当該賠償額の元本に対する割合","ｄ":"担保を供することが必要な場合における当該担保に関する事項"},"options":{"①":"1個","②":"2個","③":"3個","④":"4個"},"note":"","answer":4,"format":"count","negative":true},{"id":"R20-12","kai":20,"era":"令和7年度","num":12,"sectionShort":"法令","stem":"貸金業法第16条の2（契約締結前の書面の交付）に関する次のａ～ｄの記述のうち、その内容が適切なものの個数を①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"貸金業者は、極度方式基本契約を締結しようとする場合には、当該契約を締結するまでに、内閣府令で定めるところにより、貸金業法第16条の2第2項に規定する当該契約の内容を説明する書面を当該契約の相手方となろうとする者に交付しなければならない。","ｂ":"貸金業者は、極度方式貸付けに係る契約を締結しようとする場合には、当該契約を締結するまでに、内閣府令で定めるところにより、貸金業法第16条の2第1項に規定する当該契約の内容を説明する書面を当該契約の相手方となろうとする者に交付しなければならない。","ｃ":"貸金業者は、貸付けに係る契約について保証契約を締結しようとする場合には、当該保証契約を締結するまでに、内閣府令で定めるところにより、貸金業法第16条の2第3項に規定する当該保証契約の内容を説明する書面を当該貸付けに係る契約の相手方及び当該保証契約の保証人となろうとする者に交付しなければならない。","ｄ":"貸金業者向けの総合的な監督指針によれば、貸金業法第16条の2の契約締結前の書面交付後、契約締結前に法令で定められた記載事項の内容に変更が生じた場合については、法令上、再度、当該契約の相手方となろうとする者に対し契約締結前の書面を交付する義務がないことに留意する必要があるとされている。"},"options":{"①":"1個","②":"2個","③":"3個","④":"4個"},"note":"","answer":1,"format":"count","negative":false},{"id":"R20-13","kai":20,"era":"令和7年度","num":13,"sectionShort":"法令","stem":"貸金業法第24条（債権譲渡等の規制）に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"貸金業者Ａは、貸付けに係る契約に基づく債権を貸金業者であるＢに譲渡する場合には、Ｂに対し、当該債権が貸付けに係る契約に基づいて発生したことその他内閣府令で定める事項及び譲受人が当該債権に係る貸付けの契約に基づく債権に関してする行為について貸金業法第24条第1項所定の規定の適用がある旨を通知する必要はない。","②":"貸金業者Ａは、貸付けに係る契約に基づく債権をＢに譲渡した場合には、債務者Ｃに対し、当該債権について貸金業法第17条（契約締結時の書面の交付）第1項に規定する書面を交付しなければならない。","③":"貸金業者Ａは、貸付けに係る契約に基づく債権をＢに譲渡した後にＢが当該債権をさらに暴力団員Ｃに譲渡した場合において、Ｂへの当該債権の譲渡に当たり、Ｃが当該債権を譲り受けることを知っていたときのみならず、知り得たときも、貸金業法に基づく行政処分の対象となる。","④":"個人である貸金業者Ａは、貸付けに係る契約に基づく債権をＡの親族であるＢに譲渡した場合において、Ｂが当該債権の取立てをするに当たり、貸金業法第21条（取立て行為の規制）第1項に違反したときは、Ｂが当該違反行為を行わないようにＡが相当の注意を払っていたか否かにかかわらず、貸金業法に基づく行政処分の対象となる。"},"note":"","answer":3,"format":"single","negative":false},{"id":"R20-14","kai":20,"era":"令和7年度","num":14,"sectionShort":"法令","stem":"貸金業者に対する監督等に関する次のａ～ｄの記述のうち、その内容が適切なものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"内閣総理大臣又は都道府県知事（以下、本問において「登録行政庁」という。）が、その登録を受けた貸金業者の業務の運営に関し、当該貸金業者に対して、業務の方法の変更その他業務の運営の改善に必要な措置を命ずることができるのは、当該貸金業者の業務の運営が法令に違反するものであると認められる場合に限られる。","ｂ":"登録行政庁は、その登録を受けた貸金業者が暴力団員等をその業務に従事させ、又はその業務の補助者として使用した場合においては、その登録を取り消さなければならない。","ｃ":"貸金業者は、事業年度ごとに、内閣府令で定めるところにより、貸金業に係る事業報告書を作成し、毎事業年度経過後3か月以内に、これを登録行政庁に提出しなければならない。","ｄ":"日本貸金業協会に加入していない貸金業者は、当該貸金業者又はその役員もしくは使用人が遵守すべき社内規則の作成、変更又は廃止を行う場合においては、その都度、登録行政庁の承認を受けなければならない。"},"options":{"①":"ａｂ","②":"ａｄ","③":"ｂｃ","④":"ｃｄ"},"note":"","answer":3,"format":"combo","negative":false},{"id":"R20-15","kai":20,"era":"令和7年度","num":15,"sectionShort":"法令","stem":"指定信用情報機関への個人信用情報の提供等に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。なお、本問における貸金業者は、非営利特例対象法人及び特定非営利金融法人ではないものとする。","statements":{},"options":{"①":"指定信用情報機関とは、貸金業法第41条の13（信用情報提供等業務を行う者の指定）第1項の規定による指定を受けた者をいい、現在、株式会社日本信用情報機構、株式会社シー・アイ・シー及び全国銀行個人信用情報センターがその指定を受けている。","②":"指定信用情報機関は、他の指定信用情報機関の加入貸金業者(注1)の依頼に基づき当該他の指定信用情報機関から個人信用情報の提供の依頼を受けたときは、正当な理由がある場合を除き、当該依頼に応じ、個人信用情報を提供しなければならない。","③":"個人信用情報とは、個人を相手方とする貸付けに係る契約に係る貸金業法第41条の35（個人信用情報の提供）第1項各号に掲げる事項をいい、極度方式基本契約にあっては、極度額が含まれる。","④":"加入貸金業者は、加入指定信用情報機関(注2)に資金需要者等に係る信用情報の提供の依頼（当該資金需要者等に係る他の指定信用情報機関が保有する個人信用情報の提供の依頼を含む。）をする場合において、当該信用情報の提供が貸金業法第13条に定める返済能力の調査を目的とするときは、あらかじめ、当該資金需要者等から同意を得る必要はない。"},"note":"(注1) 加入貸金業者とは、指定信用情報機関と信用情報提供契約を締結した相手方である貸金業者をいう。(注2) 加入指定信用情報機関とは、加入貸金業者と信用情報提供契約を締結した指定信用情報機関をいう。","answer":2,"format":"single","negative":false},{"id":"R20-16","kai":20,"era":"令和7年度","num":16,"sectionShort":"法令","stem":"貸金業者であるＡの廃業等の届出等に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"個人であるＡが死亡した場合、Ａの相続人は、その事実を知った日から30日以内に、その旨をその登録をした内閣総理大臣又は都道府県知事（以下、本問において「登録行政庁」という。）に届け出なければならない。","②":"株式会社であるＡが株式会社であるＢとの合併により消滅した場合、Ｂの代表取締役は、その日から30日以内に、その旨を登録行政庁に届け出なければならない。","③":"Ａについて破産手続開始の決定があったときは、貸金業の登録は、その効力を失う。","④":"Ａは、貸金業を廃止した場合であっても、Ａが締結した貸付けの契約に基づく取引を結了する目的の範囲内においては、なお貸金業者とみなされる。"},"note":"","answer":2,"format":"single","negative":true},{"id":"R20-17","kai":20,"era":"令和7年度","num":17,"sectionShort":"法令","stem":"貸金業者向けの総合的な監督指針における取引時確認、疑わしい取引の届出について、監督当局が貸金業者を監督するに当たって留意することとされている事項に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"犯罪による収益の移転防止に関する法律第3条第3項に基づき国家公安委員会が作成・公表する犯罪収益移転危険度調査書の内容を勘案し、取引・商品特性や取引形態、取引に関係する国・地域、顧客属性等の観点から、自らが行う取引がテロ資金供与やマネー・ローンダリング等に利用されるリスクについて適切に調査・分析した上で、その結果を記載した書面等（特定事業者作成書面等）を作成し、定期的に見直しを行っているか。","②":"法人顧客との取引における実質的支配者の確認や、外国PEPs(注)該当性の確認、個人番号や基礎年金番号の取扱いを含む本人確認書類の適切な取扱いなど、取引時確認を適正に実施するための態勢が整備されているか。","③":"疑わしい取引として届出を行うか否かの判断を行うに当たっては、別途公表している疑わしい取引の参考事例に基づきその要否を判断する態勢を整備しているか。なお、当該参考事例に該当する取引はもれなく届出を行う必要があり、一方、これに該当しない取引は届出の対象とならないことに留意する必要がある。","④":"取引時確認と疑わしい取引の届出が相互に関連性を有していることを十分に認識し、取引時確認の的確な実施により資金需要者等の基礎的な情報を把握し、その上で当該情報及び資金需要者等の取引態様等を総合的に勘案のうえ判断し、疑わしい取引の届出が行われるよう、一体的、一元的な社内体制等が構築されているか。"},"note":"(注) 外国PEPsとは、犯罪による収益の移転防止に関する法律施行令第12条第3項各号及び犯罪による収益の移転防止に関する法律施行規則第15条各号に掲げる外国の元首及び外国政府等において重要な地位を占める者等をいう。","answer":3,"format":"single","negative":true},{"id":"R20-18","kai":20,"era":"令和7年度","num":18,"sectionShort":"法令","stem":"貸金業者の禁止行為に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"貸金業者は、貸金業の業務に従事する使用人その他の従業者に対し、その業務が営業所等において資金需要者等と対面することなく行うものであるとしても、その従業者であることを証する証明書を携帯させなければ、その者をその業務に従事させてはならない。","②":"貸金業者は、その貸金業の業務に関し、資金需要者等に対し、不確実な事項について断定的判断を提供し、又は確実であると誤認させるおそれのあることを告げる行為をしてはならない。","③":"貸金業者は、貸付けの契約（住宅資金貸付契約その他の内閣府令で定める契約を除く。）の相手方又は相手方となろうとする者の死亡によって保険金の支払を受けることとなる保険契約を締結しようとする場合には、当該保険契約において、自殺による死亡を保険事故としてはならない。","④":"貸金業者は、その貸金業の業務に関して広告又は勧誘をするときは、公的な年金、手当等の受給者の借入意欲をそそるような表示又は説明をしてはならない。"},"note":"","answer":1,"format":"single","negative":true},{"id":"R20-19","kai":20,"era":"令和7年度","num":19,"sectionShort":"法令","stem":"次の①～④の記述のうち、貸金業法第13条の2（過剰貸付け等の禁止）第2項に規定する個人過剰貸付契約から除かれる契約として貸金業法施行規則第10条の21に規定するものに該当しないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"売却を予定している個人顧客の不動産（借地権を含む。）の売却代金により弁済される貸付けに係る契約であって、当該個人顧客の返済能力を超えないと認められるもの（貸付けの金額が当該貸付けに係る契約の締結時における当該不動産の価格の範囲内であるものに限り、当該不動産を売却することにより当該個人顧客の生活に支障を来すと認められる場合を除く。）","②":"個人顧客の居宅を担保とする貸付けに係る契約であって、当該個人顧客の返済能力を超えないと認められるもの（貸付けの金額が当該貸付けに係る契約の締結時における当該居宅の価格の範囲内であるものに限る。）","③":"自ら又は他の者により住宅資金貸付契約に係る貸付けが行われるまでのつなぎとして行う貸付けに係る契約","④":"個人顧客又は当該個人顧客の親族で当該個人顧客と生計を一にする者の健康保険法に規定する高額療養費を支払うために必要な資金の貸付けに係る契約"},"note":"","answer":2,"format":"single","negative":true},{"id":"R20-20","kai":20,"era":"令和7年度","num":20,"sectionShort":"法令","stem":"貸金業法第13条の2（過剰貸付け等の禁止）第2項に規定する個人顧客の利益の保護に支障を生ずることがない契約として貸金業法施行規則第10条の23で定めるもの（以下、本問において「例外契約」という。）に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"貸金業者が事業を営む個人顧客との間で貸付けに係る契約を締結する場合において、当該契約が例外契約に該当するための要件の1つとして、当該契約に関し、実地調査、当該個人顧客の直近の確定申告書の確認その他の方法により当該事業の実態が確認されていることが必要である。","②":"貸金業者が事業を営む個人顧客との間で貸付けに係る契約を締結する場合において、当該契約に係る貸付けの金額が100万円以下であるときは、当該契約が例外契約に該当するための要件の1つとして、当該契約に関し、当該個人顧客の営む事業の状況、収支の状況及び資金繰りの状況に照らし、当該個人顧客の返済能力を超えない貸付けに係る契約であると認められることが必要である。","③":"預金保険法第2条第1項に規定する金融機関からの貸付け（以下、本問において「正規貸付け」という。）が行われるまでのつなぎとして行う貸付けに係る契約であって、正規貸付けが行われることが確実であると認められ、かつ、返済期間が3か月を超えないものは、例外契約に該当する。","④":"例外契約に係る貸付けの残高は、貸金業法第13条（返済能力の調査）第3項第2号の規定に基づき算出される個人顧客合算額に算入される。"},"note":"","answer":3,"format":"single","negative":true},{"id":"R20-21","kai":20,"era":"令和7年度","num":21,"sectionShort":"法令","stem":"貸金業法第17条（契約締結時の書面の交付）に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"貸金業者は、極度方式基本契約を締結した場合にその相手方に交付すべき契約締結時の書面に、極度方式基本契約に関し貸金業者が受け取る書面の内容を記載しなければならない。","②":"貸金業者が極度方式基本契約を締結した場合にその相手方に交付すべき契約締結時の書面に記載すべき貸金業者の登録番号については、その登録番号の括弧書の記載を省略することができる。","③":"貸金業者が顧客との間で極度方式貸付けに係る契約を締結した場合において、当該顧客に対し、その承諾を得て、内閣府令で定めるところにより、一定期間における貸付け及び弁済その他の取引の状況を記載した書面として内閣府令で定めるものを交付するときは、貸金業法第17条第1項に規定する書面（当該極度方式貸付けに係る契約についての契約締結時の書面）の交付に代えて、契約年月日及び貸付けの金額のほか内閣府令で定める事項を記載した書面を当該顧客に交付することができる。","④":"貸金業者は、極度方式基本契約を締結した場合にその相手方に交付すべき契約締結時の書面に記載すべき事項について、その相手方から書面による交付を希望する旨の申出があった場合を除き、当該事項を電磁的方法により提供することができる。"},"note":"","answer":4,"format":"single","negative":true},{"id":"R20-22","kai":20,"era":"令和7年度","num":22,"sectionShort":"法令","stem":"貸金業者であるＡは、個人顧客であるＢとの間で、金銭の貸付けに係る契約を締結し、遅滞なく、貸金業法第17条第1項に規定する書面（以下、本問において「契約締結時の書面」という。）をＢに交付した。この場合に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。なお、本件契約は、極度方式基本契約及び極度方式貸付けに係る契約ではないものとする。","statements":{},"options":{"①":"Ａは、契約締結時の書面を交付した後に、貸付けの利率を引き下げた場合、変更後の内容を記載した契約締結時の書面をＢに交付する必要はない。","②":"Ａは、契約締結時の書面を交付した後に、各回の返済金額を減額した場合、変更後の内容を記載した契約締結時の書面をＢに交付する必要はない。","③":"Ａは、契約締結時の書面を交付した後に、期限の利益の喪失の定めについてＢの利益となる変更を加えた場合、変更後の内容を記載した契約締結時の書面をＢに交付する必要はない。","④":"Ａは、契約締結時の書面を交付した後に、契約締結時の書面に記載されている保証人との間で締結している保証契約を解除した場合、変更後の内容を記載した契約締結時の書面をＢに交付する必要はない。"},"note":"","answer":2,"format":"single","negative":true},{"id":"R20-23","kai":20,"era":"令和7年度","num":23,"sectionShort":"法令","stem":"貸金業法第21条（取立て行為の規制）に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"貸金業を営む者又は貸金業を営む者の貸付けの契約に基づく債権の取立てについて貸金業を営む者その他の者から委託を受けた者（以下、本問において「貸金業を営む者等」という。）は、貸付けの契約に基づく債権の取立てをするに当たって、正当な理由がないのに、午後9時から午前8時までの間に、債務者等に電話をかけ、もしくはファクシミリ装置を用いて送信し、又は債務者等の居宅を訪問してはならないが、貸金業者向けの総合的な監督指針（以下、本問において「監督指針」という。）によれば、例えば、債務者等と連絡をとるための合理的方法が他にない場合は、正当な理由に該当する可能性が高いとされている。","②":"貸金業を営む者等は、貸付けの契約に基づく債権の取立てをするに当たって、債務者等が弁済し、又は連絡し、もしくは連絡を受ける時期を申し出た場合において、その申出が社会通念に照らし相当であると認められないことその他の正当な理由がないのに、午前8時から午後9時までの間に、債務者等に電話をかけ、もしくはファクシミリ装置を用いて送信し、又は債務者等の居宅を訪問してはならないが、監督指針によれば、例えば、直近において債務者等から弁済や連絡に関する申し出が履行されていない場合は、正当な理由に該当する可能性が高いとされている。","③":"貸金業を営む者等は、貸付けの契約に基づく債権の取立てをするに当たって、正当な理由がないのに、債務者等の勤務先その他の居宅以外の場所を訪問してはならないが、監督指針によれば、例えば、債権の取立てをするに当たって勤務先を訪問する旨を告げたとしても、そのことをもって違反行為に該当するものではないとされている。","④":"貸金業を営む者等は、貸付けの契約に基づく債権の取立てをするに当たって、貼り紙、立看板その他何らの方法をもってするを問わず、債務者の借入れに関する事実その他債務者等の私生活に関する事実を債務者等以外の者に明らかにしてはならないが、監督指針によれば、例えば、債務者等から家族に知られないように要請を受けている場合以外においては、債務者等の自宅に電話をかけ家族がこれを受けた場合に貸金業者であることを名乗り、郵送物の送付に当たり差出人として貸金業者であることを示したとしても、直ちに違反行為に該当するものではないとされている。"},"note":"","answer":3,"format":"single","negative":true},{"id":"R20-24","kai":20,"era":"令和7年度","num":24,"sectionShort":"法令","stem":"貸金業法第24条の6の2（開始等の届出）に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"貸金業者は、その政令で定める使用人が破産手続開始の決定を受けた場合、内閣府令で定めるところにより、その旨をその登録をした内閣総理大臣又は都道府県知事（以下、本問において「登録行政庁」という。）に届け出なければならない。","②":"貸金業者は、貸金業務取扱主任者が死亡したことにより、その営業所又は事務所について貸金業法第12条の3（貸金業務取扱主任者の設置）に規定する要件を欠くこととなった場合、内閣府令で定めるところにより、その旨を登録行政庁に届け出なければならない。","③":"貸金業者は、その使用人に貸金業の業務に関し法令に違反する行為があったことを知った場合、内閣府令で定めるところにより、その旨を登録行政庁に届け出なければならない。","④":"貸金業者（資金需要者等の利益を損なうおそれがないものとして内閣府令で定める事由がある者を除く。）は、その登録期間中に純資産額が5000万円未満となったことを知った場合、内閣府令で定めるところにより、その旨を登録行政庁に届け出なければならない。"},"note":"","answer":1,"format":"single","negative":true},{"id":"R20-25","kai":20,"era":"令和7年度","num":25,"sectionShort":"法令","stem":"金利等の規制に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"出資の受入れ、預り金、及び金利等の取締りに関する法律上、金銭の貸借の媒介を行う者は、その媒介に係る貸借の金額の100分の5に相当する金額（当該貸借の期間が1年未満であるものについては、当該貸借の金額に、その期間の日数に応じ、年5％の割合を乗じて計算した金額）を超える手数料の契約をし、又はこれを超える手数料を受領してはならない。","②":"利息制限法上、営業的金銭消費貸借上の債務の不履行による賠償額の予定は、その賠償額の元本に対する割合が年2割（20％）を超えるときは、その超過部分について、無効とされる。","③":"利息制限法上、営業的金銭消費貸借上の債務を主たる債務とする保証（業として行うものに限る。）がされた場合における保証料（主たる債務者が支払うものに限る。）の契約は、その保証料が当該主たる債務の元本に係る法定上限額（同法第1条及び第5条の規定の例により計算した金額をいう。）から当該主たる債務について支払うべき利息の額を減じて得た金額を超えるときは、その超過部分について、無効とされる。","④":"貸金業法上、貸金業者は、その利息（みなし利息を含む。）が利息制限法第1条及び第5条の規定の例により計算した金額を超える利息の契約を締結した場合、刑事罰の対象となる。"},"note":"","answer":4,"format":"single","negative":true},{"id":"R20-26","kai":20,"era":"令和7年度","num":26,"sectionShort":"法令","stem":"複数の営業的金銭消費貸借契約（以下、本問において「第一契約」、「第二契約」又は「第三契約」という。）における利息の制限の適用に関する次の①～④の記述のうち、利息制限法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"Ａは、Ｂとの間で、元本を50万円とし利息を年1割8分（18％）とする第一契約を締結し50万円をＢに貸し付けると同時に、Ｂとの間で元本を100万円とし利息を年1割（10％）とする第二契約を締結し100万円をＢに貸し付けた。この場合、第一契約における利息の約定は、年1割5分（15％）を超過する部分に限り無効となる。","②":"Ａは、Ｂとの間で、元本を100万円とし利息を年1割5分（15％）とする第一契約を締結し100万円をＢに貸し付けた。その後、Ａは、第一契約に基づく債務の元本残高が30万円である時点において、Ｂとの間で元本を70万円とし利息を年1割8分（18％）とする第二契約を締結し70万円をＢに貸し付けた。この場合、第二契約における利息の約定は、年1割5分（15％）を超過する部分に限り無効となる。","③":"Ａは、Ｂとの間で、元本を100万円とし利息を年1割5分（15％）とする第一契約を締結し100万円をＢに貸し付けた。Ａは、ＢがＡに対して第一契約に基づく債務をすべて弁済した後に、Ｂとの間で元本を8万円とし利息を年2割（20％）とする第二契約を締結し8万円をＢに貸し付けると同時に、元本を30万円とし利息を年1割8分（18％）とする第三契約を締結し30万円をＢに貸し付けた。この場合、第二契約における利息の約定は、年1割8分（18％）を超過する部分に限り無効となる。","④":"Ａは、Ｂとの間で、元本を70万円とし利息を年1割8分（18％）とする第一契約を締結し70万円をＢに貸し付けた。その後、貸金業者であるＣは、ＢがＡから70万円を借り入れた事実を把握した上で、Ｂとの間で、元本を30万円とし利息を年1割8分（18％）とする初めての第二契約を締結し30万円をＢに貸し付けた。この場合、第二契約における利息の約定は、年1割5分（15％）を超過する部分に限り無効となる。"},"note":"","answer":4,"format":"single","negative":true},{"id":"R20-27","kai":20,"era":"令和7年度","num":27,"sectionShort":"法令","stem":"みなし利息に関する次の①～④の記述のうち、利息制限法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"貸金業者は、顧客との間で締結した営業的金銭消費貸借契約において、当該契約で約定された弁済期における口座振替の方法による弁済に係る口座振替手続に要する費用（消費税額等相当額を含むものとする。）を当該顧客から受領した。この場合、当該費用は、利息とみなされない。","②":"貸金業者は、顧客との間で締結した営業的金銭消費貸借契約において、貸金業法第17条（契約締結時の書面の交付）第1項に規定する書面を交付し、当該交付に要する費用（消費税額等相当額を含むものとする。）を当該顧客から受領した。この場合、当該費用は、利息とみなされる。","③":"貸金業者は、顧客との間で締結した営業的金銭消費貸借契約において、金銭の貸付け及び弁済に用いるため当該契約締結時に当該顧客に交付したカードの発行費用（消費税額等相当額を含むものとする。）を当該顧客から受領した。この場合、当該費用は、利息とみなされる。","④":"貸金業者は、顧客との間で締結した営業的金銭消費貸借契約において、顧客が金銭の受領又は弁済のために利用する現金自動支払機その他の機械の利用料として、10,000円の弁済を受領する際に110円（消費税額等相当額を含むものとする。）を当該顧客から受領した。この場合、当該利用料は、利息とみなされない。"},"note":"","answer":1,"format":"single","negative":true},{"id":"R20-28","kai":20,"era":"令和7年度","num":28,"sectionShort":"貸付実務","stem":"意思表示に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"意思表示は、その通知を相手方に発した時からその効力を生ずる。","②":"表意者は、意思表示の相手方の所在を知ることができないときは、公示の方法によって意思表示をすることができるが、意思表示の相手方を知ることができないときは、公示の方法によって意思表示をすることができない。","③":"意思表示が、意思表示に対応する意思を欠く錯誤に基づくものであって、その錯誤が、法律行為の目的及び取引上の社会通念に照らして重要なものであり、かつ、表意者の重大な過失によるものでなかった場合には、表意者は、その意思表示を取り消すことができる。","④":"相手方に対する意思表示について第三者が強迫を行った場合においては、相手方がその事実を知り、又は知ることができたときに限り、表意者は、その意思表示を取り消すことができる。"},"note":"","answer":3,"format":"single","negative":false},{"id":"R20-29","kai":20,"era":"令和7年度","num":29,"sectionShort":"貸付実務","stem":"Ａは、Ｂ所有の甲土地を売却する旨の売買契約を締結しようとしている。この場合に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"Ａは、Ｂから甲土地の売却について代理権を付与されていたが、Ｃとの間で、当該代理権に基づく代理行為を行うに際し、Ｂのためにすることを示さないで甲土地の売買契約を締結した。この場合において、Ｃが、当該契約を締結するに際し、当該契約がＢのためにされたものであることを知っていたときであっても、当該契約はＡとＣとの間にその効力を生ずる。","②":"Ａは、Ｂから甲土地の売却について付与されていた代理権が消滅した後に、その代理権の範囲内において、Ｂの代理人として、Ｄとの間で甲土地の売買契約を締結した。この場合において、Ｄが、当該代理権の消滅の事実を過失により知らなかったときであっても、当該契約は、ＢとＤとの間にその効力を生ずる。","③":"Ａは、何らの代理権も付与されていないのに、Ｂの代理人として、Ｅとの間で甲土地の売買契約を締結した。この場合において、Ｅは、当該契約締結時に、当該契約を締結することにつきＡに代理権がないことを知らなかったときは、Ｂが追認をしない間は、当該契約を取り消すことができる。","④":"Ａは、Ｂから甲土地の売却について代理権を付与されていた一方で、Ｆからも甲土地の購入について代理権を付与されていた。この場合において、Ａが、Ｂ及びＦの双方の代理人として、甲土地の売買契約を締結したときは、当該契約はＢとＦとの間にその効力を生ずる。"},"note":"","answer":3,"format":"single","negative":false},{"id":"R20-30","kai":20,"era":"令和7年度","num":30,"sectionShort":"貸付実務","stem":"法律行為の無効及び取消しに関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"未成年者は、その法定代理人の同意がなければ、自己の行った法律行為を取り消すことができない。","②":"取り消された法律行為は、初めから無効であったものとみなされる。","③":"無効な法律行為に基づく債務の履行として給付を受けた者は、その給付を受けた当時その法律行為が無効であることを知っていたか否かにかかわらず、その法律行為によって現に利益を受けた限度において、相手方に対し、返還の義務を負う。","④":"取消権は、法律行為の時から5年間行使しないときは、時効によって消滅する。"},"note":"","answer":2,"format":"single","negative":false},{"id":"R20-31","kai":20,"era":"令和7年度","num":31,"sectionShort":"貸付実務","stem":"根抵当権に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"根抵当権は、債務者との取引によって生ずる債権について、その担保すべき範囲を限定して定めることを要しない。","②":"根抵当権者は、確定した元本のほか、利息その他の定期金を請求する権利又は債務の不履行によって生じた損害の賠償を請求する権利を有するときは、その最後の2年分についてのみ、その根抵当権を行使することができる。","③":"元本の確定前に根抵当権者から根抵当権の被担保債権を取得した者は、その債権についてその根抵当権を行使することができる。","④":"根抵当権により担保すべき元本の確定すべき期日の定めがない場合、根抵当権設定者は、その根抵当権の設定の時から3年を経過したときは、その担保すべき元本の確定を請求することができる。"},"note":"","answer":4,"format":"single","negative":false},{"id":"R20-32","kai":20,"era":"令和7年度","num":32,"sectionShort":"貸付実務","stem":"債権の効力に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"債務の不履行又はこれによる損害の発生もしくは拡大に関して債権者に過失があったときは、裁判所は、これを考慮して、損害賠償の責任及びその額を定める。","②":"債務者は、債権者に対し、損害賠償として、その債権の目的である物又は権利の価額の全部の支払をした場合であっても、債権者の承諾を得なければ、その物又は権利について債権者に代位することができない。","③":"債権者は、自己の債権を保全するため必要があるときは、債務者の一身に専属する権利を行使することができる。","④":"債権者は、裁判外において、詐害行為取消権を行使して、債務者が債権者を害することを知ってした財産権を目的とする行為を取り消すことができる。"},"note":"","answer":1,"format":"single","negative":false},{"id":"R20-33","kai":20,"era":"令和7年度","num":33,"sectionShort":"貸付実務","stem":"ＡのＢに対する貸付金債権（以下、本問において「本件債権」という。）の譲渡に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"Ａが、本件債権をＣに譲渡し、Ｃへの本件債権の譲渡についてＢに通知をし、当該通知がＢに到達した。この場合、Ｃは、本件債権の譲受けをＢに対抗することができる。","②":"Ａが、本件債権をＣ及びＤに二重に譲渡した場合において、AC間の債権譲渡について、ＢがＡに対して確定日付のある証書によらない承諾をした後、AD間の債権譲渡について、ＡがＢに対して確定日付のある証書による通知をし、当該通知がＢに到達した。この場合、Ｃは、本件債権の譲受けをＤに対抗することができる。","③":"Ａが、本件債権をＣ及びＤに二重に譲渡した場合において、いずれの債権譲渡についても、ＡからＢに対して確定日付のある証書による通知がなされた。AC間の債権譲渡の通知よりも先にAD間の債権譲渡の通知がＢに到達したが、AC間の債権譲渡の通知に係る確定日付はAD間の債権譲渡の通知に係る確定日付よりも早い日であった。この場合、Ｃは、本件債権の譲受けをＤに対抗することができる。","④":"Ａが、本件債権をＣに譲渡した後に、本件債権は、Ａの債権者Ｅにより差し押さえられた。この場合において、Ｃに本件債権を譲渡した旨の確定日付のある証書による通知がＢに到達した後に、当該差押命令がＢに送達されたときであっても、Ｅは、本件債権の差押えをＣに対抗することができる。"},"note":"","answer":1,"format":"single","negative":false},{"id":"R20-34","kai":20,"era":"令和7年度","num":34,"sectionShort":"貸付実務","stem":"相殺に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"相殺の意思表示には、条件又は期限を付することができる。","②":"時効によって消滅した債権がその消滅以前に相殺に適するようになっていた場合であっても、その債権者は、これを自働債権として相殺をすることができない。","③":"相殺の意思表示は、その意思表示をした時から将来に向かってその効力を生ずる。","④":"当事者が相殺を禁止し、又は制限する旨の意思表示をした場合には、その意思表示は、第三者がこれを知り、又は重大な過失によって知らなかったときに限り、その第三者に対抗することができる。"},"note":"","answer":4,"format":"single","negative":false},{"id":"R20-35","kai":20,"era":"令和7年度","num":35,"sectionShort":"貸付実務","stem":"相続に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"相続人は、相続開始の時から、被相続人の一身に専属したものを含め、その財産に属した一切の権利義務を承継する。","②":"共同相続人は、民法第908条（遺産の分割の方法の指定及び遺産の分割の禁止）第1項の規定により被相続人が遺言で遺産の分割を禁じた場合又は同条第2項の規定により共同相続人間で遺産の分割をしない旨の契約をした場合を除き、いつでも、その協議で、遺産の全部又は一部の分割をすることができる。","③":"相続においては、被相続人の債権だけでなく、債務も遺産の分割の対象となり、遺産の分割により共同相続人の1人が被相続人の金銭債務の全てを承継した場合には、当該金銭債務の債権者は他の共同相続人に当該金銭債務の履行を請求することができない。","④":"相続の放棄は、他の相続人に対する意思表示によってその効力を生じ、相続の放棄をした者は、その相続に関しては、初めから相続人とならなかったものとみなされる。"},"note":"","answer":2,"format":"single","negative":false},{"id":"R20-36","kai":20,"era":"令和7年度","num":36,"sectionShort":"貸付実務","stem":"破産法に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"破産債権とは、破産者に対する財産上の請求権であって、破産手続開始後の原因に基づいて生じたものをいう。","②":"別除権は、破産財団に属する財産につき特別の先取特権、質権又は抵当権を有する者がこれらの権利の目的である財産について認められる権利であり、破産手続によらなければ行使することができない。","③":"破産者が破産手続開始後に破産財団に属する財産に関してした法律行為は、破産手続の関係においては、その効力を主張することができない。","④":"破産債権者は、破産手続開始後に破産財団に対して債務を負担した場合、破産手続によらずに、相殺をすることができる。"},"note":"","answer":3,"format":"single","negative":false},{"id":"R20-37","kai":20,"era":"令和7年度","num":37,"sectionShort":"貸付実務","stem":"意思能力及び行為能力に関する次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"法律行為の当事者が意思表示をした時に意思能力を有しなかったときは、その法律行為は、無効とされる。","②":"成年被後見人とは、精神上の障害により事理を弁識する能力を欠く常況にある者で、家庭裁判所により後見開始の審判を受けたものをいう。","③":"未成年者が法律行為を行うにあたり、成年者であることを信じさせるため詐術を用いたとしても、当該未成年者の法定代理人は当該法律行為を取り消すことができる。","④":"未成年者を相手方として法律行為を行った者が、当該未成年者が行為能力者とならない間に、当該未成年者の法定代理人に対し、1か月以上の期間を定めて、当該期間内に当該法律行為を追認するかどうかを確答すべき旨の催告をした場合において、当該法定代理人が当該期間内に確答を発しなかったときは、当該法律行為を追認したものとみなされる。"},"note":"","answer":3,"format":"single","negative":true},{"id":"R20-38","kai":20,"era":"令和7年度","num":38,"sectionShort":"貸付実務","stem":"期限及び期間に関する次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"法律行為に始期を付したときは、その法律行為の履行は、期限が到来するまで、これを請求することができない。","②":"債務者は、担保を滅失させ、損傷させ、又は減少させたときは、期限の利益を主張することができない。","③":"日、週、月又は年によって期間を定めたときは、期間の初日は、算入しない。ただし、その期間が午前零時から始まるときは、この限りでない。","④":"週、月又は年によって期間を定めた場合において、週、月又は年の初めから期間を起算しないときは、その期間は、最後の週、月又は年においてその起算日に応当する日に満了する。"},"note":"","answer":4,"format":"single","negative":true},{"id":"R20-39","kai":20,"era":"令和7年度","num":39,"sectionShort":"貸付実務","stem":"消滅時効に関する次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"債権は、債権者が権利を行使することができることを知った時から5年間行使しないとき、又は権利を行使することができる時から10年間行使しないときは、時効によって消滅する。","②":"保証人は、主たる債務の消滅時効が完成した場合には、当該主たる債務の消滅時効を援用することができる。","③":"消滅時効が完成し債務者が時効の援用をした場合には、その効果は、援用をした時から将来に向かってのみその効力を生ずる。","④":"債権者と債務者との間で、両者の間に生じた債権について消滅時効が完成する前に、その消滅時効が完成しても債務者は時効の援用をしない旨の合意をしたとしても、当該合意は無効である。"},"note":"","answer":3,"format":"single","negative":true},{"id":"R20-40","kai":20,"era":"令和7年度","num":40,"sectionShort":"貸付実務","stem":"連帯保証に関する次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"主たる債務者に対する履行の請求その他の事由による時効の完成猶予及び更新は、連帯保証人に対しても、その効力を生ずる。","②":"連帯保証人は、主たる債務者が主張することができる抗弁をもって債権者に対抗することができる。","③":"連帯保証人は、主たる債務者が債権者に対して相殺権を有するときは、相殺権の行使によって主たる債務者がその債務を免れるべき限度において、債権者に対して債務の履行を拒むことができる。","④":"連帯保証人に対する履行の請求その他の事由による時効の完成猶予及び更新は、主たる債務者に対しても、その効力を生ずる。"},"note":"","answer":4,"format":"single","negative":true},{"id":"R20-41","kai":20,"era":"令和7年度","num":41,"sectionShort":"貸付実務","stem":"弁済に関する次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"債務者が1個の債務について、元本のほか利息及び費用を支払うべき場合において、弁済をする者がその債務の全部を消滅させるのに足りない給付をしたときは、別段の合意がない限り、これを順次に費用、利息及び元本に充当しなければならない。","②":"受領権者（債権者及び法令の規定又は当事者の意思表示によって弁済を受領する権限を付与された第三者をいう。）以外の者であって取引上の社会通念に照らして受領権者としての外観を有するものに対してした弁済は、その弁済をした者が善意のときは、過失があったとしても、その効力を有する。","③":"抵当権の目的となっている不動産の第三取得者は、当該抵当権の被担保債務の債務者及び債権者があらかじめ第三者による弁済を禁止し又は制限していないときは、当該債務者の意思に反しても、当該被担保債務を弁済することができる。","④":"差押えを受けた債権の第三債務者が自己の債権者に弁済をしたときは、差押債権者は、その受けた損害の限度において更に弁済をすべき旨を当該第三債務者に請求することができる。"},"note":"","answer":2,"format":"single","negative":true},{"id":"R20-42","kai":20,"era":"令和7年度","num":42,"sectionShort":"貸付実務","stem":"犯罪による収益の移転防止に関する法律に基づき、貸金業者が顧客との間で特定取引を行うに際し当該顧客について行う取引時確認に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。なお、本問における特定取引は、同法第4条第2項各号に掲げる取引（ハイリスク取引）ではないものとする。","statements":{},"options":{"①":"貸金業者が取引時確認をしなければならない本人特定事項は、自然人にあっては氏名、住居（本邦内に住居を有しない外国人で政令で定めるものにあっては、主務省令で定める事項）及び生年月日、法人にあっては名称及び本店又は主たる事務所の所在地である。","②":"貸金業者が顧客から本人確認書類として運転免許証（有効なものとする。）の提示を受ける場合において、当該運転免許証に記載されている住居が現在の住居と異なるときは、現在の住居が記載された官公庁発行書類（有効なものとする。）の写しの送付を受けることにより現在の住居の確認を行うことができる。","③":"貸金業者が取引時確認をしなければならない事項は、自然人にあっては、本人特定事項のほか、取引を行う目的及び職業である。","④":"貸金業者が国内に本店又は主たる営業所もしくは事務所を有する法人である顧客について取引時確認をする場合、当該法人の事業の内容は当該法人の代表者から申告を受けることにより確認を行うことができる。"},"note":"","answer":4,"format":"single","negative":true},{"id":"R20-43","kai":20,"era":"令和7年度","num":43,"sectionShort":"資金需要者保護","stem":"個人情報の保護に関する法律についての次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"個人情報とは、個人に関する情報であって、当該情報に含まれる氏名、生年月日その他の記述等により特定の個人を識別することができるもの又は個人識別符号が含まれるものをいい、生存する個人に関する情報に限られない。","②":"個人識別符号とは、個人に発行されるカードその他の書類に記載され、もしくは電磁的方式により記録された文字、番号、記号その他の符号であって、特定の利用者を識別することができるものをいい、クレジットカード番号や電話番号は個人識別符号に該当する。","③":"要配慮個人情報とは、本人の人種、信条、社会的身分、病歴、犯罪の経歴、犯罪により害を被った事実その他本人に対する不当な差別、偏見その他の不利益が生じないようにその取扱いに特に配慮を要するものとして政令で定める記述等が含まれる個人情報をいう。","④":"個人データとは、個人情報データベース等を構成する個人情報をいい、例えば、防犯カメラに録画された映像情報に本人を識別できる情報が含まれる場合には、当該映像情報が本人を容易に検索することができるよう体系的に構成されていないものであっても、当該映像情報に含まれる本人を識別できる情報は個人データに該当する。"},"note":"","answer":3,"format":"single","negative":false},{"id":"R20-44","kai":20,"era":"令和7年度","num":44,"sectionShort":"資金需要者保護","stem":"金融分野における個人情報保護に関するガイドラインに規定する個人データの第三者提供の制限（個人情報保護法(注)第27条関係）についての次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"金融分野における個人情報取扱事業者は、与信事業に係る個人の返済能力に関する情報を個人信用情報機関へ提供するに当たっては、個人情報保護法第27条（第三者提供の制限）第2項の規定に従い、適切にオプトアウトの手続をすることとされている。","②":"個人信用情報機関に対して個人データが提供される場合には、個人信用情報機関を通じて当該機関の会員企業にも情報が提供されることとなるため、個人信用情報機関に個人データを提供する金融分野における個人情報取扱事業者が本人の同意を得ることとされている。","③":"個人情報保護法第27条第5項第3号に定める通知等（共同利用の際の通知等）に関し、事業者による「共同して利用する者の範囲」の通知等については、本人がその範囲を明確に判断できるように、共同して利用する者の名称等を個別に全て列挙する必要があるとされている。","④":"金融分野における個人情報取扱事業者は、個人情報保護法第27条第1項に従い、個人データの第三者提供についての本人の同意を得る際には、個人データの提供先の第三者、提供先の第三者における利用目的及び第三者に提供される個人データの項目を本人に認識させた上で同意を得ることとされているが、書面又は電磁的記録による必要はない。"},"note":"(注) 個人情報保護法とは、個人情報の保護に関する法律をいう。","answer":2,"format":"single","negative":false},{"id":"R20-45","kai":20,"era":"令和7年度","num":45,"sectionShort":"資金需要者保護","stem":"個人情報の保護に関する法律についての次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"個人情報取扱事業者は、特定された利用目的の達成に必要な範囲を超えて個人情報を取り扱う場合には、あらかじめ本人の同意を得なければならない。","②":"個人情報取扱事業者は、合併その他の事由により他の個人情報取扱事業者から事業を承継することに伴って個人情報を取得する場合であって、当該個人情報に係る承継前の利用目的の達成に必要な範囲内で当該個人情報を取り扱うときは、あらかじめ本人の同意を得る必要はない。","③":"個人情報取扱事業者は、インターネットなどで本人が自発的に公にしている個人情報を取得した場合には、その利用目的を、本人に通知し、又は公表する必要はない。","④":"個人情報取扱事業者は、個人情報の利用目的を変更する場合には、変更前の利用目的と関連性を有すると合理的に認められる範囲を超えて行ってはならない。"},"note":"","answer":3,"format":"single","negative":true},{"id":"R20-46","kai":20,"era":"令和7年度","num":46,"sectionShort":"資金需要者保護","stem":"日本貸金業協会が定める貸金業の業務運営に関する自主規制基本規則についての次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"協会員は、債務者等に対して貸付けの契約に係る勧誘を行うに際しては、当該債務者等から当該勧誘を行うことについての承諾を得なければならない。","②":"協会員は、勧誘リスト等を作成するにあたっては、当該勧誘リストに個人信用情報の記載等をすることがないよう留意しなければならない。","③":"協会員は、資金需要者等が身体的・精神的な障害等により契約の内容が理解困難なことを認識した場合には、貸付けの契約の締結に係る勧誘を行ってはならない。","④":"協会員は、貸金業の業務に関して勧誘をした場合において、当該勧誘対象者が勧誘に係る取引についての契約を締結しない旨の意思を表示した場合、当該意思表示のあった日から最低1年間は当該勧誘に係る取引及びこれと類似する取引の勧誘を行ってはならない。"},"note":"","answer":4,"format":"single","negative":true},{"id":"R20-47","kai":20,"era":"令和7年度","num":47,"sectionShort":"資金需要者保護","stem":"日本貸金業協会が定める紛争解決等業務に関する規則についての次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"貸金業務等関連苦情とは、貸金業務等に関し、その契約者等による当該貸金業務等を行った貸金業者に対する不満足の表明のうち、当該貸金業者と当該契約者等の自主的な交渉では解決ができないものであって、当事者が和解をすることができるものをいう。","②":"協会員等は、貸金業相談・紛争解決センターによる紛争解決等業務を周知するため、その内容及び手続の概要、受付窓口などに関し、協会員等のウェブサイトに掲示し又は店頭に掲示するなど適切な方法で公表しなければならない。","③":"協会員等との間で貸金業務等関連苦情を有する契約者等である個人、法人又は法人でない社団もしくは財団で代表者もしくは管理者の定めがある者は、貸金業相談・紛争解決センターに対して苦情処理手続開始の申立てをすることができる。","④":"貸金業相談・紛争解決センターが苦情の解決の促進を図る場合において、当事者である協会員等は、正当な理由なく事情の聴取及び資料提出の求めを拒むことはできない。"},"note":"","answer":1,"format":"single","negative":true},{"id":"R20-48","kai":20,"era":"令和7年度","num":48,"sectionShort":"財務会計","stem":"会社計算規則に規定する損益計算書等(注)に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"損益計算書等は、売上高（売上高以外の名称を付すことが適当な場合には、当該名称を付した項目。以下、本問において「売上高」という。）、売上原価、販売費及び一般管理費、営業外収益、営業外費用、特別利益、特別損失の各項目に区分して表示しなければならない。","②":"当期純利益とは、経常利益から法人税等を控除した額をいう。","③":"経常利益とは、売上高に営業外収益及び特別利益を加えたものから売上原価、販売費及び一般管理費、営業外費用並びに特別損失を減じたものをいう。","④":"売上総利益とは、売上高から売上原価並びに販売費及び一般管理費を控除したものをいう。"},"note":"(注) 損益計算書等とは、損益計算書及び連結損益計算書をいう。","answer":1,"format":"single","negative":false},{"id":"R20-49","kai":20,"era":"令和7年度","num":49,"sectionShort":"財務会計","stem":"企業会計原則（大蔵省企業会計審議会発表）の一般原則に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"企業会計は、企業の財政状態及び経営成績に関して、真実な報告を提供するものでなければならない。これを一般に真実性の原則という。","②":"事業取引と投資等の財務活動とを明瞭に区別し、特に事業収益と財務活動による収益とを混同してはならない。これを一般に事業・財務収益区分の原則という。","③":"企業会計は、その処理の原則及び手続を毎期継続して適用し、みだりにこれを変更してはならない。これを一般に継続性の原則という。","④":"企業の財政に不利な影響を及ぼす可能性がある場合には、これに備えて適当に健全な会計処理をしなければならない。これを一般に保守主義の原則という。"},"note":"","answer":2,"format":"single","negative":true},{"id":"R20-50","kai":20,"era":"令和7年度","num":50,"sectionShort":"財務会計","stem":"貸借対照表に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。なお、本問においては、連結貸借対照表は考慮しなくてよいものとする。","statements":{},"options":{"①":"会社計算規則によれば、資産の部は、流動資産、固定資産、繰延資産に区分しなければならないとされている。","②":"会社計算規則によれば、負債の部は、流動負債、固定負債、引当金その他の負債に区分しなければならないとされている。","③":"会社計算規則によれば、株式会社における純資産の部は、株主資本、評価・換算差額等、株式引受権、新株予約権に区分しなければならないとされている。","④":"貸借対照表では、資産の部の合計額から負債の部の合計額を差し引いた額は、純資産の部の合計額と一致する。"},"note":"","answer":2,"format":"single","negative":true}];
const META = {"years":[{"kai":14,"era":"令和元年度","year":2019,"pass":29,"rate":"30.0%"},{"kai":15,"era":"令和2年度","year":2020,"pass":33,"rate":"33.9%"},{"kai":16,"era":"令和3年度","year":2021,"pass":31,"rate":"32.2%"},{"kai":17,"era":"令和4年度","year":2022,"pass":28,"rate":"26.6%"},{"kai":18,"era":"令和5年度","year":2023,"pass":31,"rate":"31.0%"},{"kai":19,"era":"令和6年度","year":2024,"pass":30,"rate":"32.4%"},{"kai":20,"era":"令和7年度","year":2025,"pass":31,"rate":"32.5%"}]};

/* ===== 保存データ ===== */
const blank = () => ({ q:{}, exams:[] });

function load(){
  try{ const v = JSON.parse(localStorage.getItem(KEY)); return (v&&v.q) ? v : blank(); }
  catch(e){ return blank(); }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function rec(id){ return S.q[id] || (S.q[id] = {n:0,ng:0,last:null,flag:false}); }

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = (a,b) => b ? Math.round(a/b*100) : 0;

/* 「適切でないもの」等をマーカーで立てる */
function hlStem(t){
  return esc(t).replace(/(適切でないもの|合致しないもの|該当しないもの|含まれないもの)/g,
                        '<span class="neg">$1</span>');
}

    <div class="summary">

      <div class="stat"><div class="k">正答率</div><div class="v">${totN?acc:'—'}<small>${totN?'%':''}</small></div></div>
      <div class="stat"><div class="k">要復習</div><div class="v">${weak}</div></div>
      <div class="stat"><div class="k">付箋</div><div class="v">${flag}</div></div>
    </div>

    <h2 class="h2">到達度</h2>
    ${mx}

    <h2 class="h2">演習する</h2>
    <div class="modes">
      <button class="mode" data-go="practice">
        <span class="t">分野別演習</span>
        <span class="d">年度・分野・出題形式で絞り込み、1問ずつ答え合わせしながら進めます。</span>
        <span class="n">全350問から選択</span>

/* ===== 演習の絞り込み ===== */
let filt = { kai:[], sec:[], fmt:[], only:'all' };
function renderPractice(){
  view='practice'; barSlot.innerHTML=''; homeBtn.hidden=false; topInfo.innerHTML='';
  const FMT = {single:'単純択一', combo:'組合せ', count:'個数'};

  const chips = (name, items, cur) => items.map(([v,l])=>
    `<button class="chip" data-f="${name}" data-v="${v}" aria-pressed="${cur.includes(v)?'true':'false'}">${l}</button>`).join('');

  app.className='wrap';
  app.innerHTML = `
    <h1 class="h1">分野別演習</h1>
    <p class="lede">条件を選んで開始します。何も選ばなければ全350問が対象です。</p>
    <div class="panel">
      <div class="frow"><span class="lab">年度</span>
        ${chips('kai', META.years.map(y=>[String(y.kai), y.era.replace('年度','')]), filt.kai.map(String))}</div>
      <div class="frow"><span class="lab">分野</span>
        ${chips('sec', SECS.map(s=>[s,s]), filt.sec)}</div>
      <div class="frow"><span class="lab">出題形式</span>
        ${chips('fmt', Object.entries(FMT), filt.fmt)}</div>
      <div class="frow"><span class="lab">対象</span>
        ${['all','fresh','ng'].map(v=>`<button class="chip" data-f="only" data-v="${v}"
           aria-pressed="${filt.only===v?'true':'false'}">${{all:'すべて',fresh:'未解答のみ',ng:'間違えた問題のみ'}[v]}</button>`).join('')}</div>
      <div class="frow"><span class="lab">出題順</span>
        <button class="chip" id="shuf" aria-pressed="true">シャッフル</button></div>
      <button class="go" id="startBtn"></button>
    </div>`;

  const upd = ()=>{
    const n = pick().length;
    const b = document.getElementById('startBtn');
    b.textContent = n ? `${n}問を開始` : '該当する問題がありません';
    b.disabled = !n;
  };
  app.querySelectorAll('.chip[data-f]').forEach(c=>c.onclick=()=>{
    const {f,v}=c.dataset;
    if(f==='only'){ filt.only=v; app.querySelectorAll('[data-f="only"]').forEach(x=>x.setAttribute('aria-pressed', String(x.dataset.v===v))); }
    else{
      const arr=filt[f], val=(f==='kai')?+v:v, i=arr.indexOf(val);
      i<0?arr.push(val):arr.splice(i,1);
      c.setAttribute('aria-pressed', String(i<0));
    }
    upd();
  });
  const sh=document.getElementById('shuf');
  sh.onclick=()=>sh.setAttribute('aria-pressed', String(sh.getAttribute('aria-pressed')!=='true'));
  document.getElementById('startBtn').onclick=()=>{
    let qs=pick();
    if(sh.getAttribute('aria-pressed')==='true') qs=shuffle(qs);
    startSession(qs,'practice','分野別演習');
  };
  upd();

  function pick(){
    return DB.filter(q=>{
      if(filt.kai.length && !filt.kai.includes(q.kai)) return false;
      if(filt.sec.length && !filt.sec.includes(q.sectionShort)) return false;
      if(filt.fmt.length && !filt.fmt.includes(q.format)) return false;
      const r=S.q[q.id];
      if(filt.only==='fresh' && r && r.n>0) return false;
      if(filt.only==='ng' && !(r && r.ng>0)) return false;
      return true;
    });
  }
}

const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

function startReview(){
  const qs = DB.filter(q=>{ const r=S.q[q.id]; return r && (r.ng>0 || r.flag); });
  startSession(shuffle(qs), 'practice', '復習');
}

/* ===== セッション ===== */
function startSession(qs, mode, title, kai){
  if(!qs.length) return;
  ses = { qs, mode, title, kai:kai||0, i:0, ans:new Array(qs.length).fill(null),
          shown:new Array(qs.length).fill(false), t0:Date.now(),
          limit: mode==='exam' ? 120*60*1000 : null };
  homeBtn.hidden=false;
  if(mode==='exam') tick();
  renderQ();
}

let timerId=null;
function tick(){
  clearInterval(timerId);
  timerId=setInterval(()=>{
    if(!ses||ses.mode!=='exam'){clearInterval(timerId);return;}
    const left = ses.limit-(Date.now()-ses.t0);
    if(left<=0){ clearInterval(timerId); finishExam(); return; }
    const m=Math.floor(left/60000), s=Math.floor(left%60000/1000);
    const el=document.getElementById('tm');
    if(el){ el.textContent=`残り ${m}:${String(s).padStart(2,'0')}`; el.classList.toggle('warn', left<10*60000); }
  },250);
}

function renderQ(){
  const q = ses.qs[ses.i];
  const picked = ses.ans[ses.i];
  const shown = ses.shown[ses.i];
  const r = S.q[q.id]||{};

  topInfo.innerHTML = ses.mode==='exam'
    ? `<span class="counter"><b>${ses.i+1}</b> / ${ses.qs.length}</span><span class="timer" id="tm" style="margin-left:10px"></span>`
    : `<span class="counter"><span class="who">${esc(ses.title)}　</span><b>${ses.i+1}</b> / ${ses.qs.length}</span>`;

  const y = META.years.find(v=>v.kai===q.kai);
  const secCol = `var(${SECVAR[q.sectionShort]})`;

  let tableHTML='';
  if(q.table){
    tableHTML = `<div class="qtable"><table><caption>${esc(q.table.title)}　${esc(q.table.caption)}</caption>
      <thead><tr>${q.table.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead>
      <tbody>${q.table.rows.map(rw=>`<tr>${rw.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  }

  const stmtHTML = Object.keys(q.statements).length
    ? `<div class="stmts">${Object.entries(q.statements).map(([k,v])=>
        `<div><span class="k">${k}</span>${esc(v)}</div>`).join('')}</div>` : '';

  const optHTML = MARKS.map((m,idx)=>{
    const n=idx+1;
    let cls='opt', mark='';
    if(shown){
      if(n===q.answer) cls+=' correct';
      else if(n===picked) cls+=' wrong';
      if(n===picked) cls+=' picked';
      if(n===q.answer) mark = circleSVG();
      else if(n===picked) mark = crossSVG();
    } else if(n===picked) cls+=' picked correct';
    return `<button class="${cls}" data-n="${n}" ${shown?'disabled':''}>
              <span class="m">${m}</span><span>${esc(q.options[m])}</span>${mark}</button>`;
  }).join('');

  const verdict = shown ? `<div class="verdict ${picked===q.answer?'ok':'ng'}">
      <span class="r">${picked===q.answer?'正解':'不正解'}</span>
      <span class="a">正答 ${MARKS[q.answer-1]}${picked&&picked!==q.answer?`　選択 ${MARKS[picked-1]}`:''}</span></div>` : '';

  app.className='wrap';
  app.innerHTML = `
    <div class="qmeta">
      <span class="tag sec" style="background:${secCol}">${q.sectionShort}</span>
      <span class="tag">${y.era} 問${q.num}</span>
      <span class="tag">${{single:'単純択一',combo:'組合せ',count:'個数'}[q.format]}</span>
      ${q.negative?'<span class="tag neg">否定形</span>':''}
      ${r.n?`<span class="tag">${r.n}回目${r.ng?`・誤${r.ng}`:''}</span>`:''}
    </div>
    ${verdict}
    <p class="stem">${hlStem(q.stem)}</p>
    ${tableHTML}${stmtHTML}
    ${q.note?`<p class="note">${esc(q.note)}</p>`:''}
    <div class="opts">${optHTML}</div>
    ${ses.mode==='exam'?`<h2 class="h2">答案用紙</h2><div class="sheet">${
      ses.qs.map((qq,ix)=>`<button class="sq${ses.ans[ix]?' done':''}${(S.q[qq.id]||{}).flag?' flag':''}${ix===ses.i?' cur':''}"
        data-jump="${ix}">${ix+1}</button>`).join('')}</div>`:''}`;

  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  app.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{ ses.i=+b.dataset.jump; renderQ(); });
  renderBar();
  window.scrollTo(0,0);
}

const circleSVG = () => `<svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="14" style="--len:88"/></svg>`;
const crossSVG  = () => `<svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><path d="M9 9 L31 31" style="--len:32"/><path class="s2" d="M31 9 L9 31" style="--len:32"/></svg>`;

function choose(n){
  const q=ses.qs[ses.i];
  if(ses.mode==='exam'){
    ses.ans[ses.i]= (ses.ans[ses.i]===n ? null : n);
    renderQ(); return;
  }
  if(ses.shown[ses.i]) return;
  ses.ans[ses.i]=n; ses.shown[ses.i]=true;
  const r=rec(q.id); r.n++; if(n!==q.answer) r.ng++; r.last=Date.now(); save();
  renderQ();
}

function renderBar(){
  const q=ses.qs[ses.i];
  const flagged=(S.q[q.id]||{}).flag;
  const last = ses.i===ses.qs.length-1;
  barSlot.innerHTML = `<div class="bar"><div class="inner">
      <button class="ghost" id="prev" ${ses.i?'':'disabled'}>前へ</button>
      <button class="ghost" id="flag" aria-pressed="${flagged?'true':'false'}">付箋</button>
      <span class="spacer"></span>
      ${ses.mode==='exam'
        ? (last?'<button class="next" id="submit">採点する</button>'
               :'<button class="next" id="next">次へ</button>')
        : (last?'<button class="next" id="submit">結果を見る</button>'
               :`<button class="next" id="next">${ses.shown[ses.i]?'次へ':'とばす'}</button>`)}
    </div></div>`;
  const g=id=>document.getElementById(id);
  if(g('prev')) g('prev').onclick=()=>{ ses.i--; renderQ(); };
  g('flag').onclick=()=>{ const r=rec(q.id); r.flag=!r.flag; save(); renderBar();
                          if(ses.mode==='exam') renderQ(); };
  if(g('next')) g('next').onclick=()=>{ ses.i++; renderQ(); };
  if(g('submit')) g('submit').onclick=()=> ses.mode==='exam' ? finishExam() : finishPractice();
}

/* ===== 採点 ===== */
function finishExam(){
  clearInterval(timerId);
  ses.qs.forEach((q,i)=>{ const r=rec(q.id); r.n++; if(ses.ans[i]!==q.answer) r.ng++; r.last=Date.now(); });
  const score = ses.qs.filter((q,i)=>ses.ans[i]===q.answer).length;
  const y = META.years.find(v=>v.kai===ses.kai);
  const pass = y ? y.pass : 30;
  S.exams.unshift({ t:Date.now(), title:ses.title, score, total:ses.qs.length, pass });
  S.exams = S.exams.slice(0,50);
  save();
  renderResult(score, pass);
}
function finishPractice(){
  const done = ses.shown.filter(Boolean).length;
  const score = ses.qs.filter((q,i)=>ses.shown[i] && ses.ans[i]===q.answer).length;
  renderResult(score, null, done);
}

function renderResult(score, pass, answered){
  const total = answered!=null ? answered : ses.qs.length;
  const ok = pass!=null ? score>=pass : null;
  homeBtn.hidden=true; topInfo.innerHTML=''; barSlot.innerHTML='';

  const bySec = SECS.map(s=>{
    const idx = ses.qs.map((q,i)=>[q,i]).filter(([q])=>q.sectionShort===s);
    const n = idx.length;
    const c = idx.filter(([q,i])=>ses.ans[i]===q.answer).length;
    return {s,n,c};
  }).filter(x=>x.n);

  const wrong = ses.qs.map((q,i)=>[q,i]).filter(([q,i])=>
    (answered==null || ses.shown[i]) && ses.ans[i]!==q.answer);

  app.className='wrap';
  app.innerHTML = `
    <div class="result">
      <div class="score">${score}<small>/${total}</small></div>
      ${pass!=null?`<div class="judge ${ok?'pass':'fail'}">${ok?'合格':'不合格'}</div>
        <div class="line">${esc(ses.title)}の合格基準点は ${pass}問（正答率 ${pct(score,total)}%）</div>`
       :`<div class="line">正答率 ${pct(score,total)}%${answered<ses.qs.length?`　未解答 ${ses.qs.length-answered}問`:''}</div>`}
    </div>

    <h2 class="h2">分野別</h2>
    <div class="breakdown">${bySec.map(b=>`
      <div class="br"><span class="n">${b.s}</span>
        <span class="track"><span class="fill" style="width:${pct(b.c,b.n)}%;background:var(${SECVAR[b.s]})"></span></span>
        <span class="v">${b.c}/${b.n}</span></div>`).join('')}</div>

    <h2 class="h2">間違えた問題${wrong.length?`（${wrong.length}問）`:''}</h2>
    ${wrong.length? `<div class="list">${wrong.map(([q,i])=>`
        <button class="li" data-jump="${i}">
          <span class="id">${q.era.replace('年度','')} 問${q.num}</span>
          <span class="ans"><span class="no">${ses.ans[i]?MARKS[ses.ans[i]-1]:'—'}</span> → <span class="yes">${MARKS[q.answer-1]}</span></span>
          <span class="tx">${esc(q.stem.slice(0,58))}…</span></button>`).join('')}</div>`
      : '<p class="empty">全問正解です。</p>'}

    <div style="display:flex;gap:9px;margin-top:26px;flex-wrap:wrap">
      <button class="go" id="again" style="flex:1;min-width:160px">間違えた問題を解き直す</button>
      <button class="tbtn" id="back" style="padding:12px 20px">ホームへ</button>
    </div>`;

  app.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{
    ses.i=+b.dataset.jump; ses.mode='practice'; ses.shown=ses.shown.map(()=>true);
    homeBtn.hidden=false; renderQ();
  });
  const ag=document.getElementById('again');
  if(!wrong.length){ ag.disabled=true; ag.textContent='間違えた問題はありません'; }
  else ag.onclick=()=>startSession(shuffle(wrong.map(([q])=>q)),'practice','解き直し');
  document.getElementById('back').onclick=renderHome;
}

/* ===== 成績 ===== */
function renderStats(){
  view='stats'; homeBtn.hidden=false; barSlot.innerHTML=''; topInfo.innerHTML='';
  const bySec = SECS.map(s=>{
    const qs=DB.filter(q=>q.sectionShort===s);
    const done=qs.filter(q=>(S.q[q.id]||{}).n>0);
    const n=done.reduce((a,q)=>a+S.q[q.id].n,0);
    const ng=done.reduce((a,q)=>a+S.q[q.id].ng,0);
    return {s, total:qs.length, done:done.length, acc:pct(n-ng,n), n};
  });
  const byYear = META.years.map(y=>{
    const qs=DB.filter(q=>q.kai===y.kai);
    const done=qs.filter(q=>(S.q[q.id]||{}).n>0);
    const n=done.reduce((a,q)=>a+S.q[q.id].n,0);
    const ng=done.reduce((a,q)=>a+S.q[q.id].ng,0);
    return {y, done:done.length, total:qs.length, acc:pct(n-ng,n), n};
  });

  app.className='wrap';
  app.innerHTML = `
    <h1 class="h1">成績</h1>
    <p class="lede">正答率は延べ解答回数に対する割合です。</p>

    <h2 class="h2">分野別</h2>
    <div class="breakdown">${bySec.map(b=>`
      <div class="br"><span class="n">${b.s}</span>
        <span class="track"><span class="fill" style="width:${b.acc}%;background:var(${SECVAR[b.s]})"></span></span>
        <span class="v">${b.n?b.acc+'%':'—'}</span></div>
      <div class="br sub"><span class="n">　解答済</span>
        <span class="track"><span class="fill" style="width:${pct(b.done,b.total)}%;background:var(--ink-3);opacity:.55"></span></span>
        <span class="v">${b.done}/${b.total}</span></div>`).join('')}</div>

    <h2 class="h2">年度別</h2>
    <div class="breakdown">${byYear.map(b=>`
      <div class="br"><span class="n">${b.y.era}</span>
        <span class="track"><span class="fill" style="width:${b.acc}%;background:var(--ai)"></span></span>
        <span class="v">${b.n?b.acc+'%':'—'}</span></div>`).join('')}</div>

    <h2 class="h2">模試の記録</h2>
    ${S.exams.length? `<div class="list">${S.exams.map(e=>`
        <div class="li"><span class="id">${new Date(e.t).toLocaleDateString('ja-JP')}</span>
          <span class="tx">${esc(e.title)}</span>
          <span class="ans"><span class="${e.score>=e.pass?'yes':'no'}">${e.score}/${e.total}</span>
          　基準 ${e.pass}</span></div>`).join('')}</div>`
      : '<p class="empty">まだ模試の記録がありません。</p>'}`;
}

/* ===== 全体の操作 ===== */
homeBtn.onclick=()=>{
  if(ses && ses.mode==='exam' && !confirm('模試を中断してホームに戻ります。よろしいですか？')) return;
  clearInterval(timerId); renderHome();
};
const tBtn=document.getElementById('themeBtn');
tBtn.onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const sys=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
  const next = cur ? (cur==='dark'?'light':'dark') : (sys==='dark'?'light':'dark');
  document.documentElement.setAttribute('data-theme',next);
  try{ localStorage.setItem('kashikin.theme',next); }catch(e){}
};
try{ const t=localStorage.getItem('kashikin.theme'); if(t) document.documentElement.setAttribute('data-theme',t); }catch(e){}

document.addEventListener('keydown',e=>{
  if(!ses || e.metaKey||e.ctrlKey||e.altKey) return;
  if(/^[1-4]$/.test(e.key)){ e.preventDefault(); choose(+e.key); }
  else if(e.key==='ArrowRight'||e.key==='Enter'){ if(ses.i<ses.qs.length-1){ e.preventDefault(); ses.i++; renderQ(); } }
  else if(e.key==='ArrowLeft'){ if(ses.i>0){ e.preventDefault(); ses.i--; renderQ(); } }
  else if(e.key==='f'){ e.preventDefault(); const r=rec(ses.qs[ses.i].id); r.flag=!r.flag; save(); renderQ(); }
});

renderHome();
</script>
