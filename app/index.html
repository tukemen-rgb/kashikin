データの適切な取扱いを周知徹底するとともに適切な教育を行わなければならない。","③":"個人情報取扱事業者は、組織的安全管理措置として、個人データの取扱いに係る規律に従った運用、担当者及び取り扱う個人情報データベース等の範囲を限定するための適切なアクセス制御を行わなければならない。","④":"個人情報取扱事業者は、情報システム（パソコン等の機器を含む。）を使用して個人データを取り扱う場合（インターネット等を通じて外部と送受信等する場合を含む。）、技術的安全管理措置として、個人データを取り扱う情報システムを使用する従業者が正当なアクセス権を有する者であることを、識別した結果に基づき認証しなければならない。"},"note":"","answer":3,"format":"single","negative":true},{"id":"R17-47","kai":17,"era":"令和4年度","num":47,"sectionShort":"資金需要者保護","stem":"不当景品類及び不当表示防止法（以下、本問において「景品表示法」という。）に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"「景品類」とは、顧客を誘引するための手段として、その方法が直接的であるか間接的であるかを問わず、くじの方法によるかどうかを問わず、また事業者が自己の供給する商品又は役務の取引に付随して行われるものかどうかを問わず、相手方に提供する物品、金銭その他の経済上の利益であって、内閣総理大臣が指定するものをいう。","②":"内閣総理大臣は、不当な顧客の誘引を防止し、一般消費者による自主的かつ合理的な選択を確保するため必要があると認めるときは、景品類の価額の最高額もしくは総額、種類もしくは提供の方法その他景品類の提供に関する事項を制限し、又は景品類の提供を禁止することができる。","③":"内閣総理大臣は、景品表示法第7条（措置命令）第1項の規定による命令に関し、事業者がした表示が同法第5条（不当な表示の禁止）第1号に該当する表示（以下、本問において「優良誤認表示」という。）であるか否かを判断するため必要があると認めるときは、当該表示をした事業者に対し、期間を定めて、当該表示の裏付けとなる合理的な根拠を示す資料の提出を求めることができる。この場合において、当該事業者が当該資料を提出しないときは、同法第7条第1項の規定の適用については、当該表示は優良誤認表示とみなされる。","④":"景品表示法第7条第1項の規定による命令に違反した者は、刑事罰に処される。"},"note":"","answer":1,"format":"single","negative":true},{"id":"R17-48","kai":17,"era":"令和4年度","num":48,"sectionShort":"財務会計","stem":"給与所得者の収入及び給与所得の源泉徴収票等に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"給与所得者の収入を把握できるものは、雇用主により作成され交付される源泉徴収票及び給与明細書のみである。","②":"単一の事業者のみから給与を受けている給与所得者のうち、給与の年間収入金額が1,500万円を超える者は、確定申告書の提出が必要である。","③":"源泉徴収票には、支払金額、給与所得控除後の金額及び源泉徴収税額が記載される欄はあるが、前年度の市町村民税の控除額が記載される欄はない。","④":"源泉徴収票には控除対象配偶者の有無等の欄がある。ここでいう控除対象配偶者とは、その年の12月31日の現況で、民法の規定による配偶者又は婚姻の届出はしていないが事実上婚姻関係と同様の事情にある者であること、納税者と生計を一にしていること、年間の合計所得金額が103万円以下であることの条件を満たす者をいう。"},"note":"","answer":3,"format":"single","negative":false},{"id":"R17-49","kai":17,"era":"令和4年度","num":49,"sectionShort":"財務会計","stem":"会社計算規則に規定する損益計算書等(注)に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"損益計算書とは、ある時点における企業の財政状態を表す財務諸表である。","②":"売上総損益金額から販売費及び一般管理費の合計額を減じて得た額が零以上の場合を営業利益金額という。","③":"営業損益金額に特別利益を加えて得た額から特別損失を減じて得た額が零以上の場合を経常利益金額という。","④":"経常利益金額から税金を差し引いた額が零以上の場合を当期純利益金額という。"},"note":"(注) 損益計算書等とは、損益計算書及び連結損益計算書をいう。","answer":2,"format":"single","negative":false},{"id":"R17-50","kai":17,"era":"令和4年度","num":50,"sectionShort":"財務会計","stem":"企業会計原則（大蔵省企業会計審議会発表）の一般原則に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"企業会計は、企業の財政状態及び経営成績に関して、真実な報告を提供するものでなければならない。これを一般に真実性の原則という。","②":"資本取引と損益取引とを明瞭に区別し、特に資本剰余金と利益剰余金とを混同してはならない。これを一般に資本取引と損益取引との区分の原則という。","③":"企業会計は、財産目録及び出納帳簿によって、利害関係者に対し必要な会計事実を明瞭に表示し、企業の状況に関する適切な判断がなされるようにしなければならない。これを一般に適切性の原則という。","④":"株主総会提出のため、信用目的のため、租税目的のため等種々の目的のために異なる形式の財務諸表を作成する必要がある場合、それらの内容は、信頼しうる会計記録に基づいて作成されたものであって、政策の考慮のために事実の真実な表示をゆがめてはならない。これを一般に単一性の原則という。"},"note":"","answer":3,"format":"single","negative":true},{"id":"R18-01","kai":18,"era":"令和5年度","num":1,"sectionShort":"法令","stem":"貸金業法上の用語の定義等に関する次のａ～ｄの記述のうち、その内容が適切なものの個数を①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"貸金業者とは、貸金業法第3条第1項の登録を受けて貸金業を営む者をいい、これには貸付けに係る契約について業として保証を行う者も含まれる。","ｂ":"資金需要者等とは、資金需要者である顧客、債務者又は債務者であった者をいう。","ｃ":"住宅資金貸付契約とは、住宅の建設もしくは購入に必要な資金（住宅の用に供する土地又は借地権の取得に必要な資金を含む。）又は住宅の改良に必要な資金の貸付けに係る契約をいう。","ｄ":"手続実施基本契約とは、紛争解決等業務の実施に関し指定紛争解決機関と貸金業者との間で締結される契約をいう。"},"options":{"①":"1個","②":"2個","③":"3個","④":"4個"},"note":"","answer":2,"format":"count","negative":false},{"id":"R18-02","kai":18,"era":"令和5年度","num":2,"sectionShort":"法令","stem":"次のａ～ｄの記述のうち、貸金業法第6条第1項各号のいずれかに該当する者として貸金業の登録を拒否されるものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"破産手続開始の決定を受けて復権を得た日から5年を経過しない者","ｂ":"出資法(注)の規定に違反し、罰金の刑に処せられ、その刑の執行を終わり、又は刑の執行を受けることがなくなった日から5年を経過しない者","ｃ":"貸金業法第24条の6の4（監督上の処分）第1項の規定により貸金業の登録を取り消された株式会社の取締役を当該取消しの日の30日前に退任した者であって、当該取消しの日から5年を経過しないもの","ｄ":"株式会社であって、その常務に従事する取締役がすべて、貸金業者以外の金融機関での貸付けの業務に3年以上従事した経験を有するが、貸金業者での貸付けの業務に従事した経験を有しないもの"},"options":{"①":"ａｂ","②":"ａｄ","③":"ｂｃ","④":"ｃｄ"},"note":"(注) 出資法とは、出資の受入れ、預り金及び金利等の取締りに関する法律をいう。","answer":3,"format":"combo","negative":false},{"id":"R18-03","kai":18,"era":"令和5年度","num":3,"sectionShort":"法令","stem":"貸金業者向けの総合的な監督指針における反社会的勢力による被害の防止について、監督当局が貸金業者を監督するに当たって留意することとされている事項に関する次のａ～ｄの記述のうち、その内容が適切なものの個数を①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"反社会的勢力との関係を遮断するための対応を総括する部署（以下、本問において「反社会的勢力対応部署」という。）を整備し、反社会的勢力による被害を防止するための一元的な管理態勢が構築され、機能しているか。一元的な管理態勢の構築に当たっては、反社会的勢力対応部署において反社会的勢力に関する情報を積極的に収集・分析するとともに、当該情報を一元的に管理したデータベースを構築し、適切に更新（情報の追加、削除、変更等）する体制となっているか。","ｂ":"反社会的勢力との取引を未然に防止するため、反社会的勢力に関する情報等を活用した適切な事前審査を実施するとともに、契約書や取引約款への暴力団排除条項の導入を徹底するなど、反社会的勢力が取引先となることを防止しているか。","ｃ":"反社会的勢力との取引が判明した場合、直ちに取引を解消することは、貸金業者が回収不能による経済的損失を被り、当該回収不能の結果として反社会的勢力が利益を得ることとなるほか、役職員の安全が脅かされる等不測の事態が危惧されるため、弁済が滞る又は不当な要求行為等があるまで、契約解消は行わないこととしているか。","ｄ":"反社会的勢力からの不当要求に対しては、あらゆる民事上の法的対抗手段を講ずるとともに、積極的に被害届を提出するなど、刑事事件化も躊躇しない対応を行うこととしているか。"},"options":{"①":"1個","②":"2個","③":"3個","④":"4個"},"note":"","answer":3,"format":"count","negative":false},{"id":"R18-04","kai":18,"era":"令和5年度","num":4,"sectionShort":"法令","stem":"貸金業務取扱主任者（以下、本問において「主任者」という。）に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"主任者は、その職務に関し貸金業に関する法令の規定に違反したことによりその主任者登録(注1)の取消しの処分を受けたときは、その処分の日から5年間主任者登録を受けることができない。","②":"主任者登録の更新は、登録講習機関(注2)が行う講習で主任者登録の有効期間満了日前6か月以内に行われるものを受けることによりなされ、更新の申請をする必要はない。","③":"貸金業者向けの総合的な監督指針によれば、貸金業者が営業所又は事務所（以下、本問において「営業所等」という。）に設置する主任者は、勤務する営業所等が1つに決まっているだけでなく、営業時間内に、その営業所等に常時駐在していることが必要であるとされている。","④":"貸金業者は、その営業所等における唯一の主任者が定年退職したことにより当該営業所等に主任者を欠くに至ったときは、その日から2週間以内に新たな主任者を設置するか、又は当該営業所等を廃止しなければならない。"},"note":"(注1) 主任者登録とは、貸金業法第24条の25（貸金業務取扱主任者の登録）第1項の登録をいう。(注2) 登録講習機関とは、貸金業法第24条の36（登録講習機関の登録）第1項に規定する内閣総理大臣の登録を受けた者をいう。","answer":1,"format":"single","negative":false},{"id":"R18-05","kai":18,"era":"令和5年度","num":5,"sectionShort":"法令","stem":"貸金業法第13条（返済能力の調査）第3項及び同法第13条の3（基準額超過極度方式基本契約に係る調査）第3項に規定する内閣府令で定めるもの（貸金業法施行規則第10条の17第1項に規定される源泉徴収票その他の当該個人顧客の収入又は収益その他の資力を明らかにする書面等。以下、本問において「年収証明書」という。）に関する次のａ～ｄの記述のうち、その内容が適切なものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"貸金業者は、これまで契約を一切締結していない個人顧客との間で、貸付けの金額が60万円の貸付けに係る契約を締結しようとする場合において、指定信用情報機関が保有する信用情報を使用して返済能力の調査を行った結果、当該顧客に対する他の貸金業者の貸付けの残高が30万円であり、自らの貸付けの金額と他の貸金業者の貸付けの残高の合計額が100万円未満であることが判明した。この場合、当該貸金業者は、当該顧客から年収証明書の提出又は提供を受ける必要はない。","ｂ":"貸金業者は、これまで契約を一切締結していない個人顧客との間で貸付けに係る契約を締結するに際し、年収証明書の提出又は提供を受けなければならない場合において、年収証明書として給与の支払明細書の提出を受けるときは、当該給与の支払明細書は、直近1年以内の間に発行された任意の2か月分以上のものでなければならない。","ｃ":"貸金業者向けの総合的な監督指針（以下、本問において「監督指針」という。）によれば、年収証明書のうちの所得証明書について、例えば、行政サービスの一環として地方公共団体が交付する所得・課税証明書は、地方税法等に発行の根拠がなくても、所得証明書に含まれるとされている。","ｄ":"監督指針によれば、個人顧客につき貸金業法第13条第3項本文各号のいずれか又は同法第13条の3第3項本文に該当することを確認した場合において、当該個人顧客から年収証明書の提出を受けられないなど当該個人顧客の年収を把握できないときは、当該個人顧客の返済能力を確認できないことから、貸金業法第13条の2（過剰貸付け等の禁止）第1項により貸付けの契約（極度方式貸付けに係る契約を含む。）を締結できないことに留意する必要があるとされている。"},"options":{"①":"ａｂ","②":"ａｄ","③":"ｂｃ","④":"ｃｄ"},"note":"","answer":4,"format":"combo","negative":false},{"id":"R18-06","kai":18,"era":"令和5年度","num":6,"sectionShort":"法令","stem":"貸金業法第13条の2（過剰貸付け等の禁止）第2項に規定する個人過剰貸付契約から除かれる契約として貸金業法施行規則第10条の21に規定する契約（以下、本問において「除外契約」という。）に関する次のａ～ｄの記述のうち、その内容が適切なものの個数を①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"住宅の改良に必要な資金の貸付けに係る契約であっても、当該住宅を担保としないものは、除外契約に該当しない。","ｂ":"自動車の購入に必要な資金の貸付けに係る契約であっても、当該自動車の所有権を貸金業者が取得し、又は当該自動車が譲渡により担保の目的となっていないものは、除外契約に該当しない。","ｃ":"個人顧客の親族の健康保険法第115条第1項及び第147条に規定する高額療養費を支払うために必要な資金の貸付けに係る契約であっても、当該親族が当該個人顧客と生計を一にしていないものは、除外契約に該当しない。","ｄ":"個人顧客の不動産を担保とする貸付けに係る契約であって、当該個人顧客の返済能力を超えないと認められるものであっても、当該不動産が当該個人顧客の居宅であるものは、除外契約に該当しない。"},"options":{"①":"1個","②":"2個","③":"3個","④":"4個"},"note":"","answer":3,"format":"count","negative":false},{"id":"R18-07","kai":18,"era":"令和5年度","num":7,"sectionShort":"法令","stem":"貸金業者Ａが、個人顧客Ｂとの間で極度方式基本契約（以下、本問において「本件基本契約」という。）を締結している場合において、貸金業法第13条の3第2項に基づく、3か月以内の期間（以下、本問において「所定の期間」という。）ごとに、指定信用情報機関が保有する当該個人顧客に係る信用情報を使用して、本件基本契約が基準額超過極度方式基本契約に該当するかどうかの調査（以下、本問において「本件調査」という。）を行う場合等に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。なお、Ａは、Ｂとの間で本件基本契約以外の極度方式基本契約を締結していないものとする。","statements":{},"options":{"①":"Ａは、本件調査をしなければならない場合において、Ｂに係る極度方式個人顧客合算額が80万円であったときは、本件調査を行うに際し、Ｂから源泉徴収票その他のＢの収入又は収益その他の資力を明らかにする事項を記載し、又は記録した書面又は電磁的記録として内閣府令で定めるものの提出又は提供を受けなければならない。","②":"Ａは、所定の期間の末日における本件基本契約に基づく極度方式貸付けの残高が10万円であるときは、本件調査をする必要がない。","③":"Ａは、Ｂに対し、利息の支払の遅延を理由に本件基本契約に基づく新たな極度方式貸付けを停止する措置を講じている。この場合、Ａは、所定の期間の末日における本件基本契約に基づく極度方式貸付けの残高が20万円であるときは、本件調査をしなければならない。","④":"Ａは、本件調査をしたところ、本件基本契約は、基準額超過極度方式基本契約に該当すると認められた。この場合、Ａは、本件基本契約に基づく新たな極度方式貸付けの停止又は本件基本契約の解除のいずれかの措置を講じなければならない。"},"note":"","answer":2,"format":"single","negative":false},{"id":"R18-08","kai":18,"era":"令和5年度","num":8,"sectionShort":"法令","stem":"貸金業の業務に関する広告又は勧誘についての次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"貸金業者の従業者が、当該貸金業者の貸金業の業務に関して顧客に対し勧誘をするに際し、貸付けの条件について著しく事実に相違する説明をした場合、当該貸金業者は、行政処分の対象となるが、刑事罰の対象とはならない。","②":"日本貸金業協会が定める貸金業の業務運営に関する自主規制基本規則（以下、本問において「自主規制規則」という。）によれば、協会員は、個人向け貸付けの契約に係る広告をテレビCM、新聞広告、雑誌広告及び電話帳広告に出稿するに当たり、協会が設ける審査機関から承認を得なければならないとされている。","③":"自主規制規則によれば、協会員は、貸金業の業務に関して勧誘をした場合において、当該勧誘を受けた資金需要者等が、勧誘を引き続き受けることを希望しない旨の明確な意思の表示を行ったときは、当該意思表示のあった日から最低3か月間は当該勧誘に係る取引及びこれと類似する取引の勧誘を見合わせることを目処として対応しなければならないとされている。","④":"貸金業者が、その貸金業の業務に関して広告又は勧誘をする場合において、借入れが容易であることを過度に強調することにより、資金需要者等の借入意欲をそそるような表示又は説明をしたときは、当該貸金業者がその登録を受けた内閣総理大臣又は都道府県知事は、当該貸金業者に対して、その登録を取り消すことはできないが、その必要の限度において、業務の方法の変更その他業務の運営の改善に必要な措置を命ずることができる。"},"note":"","answer":2,"format":"single","negative":false},{"id":"R18-09","kai":18,"era":"令和5年度","num":9,"sectionShort":"法令","stem":"貸金業法第16条の2（契約締結前の書面の交付）に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"貸金業者は、顧客との間で極度方式基本契約を締結しようとする場合には、当該契約を締結するまでに、内閣府令で定めるところにより、貸金業法第16条の2第2項に規定する書面（当該極度方式基本契約における契約締結前の書面）を当該顧客に交付しなければならないが、当該書面の記載事項には、契約年月日、契約の相手方の商号、名称又は氏名及び住所等が含まれる。","②":"貸金業者は、顧客との間で極度方式貸付けに係る契約を締結しようとする場合には、当該契約を締結するまでに、内閣府令で定めるところにより、貸金業法第16条の2第1項に規定する書面（当該極度方式貸付けに係る契約における契約締結前の書面）を当該顧客に交付しなければならない。","③":"貸金業者向けの総合的な監督指針によれば、貸金業法第16条の2に規定する契約締結前の書面を交付後、契約締結前に法令で定められた記載事項の内容に変更が生じた場合、改めて、当該契約の相手方となろうとする者に対し、契約締結前の書面の再交付を要しないことに留意する必要があるとされている。","④":"貸金業者は、貸付けに係る契約について、保証人となろうとする者との間で保証契約を締結しようとする場合には、当該保証契約を締結するまでに、貸金業法施行規則第12条の2第7項第1号に規定する書面（当該保証契約の概要を記載した書面）及び貸金業法施行規則第12条の2第7項第2号に規定する書面（当該保証契約の詳細を記載した書面）の両方を同時に当該保証人となろうとする者に交付しなければならない。"},"note":"","answer":4,"format":"single","negative":false},{"id":"R18-10","kai":18,"era":"令和5年度","num":10,"sectionShort":"法令","stem":"貸金業者Ａは、個人顧客Ｂとの間で貸付けに係る契約（以下、本問において「本件貸付契約」という。）を締結した後、Ｃとの間で本件貸付契約についての保証契約を締結することとした。この場合に関する次のａ～ｄの記述のうち、その内容が適切なものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。なお、本件貸付契約は、金銭の貸付けに係る契約であって、極度方式基本契約、極度方式貸付けに係る契約、手形の割引の契約及び売渡担保の契約ではないものとする。","statements":{"ａ":"Ａは、Ｃとの間で保証契約を締結したときは、遅滞なく、貸金業法第17条第3項に掲げる事項について当該保証契約の内容を明らかにする書面を本件貸付契約の相手方であるＢに交付しなければならない。","ｂ":"Ａは、Ｃとの間で保証契約を締結したときは、遅滞なく、貸金業法第17条第3項に規定する書面（以下、本問において「当該保証契約における契約締結時の書面」という。）をＣに交付しなければならないが、ＣがＢと連帯して債務を負担するときは、当該保証契約における契約締結時の書面に、民法第454条（連帯保証の場合の特則）の規定の趣旨を記載しなければならない。","ｃ":"Ａは、Ｃとの間で保証契約を締結した後、当該保証契約に基づく債務の弁済の方式を変更した場合において、当該変更がＣの利益となる変更であるときは、変更後の当該保証契約における契約締結時の書面をＣに再交付する必要はない。","ｄ":"Ａは、Ｃとの間で保証契約を締結した場合は、遅滞なく、貸金業法第17条第1項各号に掲げる事項について本件貸付契約の内容を明らかにする書面をＣに交付しなければならない。"},"options":{"①":"ａｂ","②":"ａｃ","③":"ｂｄ","④":"ｃｄ"},"note":"","answer":3,"format":"combo","negative":false},{"id":"R18-11","kai":18,"era":"令和5年度","num":11,"sectionShort":"法令","stem":"貸金業者Ａは、個人顧客Ｂとの間で極度額を30万円とする極度方式基本契約（以下、本問において「本件基本契約」という。）を締結し、貸金業法第17条第2項に規定する書面（以下、本問において「本件基本契約に係る書面」という。）をＢに交付した。この場合に関する次のａ～ｄの記述のうち、その内容が適切なものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。なお、本件基本契約は、金銭の貸付けに係る契約であって、手形の割引の契約及び売渡担保の契約ではないものとする。","statements":{"ａ":"Ａは、Ｂと合意の上で、本件基本契約における極度額を15万円に引き下げた後に20万円に引き上げた。この場合、Ａは、変更後の内容が記載された本件基本契約に係る書面をＢに再交付する必要はない。","ｂ":"Ａは、Ｂと合意の上で、本件基本契約における各回の返済期日及び返済金額の設定の方式を変更し、各回の返済金額を15,000円から10,000円に引き下げた。この場合、Ａは、変更後の内容が記載された本件基本契約に係る書面をＢに再交付する必要はない。","ｃ":"Ａは、Ｂと合意の上で、本件基本契約における貸付けの利率を年1割2分（12％）から年9分（9％）に引き下げた。この場合、Ａは、変更後の内容が記載された本件基本契約に係る書面をＢに再交付しなければならない。","ｄ":"Ａは、貸金業の登録の更新を受け、その登録番号の括弧書（登録回数）に変更が生じた。この場合、Ａは、変更後の内容が記載された本件基本契約に係る書面をＢに再交付する必要はない。"},"options":{"①":"ａｂ","②":"ａｄ","③":"ｂｃ","④":"ｃｄ"},"note":"","answer":2,"format":"combo","negative":false},{"id":"R18-12","kai":18,"era":"令和5年度","num":12,"sectionShort":"法令","stem":"貸金業者が貸金業法に基づき保存すべきものに関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"貸金業者は、貸金業法第12条の4第2項に規定する従業者名簿を、最終の記載をした日から10年間保存しなければならない。","②":"貸金業者は、顧客と貸付けに係る契約（極度方式基本契約及び極度方式貸付けに係る契約ではないものとする。）を締結した場合には、内閣府令で定めるところにより、貸金業法第13条（返済能力の調査）第1項に規定する調査に関する記録を作成し、当該記録をその作成の日から10年間保存しなければならない。","③":"貸金業者は、個人顧客との間で締結した極度方式基本契約が基準額超過極度方式基本契約に該当するかどうかの調査をした場合には、内閣府令で定めるところにより、当該調査に関する記録を作成し、当該記録をその作成の日から10年間保存しなければならない。","④":"貸金業者は、貸金業法第19条の帳簿を、貸付けの契約ごとに、当該契約を締結した日から少なくとも10年間保存しなければならない。"},"note":"","answer":1,"format":"single","negative":false},{"id":"R18-13","kai":18,"era":"令和5年度","num":13,"sectionShort":"法令","stem":"貸金業者が貸付けに係る契約に基づく債権を譲渡する場合に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。なお、本問における債権は、抵当証券法第1条第1項に規定する抵当証券に記載された債権ではないものとする。","statements":{},"options":{"①":"貸金業者は、貸付けに係る契約に基づく債権を他人に譲渡するに当たっては、譲受人が貸金業者である場合を除き、譲受人に対し、当該債権が貸金業者の貸付けに係る契約に基づいて発生したことその他内閣府令で定める事項、及びその者が当該債権に係る貸付けの契約に基づく債権に関してする行為について貸金業法第24条（債権譲渡等の規制）第1項に規定する条項の適用がある旨を、内閣府令で定める方法により、通知しなければならない。","②":"貸金業者は、貸付けに係る契約（極度方式基本契約及び極度方式貸付けに係る契約ではないものとする。）に基づく債権を他人に譲渡した。この場合、貸金業法に規定する当該債権の内容を明らかにする書面を当該債権の債務者に遅滞なく交付しなければならないのは、当該債権の譲渡人たる貸金業者である。","③":"貸金業者は、貸付けに係る契約に基づく債権を他人に譲渡した場合には、当該債権に係る貸金業法第19条に規定する帳簿で当該貸金業者が作成したものを当該債権の譲受人に引き渡さなければならず、当該貸金業者はこれにより当該帳簿の保存義務を免れる。","④":"貸金業者は、貸付けに係る契約に基づく債権を他人に譲渡した場合、法令の規定により貸金業法第24条の規定を適用しないこととされるときを除き、その日から2週間以内に、その旨をその登録をした内閣総理大臣又は都道府県知事に届け出なければならない。"},"note":"","answer":4,"format":"single","negative":false},{"id":"R18-14","kai":18,"era":"令和5年度","num":14,"sectionShort":"法令","stem":"貸金業者向けの総合的な監督指針（以下、本問において「監督指針」という。）に規定する不祥事件（貸金業法施行規則第26条の25第1項第4号に規定する「役員又は使用人に貸金業の業務に関し法令に違反する行為又は貸金業の業務の適正な運営に支障を来す行為」をいう。）に関する次のａ～ｄの記述のうち、その内容が適切なものの個数を①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"監督指針によれば、貸金業の業務に関し法令に違反する行為のほか、貸金業の業務に関し、資金需要者等の利益を損なうおそれのある詐欺、横領、背任等や、貸金業の業務に関し、資金需要者等から告訴、告発され又は検挙された行為は、不祥事件に該当するとされている。","ｂ":"監督指針によれば、監督当局は、貸金業者において不祥事件が発覚し、当該貸金業者から第一報があった場合は、社内規則等に則った内部管理部門への迅速な報告及び経営陣への報告、刑罰法令に抵触しているおそれのある事実については、警察等関係機関等への通報、独立した部署（内部監査部門等）での不祥事件の調査・解明の実施を確認するものとされている。","ｃ":"監督指針によれば、不祥事件と貸金業者の業務の適切性については、「不祥事件の発覚後の対応は適切か」、「不祥事件への経営陣の関与はないか、組織的な関与はないか」、「不祥事件の内容が資金需要者等に与える影響はどうか」、「内部牽制機能が適切に発揮されているか」、「再発防止のための改善策の策定や自浄機能は十分か、関係者の責任の追及は明確に行われているか」、「資金需要者等に対する説明や問い合わせへの対応等は適切か」の着眼点に基づき検証を行うこととされている。","ｄ":"監督指針によれば、監督当局は、不祥事件の届出があった場合には、事実関係（当該行為が発生した営業所等、当該行為者の氏名・職名・職歴（貸金業務取扱主任者である場合にはその旨）、当該行為の概要、発覚年月日、発生期間、発覚の端緒）、発生原因分析、改善・対応策等について深度あるヒアリングを実施し、必要に応じて貸金業法第24条の6の10（報告徴収及び立入検査）に基づき報告書を徴収することにより、貸金業者の自主的な業務改善状況を把握することとされている。"},"options":{"①":"1個","②":"2個","③":"3個","④":"4個"},"note":"","answer":4,"format":"count","negative":false},{"id":"R18-15","kai":18,"era":"令和5年度","num":15,"sectionShort":"法令","stem":"貸金業者Ａは、個人顧客Ｂとの間で、元本額100万円、利息を年1割8分（18％）、期間を1年とする営業的金銭消費貸借契約を締結して100万円をＢに貸し付け、当該契約について、業として保証を行うＣとの間で保証契約を締結した。Ｂは、Ｃとの間で、当該保証契約に基づきＣが負う保証債務について、Ｃに元本額の3分（3％）の保証料を支払う旨の保証料の契約を締結した。この場合に関する次のａ～ｄの記述のうち、その内容が適切なものの個数を①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"Ａは、Ｂとの間の営業的金銭消費貸借契約における利息の約定につき、出資法(注)上、刑事罰の対象とならない。","ｂ":"Ｃは、Ｂとの間の保証料の契約につき、出資法上、刑事罰の対象とならない。","ｃ":"ＡとＢとの間の営業的金銭消費貸借契約における利息の約定は、利息制限法上、その全部について有効である。","ｄ":"ＢとＣとの間の保証料の契約は、利息制限法上、その全部について有効である。"},"options":{"①":"1個","②":"2個","③":"3個","④":"4個"},"note":"(注) 出資法とは、出資の受入れ、預り金及び金利等の取締りに関する法律をいう。","answer":1,"format":"count","negative":false},{"id":"R18-16","kai":18,"era":"令和5年度","num":16,"sectionShort":"法令","stem":"みなし利息に関する次のａ～ｄの記述のうち、利息制限法上、その内容が適切なものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"貸金業者は、顧客との間で締結した営業的金銭消費貸借契約において、顧客が金銭の受領又は弁済のために利用する現金自動支払機その他の機械の利用料として、20,000円の弁済を受領する際に220円（消費税額等相当額を含む。）を当該顧客から受領した。この場合、当該利用料は、利息とみなされない。","ｂ":"貸金業者は、顧客との間で締結した営業的金銭消費貸借契約において、契約の締結及び債務の弁済の費用として公租公課の支払に充てられるべきものを当該顧客から受領した。この場合、当該費用は、利息とみなされない。","ｃ":"貸金業者は、顧客との間で締結した営業的金銭消費貸借契約において、口座振替の方法による弁済につき、当該顧客が弁済期に弁済できなかったため、当該顧客の要請を受けて行った再度の口座振替手続に要した費用（消費税額等相当額を含む。）を当該顧客から受領した。この場合、当該費用は、利息とみなされる。","ｄ":"貸金業者は、顧客との間で締結した営業的金銭消費貸借契約において、金銭の貸付け及び弁済に用いるため当該契約締結時に当該顧客にカードを交付し、当該カードの発行の手数料（消費税額等相当額を含む。）を受領した。この場合、当該手数料は、利息とみなされない。"},"options":{"①":"ａｂ","②":"ａｃ","③":"ｂｄ","④":"ｃｄ"},"note":"","answer":1,"format":"combo","negative":false},{"id":"R18-17","kai":18,"era":"令和5年度","num":17,"sectionShort":"法令","stem":"貸金業法第8条（変更の届出）に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"貸金業者は、営業所又は事務所ごとに置かれる貸金業務取扱主任者の氏名及び登録番号に変更があったときは、その日から2週間以内に、その旨をその登録をした内閣総理大臣又は都道府県知事（以下、本問において「登録行政庁」という。）に届け出なければならない。","②":"株式会社である貸金業者は、その取締役に変更があったときは、その日から2週間以内に、その旨を登録行政庁に届け出なければならない。","③":"貸金業者は、その業務に関して広告又は勧誘をする際に表示等をする営業所又は事務所のホームページアドレスを変更しようとするときは、あらかじめ、その旨を登録行政庁に届け出なければならない。","④":"貸金業者は、その業務の種類及び方法を変更しようとするときは、あらかじめ、その旨を登録行政庁に届け出なければならない。"},"note":"","answer":4,"format":"single","negative":true},{"id":"R18-18","kai":18,"era":"令和5年度","num":18,"sectionShort":"法令","stem":"貸金業法第10条（廃業等の届出）に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"貸金業者であるＡ株式会社が破産手続開始の申立てを行った場合、Ａ社は、当該申立てを行った日から30日以内に、その旨を貸金業の登録をした内閣総理大臣又は都道府県知事（以下、本問において「登録行政庁」という。）に届け出なければならない。","②":"個人である貸金業者Ｂが死亡した場合、その相続人Ｃは、Ｂが死亡したことを知った日から30日以内に、その旨を登録行政庁に届け出なければならない。","③":"貸金業者であるＤ株式会社がＥ株式会社との合併により消滅した場合、Ｄ社の代表取締役であったＦは、当該合併によりＤ社が消滅した日から30日以内に、その旨を登録行政庁に届け出なければならない。","④":"貸金業者であるＧ株式会社が金融サービスの提供に関する法律第12条の登録（貸金業貸付媒介業務の種別に係るものに限る。）を受けた場合、Ｇ社は、当該登録を受けた日から30日以内に、その旨を登録行政庁に届け出なければならない。"},"note":"","answer":1,"format":"single","negative":true},{"id":"R18-19","kai":18,"era":"令和5年度","num":19,"sectionShort":"法令","stem":"貸金業者向けの総合的な監督指針（以下、本問において「監督指針」という。）における経営管理等及び業務の適切性に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"監督指針では、社内規則等については、貸金業者のそれぞれの規模・特性に応じて、創意・工夫を生かし、法令及び法の趣旨を踏まえ自主的に策定する必要があるが、その内容については貸金業協会の策定する自主規制規則に則った内容が求められるとされている。","②":"監督指針では、適切な内部監査態勢構築の観点から、他に貸金業の業務に従事する者がいない個人の貸金業者においては、当該個人が貸金業法に規定された貸金業務取扱主任者であることをかんがみ、内部監査に代わる措置として自己の行う貸金業に関する業務の検証を行う場合には、自己検証を実施する頻度が少なくとも年1回以上となっているか等を踏まえ、業務の適切性を確保するために十分な態勢を整備しているか、等が着眼点とされている。","③":"監督指針では、貸金業者が貸金市場の担い手としての自らの役割を十分に認識して、法令及び社内規則等を厳格に遵守し、健全かつ適切な業務運営に努めることは、貸金業者に対する資金需要者等からの信頼を確立することとなり、ひいては貸金市場の健全性を確保する上で極めて重要であるとされている。","④":"監督指針では、金融機関においては、経営者保証に関し、経営者保証に関するガイドライン（以下、本問において「ガイドライン」という。）の趣旨や内容を十分に踏まえた適切な対応を行うことにより、ガイドラインを融資慣行として浸透・定着させていくことが求められている。"},"note":"","answer":2,"format":"single","negative":true},{"id":"R18-20","kai":18,"era":"令和5年度","num":20,"sectionShort":"法令","stem":"貸金業者の禁止行為等に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"貸金業者は、その貸金業の業務に関し、保証人となろうとする者に対し、主たる債務者が弁済することが確実であると誤解させるおそれのあることを告げる行為をしてはならない。","②":"貸金業者は、貸付けの契約（住宅資金貸付契約その他の内閣府令で定める契約を除く。）の相手方又は相手方となろうとする者の死亡によって保険金の支払を受けることとなる保険契約を締結してはならない。","③":"貸金業者は、その貸金業の業務に関して広告又は勧誘をするときは、他の貸金業者の利用者又は返済能力がない者を対象として勧誘する旨の表示又は説明をしてはならない。","④":"金銭の貸借の媒介を行った貸金業者は、当該媒介により締結された貸付けに係る契約の債務者から当該媒介の手数料を受領した場合において、当該契約につき更新（媒介のための新たな役務の提供を伴わないと認められる法律行為として内閣府令で定めるものを含む。）があったときは、これに対する新たな手数料を受領し、又はその支払を要求してはならない。"},"note":"","answer":2,"format":"single","negative":true},{"id":"R18-21","kai":18,"era":"令和5年度","num":21,"sectionShort":"法令","stem":"株式会社である貸金業者Ａが行う貸金業法第13条に規定する返済能力の調査に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"Ａは、法人である顧客Ｂとの間で、貸付けの契約を締結しようとする場合には、Ｂの返済能力の調査を行うに際し、指定信用情報機関が保有する信用情報を使用する必要はない。","②":"Ａは、個人である顧客Ｂとの間で、極度額を30万円とする極度方式基本契約（以下、本問において「本件基本契約」という。）を締結した後、Ｂの返済能力は低下していないが、Ｂと連絡をとることができないことにより、本件基本契約における極度額を一時的に10万円に減額していた場合において、Ｂと連絡することができたことにより、極度額をその減額の前の30万円まで増額するときは、指定信用情報機関が保有する信用情報を使用したＢの返済能力の調査を行う必要はない。","③":"Ａは、個人である顧客Ｂとの間で、本件基本契約に基づく極度方式貸付けに係る契約を締結しようとする場合、当該極度方式貸付けの金額が5万円を超え、かつ、当該極度方式貸付けの金額と本件基本契約に基づく極度方式貸付けの残高の合計額が10万円を超えるときを除き、指定信用情報機関が保有する信用情報を使用したＢの返済能力の調査を行う必要はない。","④":"Ａは、個人である顧客Ｂとの間で、手形（融通手形を除く。）の割引を内容とする契約を締結しようとする場合には、Ｂの返済能力の調査を行うに際し、指定信用情報機関が保有する信用情報を使用する必要はない。"},"note":"","answer":3,"format":"single","negative":true},{"id":"R18-22","kai":18,"era":"令和5年度","num":22,"sectionShort":"法令","stem":"過剰貸付け等の禁止に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。なお、本問における貸付けに係る契約は、極度方式基本契約及び極度方式貸付けに係る契約ではないものとする。","statements":{},"options":{"①":"貸金業者Ａは、法人顧客Ｂとの間の貸付けに係る契約の締結に際し、当該契約がＢの返済能力を超える貸付けの契約と認められるときは、当該契約を締結してはならない。","②":"貸金業者Ａと現に事業を営んでいない個人顧客Ｃとの間で、Ｃが新たな事業を行うために必要な資金の貸付けに係る契約であって、事業計画、収支計画及び資金計画の確認その他の方法により確実に当該事業の用に供するための資金の貸付けであると認められ、かつ、Ｃの事業計画、収支計画及び資金計画に照らし、Ｃの返済能力を超えない貸付けに係る契約であると認められるものは、貸金業法第13条の2第2項に規定する当該個人顧客の利益の保護に支障を生ずることがない契約として内閣府令で定めるものに該当する。","③":"個人事業者Ｄが5年前から継続して行っている事業から得た所得税法上の総収入金額は、貸金業法施行規則第10条の22に規定する年間の給与に類する定期的な収入の金額等に該当する。","④":"貸金業者Ａは、個人顧客Ｅとの間で、貸金業法施行規則第10条の21（個人過剰貸付契約から除かれる契約）第1項第1号に該当する不動産の建設に必要な資金の貸付けに係る契約を締結し、Ｅから当該契約に係る同条第2項第1号に該当する建設工事の請負契約書の写しの提出を受けた。この場合、Ａは、当該写し又はこれらに記載された情報の内容を記録した電磁的記録を当該契約に定められた最終の返済期日（当該契約に基づく債権が弁済その他の事由により消滅したときにあっては、当該債権の消滅した日）までの間保存しなければならない。"},"note":"","answer":3,"format":"single","negative":true},{"id":"R18-23","kai":18,"era":"令和5年度","num":23,"sectionShort":"法令","stem":"貸金業法第13条の2（過剰貸付け等の禁止）第2項に規定する個人顧客の利益の保護に支障を生ずることがない契約として貸金業法施行規則第10条の23で定めるもの（以下、本問において「例外契約」という。）に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"事業を営む個人顧客に対する貸付けに係る契約であって、実地調査、当該個人顧客の直近の確定申告書の確認その他の方法により当該事業の実態が確認されていること、又は当該個人顧客の事業計画、収支計画及び資金計画に照らし、当該個人顧客の返済能力を超えない貸付けに係る契約であると認められることのいずれかの要件を満たすものは、例外契約に該当する。","②":"預金保険法第2条第1項に規定する金融機関からの貸付け（以下、本問において「正規貸付け」という。）が行われるまでのつなぎとして行う貸付けに係る契約（極度方式基本契約を除く。）であって、正規貸付けが行われることが確実であると認められ、かつ、返済期間が1か月を超えないものは、例外契約に該当する。","③":"個人顧客が特定費用(注)を支払うために必要な資金の貸付けに係る契約（極度方式基本契約ではないものとする。）として当該個人顧客と貸金業者との間に締結される契約であって、当該契約が当該個人顧客の返済能力を超えない貸付けに係る契約であると認められ、当該契約の貸付けの金額が10万円であり（当該個人顧客は、当該契約以外の貸付けに係る契約を一切締結していないものとする。）、返済期間が1年であるものは、例外契約に該当しない。","④":"個人顧客が既に貸金業者以外の者と締結した契約に基づき負担している債務（以下、本問において「既存債務」という。）を弁済するために必要な資金の貸付けに係る契約であって、当該個人顧客が当該契約に基づき将来支払うべき返済金額の合計額が既存債務について将来支払うべき返済金額の合計額を上回らないが、当該契約の1か月の負担が既存債務に係る1か月の負担を上回るものは、例外契約に該当しない。"},"note":"(注) 特定費用とは、外国において緊急に必要となった費用のほか、社会通念上緊急に必要と認められる費用をいう。","answer":1,"format":"single","negative":true},{"id":"R18-24","kai":18,"era":"令和5年度","num":24,"sectionShort":"法令","stem":"貸金業法第15条（貸付条件の広告等）及び同法第16条（誇大広告の禁止等）に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"貸金業者は、貸付条件の広告等を行うに当たっては、貸付けに関し貸金業者が受け取る書面の内容を表示しなければならない。","②":"貸金業者向けの総合的な監督指針によれば、貸金業法第15条第2項に規定する「広告」とは、ある事項を随時又は継続して広く宣伝するため、一般の人に知らせることをいい、例えば、テレビコマーシャル、新聞紙への掲載、広告塔又は立て看板への表示、チラシ又はリーフレットの配布、インターネット上の表示はすべて広告に当たるとされている。","③":"貸金業者は、その貸金業の業務に関して広告又は勧誘をするときは、資金需要者等の返済能力を超える貸付けの防止に配慮するとともに、その広告又は勧誘が過度にわたることがないように努めなければならない。","④":"貸金業者は、貸付けの条件について広告をするとき、又は書面もしくはこれに代わる電磁的記録を送付して勧誘（広告に準ずるものとして内閣府令で定めるものに限る。）をするときは、営業所又は事務所の電話番号については、これに貸金業者登録簿に登録されたもの以外のものを表示し、又は記録してはならない。"},"note":"","answer":1,"format":"single","negative":true},{"id":"R18-25","kai":18,"era":"令和5年度","num":25,"sectionShort":"法令","stem":"特定公正証書に係る制限等に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"貸金業を営む者は、貸付けの契約について、債務者等から、当該債務者等が特定公正証書（債務者等が貸付けの契約に基づく債務の不履行の場合に直ちに強制執行に服する旨の陳述が記載された公正証書をいう。以下、本問において同じ。）の作成を公証人に嘱託することを代理人に委任することを証する書面を取得してはならない。","②":"貸金業を営む者は、貸付けの契約について、債務者等が特定公正証書の作成を公証人に嘱託することを代理人に委任する場合には、当該代理人の選任に関し推薦その他これに類する関与をしてはならない。","③":"貸金業者は、貸付けの契約について、特定公正証書の作成を公証人に嘱託した場合には、遅滞なく、内閣府令で定めるところにより、債務者等となるべき資金需要者等に対し、当該貸付けの契約に基づく債務の不履行の場合には、特定公正証書により、債務者等が直ちに強制執行に服することとなる旨及び債務者等の法律上の利益に与える影響に関する事項として内閣府令で定めるものについて書面を交付し、説明しなければならない。","④":"貸金業を営む者は、貸付けの契約について、公的給付(注1)がその受給権者である債務者等又は債務者等の親族その他の者（以下、本問において「特定受給権者」という。）の預金又は貯金の口座に払い込まれた場合に当該預金又は貯金の口座に係る資金から当該貸付けの契約に基づく債権の弁済を受けることを目的として、当該特定受給権者の預金通帳等(注2)の引渡しもしくは提供を求め、又はこれらを保管する行為をしてはならない。"},"note":"(注1) 公的給付とは、法令の規定に基づき国又は地方公共団体がその給付に要する費用又はその給付の事業に関する事務に要する費用の全部又は一部を負担し、又は補助することとされている給付（給与その他対価の性質を有するものを除く。）であって、法令の規定により譲り渡し、担保に供し、又は差し押さえることができないこととされているものをいう。(注2) 預金通帳等とは、当該預金もしくは貯金の口座に係る通帳もしくは引出用のカードもしくは当該預金もしくは貯金の引出しもしくは払込みに必要な情報その他当該預金もしくは貯金の引出しもしくは払込みに必要なものとして政令で定めるもの又は年金証書その他特定受給権者が公的給付を受給することができることを証する書面その他のものをいう。","answer":3,"format":"single","negative":true},{"id":"R18-26","kai":18,"era":"令和5年度","num":26,"sectionShort":"法令","stem":"貸金業者に対する監督等に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"貸金業者は、事業年度ごとに、内閣府令で定めるところにより、貸金業に係る事業報告書を作成し、毎事業年度経過後3か月以内に、これをその登録をした内閣総理大臣又は都道府県知事（以下、本問において「登録行政庁」という。）に提出しなければならない。","②":"登録行政庁は、貸金業法を施行するため必要があると認めるときは、その登録を受けた貸金業者に対して、その業務に関し報告又は資料の提出を命ずることができる。","③":"登録行政庁は、その登録を受けた貸金業者が貸金業法第12条の5（暴力団員等の使用の禁止）の規定に違反して、暴力団員等をその業務に従事させた場合、その登録を取り消し、又は当該貸金業者に対してその業務の停止を命ずることができる。","④":"登録行政庁は、その登録を受けた貸金業者が正当な理由がないのに当該登録を受けた日から6か月以内に貸金業を開始しない場合には、その登録を取り消すことができる。"},"note":"","answer":3,"format":"single","negative":true},{"id":"R18-27","kai":18,"era":"令和5年度","num":27,"sectionShort":"法令","stem":"ＡとＢとの間の複数の営業的金銭消費貸借契約（以下、本問において、「第一契約」、「第二契約」又は「第三契約」という。）に関する次の①～④の記述のうち、利息制限法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"Ａは、Ｂとの間で、元本を10万円とし利息を年1割8分（18％）とする営業的金銭消費貸借契約（第一契約）を締結し10万円をＢに貸し付けた。Ａは、Ｂが第一契約に基づく債務を完済した後に、Ｂとの間で元本を5万円とし利息を年2割（20％）とする営業的金銭消費貸借契約（第二契約）を締結し5万円をＢに貸し付けた。この場合、第二契約における利息の約定は、有効である。","②":"Ａは、Ｂとの間で、元本を20万円とし利息を年1割8分（18％）とする営業的金銭消費貸借契約（第一契約）を締結し20万円をＢに貸し付けると同時に、元本を80万円とし利息を年1割5分（15％）とする営業的金銭消費貸借契約（第二契約）を締結し80万円をＢに貸し付けた。この場合、第一契約における利息の約定は、年15％を超過する部分に限り無効となる。","③":"Ａは、Ｂとの間で、元本を60万円とし利息を年1割8分（18％）とする営業的金銭消費貸借契約（第一契約）を締結し60万円をＢに貸し付けた。Ａは、第一契約に基づく債務の元本残高が30万円である時点において、Ｂとの間で元本を80万円とし利息を年1割8分（18％）とする営業的金銭消費貸借契約（第二契約）を締結し80万円をＢに貸し付けた。この場合、第二契約における利息の約定は、年1割5分（15％）を超過する部分に限り無効となる。","④":"Ａは、Ｂとの間で、元本を50万円とし利息を年1割8分（18％）とする営業的金銭消費貸借契約（第一契約）を締結し50万円をＢに貸し付けた後、まだ、ＢがＡに対して第一契約に係る債務を一切弁済していない時点で、Ｂとの間で、元本を5万円とし利息を年2割（20％）とする営業的金銭消費貸借契約（第二契約）を締結しＢに5万円を貸し付けると同時に、元本を50万円とし利息を年1割8分（18％）とする営業的金銭消費貸借契約（第三契約）を締結しＢに50万円を貸し付けた。この場合、第二契約、第三契約における利息の約定のうち、第二契約における年1割8分（18％）を超過する部分の利息の約定に限り無効となる。"},"note":"","answer":4,"format":"single","negative":true},{"id":"R18-28","kai":18,"era":"令和5年度","num":28,"sectionShort":"貸付実務","stem":"意思能力及び行為能力に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"法律行為の当事者が意思表示をした時に意思能力を有しなかったときは、その法律行為は、取り消すことができる。","②":"未成年者は、権利を得る法律行為をする場合にはその法定代理人の同意を得なければならないが、義務を免れる法律行為をする場合にはその法定代理人の同意を得る必要はない。","③":"成年被後見人の法律行為（日用品の購入その他日常生活に関する行為を除く。）は、あらかじめ成年後見人の同意を得ていた場合であっても、取り消すことができる。","④":"被保佐人は、あらかじめ保佐人の同意を得なくても、金銭の借入れ及びその返済をすることができる。"},"note":"","answer":3,"format":"single","negative":false},{"id":"R18-29","kai":18,"era":"令和5年度","num":29,"sectionShort":"貸付実務","stem":"無効及び取消しに関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"無効な行為は、当事者がその行為の無効であることを知って追認をしたときは、初めから有効であったものとみなされる。","②":"行為能力の制限によって取り消すことができる行為について、制限行為能力者は、その法定代理人、保佐人又は補助人の同意を得なければ、その行為を取り消すことができない。","③":"取り消すことができる行為は、取り消されるまで有効であり、取り消されたときに、取り消された時から将来に向かって無効となる。","④":"錯誤、詐欺又は強迫によって取り消すことができる行為の追認は、取消しの原因となっていた状況が消滅し、かつ、取消権を有することを知った後にしなければ、その効力を生じない。"},"note":"","answer":4,"format":"single","negative":false},{"id":"R18-30","kai":18,"era":"令和5年度","num":30,"sectionShort":"貸付実務","stem":"時効に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"債権は、債権者が権利を行使することができることを知った時から10年間行使しないとき、又は権利を行使することができる時から20年間行使しないときは、時効によって消滅する。","②":"当事者は、あらかじめ時効の利益を放棄したときは、時効を援用することができない。","③":"時効の完成猶予又は更新は、完成猶予又は更新の事由が生じた当事者、その承継人及び当該時効の完成猶予又は更新により利害関係が生じるすべての者の間において、その効力を有する。","④":"確定判決又は確定判決と同一の効力を有するものによって確定した権利については、確定の時に弁済期の到来していない債権を除き、10年より短い時効期間の定めがあるものであっても、その時効期間は、10年とされる。"},"note":"","answer":4,"format":"single","negative":false},{"id":"R18-31","kai":18,"era":"令和5年度","num":31,"sectionShort":"貸付実務","stem":"債権の目的及び効力に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"債権の目的が特定物の引渡しであるときは、債務者は、その引渡しをするまで、契約その他の債権の発生原因及び取引上の社会通念に照らして定まる善良な管理者の注意をもって、その物を保存しなければならない。","②":"債務の不履行に対する損害賠償の請求は、これによって通常生ずべき損害の賠償をさせることをその目的とし、特別の事情によって生じた損害については、損害賠償の対象とならない。","③":"債権者は、債務者が金銭債務の履行をしない場合、その不履行が不可抗力によるものであるときを除き、これによって生じた損害の賠償を請求することができる。","④":"債権者と債務者との間で金銭債務の不履行について賠償額の予定をしなかったときは、債権者は、その債務不履行による損害賠償については、その損害額を証明しなければならない。"},"note":"","answer":1,"format":"single","negative":false},{"id":"R18-32","kai":18,"era":"令和5年度","num":32,"sectionShort":"貸付実務","stem":"ＡのＢに対する貸付金債権（以下、本問において「本件債権」という。）の譲渡に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"本件債権については、ＡとＢとの間で、第三者への譲渡を禁止する旨の特約がなされていたにもかかわらず、Ａは本件債権を第三者Ｃに譲渡した。この場合、本件債権の譲渡は無効であり、Ｃは、本件債権を取得することができない。","②":"Ａは、本件債権をＣに譲渡し、Ｃへの本件債権の譲渡についてＢに対し確定日付のある証書によらない通知をした。この場合、Ｃは、本件債権の譲渡をＢに対抗することができず、Ｂは、Ｃからの本件債権の弁済の請求を拒むことができる。","③":"Ａは、本件債権をＣとＤに二重に譲渡した。Ｂが、Ｃへの本件債権の譲渡について確定日付のある証書によらない承諾をした後、ＢからＣに本件債権の弁済がなされる前に、Ｄへの本件債権の譲渡について、Ａが確定日付のある証書による通知をし、当該通知がＢに到達した。この場合、Ｃは、本件債権の譲渡をＤに対抗することができず、Ｂは、Ｃからの本件債権の弁済の請求を拒むことができる。","④":"Ａは、本件債権をＣとＤに二重に譲渡し、そのいずれについても確定日付のある証書によりＢに通知をした。Ｄへの本件債権の譲渡についての通知は、Ｃへの本件債権の譲渡についての通知がＢに到達するより早くＢに到達したが、確定日付のある証書に付された日付は、Ｄへの譲渡についての日付よりＣへの譲渡についての日付の方が早い日付であった。この場合、債権が二重に譲渡された場合の優劣は確定日付の先後で決せられるので、Ｂは、Ｃからの本件債権の弁済の請求を拒むことができない。"},"note":"","answer":3,"format":"single","negative":false},{"id":"R18-33","kai":18,"era":"令和5年度","num":33,"sectionShort":"貸付実務","stem":"ＡのＢに対する金銭債権を「甲債権」とし、ＢのＡに対する金銭債権を「乙債権」とする。甲債権と乙債権の相殺に関する次の①～④の記述のうち、民法及び民事執行法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"Ａに対して金銭債権を有するＣの申立てにより甲債権が差押えを受けた。この場合、Ａは、甲債権と乙債権とを相殺することができる。","②":"乙債権の弁済期は到来しているが、甲債権の弁済期は到来していない。この場合、Ａは、甲債権と乙債権とを相殺することができない。","③":"Ａが甲債権を取得した後に、Ｂに対して金銭債権を有するＤの申立てにより乙債権が差押えを受けた。この場合、Ａは、甲債権と乙債権との相殺をもってＤに対抗することができない。","④":"甲債権及び乙債権が相殺適状となった後、甲債権が時効により消滅した。この場合、Ａは、甲債権と乙債権とを相殺することができない。"},"note":"","answer":2,"format":"single","negative":false},{"id":"R18-34","kai":18,"era":"令和5年度","num":34,"sectionShort":"貸付実務","stem":"貸主をＡとし借主をＢとする金銭消費貸借契約に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"Ａは、Ｂとの間で、書面でする金銭消費貸借契約を締結した。この場合、Ｂは、当該契約に基づきＡから借入金を受け取る前であれば、当該契約を解除することができる。","②":"Ａは、Ｂとの間の金銭消費貸借契約において、利息の約定をせずにＢに金銭を貸し付けた。この場合、Ａは、Ｂに対し法定利息を請求することができる。","③":"Ａは、Ｂとの間の金銭消費貸借契約において、貸付金を10回の分割で返済する旨の約定をしてＢに金銭を貸し付けた。この場合において、Ｂが各回の借入金債務について、そのうちの1回でも債務の履行を遅滞したときは、Ａは、Ｂに対し、残債務全部の一括弁済を請求することができる。","④":"Ａは、利息を定めてＢとの間で金銭消費貸借契約を締結したが、Ｂは利息の支払を1年以上延滞し、Ａが催告をしてもＢはその利息を支払わなかった。この場合であっても、Ａは、利息を元本に組み入れることはできない。"},"note":"","answer":1,"format":"single","negative":false},{"id":"R18-35","kai":18,"era":"令和5年度","num":35,"sectionShort":"貸付実務","stem":"犯罪による収益の移転防止に関する法律についての次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"貸金業者が、自然人である顧客の取引時確認として確認しなければならない事項は、氏名、住居、生年月日、職業及び収入である。","②":"貸金業者が、自然人である顧客の取引時確認として本人特定事項の確認をするために、当該顧客の運転免許証の提示を受ける場合には貸金業者が当該運転免許証の提示を受ける日において有効なもの、また住民票の写しの提示を受ける場合には貸金業者が当該住民票の写しの提示を受ける日前6か月以内に作成されたものに限られる。","③":"貸金業者が、自然人である顧客の取引時確認として本人特定事項の確認をするために運転免許証の提示を受ける場合、その原本ではなく写しの提示を受けることも認められている。","④":"貸金業者が、既に取引をしたことのある顧客との間で金銭の貸付けを内容とする契約を締結する場合、過去の取引において取引時確認を行っているときであっても、契約を締結する都度、当該顧客の取引時確認をしなければならない。"},"note":"","answer":2,"format":"single","negative":false},{"id":"R18-36","kai":18,"era":"令和5年度","num":36,"sectionShort":"貸付実務","stem":"意思表示に関する次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"Ａは、Ｂに甲建物を売却するつもりがないのに、Ｂと通謀して、甲建物をＢに売却する旨の虚偽の売買契約を締結し、ＡからＢへの甲建物の所有権移転登記を経た。この場合において、ＡとＢが通謀して虚偽の売買契約を締結した事情を知らない第三者ＣがＢから甲建物を買い受けたときは、Ａは、AB間の契約は虚偽表示により無効である旨をＣに対抗することができない。","②":"Ａは、Ｂが所有する甲土地の近隣に鉄道の駅が新設される計画を知り、Ｂとの間で、甲土地を購入する旨の売買契約を締結した。しかし、当該駅新設の計画は、当該売買契約の締結前に既に中止となっていたが、Ａはそれを知らなかった。この場合において、Ａは、当該駅新設が甲土地を購入する動機である旨をＢに表示していなかったときは、Ｂに対し、当該売買契約を錯誤により取り消すことができない。","③":"Ａは、Ｂの詐欺により、Ｂとの間でＢに甲絵画を売却する旨の売買契約を締結し、Ｂに甲絵画を引き渡した後、Ｂは、詐欺の事情を知らず、知らないことに過失のない第三者Ｃに甲絵画を売却した。その後、Ａは、詐欺による意思表示を理由としてAB間の売買契約を取り消した場合、その取消しをＣに対抗することができない。","④":"Ａは、Ｂの強迫により、Ｂとの間でＢに甲土地を売却する旨の売買契約を締結し、ＡからＢへの甲土地の所有権移転登記を経た後、Ｂは、強迫の事情を知らず、知らないことに過失のない第三者Ｃに甲土地を売却した。その後、Ａは、強迫による意思表示を理由としてAB間の売買契約を取り消した場合、その取消しをＣに対抗することができない。"},"note":"","answer":4,"format":"single","negative":true},{"id":"R18-37","kai":18,"era":"令和5年度","num":37,"sectionShort":"貸付実務","stem":"期間の計算に関する次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"10月1日午前10時30分から6時間という期間を定めた場合、その期間は、即時から起算されるので、午後4時30分をもって満了する。","②":"ある事実を知った日から2週間以内に届け出ることが法令により義務付けられている場合において、当該事実を10月1日午前10時に知ったときは、当該事実の届出の期限は10月15日となる。","③":"期間の末日が日曜日、国民の祝日に関する法律に規定する休日その他の休日に当たるときは、期間は、その前日に満了する。","④":"10月31日午前0時から1か月という期間を定めた場合、その期間は、11月においてその起算日に応当する31日はないので、11月30日をもって満了する。"},"note":"","answer":3,"format":"single","negative":true},{"id":"R18-38","kai":18,"era":"令和5年度","num":38,"sectionShort":"貸付実務","stem":"質権及び抵当権に関する次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"債権を目的とする質権の設定は、第三債務者への質権の設定の通知又は第三債務者の承諾がなければ、第三債務者に対抗することができない。","②":"貸金債権を被担保債権として売買代金債権に質権を設定した場合、質権者は、売買代金債権の額が貸金債権の額を超えていても、売買代金債権の全部を直接に取り立てることができる。","③":"根抵当権者は、確定した元本並びに利息その他の定期金及び債務の不履行によって生じた損害の賠償の全部について、極度額を限度として、その根抵当権を行使することができる。","④":"根抵当権の被担保債権の元本の確定前においては、後順位の抵当権者その他の第三者の承諾を得ることなく、根抵当権の担保すべき債権の範囲の変更をすることができる。"},"note":"","answer":2,"format":"single","negative":true},{"id":"R18-39","kai":18,"era":"令和5年度","num":39,"sectionShort":"貸付実務","stem":"保証に関する次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"保証人の負担が債務の目的又は態様において主たる債務より重いときは、主たる債務の限度に減縮されるため、保証人は、その保証債務についてのみ、違約金又は損害賠償の額を約定することはできない。","②":"保証人は、主たる債務者と連帯して債務を負担したときは、民法第452条（催告の抗弁）及び同第453条（検索の抗弁）のいずれの権利も有しない。","③":"行為能力の制限によって取り消すことができる債務を保証した者は、保証契約の時にその取消しの原因を知っていた場合において、主たる債務が不履行となり又はその債務が取り消されたときは、これと同一の目的を有する独立の債務を負担したものと推定される。","④":"債務者が保証人を立てる義務を負う場合には、債権者が保証人を指名したときを除き、その保証人は、行為能力者であること及び弁済する資力を有することのいずれの要件も具備する者でなければならない。"},"note":"","answer":1,"format":"single","negative":true},{"id":"R18-40","kai":18,"era":"令和5年度","num":40,"sectionShort":"貸付実務","stem":"Ａは、配偶者Ｂ、子Ｃ及びＤ、並びにＤの子でありＡの孫であるＥを遺して死亡した。この場合の相続に関する次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"Ｂ、Ｃ及びＤが単純承認した場合は、Ｃ及びＤの法定相続分はそれぞれ4分の1である。","②":"Ａは、遺言で、共同相続人Ｂ、Ｃ及びＤの相続分について法定相続分と異なる相続分を指定していた場合であっても、Ａの債権者は、Ｂ、Ｃ及びＤに対し、その法定相続分に応じてその権利を行使することができる。","③":"Ｂは、相続財産の一部を費消したときは、単純承認をしたものとみなされる。","④":"Ｄが相続放棄をしたときは、Ｂ、Ｃ及びＥが共同相続人となる。"},"note":"","answer":4,"format":"single","negative":true},{"id":"R18-41","kai":18,"era":"令和5年度","num":41,"sectionShort":"貸付実務","stem":"手形法及び電子記録債権法に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"詐欺によって振り出された約束手形を裏書により譲り受けた所持人は、当該事情を知らず、かつ知らないことにつき過失がなかった。この場合、当該約束手形の振出人は、当該所持人から手形金の支払を請求されたときは、詐欺を理由とする手形行為取消しの抗弁をもって、当該所持人に対抗することができる。","②":"裏書が連続している約束手形の所持人は、正当な権利者と推定されるため、正当な権利者であることを証明しなくても手形上の債務者に対し手形金の支払を求めることができる。","③":"電子記録債権は、保証記録に係るもの及び電子記録保証をした者が電子記録債権法第35条第1項の規定により取得する特別求償権を除き、発生記録をすることによって生ずる。","④":"電子記録名義人に対してした電子記録債権についての支払は、その支払をした者に悪意又は重大な過失がない限り、当該電子記録名義人がその支払を受ける権利を有しない場合であっても、その効力を有する。"},"note":"","answer":1,"format":"single","negative":true},{"id":"R18-42","kai":18,"era":"令和5年度","num":42,"sectionShort":"貸付実務","stem":"民事訴訟法に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"当事者は、訴えについて法令に専属管轄の定めがある場合を除き、第一審に限り、合意により管轄裁判所を定めることができる。","②":"地方裁判所における訴えの提起は、訴状を裁判所に提出してしなければならないが、簡易裁判所においては、訴えは口頭で提起することができる。","③":"商業登記簿に支配人として登記された支配人は、民事訴訟における訴訟代理人となることができる。","④":"地方裁判所に提起された民事訴訟において、当事者は、口頭弁論の続行の期日に裁判所に出頭しなかったとしても、準備書面を裁判所に提出している場合には、口頭弁論において当該準備書面に記載した事項を陳述したものとみなされる。"},"note":"","answer":4,"format":"single","negative":true},{"id":"R18-43","kai":18,"era":"令和5年度","num":43,"sectionShort":"資金需要者保護","stem":"個人情報の保護に関する法律についての次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"取得時に生存する特定の個人を識別することができなかった情報は、取得後に新たな情報が付加され、又は照合された結果、生存する特定の個人を識別できるに至っても、個人情報に該当しない。","②":"個人データとは、氏名、生年月日など複数の情報を含む個人情報の集合体をいい、個人情報データベース等を構成するものに限られない。","③":"特定の個人の身体の一部の特徴を電子計算機の用に供するために変換した文字、番号、記号その他の符号であって、当該特定の個人を識別することができるもののうち、政令で定めるものは、個人識別符号に該当し、生存する個人に関する情報であって、個人識別符号が含まれるものは個人情報となる。","④":"個人関連情報とは、生存する個人に関する情報であって、個人情報、仮名加工情報及び匿名加工情報のいずれかに該当するものをいう。"},"note":"","answer":3,"format":"single","negative":false},{"id":"R18-44","kai":18,"era":"令和5年度","num":44,"sectionShort":"資金需要者保護","stem":"消費者契約法に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"適格消費者団体は、事業者が、消費者契約の締結について勧誘をするに際し、不特定かつ多数の消費者に対して重要事項について事実と異なることを告げる行為を現に行い又は行うおそれがあるときは、その事業者に対し、当該行為の停止もしくは予防又は当該行為に供した物の廃棄もしくは除去その他の当該行為の停止もしくは予防に必要な措置をとることを請求することができる。","②":"事業者が消費者契約の締結について勧誘をするに際し、当該事業者に対し、消費者が、その住居又はその業務を行っている場所から退去すべき旨の意思を示したにもかかわらず、当該事業者がそれらの場所から退去しないことにより困惑し、それによって当該消費者契約の申込み又はその承諾の意思表示をしたときは、当該消費者契約は、無効となる。","③":"消費者契約において、消費者の不作為をもって当該消費者が新たな消費者契約の申込み又はその承諾の意思表示をしたものとみなす条項その他の法令中の公の秩序に関しない規定の適用による場合に比して消費者の権利を制限し又は消費者の義務を加重する消費者契約の条項であって、民法第1条第2項に規定する基本原則に反して消費者の利益を一方的に害するものが含まれている場合、当該消費者は、当該消費者契約を取り消すことができる。","④":"消費者契約法に基づき消費者に認められる取消権は、追認をすることができる時から6か月間行わないときは、時効によって消滅する。当該消費者契約の締結の時から5年を経過したときも、同様とする。"},"note":"","answer":1,"format":"single","negative":false},{"id":"R18-45","kai":18,"era":"令和5年度","num":45,"sectionShort":"資金需要者保護","stem":"個人情報の保護に関する法律（以下、本問において「法」という。）についての次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"本人(注)は、個人情報取扱事業者に対し、当該本人が識別される保有個人データの電磁的記録の提供による方法その他の個人情報保護委員会規則で定める方法による開示を請求することができる。","②":"本人は、個人情報取扱事業者に対し、当該本人が識別される保有個人データの内容が事実でないときは、当該保有個人データの内容の訂正、追加又は削除を請求することができる。","③":"本人が、個人情報取扱事業者に対し、当該本人が識別される保有個人データについて利用の停止又は消去（以下、本問において「利用停止等」という。）を請求することができるのは、当該保有個人データが法第18条（利用目的による制限）もしくは法第19条（不適正な利用の禁止）の規定に違反して取り扱われているとき、又は法第20条（適正な取得）の規定に違反して取得されたものであるときに限られる。","④":"個人情報取扱事業者は、法第35条（利用停止等）第1項又は第5項の規定による請求に係る保有個人データの全部又は一部について利用停止等を行ったとき又は利用停止等を行わない旨の決定をしたときは、本人に対し、遅滞なく、その旨を通知しなければならない。"},"note":"(注) 本人とは、個人情報によって識別される特定の個人をいう。","answer":3,"format":"single","negative":true},{"id":"R18-46","kai":18,"era":"令和5年度","num":46,"sectionShort":"資金需要者保護","stem":"次の①～④の記述のうち、不当景品類及び不当表示防止法（以下、本問において「景品表示法」という。）上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"事業者が、商品の価格その他の取引条件について、実際のものよりも取引の相手方に著しく有利であると一般消費者に誤認される表示（有利誤認表示）をしたおそれがある場合、内閣総理大臣は、当該事業者に対して、期間を定めて、当該表示の裏付けとなる合理的な根拠を示す資料の提出を求めることができ、当該資料の提出を求めたにもかかわらず、当該事業者がその期間内に当該資料を提出しないときは、当該表示は、景品表示法第5条（不当な表示の禁止）第2号に規定する、不当な表示とみなされる。","②":"内閣総理大臣は、景品表示法第4条（景品類の制限及び禁止）の規定による制限もしくは禁止もしくは第5条第3号の規定による指定をし、又はこれらの変更もしくは廃止をしようとするときは、内閣府令で定めるところにより、公聴会を開き、関係事業者及び一般の意見を求めるとともに、消費者委員会の意見を聴かなければならない。","③":"表示とは、顧客を誘引するための手段として、事業者が自己の供給する商品又は役務の内容又は取引条件その他これらの取引に関する事項について行う広告その他の表示であって、内閣総理大臣が指定するものをいう。","④":"景品類とは、顧客を誘引するための手段として、その方法が直接的であるか間接的であるかを問わず、くじの方法によるかどうかを問わず、事業者が自己の供給する商品又は役務の取引（不動産に関する取引を含む。）に付随して相手方に提供する物品、金銭その他の経済上の利益であって、内閣総理大臣が指定するものをいう。"},"note":"","answer":1,"format":"single","negative":true},{"id":"R18-47","kai":18,"era":"令和5年度","num":47,"sectionShort":"資金需要者保護","stem":"日本貸金業協会が定める紛争解決等業務に関する規則についての次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"貸金業務関連紛争とは、貸金業務等関連苦情のうち、当該苦情の相手方である貸金業者と当該苦情に係る契約者等の自主的な交渉では解決ができないものであって、当事者が和解をすることができるものをいう。","②":"紛争解決手続開始の申立ては、加入貸金業者との間で貸金業務関連紛争のある契約者等のみが行うことができ、加入貸金業者から行うことはできない。","③":"紛争解決手続において、当事者双方が紛争解決委員の和解案を受諾したときには、その時点で当該和解案の内容で和解が成立したものとされる。","④":"当事者である協会員等は、紛争解決委員から特別調停案の提示を受けた場合において、当該特別調停案の受諾を拒むときには、拒否の事由を明らかにして書面により行わなければならない。"},"note":"","answer":2,"format":"single","negative":true},{"id":"R18-48","kai":18,"era":"令和5年度","num":48,"sectionShort":"財務会計","stem":"企業会計原則（大蔵省企業会計審議会発表）の一般原則に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"株主総会提出のため、信用目的のため、租税目的のため等、種々の目的のために異なる形式の財務諸表を作成してはならない。これを一般に単一性の原則という。","②":"自己資本と他人資本とを明確に区別し、純資産と負債とを混同してはならない。これを一般に総資本区分の原則という。","③":"企業会計は、その処理の原則及び手続を毎期継続して適用し、みだりにこれを変更してはならない。これを一般に継続性の原則という。","④":"企業の財政状態に影響を及ぼす多額の取引については、その取引の内容をできる限り詳細かつ正確に注記しなければならない。これを一般に正確性の原則という。"},"note":"","answer":3,"format":"single","negative":false},{"id":"R18-49","kai":18,"era":"令和5年度","num":49,"sectionShort":"財務会計","stem":"財務諸表等の用語、様式及び作成方法に関する規則に規定する損益計算書に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"売上高から売上原価を控除した額（売上原価が売上高をこえる場合は、売上原価から売上高を控除した額）は、営業利益金額又は営業損失金額として表示しなければならない。","②":"売上総利益金額から販売費及び一般管理費の合計額を控除した額（販売費及び一般管理費の合計額が売上総利益金額をこえる場合は、販売費及び一般管理費の合計額から売上総利益金額を控除した額）を経常利益金額もしくは経常損失金額として表示し、又は売上総損失金額に販売費及び一般管理費の合計額を加えた額を経常損失金額として表示しなければならない。","③":"営業利益金額又は営業損失金額に、営業外収益の金額を加減し、次に営業外費用の金額を加減した額を、営業外利益金額又は営業外損失金額として表示しなければならない。","④":"経常利益金額又は経常損失金額に特別利益の金額を加減し、次に特別損失の金額を加減した額を、税引前当期純利益金額又は税引前当期純損失金額として表示しなければならない。"},"note":"","answer":4,"format":"single","negative":false},{"id":"R18-50","kai":18,"era":"令和5年度","num":50,"sectionShort":"財務会計","stem":"財務諸表等の用語、様式及び作成方法に関する規則に規定するキャッシュ・フロー計算書に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"売上債権、棚卸資産、仕入債務により生じた資産及び負債の増加額又は減少額は、営業活動によるキャッシュ・フローの区分に掲記される。","②":"社債の発行による収入、社債の償還による支出、株式の発行による収入は、投資活動によるキャッシュ・フローの区分に掲記される。","③":"有形固定資産の取得による支出、有形固定資産の売却による収入は、投資活動によるキャッシュ・フローの区分に掲記される。","④":"長期借入れによる収入、長期借入金の返済による支出は、財務活動によるキャッシュ・フローの区分に掲記される。"},"note":"","answer":2,"format":"single","negative":true},{"id":"R19-01","kai":19,"era":"令和6年度","num":1,"sectionShort":"法令","stem":"貸金業法上の用語の定義等に関する次のａ～ｄの記述のうち、その内容が適切なものの個数を①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"貸金業とは、金銭の貸付け又は金銭の貸借の媒介（手形の割引、売渡担保その他これらに類する方法によってする金銭の交付又は当該方法によってする金銭の授受の媒介を含む。）で業として行うものをいい、これには事業者がその従業者に対して行うものも含まれる。","ｂ":"貸付けの契約とは、貸付けに係る契約又は当該契約に係る保証契約をいう。","ｃ":"債務者等とは、資金需要者である顧客、債務者又は債務者であった者をいう。","ｄ":"個人信用情報とは、資金需要者である顧客又は債務者の借入金の返済能力に関する情報をいう。"},"options":{"①":"1個","②":"2個","③":"3個","④":"4個"},"note":"","answer":1,"format":"count","negative":false},{"id":"R19-02","kai":19,"era":"令和6年度","num":2,"sectionShort":"法令","stem":"次のａ～ｄの記述のうち、貸金業法第6条第1項各号のいずれかに該当する場合として貸金業の登録を拒否されるものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。なお、本問における法人は、非営利特例対象法人及び特定非営利金融法人ではないものとする。","statements":{"ａ":"個人である申請者が貸付けの業務に3年以上従事した経験を有しない者である場合","ｂ":"営業所又は事務所ごとに貸付けの業務に1年以上従事した者が常勤の役員又は使用人として1人しか在籍していない場合","ｃ":"資金需要者等の利益の保護を図り、貸金業の適正な運営に資するため十分な社内規則を定めていない場合","ｄ":"法人である申請者で、最終事業年度に係る貸借対照表又はこれに代わる書面（最終事業年度がない場合にあっては、当該法人の成立の時に作成する貸借対照表又はこれに代わる書面）において、純資産の部の合計額として表示された金額が1億円である場合"},"options":{"①":"ａｂ","②":"ａｃ","③":"ｂｄ","④":"ｃｄ"},"note":"","answer":2,"format":"combo","negative":false},{"id":"R19-03","kai":19,"era":"令和6年度","num":3,"sectionShort":"法令","stem":"貸金業法第8条（変更の届出）に関する次のａ～ｄの記述のうち、その内容が適切なものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"貸金業者は、その貸金業を営む営業所又は事務所（以下、本問において「営業所等」という。）の所在地を変更しようとする場合、あらかじめ、その旨をその登録をした内閣総理大臣又は都道府県知事（以下、本問において「登録行政庁」という。）に届け出なければならない。","ｂ":"貸金業者は、その業務に関して広告又は勧誘をする際に表示等をする営業所等のホームページアドレスを変更した場合、その日から2週間以内に、その旨を登録行政庁に届け出なければならない。","ｃ":"貸金業者は、その業務の種類及び方法を変更しようとする場合、あらかじめ、その旨を登録行政庁に届け出なければならない。","ｄ":"貸金業者は、貸金業の他に事業を行っている場合において、その事業の種類を変更したときは、その日から2週間以内に、その旨を登録行政庁に届け出なければならない。"},"options":{"①":"ａｂ","②":"ａｄ","③":"ｂｃ","④":"ｃｄ"},"note":"","answer":2,"format":"combo","negative":false},{"id":"R19-04","kai":19,"era":"令和6年度","num":4,"sectionShort":"法令","stem":"貸金業の業務の適切な運営の確保に関する次のａ～ｄの記述のうち、その内容が適切なものの個数を①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"貸金業者は、信用情報に関する機関（資金需要者等の借入金返済能力に関する情報の収集及び貸金業者に対する当該情報の提供を行うものをいう。）から提供を受けた情報であって個人である資金需要者等の借入金返済能力に関するものを、資金需要者等の返済能力の調査以外の目的のために利用しないことを確保するための措置を講じなければならない。","ｂ":"貸金業者は、貸金業の業務を第三者に委託する場合には、当該業務の内容に応じ、当該業務の委託を受けた者（以下、本問において「受託者」という。）における当該業務の実施状況を、定期的に又は必要に応じて確認すること等により、受託者が当該業務を的確に遂行しているかを検証し、必要に応じ改善させる等、受託者に対する必要かつ適切な監督等を行うための措置を講じなければならない。","ｃ":"貸金業者向けの総合的な監督指針（以下、本問において「監督指針」という。）によれば、監督当局は、貸金業者の監督に当たっては、コンプライアンスに係る基本的な方針、具体的な実践計画（コンプライアンス・プログラム）や行動規範（倫理規程、コンプライアンス・マニュアル）等が策定され、定期的又は必要に応じ、見直しが行われているか、特に、業績評価や人事考課等において収益目標（ノルマ）に偏重することなく、コンプライアンスを重視しているかに留意するものとされている。","ｄ":"監督指針によれば、監督当局は、貸金業者の監督に当たっては、顧客等に関する情報管理について、内部管理部門における定期的な点検や内部監査部門による内部監査を通じ、その実施状況を把握・検証しているか、また、当該検証等の結果に基づき、態勢の見直しを行うなど、顧客等に関する情報管理の実効性が確保されているかに留意するものとされている。"},"options":{"①":"1個","②":"2個","③":"3個","④":"4個"},"note":"","answer":4,"format":"count","negative":false},{"id":"R19-05","kai":19,"era":"令和6年度","num":5,"sectionShort":"法令","stem":"貸金業者の苦情等対処に関する内部管理態勢の確立に関するａ～ｄの記述のうち、その内容が適切なものの個数を①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"貸金業者向けの総合的な監督指針（以下、本問において「監督指針」という。）では、苦情等の発生状況に応じ、受付窓口における対応の充実を図るとともに、資金需要者等の利便に配慮したアクセス時間・アクセス手段（例えば、電話、手紙、FAX、ｅメール等）を設定する等、広く苦情等を受け付ける態勢を整備しているかに留意するものとされている。","ｂ":"監督指針では、苦情等への対処について、単に処理の手続の問題と捉えるにとどまらず事後的な説明態勢の問題として位置付け、苦情等の内容に応じ資金需要者等から事情を十分にヒアリングしつつ、可能な限り資金需要者等の理解と納得を得て解決することを目指しているかに留意するものとされている。","ｃ":"監督指針では、類型化した苦情等及びその対処結果等が内部管理部門や営業所等に報告されると共に、重要案件と認められない軽微な案件であっても、すべて、直ちに内部監査部門や経営陣に報告されるなど、情報共有が図られる態勢を整備しているかに留意するものとされている。","ｄ":"監督指針では、苦情等の内容及び対処結果について、自ら対処したものに加え、外部機関が介在して対処したものを含め、適切かつ正確に記録・保存しているか、また、これらの苦情等の内容及び対処結果について、指定ADR機関より提供された情報等も活用しつつ、分析し、その分析結果を継続的に資金需要者等対応・事務処理についての態勢の改善や苦情等の再発防止策・未然防止策に活用する態勢を整備しているかに留意するものとされている。"},"options":{"①":"1個","②":"2個","③":"3個","④":"4個"},"note":"","answer":3,"format":"count","negative":false},{"id":"R19-06","kai":19,"era":"令和6年度","num":6,"sectionShort":"法令","stem":"貸金業務取扱主任者及び貸金業法第12条の4（証明書の携帯等）第2項に規定する従業者名簿（以下、本問において「従業者名簿」という。）に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"貸金業者向けの総合的な監督指針（以下、本問において「監督指針」という。）によれば、貸金業務取扱主任者が営業所又は事務所（以下、本問において「営業所等」という。）に常時勤務する者と認められるには、社会通念に照らし、常時勤務していると認められるだけの実態が必要であり、当該営業所等の営業時間内に当該営業所等に常時駐在している必要があるとされている。","②":"貸金業者は、その営業所等のうち従業者の数が80人である営業所等において、貸金業の業務に従事している従業者の数が50人である場合、当該営業所等に常時勤務する貸金業務取扱主任者を少なくとも2人以上置かなければならない。","③":"監督指針によれば、従業者が従業者名簿の記載対象となるか否かについて、勧誘を伴わない広告のみを行う業務及び営業所等において資金需要者等と対面することなく行う業務に従事する者は、該当しないとされている。","④":"貸金業者は、内閣府令で定めるところにより、営業所等ごとに、従業者名簿を備え、従業者の氏名、住所、貸金業法第12条の4第1項の証明書の番号その他内閣府令で定める事項を記載し、これを最終の記載をした日から10年間保存しなければならない。"},"note":"","answer":4,"format":"single","negative":false},{"id":"R19-07","kai":19,"era":"令和6年度","num":7,"sectionShort":"法令","stem":"貸金業法上の禁止行為等に関する次のａ～ｄの記述のうち、その内容が適切なものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"貸金業者は、その貸金業の業務に関し、保証人となろうとする者に対し、主たる債務者が弁済することが確実であると誤解させるおそれのあることを告げる行為をした場合、刑事罰の対象とはならないが、行政処分の対象となる。","ｂ":"貸金業者は、暴力団員による不当な行為の防止等に関する法律第2条第6号に規定する暴力団員でなくなった日から5年を経過しない者を貸金業の業務に従事させ、又はその業務の補助者として使用した場合、行政処分の対象となるだけでなく、刑事罰の対象となる。","ｃ":"貸金業者は、その貸金業の業務に関し、資金需要者等に対し、不確実な事項について断定的判断を提供し、又は確実であると誤認させるおそれのあることを告げる行為をした場合、行政処分の対象となるだけでなく、刑事罰の対象となる。","ｄ":"貸金業者は、その従業者であることを証する証明書を携帯させることなく、その者を当該貸金業者の貸金業の業務に従事させた場合、刑事罰の対象とはならないが、行政処分の対象となる。"},"options":{"①":"ａｂ","②":"ａｄ","③":"ｂｃ","④":"ｃｄ"},"note":"","answer":1,"format":"combo","negative":false},{"id":"R19-08","kai":19,"era":"令和6年度","num":8,"sectionShort":"法令","stem":"株式会社である貸金業者Ａが行う貸金業法第13条に規定する返済能力の調査に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"Ａは、個人事業者である顧客Ｂとの間で、貸付けに係る契約を締結しようとする場合には、指定信用情報機関が保有する信用情報を使用してのＢの返済能力の調査を行う必要はない。","②":"Ａは、法人である顧客Ｂとの間で貸付けに係る契約を締結するにあたり、Ｂの代表者であるＣとの間で保証契約を締結しようとする場合には、指定信用情報機関が保有する信用情報を使用してのＣの返済能力の調査を行う必要はない。","③":"Ａは、個人である顧客Ｂとの間で、極度額を50万円とする極度方式基本契約を締結した後、Ｂに返済能力の低下が認められたことを理由に極度額を20万円に減額した。この場合において、極度額をその減額の前の50万円まで増額しようとするときには、Ａは、指定信用情報機関が保有する信用情報を使用してのＢの返済能力の調査を行う必要はない。","④":"Ａは、個人である顧客Ｂとの間で、極度方式貸付けに係る契約を締結しようとする場合には、指定信用情報機関が保有する信用情報を使用してのＢの返済能力の調査を行う必要はない。"},"note":"","answer":4,"format":"single","negative":false},{"id":"R19-09","kai":19,"era":"令和6年度","num":9,"sectionShort":"法令","stem":"貸金業法第13条の2（過剰貸付け等の禁止）第2項に規定する個人過剰貸付契約から除かれる契約として貸金業法施行規則第10条の21に定める契約（以下、本問において「除外契約」という。）に関する次のａ～ｄの記述のうち、その内容が適切なものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"他の貸金業者からの住宅の改良に必要な資金の貸付けが行われるまでのつなぎとして行う貸付けに係る契約は、除外契約に該当しない。","ｂ":"国債証券、地方債証券、株券で金融商品取引所に上場されているもの（以下、本問において「本件有価証券」という。）を担保とする貸付けに係る契約であって、貸付けの金額が当該貸付けに係る契約の締結時における本件有価証券の時価の範囲内であるものは、除外契約に該当する。","ｃ":"個人顧客との間で締結する不動産を担保とする貸付けに係る契約であって、当該不動産を担保として提供する者が当該個人顧客でないものは、当該個人顧客の返済能力を超えないと認められるものであっても、除外契約に該当しない。","ｄ":"売却を予定している個人顧客の不動産の売却代金により弁済される貸付けに係る契約であって、当該個人顧客の返済能力を超えないと認められるもの（貸付けの金額が当該貸付けに係る契約の締結時における当該不動産の価格の範囲内であるものに限り、当該不動産を売却することにより当該個人顧客の生活に支障を来すと認められる場合を除く。）は、除外契約に該当する。"},"options":{"①":"ａｂ","②":"ａｃ","③":"ｂｄ","④":"ｃｄ"},"note":"","answer":3,"format":"combo","negative":false},{"id":"R19-10","kai":19,"era":"令和6年度","num":10,"sectionShort":"法令","stem":"株式会社である貸金業者Ａが、貸金業法第13条の3に基づき、個人顧客Ｂとの間で締結している極度方式基本契約（以下、本問において「本件基本契約」という。）について行う、本件基本契約が基準額超過極度方式基本契約に該当するかどうかの調査（以下、本問において「本件調査」という。）等に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。なお、Ａは、Ｂとの間で本件基本契約以外の極度方式基本契約を締結していないものとする。","statements":{},"options":{"①":"Ａは、本件基本契約の契約期間を本件基本契約の締結日から同日以後1か月以内の一定の期日までの期間及び当該一定の期日の翌日以後1か月ごとの期間に区分したそれぞれの期間（以下、本問において「所定の期間」という。）において、直近の所定の期間内にＡが行った本件基本契約に基づく極度方式貸付けの金額の合計額が5万円を超えるときは、当該所定の期間の末日における本件基本契約に基づく極度方式貸付けの残高の合計額の多寡にかかわらず、本件調査を行わなければならない。","②":"Ａは、貸金業法施行規則第10条の24（基準額超過極度方式基本契約に係る調査の要件等）第1項第1号に規定する要件に該当し、本件調査を行う必要がある場合には、所定の期間の末日から3週間を経過する日までに、指定信用情報機関にＢの個人信用情報の提供の依頼をしなければならない。","③":"Ａは、本件基本契約が基準額超過極度方式基本契約に該当しないようにするため必要な本件基本契約の極度額の減額に係る措置を講じた場合、それ以降、3か月以内の一定の期間ごとに、本件調査を行う必要はない。","④":"Ａは、本件調査により、本件基本契約が基準額超過極度方式基本契約に該当すると認められたことから、本件基本契約に基づく新たな極度方式貸付けの停止に係る措置を講じていた場合において、当該措置を解除したときは、その日から1か月以内に本件調査を行わなければならない。"},"note":"","answer":2,"format":"single","negative":false},{"id":"R19-11","kai":19,"era":"令和6年度","num":11,"sectionShort":"法令","stem":"貸金業法第17条に規定する書面（以下、本問において「契約締結時の書面」という。）に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。なお、本問における極度方式基本契約（以下、本問において「基本契約」という。）及び基本契約に基づく極度方式貸付けに係る契約（以下、本問において「個別契約」という。）は、金銭の貸付けに係る契約であって、手形の割引の契約及び売渡担保の契約ではないものとする。","statements":{},"options":{"①":"貸金業者は、基本契約を締結した場合にその相手方に交付する契約締結時の書面に、当該貸金業者が基本契約に定める極度額（当該貸金業者が当該相手方に対し貸付けの元本の残高の上限として極度額を下回る額を提示する場合にあっては、当該下回る額）を1回貸し付けることその他の必要な仮定を置き、当該仮定に基づいた将来支払う返済金額の合計額、返済期間及び返済回数並びに当該仮定を記載しなければならない。","②":"貸金業者が個別契約を締結した場合にその相手方に交付する契約締結時の書面の記載事項のうち、貸付けの利率等基本契約締結時に交付した契約締結時の書面に記載された事項については、基本契約の契約番号の記載をもって代えることができる。","③":"貸金業者は、個別契約を締結した場合において、その相手方に対し、当該相手方の承諾を得て、内閣府令で定めるところにより、一定期間における貸付け及び弁済その他の取引の状況を記載した書面として内閣府令で定めるものを交付するときは、個別契約を締結するごとに、遅滞なく、契約年月日及び貸付けの金額等を記載した書面を当該相手方に交付する必要はない。","④":"貸金業者は、基本契約を締結した後、その相手方との合意に基づき、当該基本契約の極度額を引き下げた場合、変更後の内容を記載した契約締結時の書面を当該相手方に交付する必要はないが、その後当該基本契約の極度額を引き下げる前の元の額まで引き上げる場合は、変更後の内容を記載した契約締結時の書面を当該相手方に交付しなければならない。"},"note":"","answer":1,"format":"single","negative":false},{"id":"R19-12","kai":19,"era":"令和6年度","num":12,"sectionShort":"法令","stem":"貸金業法第17条第1項各号に掲げる事項を記載した書面（以下、本問において「契約締結時の書面」という。）の交付に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。なお、本問における貸付けに係る契約は、金銭の貸付けに係る契約であって、極度方式基本契約、極度方式貸付けに係る契約、手形の割引の契約及び売渡担保の契約ではないものとする。","statements":{},"options":{"①":"契約締結時の書面に記載された事項のうち、貸金業者の商号、名称又は氏名及び住所に変更が生じた場合、当該貸金業者は、変更後の内容を記載した契約締結時の書面を貸付けに係る契約の相手方に交付しなければならない。","②":"契約締結時の書面に記載された事項のうち、貸付けの利率が引き下げられた場合、貸金業者は、変更後の内容を記載した契約締結時の書面を貸付けに係る契約の相手方に交付しなければならない。","③":"貸金業者が貸付けに係る契約について保証契約を締結している場合において、契約締結時の書面に記載された事項のうち、貸付けに係る契約の各回の返済期日及び返済金額に変更が生じた場合、当該貸金業者は、変更後の内容を記載した契約締結時の書面を、当該貸付けに係る契約の相手方だけでなく、当該保証契約の保証人にも交付しなければならない。","④":"契約締結時の書面に記載された事項のうち、重要なものとして内閣府令で定めるものに変更が生じた場合において、貸金業者が貸付けに係る契約の相手方に交付する変更後の内容を記載した契約締結時の書面には、当該変更が生じた事項のみを記載すれば足りる。"},"note":"","answer":3,"format":"single","negative":false},{"id":"R19-13","kai":19,"era":"令和6年度","num":13,"sectionShort":"法令","stem":"貸金業法第19条に規定する帳簿（以下、本問において「帳簿」という。）に関する次のａ～ｄの記述のうち、その内容が適切なものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"貸金業者は、内閣府令で定めるところにより、その営業所又は事務所（以下、本問において「営業所等」という。）ごとに、帳簿を備え、債務者ごとに貸付けの契約について契約年月日、貸付けの金額、受領金額その他内閣府令で定める事項を記載し、これを保存しなければならないが、その営業所等が代理店であるときは、帳簿の備付けを行うことを要しない。","ｂ":"貸金業者は、帳簿を作成するときは、当該帳簿を保存すべき営業所等において貸金業法第17条第1項に規定する書面（契約締結時の書面）の写しを保存することをもって、貸金業法施行規則第16条（帳簿の備付け）第1項第1号に定める事項の記載に代えることができる。","ｃ":"債務者は、貸金業者に対し、帳簿（利害関係がある部分に限る。）の閲覧又は謄写を請求することができるが、債務者以外の保証人及び弁済者は、債務者の承諾を得たときに限り、帳簿の閲覧又は謄写を請求することができる。","ｄ":"貸金業者は、帳簿の閲覧又は謄写の請求がなされた場合において、当該請求が当該請求を行った者の権利の行使に関する調査を目的とするものでないことが明らかであるときを除き、当該請求を拒むことができない。"},"options":{"①":"ａｂ","②":"ａｃ","③":"ｂｄ","④":"ｃｄ"},"note":"","answer":3,"format":"combo","negative":false},{"id":"R19-14","kai":19,"era":"令和6年度","num":14,"sectionShort":"法令","stem":"貸金業法第21条（取立て行為の規制）に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"貸金業を営む者又は貸金業を営む者の貸付けの契約に基づく債権の取立てについて貸金業を営む者その他の者から委託を受けた者は、貸付けの契約に基づく債権の取立てをするに当たって、正当な理由がないのに、午後8時から午前9時までの間に、債務者等に電話をかけ、もしくはファクシミリ装置を用いて送信し、又は債務者等の居宅を訪問してはならない。","②":"貸金業を営む者又は貸金業を営む者の貸付けの契約に基づく債権の取立てについて貸金業を営む者その他の者から委託を受けた者は、貸付けの契約に基づく債権の取立てをするに当たって、債務者等以外の者から債権の弁済を受けてはならない。","③":"貸金業者向けの総合的な監督指針（以下、本問において「監督指針」という。）によれば、債務者等から家族に知られないように要請を受けているか否かにかかわらず、債務者等の自宅に電話をかけ家族がこれを受けた場合に貸金業者であることを名乗り、郵送物の送付に当たり差出人として貸金業者であることを示すことは、貸金業法第21条第1項第5号の「貼り紙、立看板その他何らの方法をもってするを問わず、債務者の借入れに関する事実その他債務者等の私生活に関する事実を債務者等以外の者に明らかにすること」に該当するおそれが大きいとされている。","④":"監督指針によれば、反復継続して、電話をかけ、電報を送達し、電子メールもしくはファクシミリ装置等を用いて送信し又は債務者、保証人等の居宅を訪問することは、貸金業法第21条第1項の「人の私生活若しくは業務の平穏を害するような言動」に該当するおそれが大きいとされている。"},"note":"","answer":4,"format":"single","negative":false},{"id":"R19-15","kai":19,"era":"令和6年度","num":15,"sectionShort":"法令","stem":"貸金業法第24条の6の2（開始等の届出）に関する次のａ～ｄの記述のうち、その内容が適切なものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"貸金業者は、第三者に貸付けに係る契約に基づく債権を譲渡した場合又は第三者から貸付けに係る契約に基づく債権を譲り受けた場合は、内閣府令で定めるところにより、その旨をその登録をした内閣総理大臣又は都道府県知事（以下、本問において「登録行政庁」という。）に届け出なければならない。","ｂ":"貸金業者は、第三者に貸金業の業務の委託を行った場合又は当該業務の委託を行わなくなった場合は、内閣府令で定めるところにより、その旨を登録行政庁に届け出なければならない。","ｃ":"貸金業者は、貸金業協会に加入又は脱退した場合は、内閣府令で定めるところにより、その旨を登録行政庁に届け出なければならない。","ｄ":"貸金業者は、貸金業法第24条の6の2各号のいずれかに該当することとなったときは、その日から30日以内に、その旨を登録行政庁に届け出なければならない。"},"options":{"①":"ａｂ","②":"ａｄ","③":"ｂｃ","④":"ｃｄ"},"note":"","answer":3,"format":"combo","negative":false},{"id":"R19-16","kai":19,"era":"令和6年度","num":16,"sectionShort":"法令","stem":"内閣総理大臣又は都道府県知事（以下、本問において「登録行政庁」という。）による、その登録を受けた貸金業者に対する監督等に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"登録行政庁は、その登録を受けた貸金業者に法令に違反する行為が認められなければ、当該登録行政庁の職員に、当該貸金業者の営業所もしくは事務所に立ち入らせ、その業務に関して質問させ、又は帳簿書類その他の物件を検査させることができない。","②":"登録行政庁は、その登録を受けた貸金業者（株式会社であるものとする。）が、貸金業法第24条（債権譲渡等の規制）第3項に規定する取立て制限者（以下、本問において「取立て制限者」という。）を相手方として、貸付けの契約に基づく債権の譲渡を行った場合において、当該債権譲渡の業務を執行した取締役が、当該債権譲渡を行うに際し、当該相手方が取立て制限者であることを知っていたときは、当該貸金業者に対し当該取締役の解任を命ずることができる。","③":"登録行政庁は、その登録を受けた貸金業者が、保証業者と貸付けに係る契約について保証契約を締結しようとする場合において、その保証業者が貸金業法第6条（登録の拒否）第1項第6号に規定する暴力団員等であることを知りながら、これを相手方として、貸付けに係る契約について保証契約を締結したときは、その登録を取り消すことはできないが、その業務の全部又は一部の停止を命ずることができる。","④":"貸金業者向けの総合的な監督指針によれば、登録行政庁は、貸金業法第24条の6の3に基づく業務改善命令に関し、その登録を受けた貸金業者の検査結果やオフサイト・モニタリング等への対応として、報告内容を検証した結果、資金需要者等の利益の保護に関し問題が認められる場合においては、当該貸金業者が自主的に資金需要者等の利益の保護に取り組んでいる事情は考慮することなく、当該行為の重大性・悪質性のみに着眼して、最終的な行政処分の内容を決定することとされている。"},"note":"","answer":2,"format":"single","negative":false},{"id":"R19-17","kai":19,"era":"令和6年度","num":17,"sectionShort":"法令","stem":"指定信用情報機関への個人信用情報の提供等に関する次のａ～ｄの記述のうち、その内容が適切なものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。なお、本問における貸金業者は、非営利特例対象法人及び特定非営利金融法人ではないものとする。","statements":{"ａ":"加入貸金業者(注1)は、資金需要者である個人の顧客を相手方とする極度方式基本契約を締結したときは、遅滞なく、当該極度方式基本契約に係る個人信用情報を加入指定信用情報機関(注2)に提供しなければならない。","ｂ":"加入貸金業者は、貸金業法第41条の36（指定信用情報機関への信用情報の提供等に係る同意の取得等）第1項及び第2項に規定する同意を得た場合には、当該同意に関する記録を作成し、個人信用情報を加入指定信用情報機関に提供した日から10年間保存しなければならない。","ｃ":"加入貸金業者又はその役員もしくは職員は、加入指定信用情報機関から提供を受けた信用情報を返済能力等調査以外の目的に使用してはならないが、貸金業者向けの総合的な監督指針によれば、例えば、途上与信(注3)を行うために取得した信用情報を勧誘に二次利用した場合や信用情報を内部データベースに取り込み当該内部データベースを勧誘に利用した場合等（債権の保全を目的とした利用を含む。）であっても、返済能力の調査以外の目的による使用に該当することに留意する必要があるとされている。","ｄ":"加入貸金業者は、加入指定信用情報機関に資金需要者等に係る信用情報の提供の依頼（当該資金需要者等に係る他の指定信用情報機関が保有する個人信用情報の提供の依頼を含む。）をする場合には、内閣府令で定める場合を除き、あらかじめ、当該資金需要者等から同意を得なければならないが、当該同意は書面又は電磁的方法による方法で取得しなければならず、口頭での同意の取得は認められない。"},"options":{"①":"ａｂ","②":"ａｃ","③":"ｂｄ","④":"ｃｄ"},"note":"(注1) 加入貸金業者とは、指定信用情報機関と信用情報提供契約を締結した相手方である貸金業者をいう。(注2) 加入指定信用情報機関とは、加入貸金業者と信用情報提供契約を締結した指定信用情報機関をいう。(注3) 途上与信とは、貸金業法第13条の3（基準額超過極度方式基本契約に係る調査）第1項及び第2項の規定に基づく調査をいう。","answer":4,"format":"combo","negative":false},{"id":"R19-18","kai":19,"era":"令和6年度","num":18,"sectionShort":"法令","stem":"金利等の規制に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"金銭の貸付けを行う者が業として金銭の貸付けを行う場合において、元本50万円に対し年2割（20％）の利息の契約をしたときは、当該金銭の貸付けを行う者は、出資法(注)上、刑事罰の対象となる。","②":"金銭の貸付けを行う者が業として行う金銭の貸付けにつき、業として保証を行う場合において、当該保証に係る貸付けの利息が利息の契約時以後変動し得る利率をもって定められ、かつ、当該保証に際し、当該貸付けの債権者と保証人の合意により利息制限法第8条第2項第1号に規定する特約上限利率が定められなかった。この場合、当該保証人が年1割（10％）の保証料の契約をしたときは、当該保証人は、出資法上、刑事罰の対象となる。","③":"金銭の貸借の媒介に係る手数料の契約は、その手数料がその媒介に係る貸借の金額を元本として利息制限法第1条（利息の制限）に規定する利率により計算した金額を超えるときは、利息制限法上、その超過部分について、無効となる。","④":"営業的金銭消費貸借における債務の不履行による賠償額の予定は、その賠償額の元本に対する割合が年2割（20％）を超えるときは、利息制限法上、その超過部分について、無効となる。"},"note":"(注) 出資法とは、出資の受入れ、預り金及び金利等の取締りに関する法律をいう。","answer":4,"format":"single","negative":false},{"id":"R19-19","kai":19,"era":"令和6年度","num":19,"sectionShort":"法令","stem":"貸金業における金融ADR制度に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"貸金業者は、指定紛争解決機関である日本貸金業協会に加入していない場合であっても、指定紛争解決機関との間で手続実施基本契約を締結する措置を講じなければならず、手続実施基本契約を締結する措置を講じたときは、当該手続実施基本契約の相手方である指定紛争解決機関の商号又は名称を公表しなければならない。","②":"貸金業者は、貸金業法第16条の2第1項に定める書面（契約締結前の書面）に、手続実施基本契約を締結した指定紛争解決機関の商号又は名称を表示する必要はないが、貸金業法第17条第1項に規定する書面（契約締結時の書面）に、当該指定紛争解決機関の商号又は名称を表示しなければならない。","③":"加入貸金業者(注)は、訴訟が係属している請求を目的とする紛争解決手続が開始された場合には、当該訴訟が係属している旨、当該訴訟における請求の理由及び当該訴訟の程度を指定紛争解決機関に報告しなければならない。","④":"指定紛争解決機関又は紛争解決委員は、苦情処理手続を開始し、又は加入貸金業者に係る資金需要者等からの申立てに基づき紛争解決手続を開始した場合において、加入貸金業者にこれらの手続に応じるよう求めることができ、当該加入貸金業者は、その求めがあったときは、正当な理由なくこれを拒んではならない。"},"note":"(注) 加入貸金業者とは、指定紛争解決機関と手続実施基本契約を締結した貸金業者をいう。","answer":2,"format":"single","negative":true},{"id":"R19-20","kai":19,"era":"令和6年度","num":20,"sectionShort":"法令","stem":"Ａは株式会社である貸金業者であり、Ｂは個人である顧客である。貸金業法第13条（返済能力の調査）第3項及び同法第13条の3（基準額超過極度方式基本契約に係る調査）第3項に規定する源泉徴収票その他のＢの収入又は収益その他の資力を明らかにする事項を記載し、又は記録した書面又は電磁的記録として内閣府令で定めるもの（以下、本問において「年収証明書」という。）に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。なお、本問における貸付けに係る契約は、貸金業法施行規則第10条の16（指定信用情報機関が保有する信用情報の使用義務の例外）に規定する貸付けの契約ではないものとする。","statements":{},"options":{"①":"Ａは、Ｂとの間で、初めて貸付けに係る契約を締結しようとする場合において、当該契約の貸付けの金額が40万円であり、指定信用情報機関から提供を受けた信用情報により判明したＢに対するＡ以外の貸金業者の貸付けの残高の合計額（以下、本問において「他社残高」という。）が70万円であるときは、返済能力の調査を行うに際し、Ｂから年収証明書の提出又は提供を受けなければならない。","②":"Ａは、Ｂとの間で、貸付けの金額が100万円の貸付けに係る契約を締結しようとする場合において、既にＢから2年前に発行された源泉徴収票の提出を受けていたとしても、返済能力の調査を行うに際し、Ｂから年収証明書の提出又は提供を受けなければならない。","③":"Ａは、基準額超過極度方式基本契約に係る調査をしなければならない場合において、Ｂとの間の貸付けに係る契約が極度額を30万円とする極度方式基本契約のみであり、他社残高が80万円でかつその全てが除外契約(注)に係るものであるときは、当該調査を行うに際し、Ｂから年収証明書の提出又は提供を受けなければならない。","④":"Ａは、基準額超過極度方式基本契約に係る調査において、Ｂに係る極度方式個人顧客合算額が100万円を超え、Ｂから年収証明書の提出又は提供を受けなければならない場合において、年収証明書の提出又は提供を受けるときには、Ｂに係る極度方式個人顧客合算額が100万円を超えると知った日から2か月以内に年収証明書の提出又は提供を受けなければならない。"},"note":"(注) 除外契約とは、貸金業法第13条の2（過剰貸付け等の禁止）第2項に規定する個人過剰貸付契約から除かれる契約として貸金業法施行規則第10条の21に規定するものをいう。","answer":3,"format":"single","negative":true},{"id":"R19-21","kai":19,"era":"令和6年度","num":21,"sectionShort":"法令","stem":"次の①～④の記述のうち、個人顧客が既に負担している債務（以下、本問において「既存債務」という。）を弁済するために必要な資金の貸付けに係る契約（以下、本問において「当該貸付契約」という。）が、貸金業法第13条の2（過剰貸付け等の禁止）第2項に規定する個人顧客の利益の保護に支障を生ずることがない契約として貸金業法施行規則第10条の23第1項第1号の2で定めるもの（借入残高を段階的に減少させるための借換え）に該当するための要件として適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。なお、当該貸付契約は、極度方式基本契約ではないものとする。","statements":{},"options":{"①":"当該貸付契約に基づき将来支払う返済金額の合計額が既存債務に係る将来支払う返済金額の合計額を上回らないこと。","②":"当該貸付契約の1か月の負担が既存債務に係る1か月の負担を上回らないこと。","③":"当該貸付契約の貸付けの利率が、既存債務に係る貸付けに係る契約（既存債務に係る貸付けに係る契約が2以上ある場合は、弁済時における貸付けの残高により加重平均した貸付けの利率）の貸付けの利率を上回らないこと。","④":"既存債務につき供されている物的担保以外の物的担保を供させず、かつ、既存債務に係る保証契約の保証人以外の者を当該貸付契約の保証契約の保証人としないこと。"},"note":"","answer":1,"format":"single","negative":true},{"id":"R19-22","kai":19,"era":"令和6年度","num":22,"sectionShort":"法令","stem":"貸金業法第15条（貸付条件の広告等）に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。なお、本問における金銭の貸付けには、手形の割引及び売渡担保は含まれないものとする。","statements":{},"options":{"①":"貸金業者が金銭の貸付けの条件について広告をする場合において、営業所又は事務所の電話番号を表示するときは、当該営業所又は事務所で使用する携帯電話の番号を表示することはできない。","②":"貸金業者が金銭の貸付けの条件について広告をするときは、貸金業者の登録番号を表示しなければならないが、その登録番号の括弧書については、記載を省略することができる。","③":"貸金業者が金銭の貸付けの条件について広告をするときは、担保を供することが必要な場合における当該担保に関する事項について表示しなければならない。","④":"貸金業者が金銭の貸付けの条件について広告をするときは、不当景品類及び不当表示防止法、屋外広告物法第3条（広告物の表示等の禁止）第1項の規定に基づく都道府県の条例その他の法令に違反する広告をしてはならない。"},"note":"","answer":2,"format":"single","negative":true},{"id":"R19-23","kai":19,"era":"令和6年度","num":23,"sectionShort":"法令","stem":"貸金業法第16条の2に規定する書面（以下、本問において「契約締結前の書面」という。）の交付に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。なお、本問における貸付けに係る契約は、極度方式基本契約、極度方式貸付けに係る契約、手形の割引の契約及び売渡担保の契約ではないものとする。","statements":{},"options":{"①":"貸金業者向けの総合的な監督指針（以下、本問において「監督指針」という。）によれば、貸金業者は、貸付けに係る契約を締結しようとする場合において、当該契約の相手方となろうとする者に契約締結前の書面を交付するときは、当該書面は、少なくとも、契約締結の前日までに交付が必要であることに留意する必要があるとされている。","②":"貸金業者が、貸付けに係る契約を締結しようとする場合に、当該契約の相手方となろうとする者に交付すべき契約締結前の書面の記載事項には、契約年月日、契約の相手方の氏名及び住所は含まれていない。","③":"貸金業者が、貸付けに係る契約を締結しようとする場合に、当該契約の相手方となろうとする者に交付すべき契約締結前の書面の記載事項については、当該書面により明らかにすべきものとされる事項を日本産業規格Z8305に規定する8ポイント以上の大きさの文字及び数字を用いて明瞭かつ正確に記載しなければならない。","④":"監督指針によれば、貸金業者が、貸付けに係る契約の相手方となろうとする者に契約締結前の書面を交付した後、契約締結前に、法令で定められた記載事項の内容に変更が生じた場合には、再度、当該契約の相手方となろうとする者に対し契約締結前の書面を交付する必要があるとされている。"},"note":"","answer":1,"format":"single","negative":true},{"id":"R19-24","kai":19,"era":"令和6年度","num":24,"sectionShort":"法令","stem":"貸金業者Ａが個人顧客Ｂとの間で締結した貸付けに係る契約（以下、本問において「本件貸付契約」という。）に基づく債権について弁済を受けた場合に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"Ａは、Ｂから、Ａの営業所窓口で本件貸付契約に基づく債権の一部について弁済を受けた。この場合、Ａは、直ちに、貸金業法第18条第1項に規定する書面（以下、本問において「受取証書」という。）をＢに交付しなければならない。","②":"Ａは、Ｂから、Ａの預金口座に対する払込みにより本件貸付契約に基づく債権の一部について弁済を受けた。この場合、Ａは、Ｂから請求を受けたときに限り、受取証書をＢに交付しなければならない。","③":"Ａは、第三者Ｃから、Ａの営業所窓口で本件貸付契約に基づく債権の一部について弁済を受けた。この場合、Ａは、Ｃに交付する受取証書に、Ｂの氏名及びＣの氏名を記載しなければならない。","④":"Ａは、Ｂから、Ａの営業所窓口で本件貸付契約に基づく債権の全部について弁済を受けた。この場合、Ａは、Ｂから請求を受けたときは、遅滞なく、受取証書の交付とは別に、債権の全部について弁済を受けたことを証する書面（完済証明書）をＢに交付しなければならない。"},"note":"","answer":4,"format":"single","negative":true},{"id":"R19-25","kai":19,"era":"令和6年度","num":25,"sectionShort":"法令","stem":"貸金業法第24条（債権譲渡等の規制）に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"貸金業者は、貸付けに係る契約に基づく債権を他人に譲渡するに当たっては、譲受人が貸金業者である場合を除き、譲受人に対し、当該債権が貸金業者の貸付けに係る契約に基づいて発生したことその他内閣府令で定める事項及び譲受人が当該債権に係る貸付けの契約に基づく債権に関してする行為について貸金業法第24条第1項に規定する条項の適用がある旨を、内閣府令で定める方法により、通知しなければならない。","②":"貸金業者の貸付けに係る契約に基づく債権を譲り受けた者は、内閣府令で定めるところにより、その営業所又は事務所ごと（営業所又は事務所を有しない者にあっては、住所地又は居所地）に、その業務に関する帳簿を備え、当該債権の債務者ごとに当該債権に係る貸付けの契約について当該債権の譲受年月日及び当該貸付けの契約の契約年月日、当該債権の額及び貸付けの金額、受領金額その他内閣府令で定める事項を記載し、これを保存しなければならない。","③":"貸金業者向けの総合的な監督指針（以下、本問において「監督指針」という。）によれば、監督当局は、貸金業者の監督に当たっては、貸金業者の貸付債権の譲渡については、債権譲受人との債権譲渡契約において、債務者等からの問い合わせや取引履歴の開示請求などがある場合を想定し、債権譲受人との明確な責任分担のもとに債務者等に適切に対応するための規定が置かれているか、また、債権譲受人が債務者等に対し貸金業法第24条第2項に基づく債権譲渡通知を遅滞なく送付することや法令を遵守した債権管理及び回収を行うこと等、債務者等の保護の確保に努めるための規定が置かれているかに留意するものとされている。","④":"監督指針によれば、監督当局は、貸金業者の監督に当たっては、貸金業者が、貸付債権について委託又は譲渡を受けて、管理又は回収を業として行う場合には、弁護士法等の規定に抵触しないか確認を行っているかに留意するものとされている。"},"note":"","answer":1,"format":"single","negative":true},{"id":"R19-26","kai":19,"era":"令和6年度","num":26,"sectionShort":"法令","stem":"Ａは、Ｂとの間で元本を30万円とし利息を年1割8分（18％）とする営業的金銭消費貸借契約（以下、本問において「第一契約」という。）を初めて締結し金銭を貸し付けた。その後、Ａは、Ｂとの間で新たに営業的金銭消費貸借契約（以下、本問においてそれぞれ「第二契約」、「第三契約」という。）を締結しようとしている。この場合に関する次の①～④の記述のうち、利息制限法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"第一契約に基づく債務の残存元本額が15万円である時点において、ＡとＢとの間で元本を90万円とし利息を年1割8分（18％）として第二契約を締結した場合、第一契約及び第二契約における利息の約定のうち年1割5分（15％）を超過する部分に限り無効となる。","②":"第一契約に基づく債務の残存元本額が20万円である時点において、ＡとＢとの間で元本を8万円とし利息を年2割（20％）として第二契約を締結した場合、第二契約における利息の約定のうち年1割8分（18％）を超過する部分に限り無効となる。","③":"第一契約に基づく債務の残存元本額が5万円である時点において、ＡとＢとの間で元本を60万円とし利息を年1割8分（18％）として第二契約を締結すると同時に、元本を40万円とし利息を年1割8分（18％）として第三契約を締結した場合、第二契約及び第三契約における利息の約定のうち年1割5分（15％）を超過する部分に限り無効となる。","④":"第一契約に基づく債務の残存元本額が10万円である時点において、ＡとＢとの間で元本を80万円とし利息を年1割8分（18％）として第二契約を締結すると同時に、元本を9万円とし利息を年2割（20％）として第三契約を締結した場合、第三契約における利息の約定のうち年1割8分（18％）を超過する部分に限り無効となる。"},"note":"","answer":1,"format":"single","negative":true},{"id":"R19-27","kai":19,"era":"令和6年度","num":27,"sectionShort":"法令","stem":"みなし利息に関する次の①～④の記述のうち、利息制限法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"貸金業者は、顧客との間で締結した営業的金銭消費貸借契約において、現金自動支払機を利用して当該顧客から5,000円の弁済を受ける際に、その利用料として、110円（消費税額等相当額を含む。）を当該顧客から受領した。この場合、当該利用料は、利息とみなされない。","②":"貸金業者は、顧客との間で締結した営業的金銭消費貸借契約において、貸金業法第17条第1項に規定する契約締結時の書面を交付した後、当該顧客から紛失による再発行の要請を受けたことに基づき、当該書面を再発行し、その手数料（消費税額等相当額を含む。）を当該顧客から受領した。この場合、当該手数料は、利息とみなされる。","③":"貸金業者は、顧客との間で締結した営業的金銭消費貸借契約において、当該契約の契約書に貼付する当該顧客が負担すべき収入印紙の費用を当該顧客から受領した。この場合、当該費用は、利息とみなされない。","④":"貸金業者は、顧客との間で締結した営業的金銭消費貸借契約において、金銭の貸付け及び弁済に用いるため、当該契約締結時に当該顧客にカードを交付し、その発行手数料（消費税額等相当額を含む。）を当該顧客から受領した。この場合、当該発行手数料は、利息とみなされる。"},"note":"","answer":2,"format":"single","negative":true},{"id":"R19-28","kai":19,"era":"令和6年度","num":28,"sectionShort":"貸付実務","stem":"行為能力に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"成年被後見人の法律行為は、その成年後見人の同意を得て行われたときは、取り消すことができない。","②":"被保佐人は、相続の承認又は放棄をするには、その保佐人の同意を得る必要はない。","③":"被補助人は、家庭裁判所の審判により補助人の同意を得なければならないとされた行為以外の法律行為は、単独で有効に行うことができる。","④":"一種又は数種の営業を許された未成年者は、これにより成年に達したものとみなされ、すべての法律行為について、成年者と同一の行為能力を有する。"},"note":"","answer":3,"format":"single","negative":false},{"id":"R19-29","kai":19,"era":"令和6年度","num":29,"sectionShort":"貸付実務","stem":"無効及び取消しに関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"無効な行為について当事者が無効であることを知って追認をしたときは、行為の時にさかのぼって有効であったものとみなされる。","②":"成年被後見人は、法定代理人の同意を得て、取り消すことができる行為を追認することができる。","③":"詐欺又は強迫によって取り消すことができる行為の取消しは、その取消しの意思表示をした時から将来に向かってその効力を生ずる。","④":"取消権者により未成年者の法律行為が取り消された場合、その法律行為に基づく債務の履行として給付を受けた未成年者は、その法律行為によって現に利益を受けている限度において、給付を受けたものの返還義務を負う。"},"note":"","answer":4,"format":"single","negative":false},{"id":"R19-30","kai":19,"era":"令和6年度","num":30,"sectionShort":"貸付実務","stem":"消滅時効に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"債権は、債権者が権利を行使できることを知っているか否かにかかわらず、5年間行使しないときは、時効によって消滅する。","②":"消滅時効は、当事者が主張しなくても、裁判所が職権でその成否を認定し裁判することができる。","③":"強制執行がその申立ての取下げにより終了した場合は、進行中の消滅時効について、時効の完成猶予の効力を生じない。","④":"債務者が、消滅時効が完成したことを知らずに債務の存在を承認した場合、時効は、その時から新たに進行を始める。"},"note":"","answer":4,"format":"single","negative":false},{"id":"R19-31","kai":19,"era":"令和6年度","num":31,"sectionShort":"貸付実務","stem":"Ａは、Ｂとの間で金銭消費貸借契約（以下、本問において「本件契約」という。）を締結しＢに金銭を貸し付けた。本件契約では、元本10万円、利息年1割5分（15％）、元利一括返済方式とする旨の約定がなされており、遅延損害金に関する定めは存在しない。Ｂは、本件契約で定める返済期限が経過したにもかかわらず、借入金をＡに返済していない。この場合に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"Ａは、Ｂに対し、返済期限の翌日から借入金が完済されるまで、借入金の残額に約定利率年1割5分（15％）の割合を乗じた額の遅延損害金を請求することができる。","②":"Ａは、Ｂに対し、返済期限の翌日から借入金が完済されるまで、借入金の残額に約定利率年1割5分（15％）と法定利率年3分（3％）を合計した年1割8分（18％）の割合を乗じた額の遅延損害金を請求することができる。","③":"Ａは、Ｂに対し、返済期限の翌日から借入金が完済されるまで、借入金の残額に法定利率年3分（3％）の割合を乗じた額の遅延損害金しか請求することができない。","④":"Ａは、Ｂが借入金の返済を遅延したことにより被った損害を証明しなければ、Ｂに対し、当該証明した額の遅延損害金を請求することができない。"},"note":"","answer":1,"format":"single","negative":false},{"id":"R19-32","kai":19,"era":"令和6年度","num":32,"sectionShort":"貸付実務","stem":"保証に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"保証契約は、債権者と保証人となろうとする者との間において、保証契約を締結する旨の口頭の合意がなされることによって成立するが、連帯保証契約については、債権者と連帯保証人となろうとする者の間で、書面又は電磁的記録によって締結されなければ、その効力を生じない。","②":"連帯保証において、主たる債務の目的又は態様が連帯保証契約の締結後に加重されたときは、連帯保証人の負担も加重される。","③":"数人の保証人がある場合、各保証人は、別段の意思表示がある場合を除き、それぞれ平等の割合をもって分割された額についてのみ保証債務を負担するが、連帯保証人には、この分別の利益が認められず、各連帯保証人は、それぞれ全額について保証債務を負担する。","④":"連帯保証において、債権者が、主たる債務者に債務の履行を請求することなく、連帯保証人に保証債務の履行を請求した場合、連帯保証人は、主たる債務者が破産手続開始の決定を受けたとき、又はその行方が知れないときを除いて、債権者に対し、まず主たる債務者に催告すべき旨を請求することができる。"},"note":"","answer":3,"format":"single","negative":false},{"id":"R19-33","kai":19,"era":"令和6年度","num":33,"sectionShort":"貸付実務","stem":"定型約款に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"定型取引とは、ある特定の者が不特定多数の者を相手方として行う取引であって、その内容の全部又は一部が画一的であることがその双方にとって合理的なものをいう。","②":"定型取引を行い、又は行おうとする定型約款を準備した者（以下、本問において「定型約款準備者」という。）は、定型取引を行うことの合意（以下、本問において「定型取引合意」という。）をするまでに、相当な方法で相手方にその定型約款の内容を示さなければならない。","③":"定型取引合意及び定型約款を契約の内容とする旨の合意をし、かつ、定型約款準備者があらかじめその定型約款を契約の内容とする旨を相手方に表示していた場合であっても、相手方が当該定型約款の個別の条項の一部について認識していなかったときは、当該条項については合意をしたものとはみなされない。","④":"定型約款準備者は、定型約款を変更するには、その変更が相手方の一般の利益に適合するときを除き、変更内容について相手方と個別に合意しなければならない。"},"note":"","answer":1,"format":"single","negative":false},{"id":"R19-34","kai":19,"era":"令和6年度","num":34,"sectionShort":"貸付実務","stem":"相続に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"被相続人の子が、相続の開始以前に死亡したとき、相続人の欠格事由に該当しもしくは廃除によって相続権を失ったとき、又は相続の放棄をしたときは、その者の子がこれを代襲して相続人となる。","②":"被相続人の配偶者と被相続人の直系尊属が相続人となるときは、当該配偶者の法定相続分は、4分の3である。","③":"相続人が数人あるときは、限定承認は、各共同相続人がその相続分に応じて個別にすることができる。","④":"相続人のあることが明らかでないときは、相続財産は、法人とされる。"},"note":"","answer":4,"format":"single","negative":false},{"id":"R19-35","kai":19,"era":"令和6年度","num":35,"sectionShort":"貸付実務","stem":"株式会社の取締役及び取締役会に関する次の①～④の記述のうち、会社法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。なお、本問における株式会社は、監査等委員会設置会社及び指名委員会等設置会社ではないものとする。","statements":{},"options":{"①":"取締役の任期は、選任後2年以内に終了する事業年度のうち最終のものに関する定時株主総会の終結の時までであり、定款又は株主総会の決議によって、その任期を短縮又は伸長することはできない。","②":"代表取締役及び代表取締役以外の取締役であって取締役会の決議によって取締役会設置会社の業務を執行する取締役として選定されたものは、3か月に1回以上、自己の職務の執行の状況を取締役会に報告しなければならない。","③":"取締役会は、取締役会の決議により、多額の借財の決定を取締役に委任することができる。","④":"株式会社の取締役がその職務を行うについて悪意又は重大な過失があり、これによって第三者に損害が生じた場合、当該株式会社が第三者に対して損害賠償責任を負い、当該取締役が第三者に対して損害賠償責任を負うことはない。"},"note":"","answer":2,"format":"single","negative":false},{"id":"R19-36","kai":19,"era":"令和6年度","num":36,"sectionShort":"貸付実務","stem":"犯罪による収益の移転防止に関する法律についての次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"貸金業者が取引時確認をすることが求められる特定取引には、金銭の貸付け又は金銭の貸借の媒介（手形の割引、売渡担保その他これらに類する方法によってする金銭の交付又は当該方法によってする金銭の授受の媒介を含む。）を内容とする契約の締結のほか、金銭の貸付けを内容とする契約に係る保証契約が含まれる。","②":"貸金業者が、顧客等について取引時確認を行う場合において、会社の代表者が当該会社のために当該貸金業者との間で特定取引等を行うときは、当該貸金業者は、当該会社の当該取引時確認を行えば足り、当該代表者の本人特定事項の確認を行う必要はない。","③":"貸金業者は、取引時確認を行った場合には、直ちに、主務省令で定める方法により、当該取引時確認に係る事項、当該取引時確認のためにとった措置その他の主務省令で定める事項に関する記録を作成し、当該記録を作成した日から7年間保存しなければならない。","④":"貸金業者は、取引時確認、取引記録等の保存、疑わしい取引の届出等の措置を的確に行うため、特定事業者作成書面等(注)を作成し、必要に応じて、見直しを行い、必要な変更を加えるように努めなければならない。"},"note":"(注) 特定事業者作成書面等とは、特定事業者自らが行う取引について調査し、及び分析し、並びに当該取引による犯罪による収益の移転の危険性の程度その他の当該調査及び分析の結果を記載し、又は記録した書面又は電磁的記録をいう。","answer":4,"format":"single","negative":false},{"id":"R19-37","kai":19,"era":"令和6年度","num":37,"sectionShort":"貸付実務","stem":"意思表示に関する次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"意思表示は、表意者がその真意でないことを知ってしたときは無効であるが、相手方がその意思表示が表意者の真意ではないことを知り又は知ることができたときは、表意者は、その無効を主張することができない。","②":"相手方と通じてした虚偽の意思表示は無効であるが、この意思表示の無効は、善意の第三者に対抗することができない。","③":"契約の解除の意思表示は、表意者が通知を発した後に死亡し、意思能力を喪失し、又は行為能力の制限を受けたときであっても、そのためにその効力を妨げられない。","④":"意思表示は、表意者が相手方を知ることができず、又はその所在を知ることができないときは、公示の方法によってすることができる。"},"note":"","answer":1,"format":"single","negative":true},{"id":"R19-38","kai":19,"era":"令和6年度","num":38,"sectionShort":"貸付実務","stem":"代理に関する次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"代理人が本人のためにすることを示さないでした意思表示は、相手方が、代理人が本人のためにすることを知り、又は知ることができたとしても、本人が追認をしなければ、本人に対してその効力を生じない。","②":"委任による代理人は、本人の許諾を得たとき、又はやむを得ない事由があるときでなければ、復代理人を選任することができない。","③":"法定代理人は、自己の責任で復代理人を選任することができる。この場合において、やむを得ない事由があるときは、本人に対してその選任及び監督についての責任のみを負う。","④":"第三者に対して他人に代理権を与えた旨を表示した者は、その代理権の範囲内においてその他人が第三者との間でした行為について、その責任を負う。ただし、第三者が、その他人が代理権を与えられていないことを知り、又は過失によって知らなかったときは、この限りでない。"},"note":"","answer":1,"format":"single","negative":true},{"id":"R19-39","kai":19,"era":"令和6年度","num":39,"sectionShort":"貸付実務","stem":"Ａは、Ｂとの間で、11月1日に、借入金の返済期限を翌年11月1日と定めて金銭消費貸借契約（以下、本問において「本件契約」という。）を締結しＢに金銭を貸し付けた。本件契約では、契約締結日の翌月以降毎月1日に発生済みの利息を支払う約定がなされている。この場合に関する次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"Ａは、本件契約に基づきＢがＡに対して負担する一切の債務を被担保債権として、Ｂとの間で、Ｂが所有する甲建物に抵当権の設定を受けた。この場合において、Ｂが甲建物を滅失させたときは、Ｂは、返済期限到来前であっても、借入金の返済について期限の利益を主張することができない。","②":"Ｂは、返済期限が到来する前に、破産手続開始の決定を受けた。この場合、Ｂは、返済期限到来前であっても、借入金の返済について期限の利益を主張することができない。","③":"Ｂは、毎月の利息の支払を1回遅滞した。この場合、Ｂは、返済期限到来前であっても、借入金の返済について期限の利益を主張することができない。","④":"Ｂは、返済期限到来前であっても、期限の利益を放棄し、借入金及び利息をＡに弁済することができる。"},"note":"","answer":3,"format":"single","negative":true},{"id":"R19-40","kai":19,"era":"令和6年度","num":40,"sectionShort":"貸付実務","stem":"Ａは、Ｂに対して有する貸金返還請求権を被担保債権として、Ｂが所有する甲建物に抵当権の設定を受けその登記を経た。この場合に関する次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"Ｂが、月額賃料を10万円として甲建物を第三者Ｃに賃貸している場合において、返済期限を過ぎても借入金をＡに返済しないときは、Ａは、物上代位に基づいて、ＣがＢに対して賃料を払い渡す前にＢがＣに対して有する賃料請求権を差し押さえ、当該賃料から貸金を回収することができる。","②":"Ａが貸金返還請求権を第三者Ｄに譲渡した場合であっても、ＡとＢとの間の抵当権設定契約において、被担保債権の移転に伴い抵当権も移転する旨の特約がない限り、Ｄに抵当権は移転しない。","③":"貸金返還請求権についての保証人であるＥは、Ｂとの間で締結した売買契約に基づき甲建物を譲り受けた。この場合、Ｅは、Ａに対して、民法第383条（抵当権消滅請求の手続）に基づき抵当権消滅請求をすることはできない。","④":"抵当権が実行された場合において、Ａは、満期の到来した3年分の利息及び1年分の遅延損害金を請求する権利を有していた。Ａのほかに後順位抵当権者がいる場合、Ａは、元本のほか、利息及び遅延損害金を通算して2年分についてのみその抵当権を行使することができる。"},"note":"","answer":2,"format":"single","negative":true},{"id":"R19-41","kai":19,"era":"令和6年度","num":41,"sectionShort":"貸付実務","stem":"金銭消費貸借契約に関する次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"金銭消費貸借契約は、借主が借り受けた金銭と同額の金銭を返還することを約し、貸主から金銭を受け取ることによって成立するが、書面による金銭消費貸借契約は、貸主が金銭を引き渡すことを約し、借主がその受け取った金銭と同額の金銭をもって返還をすることを約することにより成立する。","②":"金銭消費貸借契約において当事者が利息に関する特約を定めなかった場合であっても、貸主は、借主に対して法定利息を請求することができる。","③":"金銭消費貸借契約において当事者が借入金の返還の時期を定めなかったときは、貸主は、相当の期間を定めてその返還の催告をすることができる。","④":"借主は、弁済期までに借入金を返還しなかった場合、履行遅滞が不可抗力によるものであったとしても、弁済期が到来した時から遅滞の責任を負う。"},"note":"","answer":2,"format":"single","negative":true},{"id":"R19-42","kai":19,"era":"令和6年度","num":42,"sectionShort":"貸付実務","stem":"民事執行法に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"強制執行は、原則として、執行文の付された債務名義の正本に基づいて実施される。ただし、少額訴訟における確定判決又は仮執行の宣言を付した少額訴訟の判決もしくは支払督促により、これに表示された当事者に対し、又はその者のためにする強制執行は、その正本に基づいて実施される。","②":"金銭の支払又は船舶もしくは動産の引渡しを目的とする債権（動産執行の目的となる有価証券が発行されている債権を除く。以下、本問において「債権」という。）に対する強制執行（民事執行法第167条の2第2項に規定する少額訴訟債権執行を除く。以下、本問において「債権執行」という。）は、執行裁判所の差押命令により開始される。","③":"債権執行における差押命令は、債務者及び第三債務者に送達され、その効力は、差押命令が債務者に送達された時に生じる。","④":"給与に係る債権については、その支払期に受けるべき給付の4分の3に相当する部分（その額が標準的な世帯の必要生計費を勘案して政令で定める額を超えるときは、政令で定める額に相当する部分）は、差し押さえてはならない。"},"note":"","answer":3,"format":"single","negative":true},{"id":"R19-43","kai":19,"era":"令和6年度","num":43,"sectionShort":"資金需要者保護","stem":"個人情報の保護に関する法律についての次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"個人情報取扱事業者は、個人情報を取得した場合は、取得の状況からみて利用目的が明らかであると認められる場合であっても、速やかに、その利用目的を、本人に通知し、又は公表しなければならない。","②":"個人情報取扱事業者は、合併その他の事由により他の個人情報取扱事業者から事業を承継することに伴って個人情報を取得した場合は、その事業を承継した個人情報取扱事業者が公表している個人情報の利用目的の達成に必要な範囲内であれば、承継前における当該個人情報の利用目的の達成に必要な範囲を超えて、当該個人情報を取り扱うことができる。","③":"個人情報取扱事業者は、利用目的を変更する場合において、変更前の利用目的と関連性を有すると合理的に認められる範囲を超えて利用目的の変更を行うときは、あらかじめその利用目的を、本人に通知し、又は公表しなければならない。","④":"個人情報取扱事業者（その者が法人（法人でない団体で代表者又は管理人の定めのあるものを含む。）である場合にあっては、その役員、代表者又は管理人）もしくはその従業者又はこれらであった者が、その業務に関して取り扱った個人情報データベース等を自己もしくは第三者の不正な利益を図る目的で提供し、又は盗用する行為は、刑事罰の対象となる。"},"note":"","answer":4,"format":"single","negative":false},{"id":"R19-44","kai":19,"era":"令和6年度","num":44,"sectionShort":"資金需要者保護","stem":"消費者契約法に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"消費者契約法の適用がある取引については、消費者には、契約の申込み又は契約の締結後一定の期間内であれば、無条件に当該契約の申込みを撤回し又は当該契約を解除することができる権利（クーリング・オフを行使する権利）が認められている。","②":"事業者に対し、消費者が後見開始、保佐開始又は補助開始の審判を受けたことのみを理由とする解除権を付与する消費者契約（消費者が事業者に対し物品、権利、役務その他の消費者契約の目的となるものを提供することとされているものを除く。）の条項は、無効である。","③":"事業者が消費者契約の締結について勧誘をするに際し、当該消費者に対して重要事項について事実と異なることを告げる行為をしたことにより、当該消費者が当該告げられた内容が事実であるとの誤認をし、それによって消費者契約が締結された場合、当該消費者契約は無効である。","④":"消費者契約の条項のうち、当該消費者契約の解除に伴う損害賠償の額を予定し、又は違約金を定める条項であって、これらを合算した額が、当該条項において設定された解除の事由、時期等の区分に応じ、当該消費者契約と同種の消費者契約の解除に伴い当該事業者に生ずべき平均的な損害の額を超える条項は、無効である。"},"note":"","answer":2,"format":"single","negative":false},{"id":"R19-45","kai":19,"era":"令和6年度","num":45,"sectionShort":"資金需要者保護","stem":"日本貸金業協会が定める紛争解決等業務に関する規則についての次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"貸金業相談・紛争解決センターに対して苦情処理手続開始の申立てをすることができるのは、協会員等との間で貸金業務等関連苦情を有する契約者等である個人に限られている。","②":"当事者である協会員等は、苦情処理手続が開始された事案について当事者間で直接交渉を行った場合には、苦情受付課に対して、交渉の日時、場所及び手法、交渉の内容等を報告しなければならない。","③":"紛争解決手続は公開とする。ただし、紛争解決委員は、非公開とすべき相当な理由があるときは、傍聴を禁止することができる。","④":"当事者である協会員等は、紛争解決委員から、特別調停案の提示を受けたときには、当事者である契約者等が当該特別調停案を受諾しないときを除き、これを必ず受諾しなければならない。"},"note":"","answer":2,"format":"single","negative":false},{"id":"R19-46","kai":19,"era":"令和6年度","num":46,"sectionShort":"資金需要者保護","stem":"個人情報の保護に関する法律第26条（漏えい等の報告等）についての次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"個人情報取扱事業者は、不正に利用されることにより財産的被害が生じるおそれがある個人データの漏えい等が発生し、又は発生したおそれがある事態が生じた場合であっても、当該事態が生じた個人データに係る本人の数が1,000人を超えないときは、当該事態が生じた旨を個人情報保護委員会に報告する必要はない。","②":"個人情報取扱事業者は、個人データに係る本人の数が1,000人を超える漏えい等が発生し、又は発生したおそれがある事態が生じた場合であっても、高度な暗号化その他の個人の権利利益を保護するために必要な措置がなされていれば、当該事態が生じた旨を個人情報保護委員会に報告する必要はない。","③":"個人情報取扱事業者（他の個人情報取扱事業者又は行政機関等から個人データの取扱いの全部又は一部の委託を受けた者ではないものとする。）は、報告対象事態(注)が生じた場合、本人に対し、当該事態が生じた旨を通知しなければならない。ただし、本人への通知が困難な場合であって、本人の権利利益を保護するため必要なこれに代わるべき措置をとるときは、この限りでない。","④":"個人情報取扱事業者は、報告対象事態が生じた旨を個人情報保護委員会に報告する場合には、概要、原因、二次被害又はそのおそれの有無及びその内容、本人への対応の実施状況、再発防止のための措置等について報告をしようとする時点において把握しているものを、当該事態を知った後、速やかに、報告しなければならない。"},"note":"(注) 報告対象事態とは、個人情報取扱事業者の取り扱う個人データの漏えい、滅失、毀損その他の個人データの安全の確保に係る事態であって個人の権利利益を害するおそれが大きいものとして個人情報保護委員会規則で定めるものをいう。","answer":1,"format":"single","negative":true},{"id":"R19-47","kai":19,"era":"令和6年度","num":47,"sectionShort":"資金需要者保護","stem":"日本貸金業協会（以下、本問において「協会」という。）が定める貸付自粛対応に関する規則についての次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"自粛対象者の配偶者又は二親等内の親族は、自粛対象者が所在不明者であり、その原因が金銭の貸付けによる金銭債務の負担を原因としている可能性があること、貸付自粛の対応をとることが自粛対象者の生命、身体又は財産の保護のために必要であること、及び申告を行うことにつき自粛対象者の同意を得ることが困難と認められることのすべてに該当する場合には、自粛対象者の意思に反することが明らかなときを除き、貸付自粛の申告をすることができる。","②":"自粛対象者の配偶者又は二親等内の親族が貸付自粛の申告をした場合には、自粛対象者は、いつでも当該申告を取り消すことができる。","③":"貸付自粛情報が登録された場合、当該貸付自粛の申告をした者又は自粛対象者が、協会に対し、当該貸付自粛の申告の撤回又は取消しをしない限り、当該情報は抹消されない。","④":"協会員（個人信用情報機関と個人信用情報の提供を受けることに関し契約を締結している者に限る。）は、個人信用情報の提供を受けることにつき契約を締結している個人信用情報機関から貸付自粛情報の提供を受けたときには、当該貸付自粛情報に係る自粛対象者との間で新たな貸付けに係る契約の締結をせず又は当該自粛対象者との間で締結済みの極度方式基本契約の極度額を零円としもしくは極度方式基本契約に基づく新たな貸付けを停止する措置をとるなど、以後、新規に金銭の貸付けがなされないこととなるために必要な措置をとるよう努めなければならない。"},"note":"","answer":3,"format":"single","negative":true},{"id":"R19-48","kai":19,"era":"令和6年度","num":48,"sectionShort":"財務会計","stem":"次の表は、Ａ株式会社の令和5年度の損益計算書の一部を抜粋したものである。次の①～④の記述のうち、この表に基づき計算したＡ株式会社の経常利益金額として適切なものを1つだけ選び、解答欄にその番号をマークしなさい。なお、計算するにあたって、この表に記載されていない損益計算書上の費目については、考慮しないものとする。","statements":{},"options":{"①":"1,000百万円","②":"600百万円","③":"580百万円","④":"500百万円"},"note":"","answer":3,"table":{"title":"損益計算書","caption":"（単位：百万円）","head":["科目","金額"],"rows":[["売上高","2,000"],["売上原価","1,000"],["販売費及び一般管理費","400"],["営業外収益","80"],["営業外費用","100"],["特別利益","40"],["特別損失","60"]]},"format":"single","negative":false},{"id":"R19-49","kai":19,"era":"令和6年度","num":49,"sectionShort":"財務会計","stem":"財務諸表等の用語、様式及び作成方法に関する規則に規定するキャッシュ・フロー計算書に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"長期借入れによる収入、長期借入金の返済による支出は、営業活動によるキャッシュ・フローの区分に掲記される。","②":"損益計算書に収益又は費用として計上されている項目のうち資金の増加又は減少を伴わない項目は、営業活動によるキャッシュ・フローの区分に掲記される。","③":"社債の償還による支出、株式の発行による収入は、投資活動によるキャッシュ・フローの区分に掲記される。","④":"貸付けによる支出、貸付金の回収による収入は、財務活動によるキャッシュ・フローの区分に掲記される。"},"note":"","answer":2,"format":"single","negative":false},{"id":"R19-50","kai":19,"era":"令和6年度","num":50,"sectionShort":"財務会計","stem":"会社計算規則に規定する貸借対照表等(注)に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"資産の部は、流動資産、固定資産及び投資その他の資産の項目に区分しなければならない。","②":"現金及び預金（1年以内に期限の到来しない預金を除く。）は、流動資産に属するものとする。","③":"社債は、固定負債に属するものとする。","④":"純資産の部は、株式会社の貸借対照表にあっては、株主資本、評価・換算差額等、株式引受権及び新株予約権の項目に区分しなければならない。"},"note":"(注) 貸借対照表等とは、貸借対照表及び連結貸借対照表をいう。","answer":1,"format":"single","negative":true},{"id":"R20-01","kai":20,"era":"令和7年度","num":1,"sectionShort":"法令","stem":"貸金業法上の用語の定義等に関する次のａ～ｄの記述のうち、その内容が適切なものの個数を①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"貸金業には、物品の運送を業とする者がその取引に付随して行う金銭の貸付けは含まれない。","ｂ":"債務者等には、債務者又は債務者であった者は含まれるが、保証人及び代位弁済者は含まれない。","ｃ":"貸付けの契約には、金銭の貸付けに係る契約又は金銭の貸借の媒介の契約は含まれるが、これらの契約に係る保証契約は含まれない。","ｄ":"住宅資金貸付契約には、住宅の建設又は購入に必要な資金の貸付けに係る契約は含まれるが、住宅の改良に必要な資金の貸付けに係る契約は含まれない。"},"options":{"①":"1個","②":"2個","③":"3個","④":"4個"},"note":"","answer":1,"format":"count","negative":false},{"id":"R20-02","kai":20,"era":"令和7年度","num":2,"sectionShort":"法令","stem":"貸金業の登録に関する次のａ～ｄの記述のうち、その内容が適切なものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"貸金業の登録は、2年ごとにその更新を受けなければ、その期間の経過によって、その効力を失う。","ｂ":"貸金業者は、貸金業の登録の更新を受けようとするときは、その者が現に受けている登録の有効期間満了の日の2か月前までに当該登録の更新を申請しなければならない。","ｃ":"都道府県知事の登録を受けている者が、他の都道府県に営業所を設置する場合は、その登録換えの申請をした時から、当該営業所で貸金業を営むことができる。","ｄ":"登録換えの申請をしようとする貸金業者は、その者が現に受けている登録をした財務局長もしくは福岡財務支局長又は都道府県知事を経由して登録の申請をしなければならない。"},"options":{"①":"ａｃ","②":"ａｄ","③":"ｂｃ","④":"ｂｄ"},"note":"","answer":4,"format":"combo","negative":false},{"id":"R20-03","kai":20,"era":"令和7年度","num":3,"sectionShort":"法令","stem":"株式会社であるＡが貸金業の登録の申請をした。この場合に関する次のａ～ｄの記述のうち、その内容が適切なものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"Ａの取締役の中に、精神の機能の障害のため貸金業に係る職務を適正に執行するに当たって必要な認知、判断及び意思疎通を適切に行うことができない者がいる場合、貸金業法第6条（登録の拒否）第1項に規定する登録の拒否事由（以下、本問において「登録拒否事由」という。）に該当する。","ｂ":"Ａの取締役の中に、道路交通法の規定に違反し、罰金の刑に処せられ、その刑の執行を終わり、又は刑の執行を受けることがなくなった日から5年を経過しない者がいる場合、登録拒否事由に該当する。","ｃ":"Ａの政令で定める使用人の中に、破産手続開始の決定を受けて復権をした日から5年を経過しない者がいる場合、登録拒否事由に該当する。","ｄ":"Ａの政令で定める使用人の中に、貸金業法第24条の6の4（監督上の処分）第1項の規定により貸金業の登録を取り消された株式会社であるＢにおいて、当該取消しの日にＢの取締役であった者で、当該取消しの日から5年を経過しないものがいる場合、登録拒否事由に該当する。"},"options":{"①":"ａｂ","②":"ａｄ","③":"ｂｃ","④":"ｃｄ"},"note":"","answer":2,"format":"combo","negative":false},{"id":"R20-04","kai":20,"era":"令和7年度","num":4,"sectionShor
