ば、これを第三者に対抗できない。","④":"電子記録名義人に対してした電子記録債権についての支払は、当該電子記録名義人がその支払を受ける権利を有しない場合であっても、その効力を有する。ただし、その支払をした者に悪意又は重大な過失があるときは、この限りでない。"},"note":"","answer":4,"format":"single","negative":false},{"id":"R15-36","kai":15,"era":"令和2年度","num":36,"sectionShort":"貸付実務","stem":"犯罪による収益の移転防止に関する法律（以下、本問において「犯罪収益移転防止法」という。）に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"貸金業者が、株式会社（「外国に本店又は主たる事務所を有する法人」ではないものとする。）である顧客の取引時確認として確認しなければならない事項である事業の内容の確認方法には、当該取引時確認をする日前1年以内に作成された当該株式会社の設立の登記に係る登記事項証明書又はその写しを確認する方法がある。","②":"貸金業者は、取引時確認を行った場合には、直ちに、主務省令で定める方法により、当該取引時確認に係る事項、当該取引時確認のためにとった措置その他の主務省令で定める事項に関する記録（以下、本問において「確認記録」という。）を作成しなければならない。貸金業者は、確認記録を、特定取引等に係る契約が終了した日その他の主務省令で定める日から、3年間保存しなければならない。","③":"貸金業者は、特定業務に係る取引を行った場合には、少額の取引その他の政令で定める取引を除き、直ちに、主務省令で定める方法により、顧客等の確認記録を検索するための事項、当該取引の期日及び内容その他の主務省令で定める事項に関する記録（以下、本問において「取引記録」という。）を作成し、取引記録を、当該取引の行われた日から7年間保存しなければならない。","④":"貸金業者（その役員及び使用人を含む。）は、犯罪収益移転防止法第8条第1項の規定による届出（以下、本問において「疑わしい取引の届出」という。）を行おうとすること又は行ったことを当該疑わしい取引の届出に係る顧客等又はその者の関係者に開示することができる。"},"note":"","answer":3,"format":"single","negative":false},{"id":"R15-37","kai":15,"era":"令和2年度","num":37,"sectionShort":"貸付実務","stem":"代理に関する次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"代理人がその権限内において本人のためにすることを示してした意思表示は、本人が事前にこれを承認し、又は事後にこれを追認しなければ、本人に対してその効力を生じない。","②":"法定代理人は、自己の責任で復代理人を選任することができる。この場合において、やむを得ない事由があるときは、本人に対してその選任及び監督についての責任のみを負う。","③":"代理権は、本人の死亡によって消滅する。","④":"他人に代理権を与えた者は、代理権の消滅後にその代理権の範囲内においてその他人が第三者との間でした行為について、代理権の消滅の事実を知らなかった第三者に対してその責任を負う。ただし、第三者が過失によってその事実を知らなかったときは、この限りでない。"},"note":"","answer":1,"format":"single","negative":true},{"id":"R15-38","kai":15,"era":"令和2年度","num":38,"sectionShort":"貸付実務","stem":"時効に関する次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"裁判上の請求がなされた場合において、確定判決又は確定判決と同一の効力を有するものによって権利が確定したときは、時効は、裁判上の請求が終了した時から新たにその進行を始める。","②":"強制執行が申し立てられた場合において、当該申立ての取下げ又は法律の規定に従わないことによる取消しによって強制執行が終了したときは、その終了の時から6か月を経過するまでの間は、時効は、完成しない。","③":"仮差押えが申し立てられた場合、仮差押えは時効の更新事由に該当するため、時効は、仮差押えが終了した時から新たにその進行を始める。","④":"債権者が権利を行使することができることを知った時から5年間行使しないとき、又は権利を行使することができる時から10年間行使しないときは、債権は、時効によって消滅する。"},"note":"","answer":3,"format":"single","negative":true},{"id":"R15-39","kai":15,"era":"令和2年度","num":39,"sectionShort":"貸付実務","stem":"Ａは貸金業者、Ｂは個人事業主である借主、ＣはＢの子でありＢと共同して事業を行っていない保証人である。保証に関する次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。なお、本問における契約等は、2020年4月1日以降に行われているものとする。","statements":{},"options":{"①":"Ａが、Ｂの事業資金を融資するに当たってＣとの間で保証契約を締結するに先立ち、Ｃの保証債務を履行する意思を表示するために作成しなければならない公正証書は、Ｂが主たる債務を履行しないときにＣがその全額について履行する意思を表示した文書をＣが作成し、公証人がその内容を認証して署名押印する方式に従って作成されなければならない。","②":"Ａは、Ｂとの間で貸付契約を締結し、当該契約につきＣとの間で保証契約を締結した。ＢがＡに対して負う貸付金の返還債務について期限の利益を喪失した場合において、Ａは、Ｃに対し、その利益の喪失を知った時から2か月を超えてもその旨を通知しなかったときは、Ｂが期限の利益を喪失した時から当該通知を現にするまでに生じた遅延損害金（期限の利益を喪失しなかったとしても生ずべきものを除く。）に係る保証債務の履行を請求することができない。","③":"Ａは、Ｂとの間で、Ｂの事業資金を融資する目的で極度方式基本契約を締結し、当該契約につき、Ｃとの間で個人根保証契約を締結しようとする場合、当該個人根保証契約の締結に先立ち、その締結の日前1か月以内に作成された公正証書でＣが保証債務を履行する意思を表示していなければ、当該個人根保証契約はその効力を生じない。","④":"Ａが、Ｂとの間で、Ｂの事業資金を融資する目的で極度方式基本契約を締結し、当該契約に基づく不特定の債務を主たる債務とする根保証をＢがＣに委託するときは、Ｂは、Ｃに対し、「財産及び収支の状況」、「主たる債務以外に負担している債務の有無並びにその額及び履行状況」、「主たる債務の担保として他に提供し、又は提供しようとするものがあるときは、その旨及びその内容」に関する情報を提供しなければならない。"},"note":"","answer":1,"format":"single","negative":true},{"id":"R15-40","kai":15,"era":"令和2年度","num":40,"sectionShort":"貸付実務","stem":"弁済に関する次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"債務者が債権者に対して債務の弁済をしたときは、その債権は、消滅する。","②":"弁済をするについて正当な利益を有する者でない第三者は、債権者及び債務者のいずれの意思にも反しない場合であっても、弁済をすることはできない。","③":"弁済をすべき場所について別段の意思表示がないときは、特定物の引渡しは債権発生の時にその物が存在した場所において、その他の弁済は債権者の現在の住所において、それぞれしなければならない。","④":"債務者は、弁済の提供の時から、債務を履行しないことによって生ずべき責任を免れる。"},"note":"","answer":2,"format":"single","negative":true},{"id":"R15-41","kai":15,"era":"令和2年度","num":41,"sectionShort":"貸付実務","stem":"消費貸借契約に関する次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"借主は、返還の時期の定めの有無にかかわらず、いつでも返還をすることができる。","②":"書面でする消費貸借の借主は、貸主から金銭その他の物を受け取るまで、契約の解除をすることができる。","③":"金銭その他の物を給付する義務を負う者がある場合において、当事者がその物を消費貸借の目的とすることを約したときは、消費貸借は、これによって成立したものとみなされる。","④":"貸主は、特約の有無にかかわらず、借主に対して法定利息を請求することができる。"},"note":"","answer":4,"format":"single","negative":true},{"id":"R15-42","kai":15,"era":"令和2年度","num":42,"sectionShort":"貸付実務","stem":"次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。なお、本問において、「改正前民法」とは平成29年法律第44号により改正される前の民法をいい、「改正民法」とは同法により改正された後の民法をいうものとする。","statements":{},"options":{"①":"Ａは、2020年3月1日に、Ｂとの間で、金銭消費貸借契約を締結しＢに10万円を貸し付けた。この場合、ＡのＢに対する貸付金債権の消滅時効の期間については、改正前民法が適用され、当該債権は、10年間行使しないときは、時効によって消滅する。","②":"Ａは、2020年3月1日に、Ｂとの間で、債権の譲渡を禁止する旨の特約を付した金銭消費貸借契約を締結しＢに10万円を貸し付けた。その後、Ａは、2020年5月1日に、Ｃとの間で、ＡのＢに対する貸付金債権を譲渡した。この場合、ＡのＣに対する債権の譲渡については、改正前民法が適用され、ＡとＣとの間の債権譲渡契約は無効となる。","③":"Ａは、2020年3月1日に、Ｂとの間で、定型取引(注)に係る契約を締結した。この場合において、2020年3月31日以前に、Ａ又はＢが書面又は電磁的記録により反対の意思を表示していないときは、当該契約については、改正民法が適用される。","④":"Ａは、2010年5月1日に、Ｂとの間で、金銭消費貸借契約を締結しＢに10万円を貸し付けた。ＢがＡに借入金を返済していない場合において、2020年4月15日に天災その他避けることのできない事変が生じた。この場合、天災等による時効の完成猶予については、改正民法が適用され、その障害が消滅した時から3か月を経過するまでの間は、時効は、完成しない。"},"note":"(注) 定型取引とは、改正民法第548条の2（定型約款の合意）第1項に規定する定型取引（ある特定の者が不特定多数の者を相手方として行う取引であって、その内容の全部又は一部が画一的であることがその双方にとって合理的なもの）をいう。","answer":2,"format":"single","negative":true},{"id":"R15-43","kai":15,"era":"令和2年度","num":43,"sectionShort":"資金需要者保護","stem":"個人情報の保護に関する法律についてのガイドライン（通則編）に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"個人情報取扱事業者は、個人情報を取り扱うに当たっては、その利用の目的（以下、本問において「利用目的」という。）をできる限り特定しなければならない。例えば、「マーケティング活動に用いるため」という記載は、具体的に利用目的を特定している事例に該当する。","②":"個人情報取扱事業者は、あらかじめ本人の同意を得ないで、個人情報の保護に関する法律第15条の規定により特定された利用目的の達成に必要な範囲を超えて、個人情報を取り扱ってはならない。なお、当該同意を得るために個人情報を利用することは、当初特定した利用目的としてその旨が記載されていない場合には、目的外利用に該当する。","③":"個人情報取扱事業者は、あらかじめその利用目的を公表していない場合であっても、インターネット上で本人が自発的に公にしている個人情報を取得したときは、その利用目的を、本人に通知し、又は公表する必要はない。","④":"個人情報取扱事業者は、例えば、アンケートに記載された個人情報を直接本人から取得する場合等、本人から直接書面に記載された当該本人の個人情報を取得する場合は、あらかじめ、本人に対し、その利用目的を明示しなければならない。ただし、人の生命、身体又は財産の保護のために緊急に必要がある場合は、この限りでない。"},"note":"","answer":4,"format":"single","negative":false},{"id":"R15-44","kai":15,"era":"令和2年度","num":44,"sectionShort":"資金需要者保護","stem":"消費者契約法に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"消費者契約法の適用がある取引については、消費者には、消費者契約法に基づき、契約の申込み又は契約の締結後一定の期間内であれば、無条件に当該契約の申込みを撤回し又は当該契約を解除することができる権利であるクーリング・オフを行使する権利が認められている。","②":"事業者が、消費者契約の締結について勧誘をするに際し、勧誘をしている場所から退去する旨の意思を消費者が示したにもかかわらず、当該消費者を退去させないなど、消費者を困惑させることにより当該消費者契約を締結した場合、消費者契約法第2条（定義）第4項に規定する適格消費者団体には、当該消費者契約についての取消権が認められている。","③":"消費者契約法に基づき消費者に認められる取消権は、追認をすることができる時から1年間行わないときは、時効によって消滅する。当該消費者契約の締結の時から5年を経過したときも、同様とする。","④":"消費者契約の解除に伴う損害賠償の額を予定する条項であって、その額が、当該条項において設定された解除の事由、時期等の区分に応じ、当該消費者契約と同種の消費者契約の解除に伴い当該事業者に生ずべき平均的な損害の額を超えるものは、当該条項そのものを無効とする。"},"note":"","answer":3,"format":"single","negative":false},{"id":"R15-45","kai":15,"era":"令和2年度","num":45,"sectionShort":"資金需要者保護","stem":"日本貸金業協会が定める貸金業の業務運営に関する自主規制基本規則に規定する「広告及び勧誘に関する規制」についての次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"協会員は、債務者等に対して貸付けの契約に係る勧誘を行うに際しては、例えば、店頭窓口において口頭での承諾の事実を確認し、当該承諾に係る記録を作成及び保管する方法により、当該債務者等から当該勧誘を行うことについての承諾を得なければならない。","②":"協会員は、勧誘リスト等を作成するにあたっては、当該勧誘リストに指定信用情報機関の信用情報を記載し、勧誘対象者に対する過剰貸付けの防止に努めなければならない。","③":"協会員は、ギャンブル専門紙及びギャンブル専門誌へ個人向け貸付けの契約に係る広告を出稿するにあたっては、安易な借入れを助長する表現、又はその疑いのある表現を排除することに留意しなければならない。","④":"協会員は、新聞、雑誌又は電話帳へ個人向け貸付けの契約に係る広告を出稿するにあたって、比較広告を行う場合には、求めに応じてその裏付けとなる根拠を説明することができる態勢を整備するとともに、その説明に必要となる資料等を作成し、保管するといった適切な措置を講じなければならない。"},"note":"","answer":1,"format":"single","negative":false},{"id":"R15-46","kai":15,"era":"令和2年度","num":46,"sectionShort":"資金需要者保護","stem":"不当景品類及び不当表示防止法（以下、本問において「景品表示法」という。）に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"表示とは、顧客を誘引するための手段として、事業者が自己の供給する商品又は役務の内容又は取引条件その他これらの取引に関する事項について行う広告その他の表示であって、内閣総理大臣が指定するものをいう。","②":"内閣総理大臣は、景品表示法第4条（景品類の制限及び禁止）の規定による制限もしくは禁止又は同法第5条（不当な表示の禁止）の規定に違反する行為があるときは、当該事業者に対し、その行為の差止めもしくはその行為が再び行われることを防止するために必要な事項又はこれらの実施に関連する公示その他必要な事項を命ずることができる。ただし、その命令は、当該違反行為が既になくなっている場合にはすることができない。","③":"内閣総理大臣は、景品表示法第7条（措置命令）第1項の規定による命令に関し、事業者がした表示が同法第5条（不当な表示の禁止）第1号に該当する表示（以下、本問において「優良誤認表示」という。）か否かを判断するため必要があると認めるときは、当該表示をした事業者に対し、期間を定めて、当該表示の裏付けとなる合理的な根拠を示す資料の提出を求めることができる。この場合において、当該事業者が当該資料を提出しないときは、同法第7条第1項の規定の適用については、当該表示は優良誤認表示とみなされる。","④":"内閣総理大臣は、事業者が正当な理由がなくて景品表示法第26条（事業者が講ずべき景品類の提供及び表示の管理上の措置）第1項の規定に基づき事業者が講ずべき措置を講じていないと認めるときは、当該事業者に対し、景品類の提供又は表示の管理上必要な措置を講ずべき旨の勧告をすることができる。内閣総理大臣は、当該勧告を行った場合において当該事業者がその勧告に従わないときは、その旨を公表することができる。"},"note":"","answer":2,"format":"single","negative":true},{"id":"R15-47","kai":15,"era":"令和2年度","num":47,"sectionShort":"資金需要者保護","stem":"日本貸金業協会が定める紛争解決等業務に関する規則についての次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"契約者等(注1)による紛争解決手続開始の申立てが受理され、相手方に対してその旨の通知がなされた場合、当該通知を受けた協会員等(注2)は、正当な理由がある場合を除き、紛争解決手続に応じなければならない。","②":"紛争解決委員は、当事者もしくは参考人から意見を聴取し、もしくは文書もしくは口頭による報告を求め、又は当事者から参考となるべき帳簿書類その他の物件の提出もしくは提示を求めることができる。","③":"紛争解決委員は、申立てに係る紛争の解決に必要な和解案を作成し、当事者に対し提示して、その受諾を勧告することができる。当事者双方が紛争解決委員の和解案を受諾したときは、裁判所に届け出ることにより、当該和解案の内容で和解が成立したものとされる。","④":"紛争解決委員は、和解案の受諾の勧告によっては当事者間に和解が成立する見込みがない場合において、事案の性質、当事者の意向、当事者の手続追行の状況その他の事情に照らして相当であると認めるときは、貸金業務関連紛争の解決のために必要な特別調停案を作成し、理由を付して当事者に提示することができる。"},"note":"(注1)契約者等とは、顧客等、債務者等もしくは債務者等であったもの又はその一般承継人をいう。(注2)協会員等とは、日本貸金業協会の会員及び日本貸金業協会と手続実施基本契約を締結した貸金業者をいう。","answer":3,"format":"single","negative":true},{"id":"R15-48","kai":15,"era":"令和2年度","num":48,"sectionShort":"財務会計","stem":"損益計算書に関する次の図表の空欄ａ～ｃに当てはまる語句の組み合わせとして適切なものを、次の①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"ａ-売上総利益ｂ-営業利益ｃ-経常利益","②":"ａ-経常利益ｂ-営業利益ｃ-売上総利益","③":"ａ-売上総利益ｂ-粗利益ｃ-経常利益","④":"ａ-粗利益ｂ-売上総利益ｃ-営業利益"},"note":"","answer":1,"table":{"title":"損益計算書","caption":"自平成31年4月1日 至令和2年3月31日（単位：百万円）","head":["科目","金額"],"rows":[["売上高","3,850"],["売上原価","2,950"],["（ａ）","900"],["販売費及び一般管理費","730"],["（ｂ）","170"],["営業外費用","20"],["営業外収益","3"],["（ｃ）","153"],["特別利益","0"],["特別損失","1"],["税引前当期純利益","152"],["法人税等","80"],["当期純利益","72"]]},"format":"single","negative":false},{"id":"R15-49","kai":15,"era":"令和2年度","num":49,"sectionShort":"財務会計","stem":"企業会計原則（大蔵省企業会計審議会発表）の一般原則に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"企業会計は、企業の財政状態及び経営成績に関して、真実な報告を提供するものでなければならない。これを一般に真実性の原則という。","②":"企業会計は、財務諸表によって、利害関係者に対し必要な会計事実を明瞭に表示し、企業の状況に関する判断を誤らせないようにしなければならない。これを一般に明瞭性の原則という。","③":"企業の財政状態に影響を及ぼす多額の取引については、その取引の内容をできる限り詳細かつ堅実に注記しなければならない。これを一般に堅実性の原則という。","④":"株主総会提出のため、信用目的のため、租税目的のため等種々の目的のために異なる形式の財務諸表を作成する必要がある場合、それらの内容は、信頼し得る会計記録に基づいて作成されたものであって、政策の考慮のために事実の真実な表示をゆがめてはならない。これを一般に単一性の原則という。"},"note":"","answer":3,"format":"single","negative":true},{"id":"R15-50","kai":15,"era":"令和2年度","num":50,"sectionShort":"財務会計","stem":"会社計算規則に規定する貸借対照表等(注)に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"固定資産に係る項目は、有形固定資産、無形固定資産及び投資その他の資産に区分しなければならない。","②":"資産の部は、流動資産、固定資産及び金融資産に区分しなければならない。","③":"長期借入金は、固定負債に属するものとされている。","④":"未払費用は、流動負債に属するものとされている。"},"note":"(注) 貸借対照表等とは、貸借対照表及び連結貸借対照表をいう。","answer":2,"format":"single","negative":true},{"id":"R16-01","kai":16,"era":"令和3年度","num":1,"sectionShort":"法令","stem":"貸金業法上の用語の定義等に関する次のａ～ｄの記述のうち、その内容が適切なものの個数を①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"貸金業とは、金銭の貸付け又は金銭の貸借の媒介（手形の割引、売渡担保その他これらに類する方法によってする金銭の交付又は当該方法によってする金銭の授受の媒介を含む。）で業として行うものをいうが、貸金業から除かれるものの1つとして、物品の売買、運送、保管又は売買の媒介を業とする者がその取引に付随して行うものがある。","ｂ":"債務者等とは、債務者又は債務者であった者をいい、保証人及び保証人であった者は債務者等に含まれない。","ｃ":"貸付けの契約とは、貸付けに係る契約又は当該契約に係る保証契約であって、資金需要者等の利益を損なうおそれがないと認められるものをいう。","ｄ":"手続実施基本契約とは、紛争解決等業務の実施に関し、指定紛争解決機関、紛争当事者である貸金業者及び資金需要者等の三者間で締結される契約をいう。"},"options":{"①":"1個","②":"2個","③":"3個","④":"4個"},"note":"","answer":1,"format":"count","negative":false},{"id":"R16-02","kai":16,"era":"令和3年度","num":2,"sectionShort":"法令","stem":"貸金業者の登録等に関する次のａ～ｄの記述のうち、その内容が適切なものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"貸金業を営もうとする者は、2つ以上の都道府県の区域内に営業所又は事務所を設置してその事業を営もうとする場合にあっては、その本店の所在地を管轄する都道府県知事を経由して内閣総理大臣の登録の申請をしなければならない。","ｂ":"貸金業者は、貸金業の登録の更新を受けようとするときは、その者が現に受けている貸金業の登録の有効期間満了の日の2か月前までに当該登録の更新を申請しなければならない。","ｃ":"貸金業の登録を受けるための登録申請書には、営業所又は事務所ごとに置かれる貸金業務取扱主任者の氏名及び住所を記載しなければならない。","ｄ":"貸金業の登録は、3年ごとにその更新を受けなければ、その期間の経過によって、その効力を失う。"},"options":{"①":"ａｂ","②":"ａｃ","③":"ｂｄ","④":"ｃｄ"},"note":"","answer":3,"format":"combo","negative":false},{"id":"R16-03","kai":16,"era":"令和3年度","num":3,"sectionShort":"法令","stem":"貸金業法第8条（変更の届出）に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"貸金業者は、その商号、名称又は氏名を変更しようとする場合は、あらかじめ、その旨をその登録をした内閣総理大臣又は都道府県知事（以下、本問において「登録行政庁」という。）に届け出なければならない。","②":"貸金業者は、その業務に関して広告又は勧誘をする際に表示等をする営業所又は事務所の電話番号（場所を特定するもの並びに当該場所を特定するものに係る着信課金サービス及び統一番号サービスに係るものに限る。）を変更しようとする場合は、あらかじめ、その旨を登録行政庁に届け出なければならない。","③":"貸金業者は、その業務の種類及び方法を変更しようとする場合は、あらかじめ、その旨を登録行政庁に届け出なければならない。","④":"貸金業者は、貸金業の他に事業を行っている場合において、その事業の種類を変更しようとするときは、あらかじめ、その旨を登録行政庁に届け出なければならない。"},"note":"","answer":2,"format":"single","negative":false},{"id":"R16-04","kai":16,"era":"令和3年度","num":4,"sectionShort":"法令","stem":"貸金業者向けの総合的な監督指針（以下、本問において「監督指針」という。）において、監督当局が貸金業者を監督するに当たっての主な着眼点とされている事項に関する次のａ～ｄの記述のうち、その内容が適切なものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"監督指針によれば、社内規則等(注)については、貸金業者のそれぞれの規模・特性に応じて、創意・工夫を生かし、法令及び法の趣旨を踏まえ自主的に策定する必要があるとされており、協会員が策定する社内規則等は、貸金業協会の自主規制規則に則った内容となっている必要があるが、非協会員が策定する社内規則等は、その独自性に配慮し、貸金業協会の策定する自主規制規則に則った内容である必要はないこと、などが着眼点とされている。","ｂ":"監督指針によれば、「内部管理部門」とは、法令及び社内規則等を遵守した業務運営を確保するための内部事務管理部署、法務部署等をいうが、内部管理部門において、業務運営全般に関し、法令及び社内規則等に則った適正な業務を遂行するための適切なモニタリング・検証が行われているか、また、重大な問題等を確認した場合、経営陣に対し適切に報告が行われているか、などが着眼点とされている。","ｃ":"監督指針によれば、他に貸金業の業務に従事する者がいない個人の貸金業者においては、当該個人が貸金業法に規定された主任者（同法第24条の25第1項の登録を受けた貸金業務取扱主任者をいう。）であることをかんがみ、内部監査に代わる措置として自己の行う貸金業に関する業務の検証を行う場合には、自己検証を実施する頻度が少なくとも年3回以上となっているか等の点を踏まえ、業務の適切性を確保するために十分な態勢を整備しているか、などが着眼点とされている。","ｄ":"監督指針によれば、貸金業者の経営陣は、利益相反が生じる可能性のある業務に係る内部牽制や営業店長の権限に応じた監視などについて、内部管理部門が顧客対応を行う部署に対し、適切な業務運営を確保するためのモニタリング・検証及び改善策の策定等を行う態勢を整備しているか、などが着眼点とされている。"},"options":{"①":"ａｂ","②":"ａｃ","③":"ｂｄ","④":"ｃｄ"},"note":"(注) 社内規則等とは、貸金業協会の定款、業務規程、その他の規則を考慮し、当該貸金業者又はその役員もしくは使用人が遵守すべき規則をいう。","answer":3,"format":"combo","negative":false},{"id":"R16-05","kai":16,"era":"令和3年度","num":5,"sectionShort":"法令","stem":"貸金業法第12条の4第1項に規定する証明書（以下、本問において「証明書」という。）の携帯に関する次のａ～ｄの記述のうち、その内容が適切なものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"貸金業者Ａは、その従業者ＢをＡの営業所又は事務所において資金需要者等と対面することなく行うシステム管理の業務に従事させる場合、Ｂに証明書を携帯させる必要はない。","ｂ":"貸金業者Ａは、その従業者Ｃを資金需要者等の勧誘を伴わない広告のみを行う業務に従事させる場合、Ｃに証明書を携帯させなければならない。","ｃ":"貸金業者Ａは、労働者派遣事業を行う事業主Ｄから派遣労働者Ｅの派遣を受けてＥをＡの貸金業の業務に従事させる場合、Ｅに証明書を携帯させる必要はない。","ｄ":"貸金業者Ａは、委託先Ｆに貸金業の業務を委託した場合において、Ｆの従業者Ｇがその貸金業の業務に従事するときは、Ｇに証明書を携帯させなければならない。"},"options":{"①":"ａｂ","②":"ａｄ","③":"ｂｃ","④":"ｃｄ"},"note":"","answer":2,"format":"combo","negative":false},{"id":"R16-06","kai":16,"era":"令和3年度","num":6,"sectionShort":"法令","stem":"次のａ～ｄの記述のうち、貸金業者向けの総合的な監督指針において、貸金業法第12条の6（禁止行為）第4号に規定する「偽りその他不正又は著しく不当な行為」に該当するおそれが大きいとされているものの個数を①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"貸金業者が、契約の締結又は変更に際して、貸付け金額に比し、合理的理由がないのに、過大な担保又は保証人を徴求すること。","ｂ":"貸金業者が、資金需要者等が身体的・精神的な障害等により契約の内容が理解困難なことを認識しながら、契約を締結すること。","ｃ":"資金需要者等が障害者である場合であって、その家族や介助者等のコミュニケーションを支援する者が存在する場合に、貸金業者が、当該支援者を通じて資金需要者等に契約内容を理解してもらう等の努力をすることなく、単に障害があることを理由として契約締結を拒否すること。","ｄ":"貸金業者が、確定判決において消費者契約法第8条から第10条までの規定に該当し無効であると評価され、当該判決確定の事実が消費者庁、独立行政法人国民生活センター又は同法に規定する適格消費者団体によって公表されている条項と、内容が同一である条項を含む貸付けに係る契約（消費者契約に限る。）を締結すること。"},"options":{"①":"1個","②":"2個","③":"3個","④":"4個"},"note":"","answer":4,"format":"count","negative":false},{"id":"R16-07","kai":16,"era":"令和3年度","num":7,"sectionShort":"法令","stem":"次のａ～ｄの記述のうち、貸金業法第13条の2第2項に規定する年間の給与及びこれに類する定期的な収入の金額として内閣府令で定めるものに該当するものの個数を①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"年間の年金の金額","ｂ":"年間の投資信託の分配金（事業として行う場合を除く。）の金額","ｃ":"年間の定期的に受領する不動産の賃貸収入（事業として行う場合を除く。）の金額","ｄ":"年間の事業所得の金額（過去の事業所得の状況に照らして安定的と認められるものに限る。）"},"options":{"①":"1個","②":"2個","③":"3個","④":"4個"},"note":"","answer":3,"format":"count","negative":false},{"id":"R16-08","kai":16,"era":"令和3年度","num":8,"sectionShort":"法令","stem":"貸金業法第13条の2（過剰貸付け等の禁止）第2項に規定する個人過剰貸付契約から除かれる契約として貸金業法施行規則第10条の21に定める契約（以下、本問において「除外契約」という。）に関する次のａ～ｄの記述のうち、その内容が適切なものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"不動産の改良に必要な資金の貸付けに係る契約は、当該不動産を担保としない場合であっても、除外契約に該当する。","ｂ":"不動産の購入に必要な資金の貸付けに係る契約に係る貸付け（以下「不動産購入に係る貸付け」という。）が行われるまでのつなぎとして行う貸付けに係る契約は、当該不動産購入に係る貸付けが金融機関（預金保険法第2条第1項に規定する金融機関をいう。）でない者によって行われる場合であっても、除外契約に該当する。","ｃ":"売却を予定している個人顧客の不動産の売却代金により弁済される貸付けに係る契約は、貸付けの金額が当該貸付けに係る契約の締結時における当該不動産の価格を超える場合であっても、除外契約に該当する。","ｄ":"自動車の購入に必要な資金の貸付けに係る契約は、当該自動車の所有権を貸金業者が取得せず、かつ、当該自動車が譲渡担保の目的となっていない場合であっても、除外契約に該当する。"},"options":{"①":"ａｂ","②":"ａｃ","③":"ｂｄ","④":"ｃｄ"},"note":"","answer":1,"format":"combo","negative":false},{"id":"R16-09","kai":16,"era":"令和3年度","num":9,"sectionShort":"法令","stem":"株式会社である貸金業者Ａが個人顧客Ｂとの間で極度方式基本契約（以下、本問において「本件基本契約」という。）を締結している場合において、Ａが貸金業法第13条の3に基づいて行う本件基本契約が基準額超過極度方式基本契約に該当するかどうかの調査（以下、本問において「本件調査」という。）に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。なお、Ａは、Ｂとの間で本件基本契約以外の極度方式基本契約を締結していないものとする。","statements":{},"options":{"①":"Ａは、本件基本契約の契約期間を本件基本契約の締結日から同日以後1か月以内の一定の期日までの期間及び当該一定の期日の翌日以後1か月ごとの期間に区分したそれぞれの期間（以下、本問において「所定の期間」という。）において、直近の所定の期間内にＡが行った本件基本契約に基づく極度方式貸付けの金額の合計額が5万円であっても、当該所定の期間の末日における本件基本契約に基づく極度方式貸付けの残高の合計額が10万円を超える場合、本件調査を行わなければならない。","②":"Ａは、本件調査を行わなければならない場合において、Ｂに係る極度方式個人顧客合算額が70万円であるときは、当該調査を行うに際し、既にＢから源泉徴収票その他のＢの収入又は収益その他の資力を明らかにする事項を記載し、又は記録した書面又は電磁的記録として内閣府令で定めるものの提出又は提供を受けているときを除き、その提出又は提供を受けなければならない。","③":"Ａは、3か月以内の一定の期間の末日において、貸金業法第13条の4に基づき、本件基本契約が基準額超過極度方式基本契約に該当しないようにするため必要な本件基本契約の極度額の減額に係る措置を講じていた場合、本件調査を行う必要はない。","④":"Ａは、本件基本契約に基づく新たな極度方式貸付けの停止に係る措置を講じている場合において、当該措置を解除しようとするときは、本件調査を行わなければならない。"},"note":"","answer":4,"format":"single","negative":false},{"id":"R16-10","kai":16,"era":"令和3年度","num":10,"sectionShort":"法令","stem":"貸付条件の広告に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"貸金業者が貸付けの条件について広告をする場合において、貸金業者登録簿に登録されたホームページアドレスを表示するときは、貸金業者登録簿に登録された電話番号についても表示しなければならない。","②":"貸金業者が貸付けの条件について広告をするときは、主な返済例について表示しなければならない。","③":"日本貸金業協会が定める貸金業の業務運営に関する自主規制基本規則（以下、本問において「自主規制規則」という。）では、協会員は、新聞、雑誌又は電話帳へ個人向け貸付けの契約に係る広告を出稿するにあたっては、その表現内容に関し、安易な借入れを助長する表現、又はその疑いのある表現を排除すること、比較広告を行う場合には合理的根拠に基づかなければならないこと、ホームページアドレスを表示する場合には当該ホームページに返済シミュレーションを備えること、に留意しなければならないとされている。","④":"自主規制規則では、協会員は、ギャンブル専門紙及びギャンブル専門誌に個人向け貸付けの契約に係る広告を出稿するにあたっては、過剰借入れへの注意喚起を目的とし、貸付条件の確認、使い過ぎ、借り過ぎへの注意、及び計画的な借入れにつき、啓発文言を入れなければならないとされている。"},"note":"","answer":1,"format":"single","negative":false},{"id":"R16-11","kai":16,"era":"令和3年度","num":11,"sectionShort":"法令","stem":"貸金業法第16条の2（契約締結前の書面の交付）に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。なお、本問における極度方式基本契約及び極度方式貸付けに係る契約は、金銭の貸付けに係る契約であって、手形の割引の契約及び売渡担保の契約ではないものとする。","statements":{},"options":{"①":"貸金業者が、極度方式基本契約を締結しようとする場合に、当該基本契約の相手方となろうとする者に交付すべき貸金業法第16条の2第2項に規定する書面（以下、本問において「極度方式基本契約における契約締結前の書面」という。）の記載事項には、当該基本契約に関し貸金業者が受け取る書面の内容が含まれるが、債務者が負担すべき元本及び利息以外の金銭に関する事項は含まれない。","②":"貸金業者が、極度方式基本契約を締結しようとする場合に、当該基本契約の相手方となろうとする者に交付すべき極度方式基本契約における契約締結前の書面の記載事項には、貸金業者の商号、名称又は氏名及び住所並びにその登録番号（登録番号の括弧書については、記載を省略することができる。）が含まれるが、契約の相手方の商号、名称又は氏名及び住所は含まれない。","③":"貸金業者は、極度方式基本契約を締結しようとする場合に、当該基本契約の相手方となろうとする者に交付すべき極度方式基本契約における契約締結前の書面については、当該相手方となろうとする者の承諾の有無を問わず、当該書面の記載事項を電磁的方法により提供することはできない。","④":"貸金業者は、極度方式基本契約を締結している顧客との間で極度方式貸付けに係る契約を締結しようとする場合には、当該契約を締結するまでに、内閣府令で定めるところにより、貸金業法第16条の2第1項に規定する書面（契約締結前の書面）を当該顧客に交付しなければならない。"},"note":"","answer":2,"format":"single","negative":false},{"id":"R16-12","kai":16,"era":"令和3年度","num":12,"sectionShort":"法令","stem":"貸金業者が貸金業法に基づき保存すべきものに関する次のａ～ｄの記述のうち、その内容が適切なものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"貸金業者は、貸金業法第12条の4（証明書の携帯等）第2項の規定により営業所又は事務所（以下、本問において「営業所等」という。）ごとに備えた従業者名簿を、当該営業所等を廃止するまでの間保存しなければならない。","ｂ":"貸金業者は、個人顧客との間で貸付けに係る契約を締結した場合、内閣府令で定めるところにより、当該個人顧客の返済能力の調査に関する記録をその作成後3年間保存しなければならない。","ｃ":"貸金業者は、個人顧客との間で締結した貸付けの契約（極度方式基本契約及び極度方式貸付けに係る契約ではないものとする。）に係る貸金業法第19条の帳簿を、当該契約に定められた最終の返済期日（当該契約に基づく債権が弁済その他の事由により消滅したときにあっては、当該債権の消滅した日）から少なくとも10年間保存しなければならない。","ｄ":"加入貸金業者(注)は、貸金業法第41条の36（指定信用情報機関への信用情報の提供等に係る同意の取得等）第3項及び貸金業法施行規則第30条の15（信用情報の提供等に係る配偶者の同意の取得等）第3項に規定する同意に関する記録を、当該同意に基づき指定信用情報機関が信用情報を保有している間保存しなければならない。"},"options":{"①":"ａｂ","②":"ａｃ","③":"ｂｄ","④":"ｃｄ"},"note":"(注) 加入貸金業者とは、指定信用情報機関と信用情報提供契約を締結した相手方である貸金業者をいう。","answer":4,"format":"combo","negative":false},{"id":"R16-13","kai":16,"era":"令和3年度","num":13,"sectionShort":"法令","stem":"指定信用情報機関への信用情報の提供等に関する次のａ～ｄの記述のうち、その内容が適切なものの個数を①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。なお、本問における貸金業者は、非営利特例対象法人及び特定非営利金融法人ではないものとする。","statements":{"ａ":"加入貸金業者(注1)は、加入指定信用情報機関(注2)に資金需要者等に係る信用情報の提供の依頼（当該資金需要者等に係る他の指定信用情報機関が保有する個人信用情報の提供の依頼を含む。）をする場合には、内閣府令で定める場合を除き、あらかじめ、当該資金需要者等から書面又は電磁的方法による同意を得なければならない。","ｂ":"加入貸金業者は、資金需要者である個人の顧客を相手方とする極度方式基本契約を締結したときは、遅滞なく、当該極度方式基本契約に係る個人信用情報を、加入指定信用情報機関に提供しなければならない。","ｃ":"加入貸金業者は、加入指定信用情報機関の商号又は名称を公表しなければならない。","ｄ":"貸金業者向けの総合的な監督指針によれば、例えば、途上与信(注3)を行うために取得した信用情報を債権の保全を目的として利用した場合には返済能力の調査以外の目的による使用に該当しないが、当該信用情報を勧誘に二次利用した場合には返済能力の調査以外の目的による使用に該当することに留意する必要があるとされている。"},"options":{"①":"1個","②":"2個","③":"3個","④":"4個"},"note":"(注1) 加入貸金業者とは、指定信用情報機関と信用情報提供契約を締結した相手方である貸金業者をいう。(注2) 加入指定信用情報機関とは、加入貸金業者と信用情報提供契約を締結した指定信用情報機関をいう。(注3)途上与信とは、貸金業法第13条の3第1項及び第2項の規定に基づく調査をいう。","answer":2,"format":"count","negative":false},{"id":"R16-14","kai":16,"era":"令和3年度","num":14,"sectionShort":"法令","stem":"みなし利息に関する次のａ～ｄの記述のうち、利息制限法上、その内容が適切なものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"貸金業者は、顧客との間で締結した営業的金銭消費貸借契約において、金銭の貸付け及び弁済に用いるカードを交付した後、当該顧客の要請を受けて、当該カードを再発行し、再発行に係る手数料（消費税額等相当額を含むものとする。）を当該顧客から受領した。この場合、当該手数料は、利息とみなされる。","ｂ":"貸金業者は、顧客との間で締結した営業的金銭消費貸借契約において、口座振替の方法による弁済につき、当該顧客が弁済期に弁済できなかったため、当該顧客の要請を受けて行った再度の口座振替手続に要した費用（消費税額等相当額を含むものとする。）を当該顧客から受領した。この場合、当該費用は、利息とみなされる。","ｃ":"貸金業者は、顧客との間で締結した営業的金銭消費貸借契約において、顧客が金銭の受領又は弁済のために利用する現金自動支払機その他の機械の利用料として、20,000円の弁済を受領する際に220円（消費税額等相当額を含むものとする。）を当該顧客から受領した。この場合、当該利用料は、利息とみなされない。","ｄ":"貸金業者は、顧客との間で締結した営業的金銭消費貸借契約において、貸金業法第17条第1項に規定する契約の内容を明らかにする書面を交付した後、当該顧客からの紛失による再発行の要請に基づき、当該書面を再発行し、その手数料（消費税額等相当額を含むものとする。）を当該顧客から受領した。この場合、当該手数料は、利息とみなされない。"},"options":{"①":"ａｂ","②":"ａｃ","③":"ｂｄ","④":"ｃｄ"},"note":"","answer":4,"format":"combo","negative":false},{"id":"R16-15","kai":16,"era":"令和3年度","num":15,"sectionShort":"法令","stem":"株式会社であるＡが貸金業の登録の申請をした場合に関する次の①～④の記述のうち、その事由が貸金業法第6条（登録の拒否）第1項各号のいずれにも該当しないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"Ａの取締役の中に、精神の機能の障害のため貸金業に係る職務を適正に執行するに当たって必要な認知、判断及び意思疎通を適切に行うことができない者がいる。","②":"Ａの取締役の中に、破産手続開始の決定を受け復権した日から5年を経過しない者がいる。","③":"Ａの政令で定める使用人の中に、貸金業法の規定に違反し、罰金の刑に処せられ、その刑の執行を終わった日から5年を経過しない者がいる。","④":"Ａの政令で定める使用人の中に、貸金業法第24条の6の4（監督上の処分）第1項の規定により貸金業の登録を取り消されたＢ株式会社において、当該取消しの日にＢ株式会社の取締役であった者で、当該取消しの日から5年を経過しないものがいる。"},"note":"","answer":2,"format":"single","negative":true},{"id":"R16-16","kai":16,"era":"令和3年度","num":16,"sectionShort":"法令","stem":"貸金業者向けの総合的な監督指針において、顧客等に関する情報管理態勢について、監督当局が、貸金業者の監督に当たって留意するものとされている事項に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"クレジットカード情報等について、利用目的その他の事情を勘案した適切な保存期間を設定し、保存場所を限定し、保存期間経過後適切かつ速やかに廃棄しているか。業務上必要とする場合を除き、クレジットカード情報等をコンピューター画面に表示する際には、カード番号を全て表示させない等の適切な措置を講じているか。独立した内部監査部門において、クレジットカード情報等を保護するためのルール及びシステムが有効に機能しているかについて、定期的又は随時に内部監査を行っているか。","②":"法人関係情報を利用したインサイダー取引等の不公正な取引の防止に係る着眼点として、法人関係情報を入手し得る立場にある役職員が当該法人関係情報に関連する有価証券の売買その他の取引等を行った際には報告を義務付ける等、不公正な取引を防止するための適切な措置を講じているか。","③":"個人データの第三者提供に関して、特に、その業務の性質や方法に応じて、第三者提供の同意の取得にあたって、優越的地位の濫用や個人である資金需要者等との利益相反等の弊害が生じるおそれがないよう留意しているか。例えば、個人である資金需要者等が、第三者提供先や第三者提供先における利用目的、提供される情報の内容について、過剰な範囲の同意を強いられる等していないか。","④":"顧客等に関する情報管理態勢に係る着眼点として、顧客等に関する情報へのアクセス管理の権限等を複数の役職員に分散させることなく特定の役職員に集中させ、幅広い権限等を有する当該特定の役職員の責任において適切な管理を行わせる等、顧客等に関する情報を利用した不正行為を防止するための適切な措置を図っているか。"},"note":"","answer":4,"format":"single","negative":true},{"id":"R16-17","kai":16,"era":"令和3年度","num":17,"sectionShort":"法令","stem":"貸金業務取扱主任者に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"貸金業者は、営業所又は事務所（以下、本問において「営業所等」という。）ごとに、内閣府令で定めるところにより、営業所等において貸金業の業務に従事する者の数に対する貸金業務取扱主任者の数の割合が50分の1以上となる数の貸金業務取扱主任者を置かなければならない。","②":"貸金業者向けの総合的な監督指針によれば、貸金業務取扱主任者が営業所等に常時勤務する者と認められるには、社会通念に照らし、常時勤務していると認められるだけの実態が必要であり、当該営業所等の営業時間内に当該営業所等に常時駐在している必要があるとされている。","③":"内閣総理大臣は、貸金業務取扱主任者がその職務に関し貸金業に関する法令の規定に違反したとき、又は著しく不適当な行為を行ったときは、当該貸金業務取扱主任者の主任者登録を取り消すことができる。","④":"貸金業者は、貸金業の業務を行うに当たり資金需要者等からの請求があったときは、当該業務を行う営業所等の貸金業務取扱主任者の氏名を明らかにしなければならない。"},"note":"","answer":2,"format":"single","negative":true},{"id":"R16-18","kai":16,"era":"令和3年度","num":18,"sectionShort":"法令","stem":"貸金業法第13条に規定する返済能力の調査に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。なお、本問における貸金業者は、非営利特例対象法人及び特定非営利金融法人ではないものとする。","statements":{},"options":{"①":"貸金業者であるＡは、法人であるＢとの間で、貸付けに係る契約を締結しようとする場合、Ｂの返済能力の調査を行うに際し、指定信用情報機関が保有する信用情報を使用する必要はない。","②":"貸金業者であるＡは、法人であるＢとの間の貸付けに係る契約について、個人であるＣとの間で、保証契約を締結しようとする場合、Ｃの返済能力の調査を行うに際し、指定信用情報機関が保有する信用情報を使用しなければならない。","③":"貸金業者であるＡは、個人であるＢとの間で、他の貸金業者Ｃを債権者とする金銭の貸借の媒介に係る契約を締結しようとする場合、Ｂの返済能力の調査を行うに際し、指定信用情報機関が保有する信用情報を使用する必要はない。","④":"貸金業者であるＡは、個人であるＢとの間で、極度方式貸付けに係る契約を締結しようとする場合、Ｂの返済能力の調査を行うに際し、指定信用情報機関が保有する信用情報を使用しなければならない。"},"note":"","answer":4,"format":"single","negative":true},{"id":"R16-19","kai":16,"era":"令和3年度","num":19,"sectionShort":"法令","stem":"貸金業者であるＡは、個人顧客であるＢとの間で極度額を50万円とする極度方式基本契約（以下、本問において「本件基本契約」という。）を締結した。Ａは、Ｂとの間で本件基本契約以外の貸付けに係る契約を締結していない。この場合に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"Ａは、Ｂとの間の合意に基づき、極度額を100万円に増額した場合、その2年前にＢから源泉徴収票の提出を受けているときは、Ｂから源泉徴収票その他の当該顧客の収入又は収益その他の資力を明らかにする事項を記載し、又は記録した書面又は電磁的記録として内閣府令で定めるものの提出又は提供を受ける必要はない。","②":"Ａは、Ｂに返済能力の低下が認められたことを理由に極度額を一時的に10万円に減額した後、Ｂとの間の合意に基づき、極度額を、本件基本契約を締結した当初の極度額に戻そうとする場合、Ｂの返済能力の調査を行わなければならない。","③":"Ａは、Ｂに返済能力の低下は認められないが、Ｂと連絡することができないために、極度額を一時的に20万円に減額した。その後、Ａは、Ｂと連絡することができたことにより、極度額を、本件基本契約を締結した当初の極度額に戻そうとする場合、Ｂの返済能力の調査を行う必要はない。","④":"Ａは、Ｂとの間の合意に基づき、極度額を100万円に増額した場合、内閣府令で定めるところにより、極度額を増額した年月日、Ｂの資力に関する調査の結果等、Ｂの返済能力の調査に関する記録を作成し、これを保存しなければならない。"},"note":"","answer":1,"format":"single","negative":true},{"id":"R16-20","kai":16,"era":"令和3年度","num":20,"sectionShort":"法令","stem":"貸金業法第13条の2（過剰貸付け等の禁止）第2項に規定する個人顧客の利益の保護に支障を生ずることがない契約として貸金業法施行規則第10条の23で定めるもの（以下、本問において「例外契約」という。）に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"例外契約に係る貸付けの残高は、貸金業法第13条の2第2項に規定する個人顧客合算額に算入される。","②":"金融機関（預金保険法第2条第1項に規定する金融機関をいう。）からの貸付け（以下、本問において「正規貸付け」という。）が行われるまでのつなぎとして行う貸付けに係る契約（極度方式基本契約を除く。）であって、正規貸付けが行われることが確実であると認められ、かつ、返済期間が1か月を超えないものは、例外契約に該当する。","③":"個人顧客が既に貸金業者以外の者と締結した契約に基づき負担している債務（以下、本問において「既存債務」という。）を弁済するために必要な資金の貸付けに係る契約（以下、本問において「当該契約」という。）であって、当該契約の1か月の負担が既存債務に係る1か月の負担を上回らず、「当該契約の将来支払う返済金額の合計額」と「当該契約の締結に関し当該個人顧客が負担する元本及び利息以外の金銭の合計額」の合計額が既存債務に係る将来支払う返済金額の合計額を上回らず、当該契約に基づく債権につき物的担保を供させず、かつ、当該契約について保証契約を締結しないものは、例外契約に該当する。","④":"個人顧客が貸金業法施行規則第10条の23第4項に規定する特定費用を支払うために必要な資金の貸付けに係る契約として当該個人顧客と貸金業者との間に締結される契約（極度方式基本契約ではないものとする。）であって、当該個人顧客の返済能力を超えない貸付けに係る契約であると認められ、かつ、返済期間が1年を超えないものは、例外契約に該当する。"},"note":"","answer":4,"format":"single","negative":true},{"id":"R16-21","kai":16,"era":"令和3年度","num":21,"sectionShort":"法令","stem":"貸金業者であるＡは、個人顧客であるＢとの間で極度方式基本契約を締結し、貸金業法第17条（契約締結時の書面の交付）第2項に規定する書面（以下、本問において「基本契約に係る書面」という。）を交付した。この場合に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"Ａは、Ｂとの間の合意に基づき、極度額を引き下げた場合、変更後の内容を記載した基本契約に係る書面をＢに再交付する必要はない。","②":"Ａは、Ｂとの間の合意に基づき、極度額を引き下げた後、元の額を上回らない額まで引き上げた場合、変更後の内容を記載した基本契約に係る書面をＢに再交付しなければならない。","③":"Ａは、Ｂとの間の合意に基づき、貸付けの利率を引き下げた場合、変更後の内容を記載した基本契約に係る書面をＢに再交付する必要はない。","④":"Ａは、Ｂとの間の合意に基づき、返済の方法及び返済を受ける場所を変更した場合、当該変更がＢの利益となる変更であるか否かを問わず、変更後の内容を記載した基本契約に係る書面をＢに再交付しなければならない。"},"note":"","answer":2,"format":"single","negative":true},{"id":"R16-22","kai":16,"era":"令和3年度","num":22,"sectionShort":"法令","stem":"取立て行為の規制に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"貸金業者向けの総合的な監督指針（以下、本問において「監督指針」という。）によれば、貸金業法第21条第1項第5号は、債務者等に心理的圧迫を加えることにより弁済を強要することを禁止する趣旨であり、債務者等から家族に知られないように要請を受けているか否かを問わず、債務者等の自宅に電話をかけ家族がこれを受けた場合に貸金業者であることを名乗り、郵送物の送付に当たり差出人として貸金業者であることを示したときは、同号に該当するおそれが大きいとされている。","②":"貸金業を営む者は、債務者に対し支払を催告するために書面を送付するときには、その書面に封をするなどして債務者以外の者に当該債務者の借入れに関する事実が明らかにならないようにしなければならない。","③":"貸金業法第21条第2項に規定する支払を催告するための書面又はこれに代わる電磁的記録に記載又は記録すべき事項には、支払を催告する金額のほか、契約年月日、貸付けの金額及び貸付けの利率が含まれる。","④":"監督指針によれば、貸金業法第21条第2項第2号に規定する「当該書面又は電磁的記録を送付する者の氏名」については、当該債権を管理する部門又は営業所等において、当該債権を管理する者の氏名を記載することとされている。"},"note":"","answer":1,"format":"single","negative":true},{"id":"R16-23","kai":16,"era":"令和3年度","num":23,"sectionShort":"法令","stem":"貸金業法第24条（債権譲渡等の規制）に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"貸金業者は、貸付けに係る契約に基づく債権を他人に譲渡する場合、譲受人が貸金業者である場合を除き、譲受人に対して、当該債権が貸金業者の貸付けに係る契約に基づいて発生したこと及び譲受人が当該債権に関して行う行為について貸金業法の一部の規定の適用がある旨を、内閣府令で定める方法により、通知しなければならない。","②":"貸金業者が、貸付けに係る契約に基づく債権を譲渡した場合、当該債権の譲受人の営業所又は事務所の所在する都道府県の知事は、資金需要者等の利益の保護を図るため必要があると認めるときは、当該職員に、当該債権の譲受人の営業所もしくは事務所に立ち入らせ、その業務に関して質問させ、又は帳簿書類その他の物件を検査させることができる。","③":"貸金業者が、貸付けに係る契約に基づく債権を譲渡した場合、当該債権の譲受人は、貸金業法第24条により準用される当該債権の内容を明らかにする同法第17条（契約締結時の書面の交付）に規定する書面を、遅滞なく、当該債権の債務者に交付しなければならない。","④":"日本貸金業協会が定める貸金業の業務運営に関する自主規制基本規則では、協会員が債権譲渡を行うにあたっては、債務者等からの問合せ及び取引履歴の開示請求等に適切に対応できるように、債権譲渡契約において譲渡人及び譲受人の双方が行う役割分担を明確にすることに留意し、債務者等に送付する債権譲渡に係る通知書に明記するよう努めるものとし、協会員が廃業等に伴って債権の譲渡を行った場合には、譲渡の日から10年間帳簿を保管して、債務者等からの閲覧又は謄写の請求に応じる措置を講じるよう努めるものとされている。"},"note":"","answer":1,"format":"single","negative":true},{"id":"R16-24","kai":16,"era":"令和3年度","num":24,"sectionShort":"法令","stem":"貸金業法第24条の6の2（開始等の届出）に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"貸金業者は、貸金業協会に加入又は脱退した場合、その日から2週間以内に、その旨をその登録をした内閣総理大臣又は都道府県知事（以下、本問において「登録行政庁」という。）に届け出なければならない。","②":"貸金業者は、特定の保証業者との保証契約の締結を貸付けに係る契約の締結の通常の条件とすることとなった場合、その日から2週間以内に、その旨を登録行政庁に届け出なければならない。","③":"貸金業者は、第三者に貸金業の業務の委託を行った場合又は当該業務の委託を行わなくなった場合、その日から2週間以内に、その旨を登録行政庁に届け出なければならない。","④":"貸金業者は、貸付けに係る契約に基づく債権を他人から譲り受けた場合、その日から2週間以内に、その旨を登録行政庁に届け出なければならない。"},"note":"","answer":4,"format":"single","negative":true},{"id":"R16-25","kai":16,"era":"令和3年度","num":25,"sectionShort":"法令","stem":"貸金業者に対する監督等に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"内閣総理大臣又は都道府県知事（以下、本問において「登録行政庁」という。）は、その登録を受けた貸金業者が、「純資産額が貸金業の業務を適正に実施するため必要かつ適当なものとして政令で定める金額に満たない者（資金需要者等の利益を損なうおそれがないものとして内閣府令で定める事由がある者を除く。）」に該当することとなった場合、当該貸金業者に対し登録を取り消し、又は1年以内の期間を定めて、その業務の全部もしくは一部の停止を命ずることができる。","②":"登録行政庁は、その登録を受けた法人である貸金業者の役員の所在を確知できない場合において、内閣府令で定めるところにより、その事実を公告し、その公告の日から30日を経過しても当該貸金業者から申出がないときは、その登録を取り消すことができる。","③":"貸金業者は、事業年度ごとに、内閣府令で定めるところにより、貸金業に係る事業報告書を作成し、毎事業年度経過後30日以内に、これをその登録をした登録行政庁に提出しなければならない。","④":"貸金業者向けの総合的な監督指針によれば、監督当局は、貸金業者の検査・監督に係る事務処理上の留意点として、非協会員(注)に対しては、貸金業法第24条の6の10（報告徴収及び立入検査）の規定に基づき、各年の四半期毎に、前四半期に出稿した広告等の写し又はその内容がわかるものを遅滞なく徴収するものとされている。"},"note":"(注) 非協会員とは、貸金業協会に加入していない貸金業者をいう。","answer":3,"format":"single","negative":true},{"id":"R16-26","kai":16,"era":"令和3年度","num":26,"sectionShort":"法令","stem":"利息、賠償額の予定及び金銭の貸借の媒介の手数料の規制に関する次の①～④の記述のうち、利息制限法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"金銭の貸借の媒介に係る手数料の契約は、その手数料がその媒介に係る貸借の金額を元本として利息制限法第1条（利息の制限）に規定する利率により計算した金額を超えるときは、その超過部分について、無効となる。","②":"営業的金銭消費貸借において、元本の額が50万円と定められている場合、当該営業的金銭消費貸借における利息の上限金利は年1割8分（18％）である。","③":"営業的金銭消費貸借上の債務の不履行による賠償額の予定は、その賠償額の元本に対する割合が年2割（20％）を超えるときは、その超過部分について、無効となる。","④":"利息の天引きをした場合において、天引額が債務者の受領額を元本として利息制限法第1条に規定する利率により計算した金額を超えるときは、その超過部分は、元本の支払に充てたものとみなされる。"},"note":"","answer":1,"format":"single","negative":true},{"id":"R16-27","kai":16,"era":"令和3年度","num":27,"sectionShort":"法令","stem":"Ａは貸金業者、ＢはＡの顧客、Ｃは保証業者である。保証料の制限等に関する次の①～④の記述のうち、利息制限法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"ＡがＣとの間でＡとＢとの間の営業的金銭消費貸借上の債務を主たる債務とする保証契約を締結した場合におけるＢがＣに支払う保証料の契約は、その保証料が当該主たる債務の元本に係る法定上限額(注)から当該主たる債務について支払うべき利息の額を減じて得た金額を超えるときは、その超過部分について、無効となる。","②":"Ａは、Ｂとの間で、元本を80万円とし期間を1年とする営業的金銭消費貸借契約を締結して80万円をＢに貸し付け、ＢがＡに支払う利息を変動利率をもって定めた。Ａは、当該契約について、Ｃとの間で、保証契約を締結したが、当該保証契約においてＡがＢから支払を受けることができる利息の利率の上限（特約上限利率）の定めをしなかった。この場合において、Ｃが、Ｂとの間でＢがＣに支払う保証料の契約を締結したときは、Ｂから受け取ることができる保証料の上限は、72,000円である。","③":"ＡがＣとの間でＡとＢとの間の営業的金銭消費貸借上の債務を主たる債務とする保証契約を締結した場合において、当該保証契約に関してＣがＢから受ける保証料以外の金銭は、契約の締結又は債務の弁済費用を除き、保証料とみなされる。","④":"Ａは、Ｂとの間で、元本を10万円、利率を年1割3分（13％）、期間を1年、元利一括返済とする営業的金銭消費貸借契約を締結して10万円をＢに貸し付け、当該契約について、Ｃとの間で、保証契約を締結した。また、Ｃは、Ｂとの間で、ＣがＢから5,000円の保証料の支払を受ける旨の保証料の契約を締結した。この場合において、ＡとＢとの合意により、当該営業的金銭消費貸借契約の利息を利率年1割5分（15％）に変更したときは、当該変更後の利息の約定は、年1割3分（13％）を超える部分に限り無効となる。"},"note":"(注) 法定上限額とは、利息制限法第1条（利息の制限）及び第5条（元本額の特則）の規定の例により計算した金額をいう。","answer":3,"format":"single","negative":true},{"id":"R16-28","kai":16,"era":"令和3年度","num":28,"sectionShort":"貸付実務","stem":"意思表示に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"Ａは、実際には購入するつもりがないのに、Ｂとの間で、Ｂが所有する甲建物を購入する旨の売買契約を締結した。この場合において、Ａには甲建物を購入する意思がないことをＢが知っていたときは、Ａは、Ｂに対し、当該売買契約が心裡留保により無効であることを主張することができない。","②":"Ａは、実際には甲建物をＢに売却するつもりがないのに、Ｂと通謀して、Ｂに甲建物を売却する旨の虚偽の売買契約を締結し、ＡからＢへの甲建物の所有権移転登記を経た。その後、Ｂがこの事情を知らない第三者Ｃに甲建物を売却した場合、Ａは、Ｃに対し、ＡとＢとの間の売買契約が虚偽表示により無効であることを対抗することができない。","③":"Ａは、Ｂが所有する甲建物の近隣にショッピングモールが新設される計画を知り、Ｂとの間で、甲建物を購入する旨の売買契約を締結した。しかし、当該ショッピングモール新設の計画は、当該売買契約の締結前に既に中止となっていたが、Ａはそれを知らなかった。この場合、Ａは、当該ショッピングモール新設が甲建物の売買契約締結の基礎とされていることをＢに表示していたか否かにかかわらず、錯誤を理由として、当該売買契約を取り消すことができる。","④":"Ａは、Ｂの強迫により、Ｂとの間で、自己が所有する甲建物をＢに売却する旨の売買契約を締結した後、Ｂは、強迫の事実を知らないＣに甲建物を売却した。その後、Ａが強迫による意思表示を理由としてＡとＢとの間の売買契約を取り消した場合、Ａは、Ｃに対し、その取消しを対抗することができない。"},"note":"","answer":2,"format":"single","negative":false},{"id":"R16-29","kai":16,"era":"令和3年度","num":29,"sectionShort":"貸付実務","stem":"無効及び取消しに関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"無効な行為は、当事者がその行為の無効であることを知って追認をしたときは、その行為をした時に遡って有効であるものとみなされる。","②":"行為能力の制限によって取り消すことができる行為について、制限行為能力者は、その法定代理人、保佐人又は補助人の同意を得ずに、その行為を取り消すことができない。","③":"取り消すことができる行為は、民法第120条（取消権者）に規定する者が追認した後であっても、その行為の相手方が自己の債務の履行に着手するまでは、取り消すことができる。","④":"錯誤、詐欺又は強迫によって取り消すことができる行為の追認は、取消しの原因となっていた状況が消滅し、かつ、取消権を有することを知った後にしなければ、その効力を生じない。"},"note":"","answer":4,"format":"single","negative":false},{"id":"R16-30","kai":16,"era":"令和3年度","num":30,"sectionShort":"貸付実務","stem":"時効に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"裁判上の請求がある場合において、確定判決又は確定判決と同一の効力を有するものによって権利が確定したときは、時効は、その事由が終了した時から6か月を経過した時から新たにその進行を始める。","②":"仮差押えがある場合には、その事由が終了した時から6か月を経過するまでの間は、時効は、完成しない。","③":"時効の更新事由である権利の承認をするには、相手方の権利についての処分につき行為能力の制限を受けていないこと又は権限があることを要する。","④":"時効の利益は、あらかじめ放棄することができる。"},"note":"","answer":2,"format":"single","negative":false},{"id":"R16-31","kai":16,"era":"令和3年度","num":31,"sectionShort":"貸付実務","stem":"連帯保証に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"主たる債務者の意思に反して連帯保証をすることは認められていない。","②":"主たる債務の目的又は態様が連帯保証契約の締結後に加重されたときは、連帯保証人の負担も加重される。","③":"債権者が連帯保証人に債務の履行を請求したときは、当該連帯保証人は、まず主たる債務者に催告をすべき旨を請求することができる。","④":"連帯保証人に対する履行の請求その他の事由による時効の完成猶予及び更新は、債権者及び主たる債務者が別段の意思を表示したときを除き、主たる債務者に対して、その効力を生じない。"},"note":"","answer":4,"format":"single","negative":false},{"id":"R16-32","kai":16,"era":"令和3年度","num":32,"sectionShort":"貸付実務","stem":"ＡのＢに対する金銭債権を「甲債権」とし、ＢのＡに対する金銭債権を「乙債権」とする。この場合に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"甲債権の弁済期が11月1日であり、乙債権の弁済期が同年10月15日である場合、Ａは、同年10月15日の時点で、甲債権と乙債権とを相殺することができる。","②":"Ａは、甲債権と乙債権とを相殺するにあたり、相殺の意思表示に条件又は期限を付することができる。","③":"甲債権と乙債権とが相殺に適するようになった後に、甲債権が時効によって消滅した場合であっても、Ａは、甲債権と乙債権とを相殺することができる。","④":"甲債権が他人から譲り受けた債権である場合において、その譲受けの時期が、乙債権に係る債権差押命令がＡに送達された後であっても、甲債権が当該差押え前の原因に基づき発生したものであるときは、Ａは、甲債権と乙債権との相殺をもって乙債権の差押債権者に対抗することができる。"},"note":"","answer":3,"format":"single","negative":false},{"id":"R16-33","kai":16,"era":"令和3年度","num":33,"sectionShort":"貸付実務","stem":"相続に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"相続人は、相続によって得た財産の限度においてのみ被相続人の債務及び遺贈を弁済すべきことを留保して、相続の承認をすることができる。","②":"被相続人の子が、相続の開始以前に相続放棄をした場合、その者の子がこれを代襲して相続人となる。","③":"相続の承認及び放棄は、民法第915条（相続の承認又は放棄をすべき期間）第1項の期間内は、いつでも撤回することができる。","④":"配偶者及び兄弟姉妹が相続人であるときは、配偶者の法定相続分は、3分の2であり、兄弟姉妹の法定相続分は3分の1である。"},"note":"","answer":1,"format":"single","negative":false},{"id":"R16-34","kai":16,"era":"令和3年度","num":34,"sectionShort":"貸付実務","stem":"手形法及び電子記録債権法に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"確定日払いの約束手形の所持人は、支払をなすべき日又はこれに次ぐ2取引日内に支払のため約束手形を呈示して、約束手形の支払を受けることができる。","②":"約束手形に、一定の金額を支払うべき旨の単純な約束（以下、本問において「支払約束文句」という。）の記載に付加して「手形金を2回に分割して支払う」旨の条件を記載した場合、支払約束文句に付加された記載は無効となるが、当該約束手形自体は無効とならない。","③":"電子記録債権の譲渡は、当事者間の合意のみによりその効力を生じ、譲渡記録は、電子記録債権の譲渡の対抗要件である。","④":"電子記録債権は、分割をすることができない。"},"note":"","answer":1,"format":"single","negative":false},{"id":"R16-35","kai":16,"era":"令和3年度","num":35,"sectionShort":"貸付実務","stem":"強制執行手続に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"債権者が自己の貸金返還請求権につき執行証書(注)を有する場合における強制執行は、執行証書の正本に基づいて実施され、執行証書に執行文が付されていることを要しない。","②":"不動産（登記することができない土地の定着物を除く。）に対する強制執行は、強制競売又は強制管理の方法により行われ、これらの方法は、併用することができない。","③":"動産に対する強制執行は、執行裁判所の差押命令により開始する。","④":"債務者が会社から受ける給料（毎月25日払い、月額28万円であるものとする。）に係る債権は、その支払期に受けるべき給付の4分の3に相当する部分は、差し押さえることができない。"},"note":"(注) 執行証書とは、金銭の一定の額の支払又はその他の代替物もしくは有価証券の一定の数量の給付を目的とする請求について公証人が作成した公正証書で、債務者が直ちに強制執行に服する旨の陳述が記載されているものをいう。","answer":4,"format":"single","negative":false},{"id":"R16-36","kai":16,"era":"令和3年度","num":36,"sectionShort":"貸付実務","stem":"行為能力に関する次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"一種又は数種の営業を許された未成年者は、その営業に関しては、成年者と同一の行為能力を有する。","②":"成年被後見人は、その成年後見人の同意を得た場合、借財又は保証をすることができる。","③":"家庭裁判所の審判により、被補助人が特定の法律行為をするためにその補助人の同意を得なければならないものとすることができる行為は、民法第13条（保佐人の同意を要する行為等）第1項に規定する行為の一部に限られる。","④":"制限行為能力者の相手方が、制限行為能力者が行為能力者とならない間に、その法定代理人、保佐人又は補助人に対し、その権限内の行為について、1か月以上の期間を定めて、その期間内にその取り消すことができる行為を追認するかどうかを確答すべき旨の催告をした場合において、これらの者がその期間内に確答を発しないときは、その行為を追認したものとみなされる。"},"note":"","answer":2,"format":"single","negative":true},{"id":"R16-37","kai":16,"era":"令和3年度","num":37,"sectionShort":"貸付実務","stem":"Ａがその所有する甲自動車をＢに売却する旨の委任に係る代理権（以下、本問において「本件代理権」という。）をＣに付与する場合等に関する次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"Ｃは、本件代理権を付与された後、Ａの代理人であることを示さないで、Ｂに甲自動車を売却する旨の売買契約を締結した。この場合において、Ｂが、ＣがＡの代理人であることを知っていたときは、当該売買契約は、Ａに対して直接にその効力を生ずる。","②":"Ｃは、本件代理権を付与されていた場合、Ａの許諾を得たとき、又はやむを得ない事由があるときでなければ、復代理人を選任することはできない。","③":"Ｃは、本件代理権を付与された後、本件代理権に係る代理行為をする前に、後見開始の審判を受け成年被後見人となった。この場合、本件代理権は消滅する。","④":"Ｃは、Ａから付与された本件代理権が消滅した後に、Ａの代理人としてＢに甲自動車を売却する旨の売買契約を締結した。この場合において、Ｂが、本件代理権の消滅の事実を知らなかったときは、知らないことに過失があったとしても、Ａは、Ｂに対して、Ｃの行為についての責任を負う。"},"note":"","answer":4,"format":"single","negative":true},{"id":"R16-38","kai":16,"era":"令和3年度","num":38,"sectionShort":"貸付実務","stem":"債権の効力に関する次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"債権者が債務の履行を受けることを拒み、又は受けることができない場合において、その債務の目的が特定物の引渡しであるときは、債務者は、履行の提供をした時からその引渡しをするまで、自己の財産に対するのと同一の注意をもって、その物を保存すれば足りる。","②":"債務の不履行に対する損害賠償の請求は、これによって通常生ずべき損害の賠償をさせることをその目的とし、特別の事情によって生じた損害は、特約がなければ、その賠償を請求することができない。","③":"当事者は、債務の不履行について損害賠償の額を予定することができる。賠償額の予定は、履行の請求又は解除権の行使を妨げない。","④":"債権者が、損害賠償として、その債権の目的である物又は権利の価額の全部の支払を受けたときは、債務者は、その物又は権利について当然に債権者に代位する。"},"note":"","answer":2,"format":"single","negative":true},{"id":"R16-39","kai":16,"era":"令和3年度","num":39,"sectionShort":"貸付実務","stem":"債権の譲渡に関する次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"債務者は、譲渡制限の意思表示(注1)がされた金銭の給付を目的とする債権が譲渡されたときは、その債権の全額に相当する金銭を債務の履行地（債務の履行地が債権者の現在の住所により定まる場合にあっては、譲渡人の現在の住所を含む。）の供託所に供託することができる。","②":"債権の譲渡は、その意思表示の時に債権が現に発生していることを要しない。","③":"債権の譲渡は、譲渡人が債務者に確定日付のある証書による通知をし、又は債務者が確定日付のある証書による承諾をしなければ、債務者に対抗することができない。","④":"債務者が対抗要件具備時(注2)より後に取得した譲渡人に対する債権であっても、その債権が対抗要件具備時より前の原因に基づいて生じたものであるときは、債務者は、その債権による相殺をもって譲受人に対抗することができる。ただし、債務者が対抗要件具備時より後に他人からその債権を取得した場合はこの限りでない。"},"note":"(注1) 譲渡制限の意思表示とは、当事者が債権の譲渡を禁止し、又は制限する旨の意思表示をいう。(注2) 対抗要件具備時とは、債権が譲渡された場合において、譲渡人が民法第467条（債権の譲渡の対抗要件）の規定による通知をし、又は債務者が同条の規定による承諾をした時をいう。","answer":3,"format":"single","negative":true},{"id":"R16-40","kai":16,"era":"令和3年度","num":40,"sectionShort":"貸付実務","stem":"定型約款(注1)に関する次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"定型取引を行い、又は行おうとする定型約款準備者(注2)は、定型約款を用いて契約を締結しようとする場合、事前に相手方にその定型約款の内容を示さなければならない。","②":"定型約款の条項のうち、相手方の権利を制限し、又は相手方の義務を加重する条項であって、その定型取引の態様及びその実情並びに取引上の社会通念に照らして民法第1条第2項に規定する基本原則に反して相手方の利益を一方的に害すると認められるものについては、合意をしなかったものとみなされる。","③":"定型約款準備者は、民法第548条の4（定型約款の変更）第1項の規定による定型約款の変更をするときは、その効力発生時期を定め、かつ、定型約款を変更する旨及び変更後の定型約款の内容並びにその効力発生時期をインターネットの利用その他の適切な方法により周知しなければならない。","④":"定型約款準備者は、定型約款の変更が、相手方の一般の利益に適合する場合には、定型約款の変更をすることにより、変更後の定型約款の条項について合意があったものとみなし、個別に相手方と合意をすることなく契約の内容を変更することができる。"},"note":"(注1) 定型約款とは、定型取引（ある特定の者が不特定多数の者を相手方として行う取引であって、その内容の全部又は一部が画一的であることがその双方にとって合理的なものをいう。）において、契約の内容とすることを目的としてその特定の者により準備された条項の総体をいう。(注2) 定型約款準備者とは、定型約款を準備した者をいう。","answer":1,"format":"single","negative":true},{"id":"R16-41","kai":16,"era":"令和3年度","num":41,"sectionShort":"貸付実務","stem":"破産法に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"破産債権とは、破産者に対して破産手続開始前の原因に基づいて生じた財産上の請求権であって、財団債権に該当しないものをいい、破産債権は、破産法に特別の定めがある場合を除き、破産手続によらなければ、行使することができない。","②":"破産債権者の共同の利益のためにする裁判上の費用の請求権は、財団債権に該当し、破産手続によらないで、破産財団から随時弁済を受けることができる。","③":"別除権とは、破産手続開始の時において破産財団に属する財産につき特別の先取特権、質権又は抵当権を有する者がこれらの権利の目的である財産について行使することができる権利をいい、別除権は、破産手続によらなければ、行使することができない。","④":"破産債権者は、破産手続開始の申立てがあった時より1年以上前に生じた原因に基づき破産者に対して債務を負担するときは、破産手続によらないで、相殺をすることができる。"},"note":"","answer":3,"format":"single","negative":true},{"id":"R16-42","kai":16,"era":"令和3年度","num":42,"sectionShort":"貸付実務","stem":"貸金業者であるＡが、自然人である顧客Ｂから融資の申込みを受けた場合において、Ｂについて確認すべき、犯罪による収益の移転防止に関する法律第4条第1項第1号に規定する本人特定事項の確認方法に関する次の①～④の記述のうち、その内容が同法上の確認方法に該当しないものを1つだけ選び、解答欄にその番号をマークしなさい。なお、Ｂの国民健康保険の被保険者証、国民年金手帳及び運転免許証は、いずれもＡがその提示又は送付を受ける日において有効なもので、Ｂの現在の住居の記載があるものとする。","statements":{},"options":{"①":"Ｂの国民健康保険の被保険者証及びＢの国民年金手帳の提示を受ける方法","②":"Ｂの国民健康保険の被保険者証の提示を受け、かつ、Ｂの現在の住居の記載のある電気料金の領収証書（領収日付の押印又は発行年月日の記載があるもので、その日がＡが送付を受ける日前6か月以内のものに限る。）の写しの送付を受ける方法","③":"Ａが提供するソフトウェアを使用して、Ｂに当該ソフトウェアを使用して撮影させたＢの容貌及びＢの運転免許証の画像情報（当該画像情報が、当該運転免許証に記載されている氏名、住居及び生年月日、当該運転免許証に貼り付けられた写真並びに当該運転免許証の厚みその他の特徴を確認することができるもの）の送信を受ける方法","④":"Ｂの運転免許証の写しの送付を受けるとともに、当該運転免許証の写しに記載されているＢの住居に宛てて、取引関係文書を書留郵便の方法により、転送不要郵便物（その取扱いにおいて転送しない郵便物）として送付する方法"},"note":"","answer":4,"format":"single","negative":true},{"id":"R16-43","kai":16,"era":"令和3年度","num":43,"sectionShort":"資金需要者保護","stem":"個人情報の保護に関する法律に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"個人識別符号とは、当該情報単体から特定の個人を識別できるものとして個人情報の保護に関する法律施行令第1条に定められた文字、番号、記号その他の符号をいい、携帯電話番号やクレジットカード番号は個人識別符号に該当する。","②":"個人情報取扱事業者とは、個人情報データベース等を事業の用に供している者（国の機関、地方公共団体、独立行政法人等及び地方独立行政法人を除く。）をいい、個人情報データベース等を事業の用に供している者であれば、当該個人情報データベース等を構成する個人情報によって識別される特定の個人の数の多寡にかかわらず、個人情報取扱事業者に該当する。","③":"保有個人データとは、個人情報取扱事業者が管理する個人情報データベース等を構成する個人情報をいい、本人又はその代理人から請求される開示、内容の訂正、追加もしくは削除、利用の停止、消去又は第三者への提供の停止のいずれかに応じることができる権限を有する個人情報に限られる。","④":"要配慮個人情報とは、本人の人種、信条、社会的身分、病歴、犯罪の経歴が含まれる個人情報をいうが、犯罪により害を被った事実は要配慮個人情報に含まれない。"},"note":"","answer":2,"format":"single","negative":false},{"id":"R16-44","kai":16,"era":"令和3年度","num":44,"sectionShort":"資金需要者保護","stem":"消費者契約法に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"事業者とは法人その他の団体をいい、事業として又は事業のために契約の当事者となる場合における個人は消費者契約法上の事業者には当たらない。","②":"事業者が消費者契約の締結について消費者を勧誘するに際し、当該消費者に対してある重要事項又は当該重要事項に関連する事項について当該消費者の利益となる旨を告げ、かつ、当該重要事項について当該消費者の不利益となる事実を故意に告げなかったことにより、当該消費者が、当該事実が存在しないとの誤認をし、それによって当該消費者契約の申込み又はその承諾の意思表示をしたときは、当該消費者契約は無効である。","③":"消費者契約の解除に伴う損害賠償の額を予定する条項であって、その額が、当該条項において設定された解除の事由、時期等の区分に応じ、当該消費者契約と同種の消費者契約の解除に伴い当該事業者に生ずべき平均的な損害の額を超えるものは、無効である。","④":"事業者の債務不履行（当該事業者、その代表者又はその使用する者の故意又は重大な過失によるものに限る。）により消費者に生じた損害を賠償する責任の一部を免除する消費者契約の条項は、無効である。"},"note":"","answer":4,"format":"single","negative":false},{"id":"R16-45","kai":16,"era":"令和3年度","num":45,"sectionShort":"資金需要者保護","stem":"日本貸金業協会が定める紛争解決等業務に関する規則についての次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"貸金業務等関連苦情とは、貸金業務等に関し、その契約者等による当該貸金業務等を行った者に対する不満足の表明をいう。","②":"貸金業務関連紛争とは、貸金業務等関連苦情のうち、当該苦情の相手方である貸金業者と当該苦情に係る契約者等の自主的な交渉では解決ができないものであって、当事者が和解をすることができないものをいう。","③":"苦情処理手続の申立人又は相手方が、苦情処理手続において代理人とすることができるのは、その法定代理人、弁護士、司法書士、行政書士に限られる。","④":"紛争解決手続開始の申立てをすることができるのは、貸金業務関連紛争の当事者である個人又は法人とされており、法人ではない社団又は財団は、紛争解決手続開始の申立てをすることができない。"},"note":"","answer":1,"format":"single","negative":false},{"id":"R16-46","kai":16,"era":"令和3年度","num":46,"sectionShort":"資金需要者保護","stem":"個人情報の保護に関する法律についてのガイドライン（通則編）（以下、本問において「ガイドライン（通則編）」という。）及び金融分野における個人情報保護に関するガイドライン（以下、本問において「金融分野ガイドライン」という。）に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"ガイドライン（通則編）によれば、親子兄弟会社、グループ会社の間で個人データを交換する場合は、個人情報の保護に関する法律第23条第5項各号に該当するときを除き、第三者提供に該当するとされている。","②":"ガイドライン（通則編）によれば、個人情報取扱事業者は、個人データを共同利用する場合において、「共同利用する者の利用目的」については、社会通念上、本人が通常予期し得る限度と客観的に認められる範囲内で変更することができ、「個人データの管理について責任を有する者の氏名又は名称」についても変更することができるが、いずれも変更する前に、本人に通知し、又は容易に知り得る状態に置かなければならないとされている。","③":"ガイドライン（通則編）によれば、個人データの取扱いに関する業務の全部又は一部を委託することに伴い、当該個人データが提供される場合は、利用目的の達成に必要な範囲内であっても、当該提供先は第三者に該当するとされている。","④":"金融分野ガイドラインによれば、金融分野における個人情報取扱事業者は、与信事業に係る個人の返済能力に関する情報を個人信用情報機関へ提供するに当たっては、個人情報の保護に関する法律第23条第2項（オプトアウト）の規定を適用しないこととされている。"},"note":"","answer":3,"format":"single","negative":true},{"id":"R16-47","kai":16,"era":"令和3年度","num":47,"sectionShort":"資金需要者保護","stem":"日本貸金業協会が定める貸金業の業務運営に関する自主規制基本規則に規定する「広告及び勧誘に関する規制」についての次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"協会員は、資金需要者等が、協会員からの勧誘を一切拒否する旨の強い意思表示を行った場合、当該意思の表示のあった日から最低1年間は一切の勧誘を見合わせるものとし、当該期間経過後も架電、ファックス、電子メールもしくはダイレクトメール等の送信又は訪問等、当該資金需要者等の私生活や業務に与える影響が大きい方法による勧誘は行わないことを目処として対応しなければならない。","②":"協会員は、資金需要者等が、協会員が勧誘を行った取引に係る勧誘を引き続き受けることを希望しない旨の明確な意思の表示を行った場合、当該意思表示のあった日から最低6か月間は当該勧誘に係る取引及びこれと類似する取引の勧誘を見合わせることを目処として対応しなければならない。","③":"協会員は、貸付けの契約の締結の勧誘に際し、資金需要者等が身体的・精神的な障害等により契約の内容が理解困難なことを認識した場合、当該資金需要者等に対し、契約内容を丁寧に説明し十分にその内容を理解させるように努めなければならない。","④":"協会員は、債務者等に対して貸付けの契約に係る勧誘を行うに際しては、例えば、店頭窓口において口頭での承諾の事実を確認し、当該承諾に係る記録を作成及び保管する方法により、当該債務者等から当該勧誘を行うことについての承諾を得なければならない。"},"note":"","answer":3,"format":"single","negative":true},{"id":"R16-48","kai":16,"era":"令和3年度","num":48,"sectionShort":"財務会計","stem":"会社計算規則に規定する貸借対照表等(注)に関する次のａ～ｄの記述のうち、その内容が適切なものの個数を①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"貸借対照表等は、資産、負債及び純資産の各部に区分して表示しなければならない。","ｂ":"負債の部は、流動負債、固定負債及び繰延負債に区分して表示しなければならない。","ｃ":"前受金（受注工事、受注品等に対する前受金をいう。）は、流動資産に属するものとされている。","ｄ":"前払費用であって、1年内に費用となるべきものは、流動負債に属するものとされている。"},"options":{"①":"1個","②":"2個","③":"3個","④":"4個"},"note":"(注) 貸借対照表等とは、貸借対照表及び連結貸借対照表をいう。","answer":1,"format":"count","negative":false},{"id":"R16-49","kai":16,"era":"令和3年度","num":49,"sectionShort":"財務会計","stem":"財務諸表等の用語、様式及び作成方法に関する規則に規定するキャッシュ・フロー計算書に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"短期借入れによる収入、短期借入金の返済による支出は、営業活動によるキャッシュ・フローの区分に掲記される。","②":"棚卸資産の増加額又は減少額は、投資活動によるキャッシュ・フローの区分に掲記される。","③":"営業活動によるキャッシュ・フローの区分には、営業利益又は営業損失の計算の対象となった取引に係るキャッシュ・フローのほか、投資活動及び財務活動以外の取引に係るキャッシュ・フローが掲記される。","④":"貸付けによる支出、貸付金の回収による収入は、財務活動によるキャッシュ・フローの区分に掲記される。"},"note":"","answer":3,"format":"single","negative":false},{"id":"R16-50","kai":16,"era":"令和3年度","num":50,"sectionShort":"財務会計","stem":"企業会計原則（大蔵省企業会計審議会発表）の一般原則に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"企業会計は、すべての取引につき、正規の簿記の原則に従って、正確な会計帳簿を作成しなければならない。これを一般に正規の簿記の原則という。","②":"資本取引と負債取引とを明確に区別し、特に資本金と借入金とを混同してはならない。これを一般に明瞭性の原則という。","③":"企業会計は、その処理の原則及び手続を毎期継続して適用し、みだりにこれを変更してはならない。これを一般に継続性の原則という。","④":"企業の財政に不利な影響を及ぼす可能性がある場合には、これに備えて適当に健全な会計処理をしなければならない。これを一般に保守主義の原則という。"},"note":"","answer":2,"format":"single","negative":true},{"id":"R17-01","kai":17,"era":"令和4年度","num":1,"sectionShort":"法令","stem":"貸金業法上の用語の定義等に関する次のａ～ｄの記述のうち、その内容が適切なものの個数を①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"貸金業とは、金銭の貸付け又は金銭の貸借の媒介で営利の目的をもって行うものをいう。","ｂ":"個人信用情報とは、個人を相手方とする貸付けに係る契約（極度方式基本契約その他の内閣府令で定めるものを除く。）に係る貸金業法第41条の35（個人信用情報の提供）第1項各号に掲げる事項をいうが、個人信用情報には、個人顧客の氏名、住所、生年月日のほか、当該個人顧客が運転免許証等(注)の交付を受けている場合における運転免許証等の番号も含まれる。","ｃ":"住宅資金貸付契約とは、住宅の建設又は購入に必要な資金（住宅の用に供する土地又は借地権の取得に必要な資金を含む。）の貸付けに係る契約をいい、住宅の改良に必要な資金の貸付けに係る契約は、住宅資金貸付契約に含まれない。","ｄ":"紛争解決手続とは、貸金業務関連紛争（貸金業務に関する紛争で当事者が和解をすることができるものをいう。）について裁判上の和解により解決を図る手続をいう。"},"options":{"①":"1個","②":"2個","③":"3個","④":"4個"},"note":"(注) 運転免許証等とは、道路交通法第92条第1項に規定する運転免許証又は同法第104条の4第5項に規定する運転経歴証明書をいう。","answer":1,"format":"count","negative":false},{"id":"R17-02","kai":17,"era":"令和4年度","num":2,"sectionShort":"法令","stem":"貸金業法第3条（登録）に規定する貸金業者の登録等に関する次のａ～ｄの記述のうち、その内容が適切なものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"貸金業の登録を受けようとする者が、貸金業法第4条第1項の規定に基づき内閣総理大臣又は都道府県知事に提出する登録申請書（以下、本問において「登録申請書」という。）には、営業所又は事務所（以下、本問において「営業所等」という。）ごとに置かれる貸金業務取扱主任者の氏名及び住所を記載しなければならない。","ｂ":"貸金業者の支店（従たる営業所等）であってその貸付けに関する業務に従事する使用人の数が50人であるものにおいて、当該支店の業務を統括する者の権限を代行し得る地位にある者があるときは、支店次長、副支店長、副所長その他いかなる名称を有する者であるかを問わず、その者の氏名を登録申請書に記載しなければならない。","ｃ":"登録申請書に記載する、その業務に関して広告又は勧誘をする際に表示等をする営業所等の電話番号については、場所を特定するもの並びに当該場所を特定するものに係る着信課金サービス及び統一番号サービスに係るものに限られる。","ｄ":"登録申請書に記載する営業所等のうち、代理店とは、貸金業者の委任を受けて、当該貸金業者のために貸付けに関する業務の全部又は一部を代理した者が、当該業務を営む施設又は設備をいい、代理店には銀行の現金自動設備が含まれる。"},"options":{"①":"ａｂ","②":"ａｄ","③":"ｂｃ","④":"ｃｄ"},"note":"","answer":3,"format":"combo","negative":false},{"id":"R17-03","kai":17,"era":"令和4年度","num":3,"sectionShort":"法令","stem":"貸金業者であるＡの登録行政庁(注)への届出に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"Ａは、営業所の所在地を変更した場合、その日から2週間以内に、その旨を登録行政庁に届け出なければならない。","②":"Ａは、その業務の種類を変更し新たに極度方式貸付けを行おうとする場合、あらかじめその旨を登録行政庁に届け出なければならない。","③":"Ａは、貸金業を廃止した場合、その日から2週間以内に、その旨を登録行政庁に届け出なければならない。","④":"Ａは、その役員に貸金業の業務に関し法令に違反する行為があったことを知った場合、その日から2週間以内に、その旨を登録行政庁に届け出なければならない。"},"note":"(注) 登録行政庁とは、貸金業者が貸金業の登録をした内閣総理大臣又は都道府県知事をいう。","answer":4,"format":"single","negative":false},{"id":"R17-04","kai":17,"era":"令和4年度","num":4,"sectionShort":"法令","stem":"次のａ～ｄの記述のうち、貸金業法施行規則第10条の5（委託業務の的確な遂行を確保するための措置）の規定により、貸金業者が、貸金業の業務を第三者に委託する場合において、当該業務の内容に応じて講じなければならない措置として適切なものの個数を①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"当該業務を的確、公正かつ効率的に遂行することができる能力を有する者に委託するための措置","ｂ":"当該業務の委託を受けた者（以下、本問において「受託者」という。）における当該業務の実施状況を、定期的に又は必要に応じて確認すること等により、受託者が当該業務を的確に遂行しているかを検証し、必要に応じ改善させる等、受託者に対する必要かつ適切な監督等を行うための措置","ｃ":"受託者が当該業務を適切に行うことができない事態が生じた場合には、他の適切な第三者に当該業務を速やかに委託する等、当該業務に係る資金需要者等の保護に支障が生じること等を防止するための措置","ｄ":"貸金業者の業務の健全かつ適切な運営を確保し、当該業務に係る資金需要者等の保護を図るため必要がある場合には、当該業務の委託に係る契約の変更又は解除をする等の必要な措置を講ずるための措置"},"options":{"①":"1個","②":"2個","③":"3個","④":"4個"},"note":"","answer":4,"format":"count","negative":false},{"id":"R17-05","kai":17,"era":"令和4年度","num":5,"sectionShort":"法令","stem":"貸金業における金融ADR制度に関する次のａ～ｄの記述のうち、その内容が適切なものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"貸金業者は、指定紛争解決機関である日本貸金業協会に加入していない場合、当該協会との手続実施基本契約を締結する措置に代えて内閣府令で定める貸金業務に関する苦情処理措置及び紛争解決措置を講じなければならない。","ｂ":"貸金業者は、貸金業法第12条の2の2（指定紛争解決機関との契約締結義務等）第1項の規定により手続実施基本契約を締結する措置を講じた場合には、当該手続実施基本契約の相手方である指定紛争解決機関の商号又は名称を公表しなければならない。","ｃ":"紛争解決委員は、紛争解決手続において、貸金業務関連紛争の解決に必要な和解案を作成し、当事者に対し、その受諾を勧告することができ、加入貸金業者(注)は、紛争解決委員から和解案が提示され、受諾を勧告されたときは、これを拒否することはできない。","ｄ":"指定紛争解決機関は、当事者である加入貸金業者に係る資金需要者等の申出があるときは、紛争解決手続における和解で定められた義務の履行状況を調査し、当該加入貸金業者に対して、その義務の履行を勧告することができる。"},"options":{"①":"ａｂ","②":"ａｃ","③":"ｂｄ","④":"ｃｄ"},"note":"(注) 加入貸金業者とは、指定紛争解決機関と手続実施基本契約を締結した貸金業者をいう。","answer":3,"format":"combo","negative":false},{"id":"R17-06","kai":17,"era":"令和4年度","num":6,"sectionShort":"法令","stem":"貸金業者Ａは、甲及び乙の2か所の営業所を設置して貸金業を営んでいるが、甲営業所において50人の従業者を貸金業の業務に従事させており、乙営業所では40人の従業者を貸金業の業務に従事させている。この場合に関する次のａ～ｄの記述のうち、その内容が適切なものの個数を①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"Ａは、甲営業所における唯一の貸金業務取扱主任者Ｂが定年退職したため甲営業所において常時勤務する者でなくなった場合、甲営業所で引き続き貸金業の業務を継続するときは、2週間以内に、新たな貸金業務取扱主任者を甲営業所に置かなければならない。","ｂ":"Ａは、甲営業所において、従業者の数を60人増員して110人とし、全員を貸金業の業務に従事させる場合、貸金業務取扱主任者を甲営業所に3人以上置かなければならない。","ｃ":"Ａは、乙営業所における唯一の貸金業務取扱主任者Ｃが急に失踪し常時勤務する者でなくなった場合、乙営業所で貸金業の業務を継続するときは、30日以内の期間で、新たな貸金業務取扱主任者を乙営業所に置くまでの間、甲営業所の貸金業務取扱主任者Ｄを甲営業所と乙営業所の両方の貸金業務取扱主任者として兼務させることができる。","ｄ":"Ａは、新たに乙営業所の同一敷地内に現金自動設備を設置する場合、乙営業所に少なくとも2人以上の貸金業務取扱主任者を置かなければならない。"},"options":{"①":"1個","②":"2個","③":"3個","④":"4個"},"note":"","answer":1,"format":"count","negative":false},{"id":"R17-07","kai":17,"era":"令和4年度","num":7,"sectionShort":"法令","stem":"貸金業法上の禁止行為等に関する次のａ～ｄの記述のうち、その内容が適切なものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"貸金業者は、暴力団員等をその業務に従事させ、又はその業務の補助者として使用してはならない。","ｂ":"貸金業者は、貸付けに係る契約について、保証業者と保証契約を締結した場合、遅滞なく、当該保証業者への照会その他の方法により、当該保証業者と当該貸付けに係る契約の相手方との間における保証料に係る契約の締結の有無、及び当該保証料に係る契約を締結した場合における保証料の額を確認しなければならない。","ｃ":"貸金業者は、住宅資金貸付契約の相手方又は相手方となろうとする者の死亡によって保険金の支払を受けることとなる保険契約を締結しようとする場合には、当該保険契約において、自殺による死亡を保険事故としてはならない。","ｄ":"貸金業者が、その貸金業の業務に関し、資金需要者等に対し、虚偽のことを告げる行為をした場合、当該行為は刑事罰の対象となる。"},"options":{"①":"ａｂ","②":"ａｄ","③":"ｂｃ","④":"ｃｄ"},"note":"","answer":2,"format":"combo","negative":false},{"id":"R17-08","kai":17,"era":"令和4年度","num":8,"sectionShort":"法令","stem":"株式会社である貸金業者Ａが行う個人顧客Ｂについての貸金業法第13条に規定する返済能力の調査に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"Ａは、Ｂとの間で、他の貸金業者を債権者とする金銭の貸借の媒介に係る契約を締結しようとする場合、Ｂの返済能力の調査を行うに際し、指定信用情報機関が保有する信用情報を使用しなければならない。","②":"Ａは、Ｂが貸金業者から全く借入れをしていない場合において、Ｂとの間で、初めて、元本を50万円とする貸付けに係る契約を締結しようとするときは、Ｂの返済能力の調査を行うに際し、Ｂから、Ｂの源泉徴収票その他のＢの収入又は収益その他の資力を明らかにする事項を記載し、又は記録した書面又は電磁的記録として内閣府令で定めるもの（以下、本問において「資力を明らかにする書面等」という。）の提出又は提供を受けなければならない。","③":"Ａは、Ｂとの間で、初めて、貸付けに係る契約を締結するに当たり、Ｂの返済能力の調査を行うに際し、Ｂの資力を明らかにする書面等の提出又は提供を受けなければならない場合において、Ｂが、契約締結の前に転職により勤務先を変更していたため、変更後の勤務先では1か月分の給与の支払しか受けていなかったときは、Ｂから、当該変更後の勤務先で発行された1か月分の給与の支払明細書の写しのみの提出又は提供を受ければ足りる。","④":"Ａは、Ｂとの間で、貸付けに係る契約（極度方式基本契約及び極度方式貸付けに係る契約ではないものとする。）を締結した場合、返済能力の調査に関する記録を当該貸付けに係る契約に定められた最終の返済期日（当該貸付けに係る契約に基づく債権が弁済その他の事由により消滅したときは、当該債権の消滅した日）までの間保存しなければならない。"},"note":"","answer":4,"format":"single","negative":false},{"id":"R17-09","kai":17,"era":"令和4年度","num":9,"sectionShort":"法令","stem":"株式会社である貸金業者Ａが保証契約を締結しようとしている。この場合における次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"Ａは、個人顧客Ｂと極度方式基本契約を締結するに当たり、当該基本契約について個人である保証人となろうとする者Ｃとの間で保証契約を締結しようとする場合、Ｃから、Ｃの貸金業法第13条（返済能力の調査）第3項に規定する源泉徴収票その他のＣの収入又は収益その他の資力を明らかにする事項を記載し、又は記録した書面又は電磁的記録として内閣府令で定めるものの提出又は提供を受けなければならない。","②":"Ａは、個人顧客Ｂと貸付けに係る契約を締結するに当たり、当該契約について個人である保証人となろうとする者Ｃとの間で保証契約を締結しようとする場合、当該保証契約を締結するまでに、当該保証契約の内容を説明する書面及び当該保証の対象となる貸付けに係る契約の内容を説明する書面の両書面を、Ｃに対して交付しなければならない。","③":"Ａは、個人顧客Ｂと貸付けに係る契約を締結するに当たり、当該契約について法人である保証人となろうとする者Ｃとの間で保証契約を締結しようとする場合、Ｃについて貸金業法第13条第1項に規定する返済能力の調査をする必要はない。","④":"Ａは、個人顧客Ｂと貸付けに係る契約（極度方式貸付けに係る契約その他の内閣府令で定める貸付けの契約を除く。）を締結するに当たり、当該契約について個人である保証人となろうとする者Ｃとの間で保証契約を締結しようとする場合、Ｂだけでなく、Ｃについても指定信用情報機関が保有する信用情報を使用して、貸金業法第13条第1項に規定する返済能力の調査をしなければならない。"},"note":"","answer":4,"format":"single","negative":false},{"id":"R17-10","kai":17,"era":"令和4年度","num":10,"sectionShort":"法令","stem":"次の①～④の記述のうち、貸金業法第13条の2（過剰貸付け等の禁止）第2項に規定する個人顧客の利益の保護に支障を生ずることがない契約として貸金業法施行規則第10条の23で定めるものに該当するものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"貸金業者が、個人顧客との間で締結する、自動車の購入に必要な資金の貸付けに係る契約のうち、当該自動車の所有権を貸金業者が取得し、又は当該自動車が譲渡により担保の目的となっているもの","②":"貸金業者が、個人顧客との間で締結する、金融機関（預金保険法第2条第1項に規定する金融機関をいう。）からの貸付けが行われるまでのつなぎとして行う貸付けに係る契約であって、返済期間が1か月を超えるもの","③":"貸金業者が、個人顧客との間で締結する、個人顧客又は当該個人顧客の親族で当該個人顧客と生計を一にする者の緊急に必要と認められる医療費（所得税法第73条第2項に規定する医療費をいう。）を支払うために必要な資金の貸付けに係る契約（高額療養費に係る貸金業法施行規則第10条の21第1項第4号に掲げる契約を除く。）であって、当該個人顧客の返済能力を超えないと認められるもの（当該個人顧客が現に当該貸付けに係る契約を締結していない場合に限る。）","④":"貸金業者が、個人顧客との間で締結する、当該個人顧客が貸金業者でない者と締結した貸付けに係る契約に基づき既に負担している債務（以下、本問において「既存債務」という。）を弁済するために必要な資金の貸付けに係る契約であって、当該個人顧客が当該契約に基づき将来支払うべき返済金額の合計額が既存債務について将来支払うべき返済金額の合計額を上回るが、当該契約の1か月の負担が既存債務に係る1か月の負担を上回らないもの"},"note":"","answer":3,"format":"single","negative":false},{"id":"R17-11","kai":17,"era":"令和4年度","num":11,"sectionShort":"法令","stem":"貸金業法第14条（貸付条件等の掲示）及び同法第23条（標識の掲示）に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"貸金業者が、貸付条件等の掲示として、営業所又は事務所（以下、本問において「営業所等」という。）ごとに掲示しなければならない事項には、当該貸金業者の商号、名称又は氏名及び登録番号が含まれる。","②":"貸金業者が、貸付条件等の掲示として、営業所等ごとに掲示しなければならない事項には、金銭の貸付けにあっては、「主な返済の例」が含まれる。","③":"貸金業者は、営業所等ごとに、顧客の見やすい場所に、内閣府令で定める様式の標識（以下、本問において「標識」という。）を掲示すれば足りる。","④":"貸金業者は、その営業所等のうち現金自動設備については、標識を掲示する必要はない。"},"note":"","answer":2,"format":"single","negative":false},{"id":"R17-12","kai":17,"era":"令和4年度","num":12,"sectionShort":"法令","stem":"貸金業法第17条（契約締結時の書面の交付）第6項及び同法第18条（受取証書の交付）第3項に規定する「一定期間における貸付け及び弁済その他の取引の状況を記載した書面として内閣府令で定めるもの」（以下、本問において「マンスリーステートメント」という。）の交付に関する次のａ～ｄの記述のうち、その内容が適切なものの個数を①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"貸金業者向けの総合的な監督指針（以下、本問において「監督指針」という。）によれば、監督当局は、書面の交付義務に関する貸金業者の監督に当たっては、マンスリーステートメントの交付に際しては、マンスリーステートメントが交付される旨及び個別書面の記載事項が簡素化される旨を示したうえで、あらかじめ書面又は電磁的方法により承諾を得ているかに留意する必要があるとされている。","ｂ":"監督指針によれば、監督当局は、書面の交付義務に関する貸金業者の監督に当たっては、債務者等から、マンスリーステートメントでの交付の承諾を撤回したい旨の意思表示があった場合、マンスリーステートメント以外の方法による書面交付の適用開始の時期等について、適切な説明が行われているかに留意する必要があるとされている。","ｃ":"貸金業者は、顧客との間で極度方式貸付けに係る契約を締結した場合において、当該顧客からマンスリーステートメントの交付の承諾を受けているときは、遅滞なく、当該顧客に対し貸金業法第17条第1項に規定する書面（契約締結時の書面）の交付に代えてマンスリーステートメントを交付しなければならない。","ｄ":"貸金業者は、極度方式貸付けに係る契約を締結した後、当該契約の基本となる極度方式基本契約に係る極度方式保証契約の保証人から、当該極度方式保証契約に基づく債権の一部について弁済を受けた。この場合において、当該貸金業者は、当該保証人の承諾を得て、内閣府令で定めるところにより、マンスリーステートメントを交付するときは、貸金業法第18条第1項に規定する書面（受取証書）の交付に代えて、同条第3項に規定する受領年月日、受領金額のほか内閣府令で定める事項を記載した書面を当該保証人に交付することができる。"},"options":{"①":"1個","②":"2個","③":"3個","④":"4個"},"note":"","answer":3,"format":"count","negative":false},{"id":"R17-13","kai":17,"era":"令和4年度","num":13,"sectionShort":"法令","stem":"貸金業法第19条に規定する帳簿（以下、本問において「帳簿」という。）に関する次のａ～ｄの記述のうち、その内容が適切なものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"貸金業者は、その主たる営業所にのみ、帳簿を備え、債務者ごとに貸付けの契約について契約年月日、貸付けの金額、受領金額その他内閣府令で定める事項を記載し、これを保存すれば足りる。","ｂ":"貸金業者は、帳簿を、債務者ごとに、債務者との全ての取引が終了した日から少なくとも10年間保存しなければならない。","ｃ":"貸金業者向けの総合的な監督指針（以下、本問において「監督指針」という。）によれば、貸金業法施行規則第16条（帳簿の備付け）第1項第7号に規定する「交渉の経過の記録」（以下、本問において「交渉の経過の記録」という。）とは、債権の回収に関する記録、貸付けの契約（保証契約を含む。）の条件の変更（当該条件の変更に至らなかったものを除く。）に関する記録等、貸付けの契約の締結以降における貸付けの契約に基づく債権に関する交渉の経過の記録であるとされている。","ｄ":"監督指針によれば、「交渉の経過の記録」として記録される事項である交渉内容には、催告書等の書面の内容を含むとされている。"},"options":{"①":"ａｂ","②":"ａｃ","③":"ｂｄ","④":"ｃｄ"},"note":"","answer":4,"format":"combo","negative":false},{"id":"R17-14","kai":17,"era":"令和4年度","num":14,"sectionShort":"法令","stem":"貸金業法第24条（債権譲渡等の規制）に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。なお、本問における債権は、抵当証券法第1条第1項に規定する抵当証券に記載された債権ではないものとする。","statements":{},"options":{"①":"貸金業者は、貸付けに係る契約に基づく債権を貸金業者ではない者に譲渡した場合に限り、その者に対し、当該債権が貸金業者の貸付けに係る契約に基づいて発生したことその他内閣府令で定める事項、及びその者が当該債権に係る貸付けの契約に基づく債権に関してする行為について貸金業法第24条第1項に規定する条項の適用がある旨を、内閣府令で定める方法により、通知しなければならない。","②":"貸金業者が、貸付けに係る契約（極度方式基本契約及び極度方式貸付けに係る契約ではないものとする。）に基づく債権を貸金業者ではない者に譲渡した場合、譲渡人である当該貸金業者は、貸金業法第24条第2項により準用される同法第17条第1項に規定する当該債権の内容を明らかにする書面を当該債権の債務者に交付しなければならない。","③":"貸金業者から貸付けに係る契約に基づく債権を譲り受けた者は、その債権について保証人となろうとする者との間で保証契約を締結しようとする場合には、当該保証契約を締結するまでに、貸金業法第16条の2第3項に規定する当該保証契約の内容を説明する書面を、当該保証契約の保証人となろうとする者に交付しなければならない。","④":"貸金業者は、貸付けの契約に基づく債権の取立ての委託をした相手方が、取立て制限者(注)であり、かつ、当該債権の取立てをするに当たり、貸金業法第21条（取立て行為の規制）第1項の規定に違反した場合において、当該債権の取立ての委託に当たりその相手方が取立て制限者であることを知らなかったときは、知ることができたとしても、行政処分の対象とはならない。"},"note":"(注) 取立て制限者とは、暴力団員等、暴力団員等がその運営を支配する法人その他の団体もしくは当該法人その他の団体の構成員又は貸付けの契約に基づく債権の取立てに当たり、貸金業法第21条第1項の規定に違反し、もしくは刑法もしくは暴力行為等処罰に関する法律の罪を犯すおそれが明らかである者をいう。","answer":3,"format":"single","negative":false},{"id":"R17-15","kai":17,"era":"令和4年度","num":15,"sectionShort":"法令","stem":"指定信用情報機関への信用情報の提供等に関する次のａ～ｄの記述のうち、その内容が適切なものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。なお、本問における貸金業者は、非営利特例対象法人及び特定非営利金融法人ではないものとする。","statements":{"ａ":"加入貸金業者(注1)は、資金需要者である個人の顧客を相手方として、極度方式基本契約に基づく極度方式貸付けに係る契約を締結したときは、遅滞なく、当該契約に係る個人信用情報を加入指定信用情報機関(注2)に提供しなければならない。","ｂ":"加入貸金業者は、資金需要者である個人の顧客を相手方として、住宅資金貸付契約を締結したときは、当該契約に係る個人信用情報を加入指定信用情報機関に提供する必要はない。","ｃ":"加入貸金業者が加入指定信用情報機関に提供する個人信用情報には、勤務先の商号又は名称が含まれる。","ｄ":"加入貸金業者が加入指定信用情報機関に提供する個人信用情報には、国民健康保険証で本人確認（犯罪による収益の移転防止に関する法律第4条第1項第1号に規定する本人特定事項の確認をいう。）を行った場合におけるその保険証の記号番号が含まれる。"},"options":{"①":"ａｂ","②":"ａｃ","③":"ｂｄ","④":"ｃｄ"},"note":"(注1) 加入貸金業者とは、指定信用情報機関と信用情報提供契約を締結した相手方である貸金業者をいう。(注2) 加入指定信用情報機関とは、加入貸金業者と信用情報提供契約を締結した指定信用情報機関をいう。","answer":2,"format":"combo","negative":false},{"id":"R17-16","kai":17,"era":"令和4年度","num":16,"sectionShort":"法令","stem":"ＡとＢとの間の複数の営業的金銭消費貸借契約（以下、本問において、「第一契約」、「第二契約」又は「第三契約」という。）に関する次のａ～ｄの記述のうち、利息制限法上、その内容が適切なものの個数を①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"Ａは、元本を95万円及び利息を利率年1割8分（18％）とする第一契約を締結し95万円をＢに貸し付けた後、その1か月後に第一契約に基づく債務がまったく弁済されていない時点において元本を9万円及び利息を利率年2割（20％）とする第二契約を締結し9万円をＢに貸し付けた。この場合、第一契約及び第二契約における利息の約定は、年1割5分（15％）を超過する部分に限り無効となる。","ｂ":"Ａは、元本を30万円及び利息を利率年1割8分（18％）とする第一契約を締結し30万円をＢに貸し付けた後、第一契約に基づく債務の残高が9万円である時点において、元本を5万円及び利息を利率年2割（20％）とする第二契約を締結し5万円をＢに貸し付けた。この場合、第二契約における利息の約定は、年1割8分（18％）を超過する部分に限り無効となる。","ｃ":"Ａは、元本を50万円及び利息を利率年1割8分（18％）とする第一契約を締結し50万円をＢに貸し付けた後、第一契約に基づく債務の残高が5万円である時点において、元本を3万円及び利息を利率年2割（20％）とする第二契約を締結し3万円をＢに貸し付けた。この場合、第二契約における利息の約定は、年1割8分（18％）を超過する部分に限り無効となる。","ｄ":"Ａは、元本を50万円及び利息を利率年1割6分（16％）とする第一契約を締結し50万円をＢに貸し付けた後、第一契約に基づく債務の残高が45万円である時点において、元本を5万円及び利息を利率年1割8分（18％）とする第二契約を締結し5万円をＢに貸し付けると同時に、元本を50万円及び利息を利率年1割6分（16％）とする第三契約を締結し50万円をＢに貸し付けた。この場合、第二契約及び第三契約のいずれの利息の約定も、年1割5分（15％）を超過する部分に限り無効となる。"},"options":{"①":"1個","②":"2個","③":"3個","④":"4個"},"note":"","answer":2,"format":"count","negative":false},{"id":"R17-17","kai":17,"era":"令和4年度","num":17,"sectionShort":"法令","stem":"みなし利息に関する次のａ～ｄの記述のうち、利息制限法上、その内容が適切なものの組み合わせを①～④の中から1つだけ選び、解答欄にその番号をマークしなさい。","statements":{"ａ":"貸金業者が、顧客との間で締結した営業的金銭消費貸借契約において、金銭の貸付け及び弁済に用いるため当該契約締結時に当該顧客に交付したカードの発行手数料を当該顧客から受領した場合、当該手数料は、利息とみなされる。","ｂ":"貸金業者が、顧客との間で締結した営業的金銭消費貸借契約に基づく貸付金を当該顧客が指定する銀行口座に振り込む際に要した手数料を当該顧客から受領した場合、当該手数料は、利息とみなされる。","ｃ":"貸金業者が、顧客との間で締結した営業的金銭消費貸借契約において、口座振替の方法による弁済につき、当該顧客が弁済期に弁済できなかったため、当該顧客の要請を受けて行った再度の口座振替手続に要した費用を当該顧客から受領した場合、当該費用は、利息とみなされる。","ｄ":"貸金業者が、顧客との間で締結した営業的金銭消費貸借契約において、貸金業法第17条第1項に規定する契約の内容を明らかにする書面を交付した後、当該顧客からの紛失による再発行の要請に基づき、当該書面を再発行し、その手数料を当該顧客から受領した場合、当該手数料は、利息とみなされる。"},"options":{"①":"ａｂ","②":"ａｃ","③":"ｂｄ","④":"ｃｄ"},"note":"","answer":1,"format":"combo","negative":false},{"id":"R17-18","kai":17,"era":"令和4年度","num":18,"sectionShort":"法令","stem":"株式会社であるＡが貸金業の登録の申請をした。この場合に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"Ａの取締役の中に、刑法の罪を犯し、懲役の刑の言渡しを受けその刑の全部の執行を猶予され、当該執行猶予の言渡しを取り消されることなくその猶予の期間を経過したが、その日から5年を経過しない者がいる場合、貸金業法第6条（登録の拒否）に規定する登録の拒否事由（以下、本問において「登録拒否事由」という。）に該当する。","②":"Ａの常務に従事する役員は取締役3人であり、その全員が、貸付けの業務に従事した経験をまったく有しない場合、登録拒否事由に該当する。","③":"Ａの取締役の中に、道路交通法の規定に違反し、懲役の刑に処せられ、その刑の執行を終わり、又は刑の執行を受けることがなくなった日から5年を経過しない者がいる場合、登録拒否事由に該当する。","④":"Ａが、再生手続開始の決定又は更生手続開始の決定のいずれも受けておらず、その純資産額が3,000万円である場合、登録拒否事由に該当する。"},"note":"","answer":1,"format":"single","negative":true},{"id":"R17-19","kai":17,"era":"令和4年度","num":19,"sectionShort":"法令","stem":"貸金業者向けの総合的な監督指針におけるシステムリスク管理態勢に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"サイバーセキュリティ事案とは、情報通信ネットワークや情報システム等の悪用により、サイバー空間を経由して行われる不正侵入、情報の窃取、改ざんや破壊、情報システムの作動停止や誤作動、不正プログラムの実行やDDoS攻撃等の、いわゆるサイバー攻撃により、サイバーセキュリティが脅かされる事案をいう。","②":"システムリスク管理態勢の検証については、貸金業者の業容に応じて、例えば、システムリスクに対する認識等として、経営陣は、システムリスクの重要性を十分に認識した上で、システムを統括管理する役員を定めているかに留意して検証することとされている。","③":"システムリスク管理態勢の検証については、貸金業者の業容に応じて、例えば、情報セキュリティ管理として、貸金業者が責任を負うべき資金需要者等の重要情報を網羅的に洗い出す必要があるが、資金需要者等の重要情報の洗い出しにあたっては、通常の業務では使用しないシステム領域に格納されたデータを除くすべてのデータ保存領域について、障害解析のためにシステムから出力された障害解析用データ、現金自動設備（店舗外含む。）等に保存されている取引ログ等のようなデータを洗い出しの対象範囲としているかに留意して検証することとされている。","④":"システムリスク管理態勢の検証については、貸金業者の業容に応じて、例えば、システム監査として、システム部門から独立した内部監査部門において、システムに精通した監査要員による定期的なシステム監査が行われているか（外部監査人によるシステム監査を導入する方が監査の実効性があると考えられる場合には、内部監査に代え外部監査を利用して差し支えない。）に留意して検証することとされている。"},"note":"","answer":3,"format":"single","negative":true},{"id":"R17-20","kai":17,"era":"令和4年度","num":20,"sectionShort":"法令","stem":"株式会社である貸金業者Ａが、貸金業法第13条の3に基づき、個人顧客Ｂとの間で締結している極度方式基本契約（以下、本問において「本件基本契約」という。）について行う、本件基本契約が基準額超過極度方式基本契約に該当するかどうかの調査（以下、本問において「本件調査」という。）等に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。なお、Ａは、Ｂとの間で本件基本契約以外の極度方式基本契約を締結していないものとする。","statements":{},"options":{"①":"Ａは、本件基本契約の契約期間を本件基本契約の締結日から同日以後1か月以内の一定の期日までの期間及び当該一定の期日の翌日以後1か月ごとの期間に区分したそれぞれの期間（以下、本問において「所定の期間」という。）において、直近の所定の期間内にＡが行った本件基本契約に基づく極度方式貸付けの金額の合計額が15万円である場合であっても、当該所定の期間の末日における本件基本契約に基づく極度方式貸付けの残高の合計額が5万円であるときは、本件調査を行う必要はない。","②":"Ａは、3か月以内の一定の期間の末日における本件基本契約に基づく極度方式貸付けの残高の合計額が30万円である場合は、本件調査を行わなければならない。","③":"Ａは、本件調査において、ＢがＡ以外の貸金業者との間で締結した貸付けに係る契約の貸付残高が60万円、本件基本契約の極度額が50万円かつ本件基本契約に基づく極度方式貸付けの残高が30万円である場合は、Ｂから、源泉徴収票その他のＢの収入又は収益その他の資力を明らかにする事項を記載し、又は記録した書面又は電磁的記録として内閣府令で定めるものの提出又は提供を受けているときを除き、その提出又は提供を受けなければならない。","④":"Ａは、3か月以内の一定の期間の末日において、本件基本契約の極度額の減額の措置を講じている場合、当該極度額を減額の措置を講じる前の金額に増額するまでの間は、本件調査を行う必要はない。"},"note":"","answer":4,"format":"single","negative":true},{"id":"R17-21","kai":17,"era":"令和4年度","num":21,"sectionShort":"法令","stem":"次の①～④の記述のうち、貸金業者が、個人顧客との間で金銭の貸付けに係る極度方式基本契約を締結しようとする場合に、当該契約を締結するまでに、貸金業法第16条の2第2項に規定する書面（極度方式基本契約における契約締結前の書面）により当該個人顧客に明らかにしなければならない事項に該当しないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"当該契約の相手方となろうとする個人顧客の氏名及び住所","②":"各回の返済期日及び返済金額の設定の方式","③":"返済の方法及び返済を受ける場所","④":"返済の方式"},"note":"","answer":1,"format":"single","negative":true},{"id":"R17-22","kai":17,"era":"令和4年度","num":22,"sectionShort":"法令","stem":"貸金業者Ａが顧客Ｂとの間で極度額を50万円とし利率を年1割8分（18％）とする極度方式基本契約を令和4年4月1日に締結した場合に交付する貸金業法第17条（契約締結時の書面の交付）第2項に規定する書面（以下、本問において「基本契約に係る書面」という。）及び当該極度方式基本契約に基づく極度方式貸付けに係る契約を締結した場合に交付する同条第1項に規定する書面（以下、本問において「個別契約に係る書面」という。）に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。なお、本問における極度方式基本契約及び極度方式貸付けに係る契約は、いずれも金銭の貸付けに係る契約であって、手形の割引の契約及び売渡担保の契約ではないものとする。","statements":{},"options":{"①":"Ａは、個別契約に係る書面におけるＡの登録番号の記載を省略することができる。","②":"Ａは、基本契約に係る書面に利息の計算の方法を記載した場合には、個別契約に係る書面における利息の計算の方法の記載を省略することができる。","③":"Ａは、基本契約に係る書面に貸付けの利率を記載した場合には、個別契約に係る書面における貸付けの利率の記載を省略することができる。","④":"Ａは、個別契約に係る書面における各回の返済期日及び返済金額を次回の返済期日及び返済金額をもって代えることができる。"},"note":"","answer":3,"format":"single","negative":true},{"id":"R17-23","kai":17,"era":"令和4年度","num":23,"sectionShort":"法令","stem":"貸金業者Ａが、個人顧客Ｂとの間で貸付けに係る契約を締結し金銭をＢに貸し付け、Ｂに貸金業法第17条第1項に規定する書面（以下、本問において「契約締結時の書面」という。）を交付した後に、Ｂとの合意に基づき契約締結時の書面に記載した事項を変更した。この場合に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"Ａは、「利息の計算の方法」を変更した場合、当該変更がＢの利益となる変更であるときを除き、変更後の内容を記載した契約締結時の書面をＢに再交付しなければならない。","②":"Ａは、「返済の方法及び返済を受ける場所」を変更した場合、当該変更がＢの利益となる変更であるときを除き、変更後の内容を記載した契約締結時の書面をＢに再交付しなければならない。","③":"Ａは、「債務者が負担すべき元本及び利息以外の金銭に関する事項」を変更した場合、当該変更がＢの利益となる変更であるときを除き、変更後の内容を記載した契約締結時の書面をＢに再交付しなければならない。","④":"Ａは、「期限の利益の喪失の定めがあるときは、その旨及びその内容」を変更した場合、当該変更がＢの利益となる変更であるときを除き、変更後の内容を記載した契約締結時の書面をＢに再交付しなければならない。"},"note":"","answer":2,"format":"single","negative":true},{"id":"R17-24","kai":17,"era":"令和4年度","num":24,"sectionShort":"法令","stem":"貸金業法第18条第1項に規定する書面（以下、本問において「受取証書」という。）の交付に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"貸金業者は、その営業所の窓口において、貸付けに係る契約に基づく債権の全部について、当該契約の債務者から弁済を受けたときは、遅滞なく、内閣府令で定めるところにより、受取証書を当該債務者に交付すれば足りる。","②":"貸金業者は、預金又は貯金の口座に対する払込みにより、貸付けに係る契約に基づく債権の全部について、当該契約の債務者から弁済を受けた場合、当該債務者の請求があったときに限り、受取証書を当該債務者に交付しなければならない。","③":"貸金業者は、貸付けに係る契約の債務者に受取証書を交付しなければならない場合、当該受取証書において、当該契約を契約番号その他により明示することをもって、当該貸金業者の登録番号及び当該債務者の商号、名称又は氏名の記載に代えることができる。","④":"貸金業者は、その営業所の窓口において、貸付けに係る契約に基づく債権の一部について、当該契約の債務者から弁済を受け、受取証書を交付する場合、当該受取証書に、受領金額及びその利息、賠償額の予定に基づく賠償金又は元本への充当額のほか、貸付けの金額等を記載しなければならない。"},"note":"","answer":1,"format":"single","negative":true},{"id":"R17-25","kai":17,"era":"令和4年度","num":25,"sectionShort":"法令","stem":"貸付けの契約に基づく債権の取立てに関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"貸金業者の貸付けの契約に基づく債権の取立てについて貸金業者から委託を受けた者が、債務者等に対し、支払を催告するために送付する書面に記載しなければならない事項には、当該書面を送付する者の氏名が含まれる。","②":"貸金業者は、債務者等から貸付けの契約に基づく債権に係る債務の処理の委託を受けた弁護士から、書面により、当該委託を受けた旨の通知を受けた場合、正当な理由がないのに、債務者等に対し、電話をかけ、電報を送達し、もしくはファクシミリ装置を用いて送信し、又は訪問する方法により、当該債務を弁済することを要求し、これに対し債務者等から直接要求しないよう求められたにもかかわらず、更にこれらの方法で当該債務を弁済することを要求してはならない。","③":"貸金業者は、貸金業法第21条（取立て行為の規制）第2項の規定により、債務者等に対し、支払を催告するために書面又はこれに代わる電磁的記録を送付するときは、当該書面に封をする方法、本人のみが使用していることが明らかな電子メールアドレスに電子メールを送付する方法その他の債務者の借入れに関する事実が債務者等以外の者に明らかにならない方法により行わなければならない。","④":"貸金業者向けの総合的な監督指針によれば、監督当局は、貸金業者以外の者が貸し付けた債権について、貸金業者が、保証契約に基づき求償権を有する場合、その取立てに当たっては貸金業法第21条が適用されることがないため、不適切な取立て行為が行われないよう指導及び監視することに留意するものとされている。"},"note":"","answer":4,"format":"single","negative":true},{"id":"R17-26","kai":17,"era":"令和4年度","num":26,"sectionShort":"法令","stem":"貸金業者に対する監督に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"内閣総理大臣又は都道府県知事（以下、本問において「登録行政庁」という。）は、3年毎に、当該職員に、その登録を受けた貸金業者の営業所もしくは事務所に立ち入らせ、その業務に関して質問させ、又は帳簿書類その他の物件を検査させなければならない。","②":"登録行政庁は、その登録を受けた貸金業者が、自己の名義で、貸金業法第3条第1項の登録を受けていない者に貸金業を営ませた場合、当該貸金業者の登録を取り消さなければならない。","③":"登録行政庁は、その登録を受けた貸金業者が、正当な理由がないのに、引き続き6か月以上貸金業を休止した場合、当該貸金業者の登録を取り消すことができる。","④":"登録行政庁は、その登録を受けた貸金業者の業務の運営に関し、資金需要者等の利益の保護を図るため必要があると認めるときは、当該貸金業者に対して、その必要の限度において、業務の方法の変更その他業務の運営の改善に必要な措置を命ずることができる。"},"note":"","answer":1,"format":"single","negative":true},{"id":"R17-27","kai":17,"era":"令和4年度","num":27,"sectionShort":"法令","stem":"金利等の規制に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"貸金業法上、金銭の貸借の媒介を行った貸金業者は、当該媒介により締結された貸付けに係る契約の債務者から当該媒介の手数料を受領した場合において、当該契約につき更新があったときは、これに対する新たな手数料を受領し、又はその支払を要求してはならない。","②":"出資法(注)上、金銭の貸借の媒介を行う者が、その媒介に係る貸借（貸借の期間が1年以上であるものとする。）の金額の100分の5に相当する金額を超える手数料の契約をし、又はこれを超える手数料を受領する行為は、刑事罰の対象となる。","③":"貸金業法上、貸金業者は、その利息が利息制限法第1条（利息の制限）に規定する金額を超える利息の契約を締結した場合、行政処分の対象となる。","④":"出資法上、金銭の貸付けを行う者が業として金銭の貸付けを行う場合において、元本100万円に対して年2割（20％）の利息の契約を締結する行為は、刑事罰の対象となる。"},"note":"(注) 出資法とは、出資の受入れ、預り金及び金利等の取締りに関する法律をいう。","answer":4,"format":"single","negative":true},{"id":"R17-28","kai":17,"era":"令和4年度","num":28,"sectionShort":"貸付実務","stem":"行為能力に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"未成年者は、法定代理人が目的を定めて処分を許した財産については、その目的の範囲内において自由に処分することができるが、法定代理人が目的を定めないで処分を許した財産については、自由に処分することができない。","②":"未成年者は、一種又は数種の営業を許された場合において、当該許された営業以外の法律行為を単独で行ったときは、未成年者による法律行為であることを理由として、当該単独で行った法律行為を取り消すことができない。","③":"後見開始の審判を受けた者は、成年被後見人とし、これに成年後見人を付する。家庭裁判所は、成年後見人を付するにあたっては、法人を成年後見人とすることができる。","④":"成年被後見人が成年後見人の同意を得て行った法律行為（日用品の購入その他日常生活に関する行為ではないものとする。）は、取り消すことができない。"},"note":"","answer":3,"format":"single","negative":false},{"id":"R17-29","kai":17,"era":"令和4年度","num":29,"sectionShort":"貸付実務","stem":"消滅時効に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"時効の利益は、あらかじめ放棄することができる。","②":"民事調停が申し立てられた場合において、当該民事調停が不調に終わったときは、当該民事調停が不調に終わった時から6か月を経過するまでの間は、時効は完成しない。","③":"催告があった場合、その時から6か月を経過するまでの間に、再度の催告をしたときは、再度の催告の時から6か月を経過するまでの間は、時効は完成しない。","④":"権利についての協議を行う旨の合意が書面でなされた場合、時効は、その合意がなされた時から新たにその進行を始める。"},"note":"","answer":2,"format":"single","negative":false},{"id":"R17-30","kai":17,"era":"令和4年度","num":30,"sectionShort":"貸付実務","stem":"質権及び抵当権に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"動産を目的とする質権の設定は、債権者に当該動産を引き渡すことによって、その効力を生ずる。","②":"質権者は、質権設定者の承諾を得なければ、質物について、転質をすることができない。","③":"抵当権は、その担保する債権について不履行があったとしても、抵当不動産の果実に及ばない。","④":"抵当権者は、利息その他の定期金を請求する権利を有するときは、その全額についてその抵当権を行使することができる。"},"note":"","answer":1,"format":"single","negative":false},{"id":"R17-31","kai":17,"era":"令和4年度","num":31,"sectionShort":"貸付実務","stem":"保証に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"保証債務は、主たる債務に関する利息、違約金、損害賠償その他その債務に従たるすべてのものを包含するが、保証人は、その保証債務についてのみ、違約金又は損害賠償の額を約定することはできない。","②":"主たる債務の目的又は態様が保証契約の締結後に軽減又は加重されたときは、保証人の負担もこれに応じて軽減又は加重される。","③":"主たる債務者に対する履行の請求その他の事由による消滅時効の完成猶予及び更新は、保証人に対しては、その効力を生じない。","④":"主たる債務者が期限の利益を有する場合において、その利益を喪失したときは、債権者は、保証人（法人である場合を除く。）に対し、その利益の喪失を知った時から2か月以内に、その旨を通知しなければならない。"},"note":"","answer":4,"format":"single","negative":false},{"id":"R17-32","kai":17,"era":"令和4年度","num":32,"sectionShort":"貸付実務","stem":"弁済に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"受領権者（債権者及び法令の規定又は当事者の意思表示によって弁済を受領する権限を付与された第三者をいう。）以外の者であって取引上の社会通念に照らして受領権者としての外観を有するものに対してした弁済は、その弁済をした者が善意であれば、過失の有無にかかわらず、その効力を有する。","②":"当事者が第三者の弁済を禁止した場合は、弁済をするについて正当な利益を有する第三者であっても、弁済をすることができない。","③":"債務者が一個又は数個の債務について元本のほか利息及び費用を支払うべき場合において、弁済をする者がその債務の全部を消滅させるのに足りない給付をしたときは、弁済の充当の順序に関する合意の有無にかかわらず、これを順次に費用、利息及び元本に充当しなければならない。","④":"弁済の提供は、債権者があらかじめその受領を拒んでいるときであっても、弁済の準備をしたことを通知してその受領の催告をすることでは足りず、債務の本旨に従って現実にしなければならない。"},"note":"","answer":2,"format":"single","negative":false},{"id":"R17-33","kai":17,"era":"令和4年度","num":33,"sectionShort":"貸付実務","stem":"相続に関する次の①～④の記述のうち、民法上、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"Ａは、配偶者Ｂ及び胎児Ｃのみを遺して死亡した。Ｃは、生きて産まれたときであってもＡの相続人とならない。","②":"Ａは、配偶者Ｂ及び親Ｃのみを遺して死亡した。この場合、Ｃの法定相続分は、3分の2である。","③":"Ａは、配偶者Ｂ、子Ｃ及び子Ｄのみを遺して死亡した。Ｂが相続を単純承認した場合であっても、Ｃ及びＤは、限定承認をすることができる。","④":"Ａは、配偶者Ｂ及び子Ｃのみを遺して死亡した。Ｂ及びＣは、遺産分割協議により、ＡのＤに対する借入金債務をＢのみが相続することとした場合であっても、Ｄは、Ｂ及びＣに対して、当該借入金債務に係るそれぞれの法定相続分の割合に相当する債務の弁済を請求することができる。"},"note":"","answer":4,"format":"single","negative":false},{"id":"R17-34","kai":17,"era":"令和4年度","num":34,"sectionShort":"貸付実務","stem":"破産法に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"破産手続開始の申立てがあった場合において、破産財団をもって破産手続の費用を支弁するのに不足するときは、その申立ては却下される。","②":"免責許可の申立ては、破産手続廃止の決定が確定した後1か月以内に限り、破産裁判所に対し、当該申立てをすることができる。","③":"裁判所は、破産者について、浪費又は賭博その他の射幸行為をしたことによって著しく財産を減少させ、又は過大な債務を負担したと認めるときは、他にいかなる事由があるときであっても、免責許可の決定をすることはできない。","④":"破産者は、免責許可の決定が確定したときは、復権する。"},"note":"","answer":4,"format":"single","negative":false},{"id":"R17-35","kai":17,"era":"令和4年度","num":35,"sectionShort":"貸付実務","stem":"犯罪による収益の移転防止に関する法律についての次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"貸金業者は、顧客である株式会社（その株式を金融商品取引所に上場しているものとする。）の取引時確認を行う場合においては、当該会社のために当該貸金業者との間で当該取引時確認の対象となる取引を行っている当該会社の担当者の本人特定事項の確認を行わなければならない。","②":"貸金業者は、個人顧客との間で特定取引を行うに際し、当該顧客から電気料金等の公共料金の領収証書の原本の提示を受けたときは、取引時確認における本人特定事項の確認を行ったものと認められる。","③":"貸金業者は、特定業務に係る取引について、顧客が組織的な犯罪の処罰及び犯罪収益の規制等に関する法律第10条（犯罪収益等隠匿）の罪に当たる行為を行っている疑いがあると認められる場合においては、速やかに、管轄の行政庁及び当該貸金業者が加入している貸金業法上の指定信用情報機関に届け出なければならない。","④":"貸金業者は、取引時確認を行った場合には、直ちに、主務省令で定める方法により、当該取引時確認に係る事項、当該取引時確認のためにとった措置その他の主務省令で定める事項に関する記録を作成し、当該記録を、当該取引時確認を行った日から7年間保存しなければならない。"},"note":"","answer":1,"format":"single","negative":false},{"id":"R17-36","kai":17,"era":"令和4年度","num":36,"sectionShort":"貸付実務","stem":"Ａは、その所有する甲土地をＢに売却する旨の委任に係る代理権（以下、本問において「本件代理権」という。）をＣに付与しようとしている。この場合に関する次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"Ｃは、Ａから本件代理権を付与され、Ａの代理人としてＢとの間で甲土地の売買契約を締結した。この場合において、当該売買契約の効力がＢの詐欺があったことによって影響を受けるべきときには、その事実の有無は、Ｃについて決するものとされる。","②":"Ｃは、Ａから本件代理権を付与されていた一方で、Ｂからも甲土地の購入について代理権を付与されていた。この場合において、Ｃが、Ａ及びＢの事前の許諾を得ることなく、Ａ及びＢの双方の代理人として、甲土地をＢに3,000万円で売却する旨の契約を締結したときは、Ｃの当該行為は無権代理行為となる。","③":"Ｃは、Ａから本件代理権を付与されていなかったのに、Ａの代理人と称してＢとの間で甲土地の売買契約を締結した。この場合、Ｂは、Ａに対して相当の期間を定めて当該売買契約を追認するか否かを催告することができる。","④":"Ｃは、Ａから本件代理権を付与されていなかったのに、Ａの代理人と称してＢとの間で甲土地の売買契約を締結した。この場合、Ｂは、当該売買契約締結時点において、Ｃに代理権がないことを知っていたときであっても、Ａが追認をしない間は、当該売買契約を取り消すことができる。"},"note":"","answer":4,"format":"single","negative":true},{"id":"R17-37","kai":17,"era":"令和4年度","num":37,"sectionShort":"貸付実務","stem":"無効及び取消しに関する次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"行為能力の制限によって取り消すことができる行為は、制限行為能力者（他の制限行為能力者の法定代理人としてした行為にあっては、当該他の制限行為能力者を含む。）又はその代理人、承継人もしくは同意をすることができる者に限り、取り消すことができる。","②":"取り消された行為は、初めから無効であったものとみなされる。","③":"無効な行為は、追認によっても、その効力を生じない。ただし、当事者がその行為の無効であることを知って追認をしたときは、新たな行為をしたものとみなされる。","④":"追認をすることができる時よりも前に、取り消すことができる行為によって取得した権利を譲渡したときは、追認をしたものとみなされる。"},"note":"","answer":4,"format":"single","negative":true},{"id":"R17-38","kai":17,"era":"令和4年度","num":38,"sectionShort":"貸付実務","stem":"債務の引受けに関する次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"併存的債務引受の引受人は、債務者と連帯して、債務者が債権者に対して負担する債務と同一の内容の債務を負担する。","②":"併存的債務引受は、債権者、債務者及び引受人となる者との三者間で契約を締結しなければ、その効力を生じない。","③":"免責的債務引受の引受人は、債務者が債権者に対して負担する債務と同一の内容の債務を負担し、債務者は、自己の債務を免れる。","④":"免責的債務引受の引受人は、債務者に対して求償権を取得しない。"},"note":"","answer":2,"format":"single","negative":true},{"id":"R17-39","kai":17,"era":"令和4年度","num":39,"sectionShort":"貸付実務","stem":"相殺に関する次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"Ａは、Ｂに対して悪意による不法行為に基づく損害賠償債権を有するとともに売買契約に基づく代金債務を負っている。この場合において、Ａは、当該損害賠償債権と当該代金債務とを相殺することができない。","②":"Ａは、Ｂに対して売買契約に基づく代金債権を有するとともに金銭消費貸借契約に基づく借入金債務を負っている。当該売買契約においては、Ｂは、代金の支払期日に、Ａからの商品の納品と引き換えに、代金をＡに支払う旨の約定がなされている。この場合において、Ａは、代金の支払期日が到来しても、Ｂに商品を納品していないときは、当該代金債権と当該借入金債務とを相殺することができない。","③":"Ｂは、Ａに対して売買契約に基づく代金債権を有しており、Ｂの債権者であるＣは、当該代金債権を差し押さえた。Ａに当該差押命令が送達された後、Ａが、ＤからＤのＢに対する貸付金債権を譲り受けた場合、Ａは、当該貸付金債権とＢに対して負う代金債務との相殺をもってＣに対抗することができない。","④":"Ａは、Ｂに対して金銭消費貸借契約に基づく貸付金債権を有するとともに売買契約に基づく代金債務を負っている。この場合において、ＡがＢに当該貸付金債権と当該代金債務との相殺の意思表示をしたときは、当該意思表示は双方の債務が互いに相殺に適するようになった時にさかのぼってその効力を生ずる。"},"note":"","answer":1,"format":"single","negative":true},{"id":"R17-40","kai":17,"era":"令和4年度","num":40,"sectionShort":"貸付実務","stem":"契約に関する次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"申込者が申込みの通知を発した後に死亡した場合において、申込者がその事実が生じたとすればその申込みは効力を有しない旨の意思を表示していたとき、又はその相手方が承諾の通知を発するまでにその事実が生じたことを知ったときは、その申込みは、その効力を有しない。","②":"当事者双方の責めに帰することができない事由によって債務を履行することができなくなったときは、債権者は、反対給付の履行を拒むことができる。","③":"当事者の一方が、第三者との間で契約上の地位を譲渡する旨の合意をした場合において、その契約の相手方にその旨の通知をしたときは、契約上の地位は、その第三者に移転する。","④":"当事者の一方がその解除権を行使したときは、各当事者は、その相手方を原状に復させる義務を負う。ただし、第三者の権利を害することはできない。"},"note":"","answer":3,"format":"single","negative":true},{"id":"R17-41","kai":17,"era":"令和4年度","num":41,"sectionShort":"貸付実務","stem":"請負契約に関する次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"請負は、当事者の一方がある仕事を完成することを約し、相手方がその仕事の結果に対してその報酬を支払うことを約することによって、その効力を生ずる。","②":"物の引渡しを要する請負契約における報酬は、仕事の目的物の引渡しと同時に支払わなければならない。","③":"請負人が種類又は品質に関して契約の内容に適合しない仕事の目的物を注文者に引き渡したときは、注文者は、注文者の供した材料の性質又は注文者の与えた指図によって生じた不適合を理由として、履行の追完の請求、報酬の減額の請求、損害賠償の請求及び契約の解除をすることができない。ただし、請負人がその材料又は指図が不適当であることを知りながら告げなかったときは、この限りでない。","④":"請負人が仕事を完成しない間は、注文者及び請負人は、いつでも契約の解除をすることができる。"},"note":"","answer":4,"format":"single","negative":true},{"id":"R17-42","kai":17,"era":"令和4年度","num":42,"sectionShort":"貸付実務","stem":"不当利得及び不法行為に関する次の①～④の記述のうち、民法上、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"数人が共同の不法行為によって他人に損害を加えたときは、各自が連帯してその損害を賠償する責任を負う。","②":"人の生命又は身体を害する不法行為による損害賠償請求権を除き、不法行為による損害賠償の請求権は、被害者又はその法定代理人が損害及び加害者を知った時から3年間行使しないとき、又は不法行為の時から20年間行使しないときは、時効によって消滅する。","③":"法律上の原因なく他人の財産又は労務によって利益を受け、そのために他人に損失を及ぼした受益者は、善意であるか悪意であるかを問わず、その受けた利益に利息を付して返還する義務を負う。","④":"債務者は、弁済期にない債務の弁済として給付をしたときは、その給付したものの返還を請求することができない。ただし、債務者が錯誤によってその給付をしたときは、債権者は、これによって得た利益を返還しなければならない。"},"note":"","answer":3,"format":"single","negative":true},{"id":"R17-43","kai":17,"era":"令和4年度","num":43,"sectionShort":"資金需要者保護","stem":"個人情報の保護に関する法律に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"個人情報取扱事業者は、個人情報を取り扱うに当たっては、その利用の目的（以下、本問において「利用目的」という。）をできる限り特定しなければならない。個人情報取扱事業者は、利用目的を変更する場合には、変更前の利用目的と関連性を有すると合理的に認められる範囲を超えて行ってはならない。","②":"個人情報取扱事業者は、合併その他の事由により他の個人情報取扱事業者から事業を承継することに伴って個人情報を取得した場合において、承継前における当該個人情報の利用目的の達成に必要な範囲を超えて当該個人情報を取り扱うときは、速やかに、その利用目的を、本人に通知し、又は公表しなければならない。","③":"個人情報取扱事業者は、利用目的を変更した場合は、取得の状況からみて利用目的が明らかであると認められるときであっても、変更された利用目的について、本人に通知し、又は公表しなければならない。","④":"個人情報取扱事業者は、本人との間で契約を締結することに伴って契約書その他の書面（電磁的記録を含む。）に記載された当該本人の個人情報を取得する場合は、あらかじめ、本人に対し、その利用目的を明示しその同意を得なければならない。"},"note":"","answer":1,"format":"single","negative":false},{"id":"R17-44","kai":17,"era":"令和4年度","num":44,"sectionShort":"資金需要者保護","stem":"消費者契約法に関する次の①～④の記述のうち、その内容が適切なものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"事業者が消費者契約の締結について勧誘をするに際し、消費者に対して重要事項について事実と異なることを告げる行為をした場合、当該消費者が、当該告げられた内容が事実であるとの誤認をしたか否かにかかわらず、当該消費者は、それによってなされた当該消費者契約の申込み又はその承諾の意思表示を取り消すことができる。","②":"消費者が消費者契約法に基づいて消費者契約を取り消すことができる場合において、追認をすることができる時から6か月間取消権を行使しないとき、又は当該消費者契約の締結の時から5年を経過したときは、当該消費者は、当該消費者契約を取り消すことができなくなる。","③":"事業者が、消費者契約の締結について勧誘をするに際し、勧誘をしている場所から退去する旨の意思を消費者が示したにもかかわらず、当該消費者を退去させないなど、消費者を困惑させることにより当該消費者契約を締結した場合、当該消費者契約は、無効である。","④":"消費者契約の条項のうち、消費者契約に基づき支払うべき金銭の全部を消費者が支払期日までに支払わない場合における損害賠償の額を予定し、又は違約金を定める条項であって、これらを合算した額が、支払期日の翌日からその支払をする日までの期間について、その日数に応じ、当該支払期日に支払うべき額から当該支払期日に支払うべき額のうち既に支払われた額を控除した額に年14.6％の割合を乗じて計算した額を超えることとなるものは、当該超える部分につき無効である。"},"note":"","answer":4,"format":"single","negative":false},{"id":"R17-45","kai":17,"era":"令和4年度","num":45,"sectionShort":"資金需要者保護","stem":"次の①～④の記述のうち、日本貸金業協会が定める貸金業の業務運営に関する自主規制基本規則に規定する「広告及び勧誘に関する規制」によれば、協会に加入している貸金業者が個人向け貸付けの契約に係る広告を出稿するに当たり、協会が設ける審査機関から承認を受けなければならないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"インターネットによる広告","②":"新聞及び雑誌広告","③":"チラシによる広告","④":"看板広告"},"note":"","answer":2,"format":"single","negative":false},{"id":"R17-46","kai":17,"era":"令和4年度","num":46,"sectionShort":"資金需要者保護","stem":"個人情報の保護に関する法律についてのガイドライン（通則編）に関する次の①～④の記述のうち、その内容が適切でないものを1つだけ選び、解答欄にその番号をマークしなさい。","statements":{},"options":{"①":"個人情報取扱事業者は、物理的安全管理措置として、個人データを取り扱う機器、電子媒体及び書類等の盗難又は紛失等を防止するために、適切な管理を行わなければならない。","②":"個人情報取扱事業者は、人的安全管理措置として、従業者に、個人
