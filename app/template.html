<title>貸金業務取扱主任者 過去問1000</title>
<style>
:root{
  --ai:#26456E; --ai-soft:#3E6296; --suou:#9C3A4B; --wakatake:#3E7D62; --shu:#C6462F;
  --kincha:#9A7B3F; --accent:#C4622A;
  --sec1:#26456E; --sec2:#8A5A3B; --sec3:#3E7D62; --sec4:#6B5B8E;
  --bg:#F5F7F4; --surface:#FFFFFF; --sunken:#EDF0EC;
  --ink:#1A1F26; --ink-2:#4A5560; --ink-3:#7A858F; --ink-4:#A8B0B8;
  --rule:#D7DCD6; --rule-2:#E7EBE5; --on-accent:#fff;
  --mincho:"Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP","Songti SC",serif;
  --gothic:"Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,"Noto Sans JP",Meiryo,system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:3px; --qsize:16.5px; --qlh:1.95;
}
@media (prefers-color-scheme:dark){:root{
  --ai:#7FA3D1; --ai-soft:#5C82B4; --suou:#D2707F; --wakatake:#6DB395; --shu:#E2705C;
  --kincha:#C6A465; --accent:#DE8A52;
  --sec1:#7FA3D1; --sec2:#C09068; --sec3:#6DB395; --sec4:#A292C4;
  --bg:#14181C; --surface:#1B2127; --sunken:#232A31;
  --ink:#E2E7EB; --ink-2:#A6B0B9; --ink-3:#78838D; --ink-4:#5B656E;
  --rule:#2E3740; --rule-2:#242C33; --on-accent:#11161B;
}}
:root[data-theme="dark"]{
  --ai:#7FA3D1; --ai-soft:#5C82B4; --suou:#D2707F; --wakatake:#6DB395; --shu:#E2705C;
  --kincha:#C6A465; --accent:#DE8A52;
  --sec1:#7FA3D1; --sec2:#C09068; --sec3:#6DB395; --sec4:#A292C4;
  --bg:#14181C; --surface:#1B2127; --sunken:#232A31;
  --ink:#E2E7EB; --ink-2:#A6B0B9; --ink-3:#78838D; --ink-4:#5B656E;
  --rule:#2E3740; --rule-2:#242C33; --on-accent:#11161B;
}
:root[data-theme="light"]{
  --ai:#26456E; --ai-soft:#3E6296; --suou:#9C3A4B; --wakatake:#3E7D62; --shu:#C6462F;
  --kincha:#9A7B3F; --accent:#C4622A;
  --sec1:#26456E; --sec2:#8A5A3B; --sec3:#3E7D62; --sec4:#6B5B8E;
  --bg:#F5F7F4; --surface:#FFFFFF; --sunken:#EDF0EC;
  --ink:#1A1F26; --ink-2:#4A5560; --ink-3:#7A858F; --ink-4:#A8B0B8;
  --rule:#D7DCD6; --rule-2:#E7EBE5; --on-accent:#fff;
}
:root[data-size="s"]{--qsize:15px;--qlh:1.85}
:root[data-size="l"]{--qsize:18.5px;--qlh:2.1}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--gothic);
     font-size:15px;line-height:1.75;-webkit-text-size-adjust:100%}
button,select{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ai-soft);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.top{position:sticky;top:0;z-index:30;background:var(--surface);
     border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:12px;
     padding:9px 16px;min-height:52px}
.brand{font-family:var(--mincho);font-size:15px;letter-spacing:.13em;color:var(--ai);
       font-weight:600;white-space:nowrap;background:none;border:none;padding:0}
.brand .sub{display:block;font-family:var(--gothic);font-size:10px;letter-spacing:.2em;
            color:var(--ink-3);font-weight:400;margin-top:1px}
.top .spacer{flex:1}
.tbtn{background:none;border:1px solid var(--rule);border-radius:var(--r);
      padding:5px 10px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.tbtn:hover{border-color:var(--ai);color:var(--ai)}
.counter{font-family:var(--mono);font-size:13px;color:var(--ink-2);
         font-variant-numeric:tabular-nums;white-space:nowrap}
.counter b{color:var(--ink);font-weight:600}
.timer{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;
       padding:3px 9px;border:1px solid var(--rule);border-radius:var(--r)}
.timer.warn{color:var(--suou);border-color:var(--suou)}
.combo{font-family:var(--mono);font-size:12px;color:var(--shu);border:1px solid var(--shu);
       border-radius:99px;padding:2px 9px;white-space:nowrap}

.wrap{max-width:820px;margin:0 auto;padding:22px 16px 100px}
.h1{font-family:var(--mincho);font-size:23px;font-weight:600;margin:0 0 4px;letter-spacing:.04em}
.lede{color:var(--ink-2);font-size:13.5px;margin:0 0 22px}
.h2{font-family:var(--gothic);font-size:11.5px;font-weight:600;letter-spacing:.19em;
    color:var(--ink-3);margin:30px 0 11px;display:flex;align-items:center;gap:11px}
.h2::after{content:"";flex:1;height:1px;background:var(--rule-2)}
.h2 .more{background:none;border:none;font-size:11px;letter-spacing:.06em;
          color:var(--ai-soft);padding:0;order:3}
.h2 .more+::after{display:none}

/* 主役：次の一手 */
.hero{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);
      padding:18px 19px 16px;display:flex;flex-direction:column;gap:13px}
.why{display:flex;align-items:center;gap:14px}
.ring{width:64px;height:64px;flex-shrink:0}
.ring circle{fill:none;stroke-width:6}
.ring .bgc{stroke:var(--sunken)}
.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dasharray .6s cubic-bezier(.3,0,.2,1)}
.ring text{font-family:var(--mono);font-size:17px;fill:var(--ink);text-anchor:middle;
           font-variant-numeric:tabular-nums}
.why .msg{font-family:var(--mincho);font-size:15.5px;line-height:1.7}
.why .msg b{color:var(--accent);font-size:19px;font-family:var(--mono);padding:0 1px}
.why .sub{font-family:var(--gothic);font-size:11.5px;color:var(--ink-3);margin-top:2px}
.cta{width:100%;background:var(--accent);color:#fff;border:none;border-radius:var(--r);
     padding:15px;font-size:16px;font-weight:600;letter-spacing:.12em}
.cta:hover{filter:brightness(1.08)}
.cta[disabled]{opacity:.4;cursor:not-allowed}
.setrow{display:flex;gap:7px;flex-wrap:wrap}
.setrow label{flex:1;min-width:104px;display:flex;flex-direction:column;gap:3px}
.setrow .lb{font-size:10px;letter-spacing:.14em;color:var(--ink-3)}
.setrow select{width:100%;background:var(--surface);border:1px solid var(--rule);
               border-radius:var(--r);padding:7px 8px;font-size:13px;color:var(--ink)}
.setrow select:hover{border-color:var(--ai)}

/* 続ける */
.streak{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:15px 17px}
.days{display:flex;gap:6px;justify-content:space-between;margin-bottom:13px}
.day{flex:1;text-align:center}
.day .w{font-size:10px;color:var(--ink-3);margin-bottom:4px}
.day .d{width:26px;height:26px;margin:0 auto;border-radius:50%;border:1.5px solid var(--rule-2);
        display:grid;place-items:center;font-size:12px;color:var(--ink-4)}
.day .d.on{background:var(--ai);border-color:var(--ai);color:var(--on-accent)}
.day .d.today{border-color:var(--accent);border-width:2px}
.srow{display:flex;align-items:center;justify-content:center;gap:22px;
      padding-top:12px;border-top:1px solid var(--rule-2)}
.srow div{text-align:center}
.srow .n{font-family:var(--mono);font-size:22px;color:var(--accent);line-height:1.2;
         font-variant-numeric:tabular-nums}
.srow .l{font-size:10.5px;color:var(--ink-3);letter-spacing:.08em}
.weeks{display:flex;align-items:flex-end;gap:5px;height:58px;margin-top:14px;
       padding-top:12px;border-top:1px solid var(--rule-2)}
.wk{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
    height:100%;justify-content:flex-end}
.wk i{display:block;width:100%;background:var(--ai-soft);border-radius:2px 2px 0 0;
      min-height:2px;opacity:.85}
.wk .t{font-size:9px;color:var(--ink-4);font-family:var(--mono)}

/* 合格可能性 */
.pass{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:15px 17px}
.pass .hd{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.pass .pc{font-family:var(--mono);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.pass .lb{font-size:12px;color:var(--ink-2)}
.gauge{display:block;height:9px;background:var(--sunken);border-radius:99px;overflow:hidden}
.gauge i{display:block;height:100%;border-radius:99px;transition:width .6s cubic-bezier(.3,0,.2,1)}
.pass .note{font-size:11px;color:var(--ink-3);margin-top:8px;line-height:1.7}

/* 分野別リスト */
.secs{display:flex;flex-direction:column;gap:1px;background:var(--rule-2);
      border:1px solid var(--rule-2);border-radius:var(--r);overflow:hidden}
.secrow{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;align-items:center;
        background:var(--surface);padding:11px 14px;width:100%;text-align:left;border:none}
.secrow:hover{background:var(--sunken)}
.secrow .swatch{width:4px;height:28px;border-radius:2px;display:block}
.secrow .body{display:block;min-width:0}
.secrow .nm{font-family:var(--mincho);font-size:15px;display:block}
.secrow .track{display:block;height:4px;background:var(--sunken);border-radius:99px;
               overflow:hidden;margin-top:5px}
.secrow .track i{display:block;height:100%;border-radius:99px}
.secrow .val{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);text-align:right;
             font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.5}
.secrow .val em{font-style:normal;color:var(--ink-4);font-size:11px}

/* 論点 */
.topics{display:flex;flex-direction:column;gap:1px;background:var(--rule-2);
        border:1px solid var(--rule-2);border-radius:var(--r);overflow:hidden}
.trow{display:grid;grid-template-columns:24px 1fr 90px 56px;gap:10px;align-items:center;
      background:var(--surface);padding:9px 13px;width:100%;text-align:left;border:none;font-size:13px}
.trow:hover{background:var(--sunken)}
.trow .rk{font-family:var(--mono);font-size:11px;color:var(--ink-4);text-align:right}
.trow .a{font-family:var(--mincho);font-size:14px}
.trow .f{font-family:var(--mono);font-size:11px;color:var(--ink-3);text-align:right}
.trow .acc{font-family:var(--mono);font-size:12px;text-align:right}

/* 到達度 */
.matrix{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
.matrix th{font-weight:500;color:var(--ink-3);font-size:10px;padding:4px 3px;text-align:center;line-height:1.3}
.matrix col.lab{width:56px} .matrix col.tot{width:44px}
.matrix th.row{text-align:right;padding-right:8px;color:var(--ink-2);font-size:11px;font-family:var(--mono)}
.matrix td{padding:1.5px}
.cell{display:block;width:100%;border:1px solid var(--rule-2);border-radius:2px;
      background:var(--sunken);padding:6px 1px;text-align:center;font-family:var(--mono);
      font-size:11px;color:var(--ink-4);transition:transform .12s}
.cell:hover{transform:scale(1.08);border-color:var(--ai);position:relative;z-index:2}
.cell.has{color:var(--on-accent);border-color:transparent}
.cell.perfect{box-shadow:inset 0 0 0 2px var(--kincha)}

/* 段位 */
.rankbar{display:flex;align-items:center;gap:13px;margin-bottom:13px}
.rankseal{width:52px;height:52px;border-radius:50%;border:2px solid var(--kincha);
          display:grid;place-items:center;flex-shrink:0}
.rankseal span{font-family:var(--mincho);font-size:18px;font-weight:600;color:var(--kincha)}
.rankbar .meta{flex:1;min-width:0}
.rankbar .x{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-bottom:5px}
.xpbar{display:block;height:6px;background:var(--sunken);border-radius:99px;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--kincha),var(--ai));border-radius:99px}

.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}
.mode{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);
      padding:13px 14px;text-align:left;display:flex;flex-direction:column;gap:3px;
      transition:border-color .14s,transform .14s}
.mode:hover{border-color:var(--ai);transform:translateY(-2px)}
.mode .t{font-family:var(--mincho);font-size:15px;font-weight:600;letter-spacing:.04em}
.mode .d{font-size:11.5px;color:var(--ink-2);line-height:1.55}
.mode[disabled]{opacity:.45;cursor:not-allowed;transform:none}

.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:6px}
.badge{border:1px solid var(--rule-2);border-radius:var(--r);padding:9px 10px;
       background:var(--surface);opacity:.42}
.badge.on{opacity:1;border-color:var(--kincha)}
.badge .bt{font-family:var(--mincho);font-size:12px;font-weight:600}
.badge.on .bt{color:var(--kincha)}
.badge .bd{font-size:10px;color:var(--ink-3);line-height:1.45;margin-top:2px}

/* 設問 */
.qmeta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:11px;font-size:11.5px}
.tag{border:1px solid var(--rule);border-radius:2px;padding:2px 8px;color:var(--ink-2);
     font-family:var(--mono);font-size:11px}
.tag.sec{border:none;color:var(--on-accent);font-family:var(--gothic);letter-spacing:.06em}
.tag.neg{border-color:var(--suou);color:var(--suou)}
.tag.hot{border-color:var(--kincha);color:var(--kincha)}
.stem{font-family:var(--mincho);font-size:var(--qsize);line-height:var(--qlh);
      margin:0 0 15px;letter-spacing:.015em;display:flex;flex-direction:column;gap:.42em}
.stem .s{text-indent:1em} .stem .s.lead{text-indent:0}
.stem .cue{background:linear-gradient(transparent 60%,rgba(198,70,47,.3) 60%);font-weight:600}
.stem .cue2{background:linear-gradient(transparent 60%,rgba(38,69,110,.22) 60%)}
.dim{color:var(--ink-4)}
:root[data-dim="off"] .dim{color:inherit}
.stmts{display:flex;flex-direction:column;gap:7px;margin:0 0 15px}
.stmt{display:grid;grid-template-columns:30px 1fr;gap:2px;align-items:start;
      border:1px solid var(--rule-2);border-radius:var(--r);background:var(--surface);
      padding:10px 13px 10px 6px}
.stmt .mk{border:none;background:none;font-family:var(--gothic);font-size:14px;font-weight:600;
          color:var(--ai);padding:2px 0;border-radius:2px;line-height:1.6}
.stmt .mk:hover{background:var(--sunken)}
.stmt .bd{font-family:var(--mincho);font-size:var(--qsize);line-height:var(--qlh);
          display:flex;flex-direction:column;gap:.35em}
.stmt[data-v="o"]{border-color:var(--wakatake);background:color-mix(in srgb,var(--wakatake) 6%,var(--surface))}
.stmt[data-v="x"]{border-color:var(--suou);background:color-mix(in srgb,var(--suou) 6%,var(--surface))}
.stmt[data-v="o"] .mk{color:var(--wakatake)} .stmt[data-v="x"] .mk{color:var(--suou)}
.tally{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin:-7px 0 13px;text-align:right}
.tally b{color:var(--wakatake)}
.qtable{margin:0 0 15px;overflow-x:auto}
.qtable table{border-collapse:collapse;font-size:13.5px;min-width:250px}
.qtable caption{font-family:var(--mincho);font-size:14px;text-align:left;padding-bottom:5px}
.qtable th,.qtable td{border:1px solid var(--rule);padding:5px 13px}
.qtable td:last-child{text-align:right;font-family:var(--mono)}
.qtable thead th{background:var(--sunken);font-size:11.5px;color:var(--ink-2)}
.note{font-size:12.5px;color:var(--ink-2);line-height:1.8;background:var(--sunken);
      border-radius:var(--r);padding:10px 13px;margin:0 0 15px;display:flex;flex-direction:column;gap:.3em}
.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.opt{position:relative;display:grid;grid-template-columns:24px 1fr;gap:8px;text-align:left;
     width:100%;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);
     padding:12px 15px;font-family:var(--mincho);font-size:var(--qsize);line-height:var(--qlh);
     transition:border-color .12s,background .12s}
.opt:hover:not([disabled]){border-color:var(--ai);background:var(--sunken)}
.opt .m{font-family:var(--gothic);font-size:15px;color:var(--ai);font-weight:600;line-height:var(--qlh)}
.opt .bd{display:flex;flex-direction:column;gap:.35em}
.opt[disabled]{cursor:default}
.opt.correct{border-color:var(--wakatake);background:color-mix(in srgb,var(--wakatake) 9%,var(--surface))}
.opt.wrong{border-color:var(--suou);background:color-mix(in srgb,var(--suou) 9%,var(--surface))}
.opt.picked{border-width:2px}
.opt.correct,.opt.wrong{padding-right:56px}
.mark{position:absolute;right:11px;top:50%;width:38px;height:38px;margin-top:-19px;
      pointer-events:none;overflow:visible}
.mark path,.mark circle{fill:none;stroke:var(--shu);stroke-width:2.6;stroke-linecap:round;
      opacity:.85;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);
      animation:draw .42s cubic-bezier(.4,0,.2,1) forwards}
.mark .s2{animation-delay:.16s}
@keyframes draw{to{stroke-dashoffset:0}}
.verdict{display:flex;align-items:baseline;gap:11px;margin-bottom:12px;
         font-family:var(--mincho);font-size:16px;flex-wrap:wrap}
.verdict .r{font-weight:600;letter-spacing:.08em}
.verdict.ok .r{color:var(--wakatake)} .verdict.ng .r{color:var(--suou)}
.verdict .a{font-family:var(--mono);font-size:13px;color:var(--ink-2)}
.verdict .xp{font-family:var(--mono);font-size:12px;color:var(--kincha)}
.after{display:flex;gap:7px;flex-wrap:wrap;margin:-6px 0 15px}
.after button{background:none;border:1px solid var(--rule);border-radius:99px;
              padding:5px 13px;font-size:12px;color:var(--ink-2)}
.after button:hover:not([disabled]){border-color:var(--ai);color:var(--ai)}
.after button[disabled]{cursor:default;color:var(--ink-4);border-style:dashed}
.nav{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.nav button{width:30px;height:30px;border:1px solid var(--rule);border-radius:2px;
            background:var(--surface);font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.nav button.ok{border-color:var(--wakatake);color:var(--wakatake)}
.nav button.ng{border-color:var(--suou);color:var(--suou)}
.nav button.done{border-color:var(--ai);color:var(--ai)}
.nav button.flag{background:color-mix(in srgb,var(--shu) 14%,var(--surface))}
.nav button.cur{background:var(--ai);color:var(--on-accent);border-color:var(--ai)}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);
     border-top:1px solid var(--rule);padding:9px 16px;z-index:25}
.bar .inner{max-width:820px;margin:0 auto;display:flex;gap:8px;align-items:center}
.bar .spacer{flex:1}
.next{background:var(--ai);color:var(--on-accent);border:none;border-radius:var(--r);
      padding:10px 26px;font-size:14px;font-weight:600;letter-spacing:.08em}
.next:hover{background:var(--ai-soft)}
.ghost{background:none;border:1px solid var(--rule);border-radius:var(--r);
       padding:9px 13px;font-size:13px;color:var(--ink-2)}
.ghost:hover{border-color:var(--ai);color:var(--ai)}
.ghost[aria-pressed="true"]{border-color:var(--shu);color:var(--shu)}
.ghost[disabled]{opacity:.4}

.result{text-align:center;padding:22px 0 6px}
.result .score{font-family:var(--mono);font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.result .score small{font-size:20px;color:var(--ink-3)}
.result .judge{font-family:var(--mincho);font-size:20px;letter-spacing:.22em;margin-top:10px;font-weight:600}
.result .judge.pass{color:var(--wakatake)} .result .judge.fail{color:var(--suou)}
.result .line{font-size:12.5px;color:var(--ink-2);margin-top:6px}
.gained{font-family:var(--mono);font-size:13px;color:var(--kincha);margin-top:8px}
.breakdown{display:flex;flex-direction:column;gap:8px}
.br{display:grid;grid-template-columns:126px 1fr 60px;gap:10px;align-items:center;font-size:12.5px}
.br .n{color:var(--ink-2)}
.br .track{display:block;height:8px;background:var(--sunken);border-radius:99px;overflow:hidden}
.br .fill{display:block;height:100%;border-radius:99px;min-width:2px;transition:width .6s cubic-bezier(.3,0,.2,1)}

<script>
const DB = /*__DATA__*/;
const META = /*__META__*/;
const TOPICS = /*__TOPICS__*/;
const BY = Object.fromEntries(DB.map(q=>[q.id,q]));

const SECS=['法令','貸付実務','資金需要者保護','財務会計'];
const SECVAR={'法令':'--sec1','貸付実務':'--sec2','資金需要者保護':'--sec3','財務会計':'--sec4'};
const MARKS=['①','②','③','④'];
const FMTLBL={single:'単純択一',combo:'組合せ',count:'個数'};
const KEY='kashikin.progress.v3';
const DAY=86400000;

const RANKS=[[0,'十級'],[100,'九級'],[250,'八級'],[450,'七級'],[700,'六級'],[1000,'五級'],
             [1400,'四級'],[1900,'三級'],[2500,'二級'],[3200,'一級'],[4000,'初段'],
             [5000,'二段'],[6200,'三段'],[7600,'四段'],[9200,'五段']];
function rankOf(xp){let i=0;while(i+1<RANKS.length&&xp>=RANKS[i+1][0])i++;
  const n=RANKS[i+1];return{grade:RANKS[i][1],base:RANKS[i][0],next:n?n[0]:null,nextName:n?n[1]:null};}

const tried=s=>Object.keys(s.q).filter(k=>s.q[k].n>0).length;
function secAcc85(s,sec){const qs=DB.filter(q=>q.sectionShort===sec&&(s.q[q.id]||{}).n>0);
  if(qs.length<100)return false;
  const n=qs.reduce((a,q)=>a+s.q[q.id].n,0),g=qs.reduce((a,q)=>a+s.q[q.id].ng,0);
  return n&&(n-g)/n>=0.85;}
const BADGES=[
 {id:'first',t:'初挑戦',d:'1問目に解答',f:s=>tried(s)>=1},
 {id:'q100',t:'百問',d:'100問に解答',f:s=>tried(s)>=100},
 {id:'q500',t:'五百問',d:'500問に解答',f:s=>tried(s)>=500},
 {id:'q1000',t:'千問走破',d:'全1000問に解答',f:s=>tried(s)>=1000},
 {id:'kai1',t:'一回完答',d:'ある回の50問すべてに解答',f:s=>META.years.some(y=>DB.filter(q=>q.kai===y.kai).every(q=>(s.q[q.id]||{}).n>0))},
 {id:'perf',t:'満点の回',d:'ある回を全問一発正解',f:s=>META.years.some(y=>DB.filter(q=>q.kai===y.kai).every(q=>{const r=s.q[q.id];return r&&r.n>0&&r.ng===0}))},
 {id:'mock',t:'模試合格',d:'模試で合格基準点を突破',f:s=>s.exams.some(e=>e.score>=e.pass)},
 {id:'mock5',t:'模試五冠',d:'5回分の模試に合格',f:s=>new Set(s.exams.filter(e=>e.score>=e.pass).map(e=>e.title)).size>=5},
 {id:'d7',t:'七日連続',d:'7日続けて学習',f:s=>s.best>=7},
 {id:'d30',t:'三十日連続',d:'30日続けて学習',f:s=>s.best>=30},
 {id:'law',t:'法令の達人',d:'法令分野で正答率85%以上（100問以上）',f:s=>secAcc85(s,'法令')},
 {id:'combo10',t:'十連正解',d:'10問連続で正解',f:s=>s.bestCombo>=10},
];

/* ===== 保存 ===== */
const blank=()=>({q:{},exams:[],xp:0,days:{},streak:0,best:0,last:null,badges:{},
                  goal:20,combo:0,bestCombo:0,cfg:{n:20,mode:'auto',scope:'all'}});
let S=(()=>{try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&v.q)return Object.assign(blank(),v);}catch(e){}return blank();})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
const rec=id=>S.q[id]||(S.q[id]={n:0,ng:0,last:null,flag:false,ease:2.5,iv:0,due:0,reps:0});
const dkey=d=>`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
const today=()=>dkey(new Date());
function touchDay(k){
  const t=today();
  if(S.last!==t){const y=new Date();y.setDate(y.getDate()-1);
    S.streak=(S.last===dkey(y))?S.streak+1:1;
    S.best=Math.max(S.best||0,S.streak);S.last=t;}
  S.days[t]=(S.days[t]||0)+(k||1);
}

/* ===== 出題エンジン =====
   忘却曲線に沿って復習日を決め、分野ごとの正答率で重みを付けて次の問題を選ぶ。
   文章を生成するのではなく、解答履歴と問題文から機械的に算出している。 */
function schedule(r,ok){
  if(ok){
    r.reps=(r.reps||0)+1;
    r.ease=Math.min(2.8,(r.ease||2.5)+0.06);
    r.iv = r.reps===1?1 : r.reps===2?3 : Math.max(1,Math.round((r.iv||1)*r.ease));
  }else{ r.reps=0; r.ease=Math.max(1.4,(r.ease||2.5)-0.22); r.iv=0; }
  r.due=Date.now()+r.iv*DAY;
}
const dueNow=()=>DB.filter(q=>{const r=S.q[q.id];return r&&r.n>0&&(r.due||0)<=Date.now();});
function sectionAcc(){
  const o={};
  SECS.forEach(s=>{
    const qs=DB.filter(q=>q.sectionShort===s&&(S.q[q.id]||{}).n>0);
    const n=qs.reduce((a,q)=>a+S.q[q.id].n,0),g=qs.reduce((a,q)=>a+S.q[q.id].ng,0);
    o[s]={n,acc:n?(n-g)/n:null,done:qs.length,total:DB.filter(q=>q.sectionShort===s).length};
  });
  return o;
}
function pickQuestions(n,mode,scope){
  let pool=DB.slice();
  if(scope&&scope!=='all'){
    if(scope.startsWith('kai:'))pool=pool.filter(q=>q.kai===+scope.slice(4));
    else pool=pool.filter(q=>q.sectionShort===scope);
  }
  const acc=sectionAcc();
  const weight=q=>{
    const r=S.q[q.id];let s=1;
    if(!r||!r.n) s+=(mode==='fresh'?6:2);
    else{
      if((r.due||0)<=Date.now()) s+=5;              // 復習の期日が来ている
      s+=(r.ng/Math.max(1,r.n))*4;                  // 間違えるほど優先
      s+=Math.max(0,3-(r.reps||0))*0.6;             // 定着が浅いほど優先
    }
    const a=acc[q.sectionShort];
    if(a&&a.acc!=null) s+=(1-a.acc)*3;              // 弱い分野を厚く
    if(mode==='hot') s+=(q.topicRank||0)*0.35;      // 頻出論点を優先
    if(mode==='fresh'&&r&&r.n) s*=0.15;
    if(mode==='weak'&&!(r&&r.ng)) s*=0.2;
    return s*(0.75+Math.random()*0.5);
  };
  return pool.map(q=>[weight(q),q]).sort((a,b)=>b[0]-a[0]).slice(0,n).map(x=>x[1]);
}

/* ===== 合格可能性の推定 =====
   分野別の正答率から、本番の分野構成(27/15/5/3)で50問解いた場合の得点分布を
   正規近似し、合格基準点を上回る確率を出す。履歴が薄いうちは表示しない。 */
const MIX={'法令':27,'貸付実務':15,'資金需要者保護':5,'財務会計':3};
const PASSLINE=31;
function erf(x){const s=x<0?-1:1;x=Math.abs(x);
  const t=1/(1+0.3275911*x);
  return s*(1-((((1.061405429*t-1.453152027)*t+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x));}
function passChance(){
  const acc=sectionAcc();
  const total=Object.values(acc).reduce((a,x)=>a+x.n,0);
  if(total<60)return null;
  const overall=Object.values(acc).reduce((t,x)=>t+(x.acc!=null?x.acc*x.n:0),0)/total;
  let m=0,v=0;
  for(const [s,cnt] of Object.entries(MIX)){
    const a=acc[s],k=8;
    const p=((a.acc!=null?a.acc*a.n:0)+overall*k)/((a.n||0)+k);   // 薄い分野は全体平均に寄せる
    m+=cnt*p; v+=cnt*p*(1-p);
  }
  const sd=Math.sqrt(Math.max(v,0.5));
  const z=(PASSLINE-0.5-m)/sd;
  return {p:Math.max(0,Math.min(100,Math.round((1-0.5*(1+erf(z/Math.SQRT2)))*100))),
          score:m.toFixed(1), n:total};
}

function checkBadges(){const g=[];BADGES.forEach(b=>{if(!S.badges[b.id]&&b.f(S)){S.badges[b.id]=Date.now();g.push(b);}});return g;}
function toast(h){const d=document.createElement('div');d.className='toast';d.innerHTML=h;
  document.getElementById('toastSlot').appendChild(d);setTimeout(()=>d.remove(),3000);}

/* ===== 読みやすさ（本文は一字も変えない） ===== */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function sentences(t){const o=[];let b='',d=0;
  for(const c of t){b+=c;
    if('（(「『［['.includes(c))d++;
    else if('）)」』］]'.includes(c))d=Math.max(0,d-1);
    else if(c==='。'&&d===0){o.push(b);b='';}}
  if(b)o.push(b);return o;}
const dimDefs=h=>h.replace(/（[^（）]*?(?:以下[^（）]*?という|本問において[^（）]*?という)[^（）]*?）/g,m=>`<span class="dim">${m}</span>`);
const cues=h=>h.replace(/(適切でないもの|合致しないもの|該当しないもの|含まれないもの)/g,'<span class="cue">$1</span>')
                .replace(/(適切なものの個数|適切なものの組み合わせ|適切なもの)/g,'<span class="cue2">$1</span>');
const proseHTML=(t,o={})=>sentences(t).map((s,i)=>{
  let h=dimDefs(esc(s)); if(o.cue)h=cues(h);
  return `<span class="s${i===0?' lead':''}">${h}</span>`;}).join('');

/* ===== 画面 ===== */
let ses=null,timerId=null,qT0=0;
const app=document.getElementById('app'),barSlot=document.getElementById('barSlot');
const topInfo=document.getElementById('topInfo'),homeBtn=document.getElementById('homeBtn');
const readBtn=document.getElementById('readBtn');
const pct=(a,b)=>b?Math.round(a/b*100):0;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const mmss=ms=>{const s=Math.max(0,Math.round(ms/1000));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;};

function renderHome(){
  ses=null;barSlot.innerHTML='';topInfo.innerHTML='';homeBtn.hidden=true;readBtn.hidden=true;
  const ids=Object.keys(S.q).filter(k=>S.q[k].n>0);
  const n=ids.reduce((a,k)=>a+S.q[k].n,0),g=ids.reduce((a,k)=>a+S.q[k].ng,0);
  const due=dueNow().length,weak=ids.filter(k=>S.q[k].ng>0).length;
  const flag=Object.keys(S.q).filter(k=>S.q[k].flag).length;
  const doneT=S.days[today()]||0,r=rankOf(S.xp),cfg=S.cfg;

  const ringMax=Math.max(due||0,S.goal,1);
  const ringVal=due||Math.max(0,S.goal-doneT);
  const C=2*Math.PI*26;
  const headline = due>0 ? `復習の期日が来た問題が <b>${due}</b> 問あります`
    : (tried(S)===0 ? `まずは <b>${S.goal}</b> 問から始めましょう`
    : (doneT>=S.goal ? `今日の目標 <b>${S.goal}</b> 問は達成済みです`
    : `今日はあと <b>${S.goal-doneT}</b> 問で目標に届きます`));
  const sub = due>0 ? '忘れかけた頃に出し直すのがいちばん定着します'
    : (doneT>=S.goal ? 'そのまま続けることもできます'
    : '解答履歴から弱点と復習期日を見て出題します');

  const wd=['日','月','火','水','木','金','土'];
  let daysHTML='';
  for(let i=6;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    const on=(S.days[dkey(d)]||0)>0;
    daysHTML+=`<div class="day"><div class="w">${wd[d.getDay()]}</div>
      <div class="d${on?' on':''}${i===0?' today':''}">${on?'✓':''}</div></div>`;
  }
  let mx=1,wks=[];
  for(let i=7;i>=0;i--){
    const e=new Date();e.setDate(e.getDate()-i*7);
    let sum=0;
    for(let k=0;k<7;k++){const d=new Date(e);d.setDate(d.getDate()-k);sum+=S.days[dkey(d)]||0;}
    wks.push([sum,`${e.getMonth()+1}/${e.getDate()}`]);mx=Math.max(mx,sum);
  }
  const wkHTML=wks.map(([v,l])=>`<div class="wk"><i style="height:${Math.max(2,v/mx*40)}px"></i><span class="t">${l}</span></div>`).join('');

  const pcRes=passChance(),acc=sectionAcc();
  const pcol=p=>p>=60?'var(--wakatake)':p>=30?'var(--kincha)':'var(--suou)';

  const secHTML=SECS.map(s=>{
    const a=acc[s],col=`var(${SECVAR[s]})`;
    return `<button class="secrow" data-sec="${s}">
      <span class="swatch" style="background:${col}"></span>
      <span class="body"><span class="nm">${s}</span>
        <span class="track"><i style="width:${pct(a.done,a.total)}%;background:${col}"></i></span></span>
      <span class="val">${a.done}/${a.total}<br><em>${a.acc!=null?Math.round(a.acc*100)+'%':'—'}</em></span>
    </button>`;}).join('');

  const SECLBL={'法令':'法令','貸付実務':'貸付<br>実務','資金需要者保護':'資金<br>需要者','財務会計':'財務<br>会計'};
  let mHTML='<table class="matrix"><colgroup><col class="lab">'+SECS.map(()=>'<col>').join('')+
    '<col class="tot"></colgroup><thead><tr><th class="row"></th>'+
    SECS.map(s=>`<th>${SECLBL[s]}</th>`).join('')+'<th>計</th></tr></thead><tbody>';
  META.years.forEach(y=>{
    mHTML+=`<tr><th class="row">${y.label.replace('第','').replace('回','')}</th>`;
    SECS.concat(['*']).forEach(sec=>{
      const qs=DB.filter(q=>q.kai===y.kai&&(sec==='*'||q.sectionShort===sec));
      const d2=qs.filter(q=>(S.q[q.id]||{}).n>0),ok=d2.filter(q=>S.q[q.id].ng===0).length;
      const p=pct(ok,d2.length),on=d2.length>0;
      const col=sec==='*'?'var(--ai)':`var(${SECVAR[sec]})`;
      const pf=on&&d2.length===qs.length&&ok===qs.length;
      mHTML+=`<td><button class="cell${on?' has':''}${pf?' perfect':''}"
        style="${on?`background:${col};opacity:${(0.28+0.72*p/100).toFixed(2)}`:''}"
        data-kai="${y.kai}" data-msec="${sec}"
        title="${y.label} ${sec==='*'?'全分野':sec}：${d2.length}/${qs.length}問">${on?p+'%':qs.length}</button></td>`;
    });
    mHTML+='</tr>';
  });
  mHTML+='</tbody></table>';

  app.className='wrap';
  app.innerHTML=`
    <div class="rankbar">
      <div class="rankseal"><span>${r.grade}</span></div>
      <div class="meta">
        <div class="x">${S.xp} XP${r.next?`　次は ${r.nextName} まであと ${r.next-S.xp}`:'　最高位'}　／　解答済 ${tried(S)}/1000　正答率 ${n?pct(n-g,n)+'%':'—'}</div>
        <span class="xpbar"><i style="width:${r.next?pct(S.xp-r.base,r.next-r.base):100}%"></i></span>
      </div>
    </div>

    <div class="hero">
      <div class="why">
        <svg class="ring" viewBox="0 0 60 60" aria-hidden="true">
          <circle class="bgc" cx="30" cy="30" r="26"/>
          <circle class="fg" cx="30" cy="30" r="26" transform="rotate(-90 30 30)"
            stroke-dasharray="${(Math.min(1,ringVal/ringMax)*C).toFixed(1)} ${C}"/>
          <text x="30" y="36">${ringVal}</text></svg>
        <div><div class="msg">${headline}</div><div class="sub">${sub}</div></div>
      </div>
      <button class="cta" id="startBtn">学習をはじめる</button>
      <div class="setrow">
        <label><span class="lb">問題数</span><select id="cN">
          ${[10,20,30,50].map(v=>`<option value="${v}"${cfg.n===v?' selected':''}>${v}問</option>`).join('')}</select></label>
        <label><span class="lb">出題の狙い</span><select id="cM">
          ${[['auto','おまかせ（弱点＋復習）'],['weak','間違えた問題'],['fresh','未着手'],['hot','頻出論点']]
            .map(([v,l])=>`<option value="${v}"${cfg.mode===v?' selected':''}>${l}</option>`).join('')}</select></label>
        <label><span class="lb">範囲</span><select id="cS">
          <option value="all"${cfg.scope==='all'?' selected':''}>全1000問</option>
          ${SECS.map(s=>`<option value="${s}"${cfg.scope===s?' selected':''}>${s}</option>`).join('')}
          ${META.years.slice().reverse().map(y=>`<option value="kai:${y.kai}"${cfg.scope==='kai:'+y.kai?' selected':''}>${y.label}</option>`).join('')}
        </select></label>
      </div>
    </div>

    <h2 class="h2">続ける</h2>
    <div class="streak">
      <div class="days">${daysHTML}</div>
      <div class="srow">
        <div><div class="n">${S.streak}</div><div class="l">連続日数</div></div>
        <div><div class="n">${S.best||0}</div><div class="l">自己ベスト</div></div>
        <div><div class="n">${doneT}<span style="font-size:12px;color:var(--ink-3)">/${S.goal}</span></div><div class="l">今日</div></div>
      </div>
      <div class="weeks">${wkHTML}</div>
    </div>

    ${pcRes?`<h2 class="h2">合格可能性の目安</h2>
    <div class="pass">
      <div class="hd"><span class="pc" style="color:${pcol(pcRes.p)}">${pcRes.p}<span style="font-size:16px">%</span></span>
        <span class="lb">今の実力で50問なら 推定 ${pcRes.score}点</span></div>
      <span class="gauge"><i style="width:${pcRes.p}%;background:${pcol(pcRes.p)}"></i></span>
      <div class="note">分野別の正答率（延べ${pcRes.n}回の解答）をもとに、本番の分野構成27/15/5/3で50問解いたときの得点分布を推定し、合格基準点31問を超える確率を計算しています。目安としてご覧ください。</div>
    </div>`:''}

    <h2 class="h2">分野別</h2>
    <div class="secs">${secHTML}</div>

    <h2 class="h2">よく出る論点<button class="more" id="allTopics">すべて見る</button></h2>

    <h2 class="h2">その他</h2>
    <div class="modes">

      <button class="mode" data-go="review" ${weak+flag?'':'disabled'}><span class="t">復習</span><span class="d">間違えた問題と付箋${weak+flag?` ${new Set([...ids.filter(k=>S.q[k].ng>0),...Object.keys(S.q).filter(k=>S.q[k].flag)]).size}問`:''}</span></button>
      <button class="mode" data-go="stats"><span class="t">成績</span><span class="d">分野別・回別の正答率と模試の記録</span></button>
      <button class="mode" data-go="matrix"><span class="t">到達度</span><span class="d">第1〜20回×分野の一覧</span></button>
    </div>
    <div id="matrixBox" hidden><h2 class="h2">到達度　第1回〜第20回</h2>${mHTML}
      <p style="font-size:11px;color:var(--ink-3)">数値は一度も間違えずに正解した割合。金枠は全問一発正解。押すとその範囲を演習します。</p></div>

    <h2 class="h2">実績　${Object.keys(S.badges).length} / ${BADGES.length}</h2>
    <div class="badges">${BADGES.map(b=>`<div class="badge${S.badges[b.id]?' on':''}"><div class="bt">${b.t}</div><div class="bd">${b.d}</div></div>`).join('')}</div>

    <div class="foot">
      出典：日本貸金業協会が公開する第1〜20回の試験問題PDF・正答PDF。問題文は原文のまま収録しています。<br>
      出題順・合格可能性・類題・論点は、解答履歴と問題文から機械的に算出したものです（文章の自動生成は行っていません）。<br>
      学習の記録はこの端末のブラウザにのみ保存されます。
      <button class="tbtn" id="goalBtn" type="button" style="margin-left:6px">1日の目標</button>
      <button class="tbtn" id="resetBtn" type="button" style="margin-left:4px">記録を消去</button>
    </div>`;

  const G=id=>document.getElementById(id);
  const readCfg=()=>{S.cfg={n:+G('cN').value,mode:G('cM').value,scope:G('cS').value};save();};
  ['cN','cM','cS'].forEach(id=>G(id).onchange=readCfg);
  G('startBtn').onclick=()=>{readCfg();
    startSession(pickQuestions(S.cfg.n,S.cfg.mode,S.cfg.scope),'practice','学習');};
  app.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>
    startSession(pickQuestions(20,'auto',b.dataset.sec),'practice',b.dataset.sec));
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.go;
    if(k==='matrix'){const m=G('matrixBox');m.hidden=!m.hidden;
      if(!m.hidden)m.scrollIntoView({behavior:'smooth',block:'start'});return;}
    ({examPick:renderExamPick,review:startReview,stats:renderStats})[k]();});
  app.querySelectorAll('.cell').forEach(b=>b.onclick=()=>{
    const kai=+b.dataset.kai,sec=b.dataset.msec,y=META.years.find(v=>v.kai===kai);
    startSession(DB.filter(q=>q.kai===kai&&(sec==='*'||q.sectionShort===sec)),'practice',
      `${y.label}・${sec==='*'?'全分野':sec}`);});
  bindTopics();
  G('allTopics').onclick=renderTopics;
  G('goalBtn').onclick=()=>{const v=prompt('1日に解く目標の問題数',S.goal);const k=parseInt(v,10);
    if(k>0){S.goal=Math.min(200,k);save();renderHome();}};
  G('resetBtn').onclick=()=>{if(confirm('学習の記録をすべて消去します。よろしいですか？')){S=blank();save();renderHome();}};
}

/* ===== 論点 ===== */
function topicRows(list){
  return list.map((t,i)=>{
    const qs=DB.filter(q=>q.articles.includes(t.article));
    const d=qs.filter(q=>(S.q[q.id]||{}).n>0);
    const n=d.reduce((a,q)=>a+S.q[q.id].n,0),g=d.reduce((a,q)=>a+S.q[q.id].ng,0);
    const p=n?pct(n-g,n):null;
    return `<button class="trow" data-topic="${esc(t.article)}">
      <span class="rk">${i+1}</span><span class="a">${esc(t.article)}</span>
      <span class="f">${t.count}問·${t.kaiCount}回</span>
      <span class="acc" style="color:${p==null?'var(--ink-4)':p>=70?'var(--wakatake)':'var(--suou)'}">${p==null?'—':p+'%'}</span></button>`;
  }).join('');
}
function bindTopics(){
  app.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.topic;
    startSession(shuffle(DB.filter(q=>q.articles.includes(a))),'practice',a);});
}
function renderTopics(){
  homeBtn.hidden=false;barSlot.innerHTML='';topInfo.innerHTML='';readBtn.hidden=true;
  app.className='wrap';
  app.innerHTML=`<h1 class="h1">よく出る論点</h1>
    <p class="lede">全1000問の本文から条文の参照を抽出し、出題数の多い順に並べたものです。押すとその論点だけを演習します。</p>
    <div class="topics">${topicRows(TOPICS)}</div>`;
  bindTopics();
}

/* ===== 模試・復習 ===== */
function startReview(){startSession(shuffle(DB.filter(q=>{const r=S.q[q.id];return r&&(r.ng>0||r.flag);})),'practice','復習');}
function renderExamPick(){
  barSlot.innerHTML='';homeBtn.hidden=false;topInfo.innerHTML='';readBtn.hidden=true;
  app.className='wrap';
  app.innerHTML=`<h1 class="h1">模試</h1>
    <p class="lede">50問・制限時間2時間。解答中は正誤を伏せ、提出後にまとめて採点します。</p>
    <div class="modes">
      <button class="mode" data-kai="0"><span class="t">ランダム50問</span><span class="d">全1000問から無作為に50問。合格基準点30問で判定</span></button>
      ${META.years.slice().reverse().map(y=>`<button class="mode" data-kai="${y.kai}">
        <span class="t">${y.label}</span><span class="d">${y.era}　合格基準点 ${y.pass}問 ／ 合格率 ${y.rate}</span></button>`).join('')}
    </div>`;
  app.querySelectorAll('[data-kai]').forEach(b=>b.onclick=()=>{
    const kai=+b.dataset.kai;
    const qs=kai?DB.filter(q=>q.kai===kai).sort((a,c)=>a.num-c.num):shuffle(DB).slice(0,50);
    startSession(qs,'exam',kai?META.years.find(y=>y.kai===kai).label:'ランダム50問',kai);});
}

/* ===== セッション ===== */
function startSession(qs,mode,title,kai){
  if(!qs||!qs.length){toast('該当する問題がありません');return;}
  ses={qs,mode,title,kai:kai||0,i:0,ans:new Array(qs.length).fill(null),
       shown:new Array(qs.length).fill(false),marks:qs.map(()=>({})),
       ms:new Array(qs.length).fill(0),t0:Date.now(),
       limit:mode==='exam'?120*60*1000:null,gain:0};
  homeBtn.hidden=false;readBtn.hidden=false;
  if(mode==='exam')tick();
  renderQ();
}
function tick(){clearInterval(timerId);
  timerId=setInterval(()=>{
    if(!ses||ses.mode!=='exam'){clearInterval(timerId);return;}
    const left=ses.limit-(Date.now()-ses.t0);
    if(left<=0){clearInterval(timerId);finishExam();return;}
    const el=document.getElementById('tm');
    if(el){el.textContent=`残り ${Math.floor(left/60000)}:${String(Math.floor(left%60000/1000)).padStart(2,'0')}`;
      el.classList.toggle('warn',left<600000);}
  },250);}
const lap=()=>{if(ses){ses.ms[ses.i]+=Date.now()-qT0;qT0=Date.now();}};

function renderQ(){
  const q=ses.qs[ses.i],picked=ses.ans[ses.i],shown=ses.shown[ses.i],r=S.q[q.id]||{};
  const y=META.years.find(v=>v.kai===q.kai);
  qT0=Date.now();
  topInfo.innerHTML=(ses.mode==='exam'
      ?`<span class="counter"><b>${ses.i+1}</b> / ${ses.qs.length}</span><span class="timer" id="tm" style="margin-left:8px"></span>`
      :`<span class="counter"><span class="who">${esc(ses.title)}　</span><b>${ses.i+1}</b> / ${ses.qs.length}</span>`)
    +(S.combo>=3?`<span class="combo" style="margin-left:8px">${S.combo}連正解</span>`:'');

  const tableHTML=q.table?`<div class="qtable"><table>
      <caption>${esc(q.table.title)}　${esc(q.table.caption)}</caption>
      <thead><tr>${q.table.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead>
      <tbody>${q.table.rows.map(w=>`<tr>${w.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'';
  const keys=Object.keys(q.statements),mk=ses.marks[ses.i];
  const stmtHTML=keys.length?`<div class="stmts">${keys.map(k=>`
      <div class="stmt" data-v="${mk[k]||''}">
        <button class="mk" data-stmt="${k}" title="○ / × を切り替えて整理できます">${mk[k]==='o'?'○':mk[k]==='x'?'×':k}</button>
        <div class="bd">${proseHTML(q.statements[k])}</div></div>`).join('')}</div>
      ${Object.keys(mk).length?`<div class="tally">○ <b>${Object.values(mk).filter(v=>v==='o').length}</b>　× ${Object.values(mk).filter(v=>v==='x').length}</div>`:''}`:'';
  const optHTML=MARKS.map((m,ix)=>{
    const nn=ix+1;let cls='opt',mark='';
    if(shown){
      if(nn===q.answer)cls+=' correct'; else if(nn===picked)cls+=' wrong';
      if(nn===picked)cls+=' picked';
      if(nn===q.answer)mark=circleSVG(); else if(nn===picked)mark=crossSVG();
    }else if(nn===picked)cls+=' picked correct';
    return `<button class="${cls}" data-n="${nn}" ${shown?'disabled':''}>
      <span class="m">${m}</span><span class="bd">${proseHTML(q.options[m])}</span>${mark}</button>`;}).join('');
  const verdict=shown?`<div class="verdict ${picked===q.answer?'ok':'ng'}">
      <span class="r">${picked===q.answer?'正解':'不正解'}</span>
      <span class="a">正答 ${MARKS[q.answer-1]}${picked&&picked!==q.answer?`　選択 ${MARKS[picked-1]}`:''}　${mmss(ses.ms[ses.i])}</span>
      ${picked===q.answer?`<span class="xp">+${r.n===1?10:4} XP</span>`:''}</div>`:'';
  const after=(shown&&ses.mode!=='exam')?`<div class="after">
      ${q.similar&&q.similar.length?`<button id="simBtn">この論点の類題 ${q.similar.length}問</button>`:''}
      ${(q.articles||[]).slice(0,2).map(a=>`<button data-topic="${esc(a)}">${esc(a)} をまとめて</button>`).join('')}
      ${r.iv?`<button disabled>次の復習は ${r.iv}日後</button>`:''}</div>`:'';
  const navHTML=`<div class="nav">${ses.qs.map((qq,ix)=>{
      let c='';
      if(ses.mode==='exam'){if(ses.ans[ix])c='done';}
      else if(ses.shown[ix])c=(ses.ans[ix]===ses.qs[ix].answer)?'ok':'ng';
      if((S.q[qq.id]||{}).flag)c+=' flag';
      if(ix===ses.i)c+=' cur';
      return `<button class="${c}" data-jump="${ix}">${ix+1}</button>`;}).join('')}</div>`;

  app.className='wrap';
  app.innerHTML=`
    <div class="qmeta">
      <span class="tag sec" style="background:var(${SECVAR[q.sectionShort]})">${q.sectionShort}</span>
      <span class="tag">${y.label} 問${q.num}</span>
      <span class="tag">${FMTLBL[q.format]}</span>
      ${q.negative?'<span class="tag neg">否定形</span>':''}
      ${(q.topicRank||0)>=12?`<span class="tag hot">頻出 ${q.topicRank}回分</span>`:''}
      ${r.n?`<span class="tag">${r.n}回目${r.ng?`・誤${r.ng}`:''}</span>`:''}
    </div>
    ${verdict}
    <div class="stem">${proseHTML(q.stem,{cue:true})}</div>
    ${tableHTML}${stmtHTML}
    ${q.note?`<div class="note">${proseHTML(q.note)}</div>`:''}
    <div class="opts">${optHTML}</div>
    ${after}${navHTML}`;

  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  app.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{lap();ses.i=+b.dataset.jump;renderQ();});
  app.querySelectorAll('[data-stmt]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.stmt,c=mk[k];
    if(!c)mk[k]='o'; else if(c==='o')mk[k]='x'; else delete mk[k];
    renderQ();});
  const sb=document.getElementById('simBtn');
  if(sb)sb.onclick=()=>startSession([q,...q.similar.map(i=>BY[i]).filter(Boolean)],'practice','類題');
  bindTopics();
  renderBar();window.scrollTo(0,0);
}
const circleSVG=()=>`<svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="14" style="--len:88"/></svg>`;
const crossSVG =()=>`<svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><path d="M9 9 L31 31" style="--len:32"/><path class="s2" d="M31 9 L9 31" style="--len:32"/></svg>`;

function choose(n){
  const q=ses.qs[ses.i];
  lap();
  if(ses.mode==='exam'){ses.ans[ses.i]=(ses.ans[ses.i]===n?null:n);renderQ();return;}
  if(ses.shown[ses.i])return;
  ses.ans[ses.i]=n;ses.shown[ses.i]=true;
  const r=rec(q.id),first=r.n===0;r.n++;r.last=Date.now();
  const ok=n===q.answer; if(!ok)r.ng++;
  schedule(r,ok);
  const gain=ok?(first?10:4):1;
  S.xp+=gain;ses.gain+=gain;
  S.combo=ok?S.combo+1:0;S.bestCombo=Math.max(S.bestCombo||0,S.combo);
  touchDay();
  const rb=rankOf(S.xp-gain).grade,ra=rankOf(S.xp).grade;
  const got=checkBadges();save();renderQ();
  if(rb!==ra)toast(`<b>${ra}</b> に昇級しました`);
  else if(got.length)toast(`実績 <b>${got[0].t}</b> を獲得`);
  else if(S.combo>0&&S.combo%10===0)toast(`<b>${S.combo}問</b>連続正解`);
  else if((S.days[today()]||0)===S.goal)toast(`今日の目標 <b>${S.goal}問</b> 達成`);
}

function renderBar(){
  const q=ses.qs[ses.i],flagged=(S.q[q.id]||{}).flag,last=ses.i===ses.qs.length-1;
  barSlot.innerHTML=`<div class="bar"><div class="inner">
      <button class="ghost" id="prev" ${ses.i?'':'disabled'}>前へ</button>
      <button class="ghost" id="flag" aria-pressed="${flagged?'true':'false'}">付箋</button>
      <span class="spacer"></span>
      ${ses.mode==='exam'
        ?(last?'<button class="next" id="submit">採点する</button>':'<button class="next" id="next">次へ</button>')
        :(last?'<button class="next" id="submit">結果を見る</button>':`<button class="next" id="next">${ses.shown[ses.i]?'次へ':'とばす'}</button>`)}
    </div></div>`;
  const G=id=>document.getElementById(id);
  if(G('prev'))G('prev').onclick=()=>{lap();ses.i--;renderQ();};
  G('flag').onclick=()=>{const r=rec(q.id);r.flag=!r.flag;save();renderQ();};
  if(G('next'))G('next').onclick=()=>{lap();ses.i++;renderQ();};
  if(G('submit'))G('submit').onclick=()=>ses.mode==='exam'?finishExam():finishPractice();
}

function finishExam(){
  clearInterval(timerId);lap();
  let gain=0;
  ses.qs.forEach((q,i)=>{const r=rec(q.id),first=r.n===0;r.n++;r.last=Date.now();
    const ok=ses.ans[i]===q.answer;if(!ok)r.ng++;schedule(r,ok);
    gain+=ok?(first?10:4):1;});
  S.xp+=gain;ses.gain=gain;touchDay(ses.qs.length);
  const score=ses.qs.filter((q,i)=>ses.ans[i]===q.answer).length;
  const y=META.years.find(v=>v.kai===ses.kai),pass=y?y.pass:30;
  S.exams.unshift({t:Date.now(),title:ses.title,score,total:ses.qs.length,pass});
  S.exams=S.exams.slice(0,60);
  const got=checkBadges();save();
  renderResult(score,pass);if(got.length)toast(`実績 <b>${got[0].t}</b> を獲得`);
}
function finishPractice(){lap();
  const done=ses.shown.filter(Boolean).length;
  renderResult(ses.qs.filter((q,i)=>ses.shown[i]&&ses.ans[i]===q.answer).length,null,done);}

function renderResult(score,pass,answered){
  const total=answered!=null?answered:ses.qs.length;
  const ok=pass!=null?score>=pass:null;
  homeBtn.hidden=true;readBtn.hidden=true;topInfo.innerHTML='';barSlot.innerHTML='';
  const bySec=SECS.map(s=>{const ix=ses.qs.map((q,i)=>[q,i]).filter(([q])=>q.sectionShort===s);
    return{s,n:ix.length,c:ix.filter(([q,i])=>ses.ans[i]===q.answer).length};}).filter(x=>x.n);
  const wrong=ses.qs.map((q,i)=>[q,i]).filter(([q,i])=>(answered==null||ses.shown[i])&&ses.ans[i]!==q.answer);
  const totMs=ses.ms.reduce((a,b)=>a+b,0);
  app.className='wrap';
  app.innerHTML=`
    <div class="result">
      <div class="score">${score}<small>/${total}</small></div>
      ${pass!=null?`<div class="judge ${ok?'pass':'fail'}">${ok?'合格':'不合格'}</div>
        <div class="line">${esc(ses.title)}の合格基準点は ${pass}問（今回の正答率 ${pct(score,total)}%）</div>`
       :`<div class="line">正答率 ${pct(score,total)}%${answered<ses.qs.length?`　未解答 ${ses.qs.length-answered}問`:''}</div>`}
      <div class="line">所要 ${mmss(totMs)}　1問あたり ${total?mmss(totMs/total):'—'}</div>
      ${ses.gain?`<div class="gained">+${ses.gain} XP　現在 ${rankOf(S.xp).grade}</div>`:''}
    </div>
    <h2 class="h2">分野別</h2>
    <div class="breakdown">${bySec.map(b=>`
      <div class="br"><span class="n">${b.s}</span>
        <span class="track"><span class="fill" style="width:${pct(b.c,b.n)}%;background:var(${SECVAR[b.s]})"></span></span>
        <span class="v">${b.c}/${b.n}</span></div>`).join('')}</div>
    <h2 class="h2">間違えた問題${wrong.length?`（${wrong.length}問）`:''}</h2>
    ${wrong.length?`<div class="list">${wrong.map(([q,i])=>`
        <button class="li" data-jump="${i}">
          <span class="id">${META.years.find(v=>v.kai===q.kai).label} 問${q.num}</span>
          <span class="ans"><span class="no">${ses.ans[i]?MARKS[ses.ans[i]-1]:'—'}</span> → <span class="yes">${MARKS[q.answer-1]}</span></span>
          <span class="tx">${esc(q.stem.slice(0,50))}…</span></button>`).join('')}</div>`
      :'<p class="empty">全問正解です。</p>'}
    <div style="display:flex;gap:9px;margin-top:22px;flex-wrap:wrap">
      <button class="cta" id="again" style="flex:1;min-width:170px;padding:12px">間違えた問題を解き直す</button>
      <button class="tbtn" id="back" style="padding:12px 20px">ホームへ</button>
    </div>`;
  app.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{
    ses.i=+b.dataset.jump;ses.mode='practice';ses.shown=ses.shown.map(()=>true);
    homeBtn.hidden=false;readBtn.hidden=false;renderQ();});
  const ag=document.getElementById('again');
  if(!wrong.length){ag.disabled=true;ag.textContent='間違えた問題はありません';}
  else ag.onclick=()=>startSession(shuffle(wrong.map(([q])=>q)),'practice','解き直し');
  document.getElementById('back').onclick=renderHome;
}

function renderStats(){
  homeBtn.hidden=false;barSlot.innerHTML='';topInfo.innerHTML='';readBtn.hidden=true;
  const agg=qs=>{const d=qs.filter(q=>(S.q[q.id]||{}).n>0);
    const n=d.reduce((a,q)=>a+S.q[q.id].n,0),g=d.reduce((a,q)=>a+S.q[q.id].ng,0);
    return{done:d.length,total:qs.length,acc:pct(n-g,n),n};};
  const bySec=SECS.map(s=>({s,...agg(DB.filter(q=>q.sectionShort===s))}));
  const byKai=META.years.map(y=>({y,...agg(DB.filter(q=>q.kai===y.kai))}));
  app.className='wrap';
  app.innerHTML=`<h1 class="h1">成績</h1><p class="lede">正答率は延べ解答回数に対する割合です。</p>
    <h2 class="h2">分野別</h2>
    <div class="breakdown">${bySec.map(b=>`
      <div class="br"><span class="n">${b.s}</span>
        <span class="track"><span class="fill" style="width:${b.acc}%;background:var(${SECVAR[b.s]})"></span></span>
        <span class="v">${b.n?b.acc+'%':'—'}</span></div>
      <div class="br sub"><span class="n">　解答済</span>
        <span class="track"><span class="fill" style="width:${pct(b.done,b.total)}%;background:var(--ink-3);opacity:.55"></span></span>
        <span class="v">${b.done}/${b.total}</span></div>`).join('')}</div>
    <h2 class="h2">回別</h2>
    <div class="breakdown">${byKai.map(b=>`
      <div class="br"><span class="n">${b.y.label}</span>
        <span class="track"><span class="fill" style="width:${b.acc}%;background:var(--ai)"></span></span>
        <span class="v">${b.n?b.acc+'%':'—'}</span></div>`).join('')}</div>
    <h2 class="h2">模試の記録</h2>
    ${S.exams.length?`<div class="list">${S.exams.map(e=>`
        <div class="li"><span class="id">${new Date(e.t).toLocaleDateString('ja-JP')}</span>
          <span class="tx">${esc(e.title)}</span>
          <span class="ans"><span class="${e.score>=e.pass?'yes':'no'}">${e.score}/${e.total}</span>　基準 ${e.pass}</span></div>`).join('')}</div>`
      :'<p class="empty">まだ模試の記録がありません。</p>'}`;
}

/* ===== 全体操作 ===== */
document.getElementById('brandBtn').onclick=()=>{if(!ses)renderHome();else homeBtn.click();};
homeBtn.onclick=()=>{
  if(ses&&ses.mode==='exam'&&!confirm('模試を中断してホームに戻ります。よろしいですか？'))return;
  clearInterval(timerId);renderHome();};
const prefs=(()=>{try{return JSON.parse(localStorage.getItem('kashikin.prefs'))||{};}catch(e){return{};}})();
const applyPrefs=()=>{const R=document.documentElement;
  if(prefs.theme)R.setAttribute('data-theme',prefs.theme);
  R.setAttribute('data-size',prefs.size||'m');
  R.setAttribute('data-dim',prefs.dim===false?'off':'on');};
const savePrefs=()=>{try{localStorage.setItem('kashikin.prefs',JSON.stringify(prefs));}catch(e){}applyPrefs();};
applyPrefs();
document.getElementById('themeBtn').onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const sys=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
  prefs.theme=cur?(cur==='dark'?'light':'dark'):(sys==='dark'?'light':'dark');savePrefs();};
readBtn.onclick=()=>{
  const o=['s','m','l'],i=o.indexOf(prefs.size||'m');
  if(i<o.length-1)prefs.size=o[i+1];
  else{prefs.size='s';prefs.dim=(prefs.dim===false);}
  savePrefs();toast(`文字 ${({s:'小',m:'中',l:'大'})[prefs.size]}　定義かっこ ${prefs.dim===false?'通常':'うすく'}`);};
document.addEventListener('keydown',e=>{
  if(!ses||e.metaKey||e.ctrlKey||e.altKey)return;
  if(/^[1-4]$/.test(e.key)){e.preventDefault();choose(+e.key);}
  else if(e.key==='ArrowRight'||e.key==='Enter'){if(ses.i<ses.qs.length-1){e.preventDefault();lap();ses.i++;renderQ();}}
  else if(e.key==='ArrowLeft'){if(ses.i>0){e.preventDefault();lap();ses.i--;renderQ();}}
  else if(e.key==='f'){e.preventDefault();const r=rec(ses.qs[ses.i].id);r.flag=!r.flag;save();renderQ();}
});
checkBadges(); save();   // 起動時にも実績を判定（過去の記録を引き継いだ場合に備えて）
renderHome();
</script>
