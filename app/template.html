<title>貸金業務取扱主任者 過去問1000</title>
<style>
/* 配色は市販の過去問アプリ／問題集にならい、主色1色＋朱の強調で組んでいる。
   影とグラデーションは使わず、面は罫線だけで区切る。 */
:root{
  /* 使う色は4つだけ。深緑＝操作、朱＝先へ進む／誤り、紺＝できた、紫＝あとで見直す。
     主色の深緑は、同ジャンル上位（宅建・行政書士・ITパスポートの過去問アプリ）の実測値に合わせた。 */
  --pri:#0F7A3C; --pri-2:#0A5C2C; --pri-soft:#E5F1E9;
  --acc:#C6402A; --acc-2:#A93321;
  --ok:#215DB3; --ok-2:#184A93;
  --vio:#A463D8; --vio-2:#8A4CBD; --vio-soft:#F2EAF9;
  --ng:var(--acc); --gold:var(--ok);
  --sec1:var(--pri); --sec2:var(--acc); --sec3:var(--ok); --sec4:var(--vio);
  --bg:#F1F2F4; --surface:#FFFFFF; --sunken:#EDEFF2;
  --ink:#14181D; --ink-2:#4E5560; --ink-3:#7C838F; --ink-4:#A9B0BA;
  --rule:#D4D8DE; --rule-2:#E3E6EA; --on-pri:#fff;
  --hdr:#0A5A2C; --hdr-ink:#FFFFFF; --hdr-line:rgba(255,255,255,.34); --on-acc:#fff;
  --foil:#A8791F; --foil-2:#E3C46A;       /* 段位・実績・合格証の箔。分野色ではない */
  --field-1:#0C5730; --field-2:#083D22;   /* 合格証の地 */
  --seal:#B3301F;                          /* 朱印 */
  --shadow:none;
  --disp:Meiryo,"メイリオ","Meiryo UI","Hiragino Sans","Noto Sans JP",sans-serif;
  --gothic:Meiryo,"メイリオ","Meiryo UI","Hiragino Sans","Noto Sans JP",sans-serif;
  --mono:Meiryo,"メイリオ","Meiryo UI",ui-monospace,monospace;
  --r:4px; --rs:3px; --qsize:15.5px; --qlh:1.95;
}
@media (prefers-color-scheme:dark){:root{
  --pri:#3BA968; --pri-2:#59C184; --pri-soft:#132A1E;
  --acc:#DE6446; --acc-2:#F07E60;
  --ok:#4C7FD6; --ok-2:#6E9AE4;
  --vio:#C662BC; --vio-2:#D67FCD; --vio-soft:#2C1F2B;
  --ng:var(--acc); --gold:var(--ok);
  --sec1:var(--pri); --sec2:var(--acc); --sec3:var(--ok); --sec4:var(--vio);
  --bg:#111419; --surface:#191D23; --sunken:#22272F;
  --ink:#E9ECF1; --ink-2:#A6ADB9; --ink-3:#79808C; --ink-4:#565D68;
  --rule:#2E343D; --rule-2:#242931; --on-pri:#111419;
  --hdr:#0B2318; --hdr-ink:#E9ECF1; --hdr-line:rgba(255,255,255,.22); --on-acc:#111419;
  --foil:#D9B45C; --foil-2:#F0DB9E;
  --field-1:#0E4A2C; --field-2:#07301C;
  --seal:#E05A46;
  --shadow:none;
}}
:root[data-theme="dark"]{
  --pri:#3BA968; --pri-2:#59C184; --pri-soft:#132A1E;
  --acc:#DE6446; --acc-2:#F07E60;
  --ok:#4C7FD6; --ok-2:#6E9AE4;
  --vio:#C662BC; --vio-2:#D67FCD; --vio-soft:#2C1F2B;
  --ng:var(--acc); --gold:var(--ok);
  --sec1:var(--pri); --sec2:var(--acc); --sec3:var(--ok); --sec4:var(--vio);
  --bg:#111419; --surface:#191D23; --sunken:#22272F;
  --ink:#E9ECF1; --ink-2:#A6ADB9; --ink-3:#79808C; --ink-4:#565D68;
  --rule:#2E343D; --rule-2:#242931; --on-pri:#111419;
  --hdr:#0B2318; --hdr-ink:#E9ECF1; --hdr-line:rgba(255,255,255,.22); --on-acc:#111419;
  --foil:#D9B45C; --foil-2:#F0DB9E;
  --field-1:#0E4A2C; --field-2:#07301C;
  --seal:#E05A46;
  --shadow:none;
}
:root[data-theme="light"]{
  /* 使う色は4つだけ。深緑＝操作、朱＝先へ進む／誤り、紺＝できた、紫＝あとで見直す。
     主色の深緑は、同ジャンル上位（宅建・行政書士・ITパスポートの過去問アプリ）の実測値に合わせた。 */
  --pri:#0F7A3C; --pri-2:#0A5C2C; --pri-soft:#E5F1E9;
  --acc:#C6402A; --acc-2:#A93321;
  --ok:#215DB3; --ok-2:#184A93;
  --vio:#A463D8; --vio-2:#8A4CBD; --vio-soft:#F2EAF9;
  --ng:var(--acc); --gold:var(--ok);
  --sec1:var(--pri); --sec2:var(--acc); --sec3:var(--ok); --sec4:var(--vio);
  --bg:#F1F2F4; --surface:#FFFFFF; --sunken:#EDEFF2;
  --ink:#14181D; --ink-2:#4E5560; --ink-3:#7C838F; --ink-4:#A9B0BA;
  --rule:#D4D8DE; --rule-2:#E3E6EA; --on-pri:#fff;
  --hdr:#0A5A2C; --hdr-ink:#FFFFFF; --hdr-line:rgba(255,255,255,.34); --on-acc:#fff;
  --foil:#A8791F; --foil-2:#E3C46A;       /* 段位・実績・合格証の箔。分野色ではない */
  --field-1:#0C5730; --field-2:#083D22;   /* 合格証の地 */
  --seal:#B3301F;                          /* 朱印 */
  --shadow:none;
}
:root[data-size="s"]{--qsize:15px;--qlh:1.85}
:root[data-size="l"]{--qsize:18.5px;--qlh:2.1}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--gothic);
     font-size:14.5px;line-height:1.8;-webkit-text-size-adjust:100%}
button,select{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--pri-2);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.top{position:sticky;top:0;z-index:30;background:var(--hdr);color:var(--hdr-ink);
     border-bottom:2px solid var(--acc);display:flex;align-items:center;gap:10px;
     padding:7px 14px;min-height:48px}
.brand{font-family:var(--disp);font-size:16px;letter-spacing:.01em;color:var(--hdr-ink);
       font-weight:700;white-space:nowrap;background:none;border:none;padding:0;text-align:left}
.brand .sub{display:block;font-family:var(--gothic);font-size:10px;letter-spacing:.14em;
            color:var(--hdr-ink);opacity:.7;font-weight:400;margin-top:1px}
.top .spacer{flex:1}
.tbtn{background:transparent;border:1px solid var(--hdr-line);border-radius:3px;
      padding:5px 9px;font-size:12.5px;color:var(--hdr-ink);white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.12)}
.counter{font-family:var(--mono);font-size:13px;color:var(--hdr-ink);opacity:.78;
         font-variant-numeric:tabular-nums;white-space:nowrap}
.counter b{color:var(--hdr-ink);font-weight:700}
.timer{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;
       padding:3px 9px;border:1px solid var(--hdr-line);border-radius:3px;color:var(--hdr-ink)}
.timer.warn{background:var(--ng);border-color:var(--ng);color:var(--on-pri)}
.combo{font-family:var(--mono);font-size:12px;color:var(--on-acc);background:var(--acc);
       border-radius:3px;padding:2px 8px;white-space:nowrap;font-weight:700}

.wrap{max-width:820px;margin:0 auto;padding:16px 14px 96px}
.h1{font-family:var(--disp);font-size:22px;font-weight:700;margin:0 0 4px;letter-spacing:0}
.lede{color:var(--ink-2);font-size:13px;margin:0 0 18px}
.h2{font-family:var(--gothic);font-size:13.5px;font-weight:700;letter-spacing:0;
    color:var(--ink);margin:24px 0 8px;display:flex;align-items:center;gap:9px;
    border-left:4px solid var(--pri);padding-left:9px;line-height:1.5}
.h2 .more{background:none;border:none;font-size:11.5px;color:var(--ink-3);
          padding:0;margin-left:auto;font-weight:400}
.h2 .more::after{content:" ›";color:var(--pri);font-weight:700}
.h2 .more:hover{color:var(--pri)}

/* 主役：次の一手 */
.hero{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);
      padding:14px 15px 13px;display:flex;flex-direction:column;gap:12px}
.why{display:flex;align-items:center;gap:14px}
.ring{width:76px;height:76px;flex-shrink:0}
.ring circle{fill:none;stroke-width:6}
.ring .bgc{stroke:var(--sunken)}
.ring .fg{stroke:var(--vio);stroke-linecap:round;transition:stroke-dasharray .6s cubic-bezier(.3,0,.2,1)}
/* 復習が溜まっていないときは「これから始める」ので、紫ではなく主色で出す */
.why.start .ring .fg{stroke:var(--pri)} .why.start .msg b{color:var(--pri)}
.why.met .ring text{fill:var(--pri)}
.ring text{font-family:var(--mono);font-size:19px;fill:var(--ink);text-anchor:middle;
           font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.why .msg{font-family:var(--disp);font-size:17.5px;line-height:1.6;font-weight:700;
          text-wrap:balance}
.why .msg b{color:var(--vio);font-size:23px;font-family:var(--mono);padding:0 2px;
            letter-spacing:-.01em}
.why .sub{font-family:var(--gothic);font-size:11.5px;color:var(--ink-3);margin-top:2px}
.cta{width:100%;background:var(--acc);color:var(--on-acc);border:none;border-radius:var(--rs);
     padding:15px;font-size:16.5px;font-weight:700;letter-spacing:.04em}
.cta:hover{background:var(--acc-2)}
.cta[disabled]{opacity:.4;cursor:not-allowed}
.setrow{display:flex;gap:6px;flex-wrap:wrap}
.setrow label{flex:1;min-width:104px;display:flex;flex-direction:column;gap:3px}
.setrow .lb{font-size:10.5px;color:var(--ink-3)}
.setrow select{width:100%;background:var(--surface);border:1px solid var(--rule);
               border-radius:var(--rs);padding:8px 9px;font-size:13px;color:var(--ink);font-weight:600}
.setrow select:hover{border-color:var(--pri)}

/* 続ける */
.streak{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:13px 15px}
.days{display:flex;gap:6px;justify-content:space-between;margin-bottom:13px}
.day{flex:1;text-align:center}
.day .w{font-size:10px;color:var(--ink-3);margin-bottom:4px}
.day .d{width:26px;height:26px;margin:0 auto;border-radius:50%;border:1.5px solid var(--rule-2);
        display:grid;place-items:center;font-size:12px;color:var(--ink-4)}
.day .d.on{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.day .d.today{border-color:var(--pri);border-width:2px}
.day .d.on.today{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--pri)}
.srow{display:flex;align-items:center;justify-content:center;gap:22px;
      padding-top:12px;border-top:1px solid var(--rule-2)}
.srow div{text-align:center}
.srow .n{font-family:var(--mono);font-size:22px;color:var(--acc);line-height:1.2;
         font-variant-numeric:tabular-nums}
.srow .n.zero{color:var(--ink-4)}          /* 0 を朱で出すと失点のように見える */
.srow .l{font-size:10.5px;color:var(--ink-3);letter-spacing:.08em}
.weeks{display:flex;align-items:flex-end;gap:5px;height:58px;margin-top:14px;
       padding-top:12px;border-top:1px solid var(--rule-2)}
.wk{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
    height:100%;justify-content:flex-end}
.wk i{display:block;width:100%;background:var(--pri-2);border-radius:2px 2px 0 0;
      min-height:2px;opacity:.85}
.wk .t{font-size:9px;color:var(--ink-4);font-family:var(--mono)}

/* 合格可能性 */
.pass{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:13px 15px}
.pass .hd{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.pass .pc{font-family:var(--mono);font-size:40px;line-height:.95;font-variant-numeric:tabular-nums;
          letter-spacing:-.02em}
.pass .lb{font-size:12px;color:var(--ink-2)}
.gauge{display:block;height:9px;background:var(--sunken);border-radius:2px;overflow:hidden}
.gauge i{display:block;height:100%;border-radius:2px;transition:width .6s cubic-bezier(.3,0,.2,1)}
.pass .note{font-size:11px;color:var(--ink-3);margin-top:8px;line-height:1.7}

/* 分野別リスト */
.secs{display:flex;flex-direction:column;background:var(--surface);
      border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.secrow{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;align-items:center;
        background:var(--surface);padding:11px 13px;width:100%;text-align:left;
        border:none;border-top:1px solid var(--rule-2)}
.secrow.flat{padding:9px 13px}                 /* 進捗バーが無い分、行を詰める */
.secrow:first-child{border-top:none}
.secrow:hover{background:var(--sunken)}
.secrow .swatch{width:4px;height:20px;display:block}
.secrow.flat .swatch{height:16px}
.secrow .body{display:block;min-width:0}
.secrow .nm{font-family:var(--disp);font-size:14.5px;display:block;font-weight:700}
.secrow .track{display:block;height:4px;background:var(--sunken);border-radius:2px;
               overflow:hidden;margin-top:5px}
.secrow .track i{display:block;height:100%;border-radius:2px}
.secrow .val{font-family:var(--mono);font-size:14px;color:var(--ink);text-align:right;
             font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.4}
.secrow .val em{font-style:normal;color:var(--ink-4);font-size:11.5px}
.secrow .val b{display:block;font-size:11.5px;font-weight:600;color:var(--ink-3);margin-top:1px}

/* テーマ */
.topics{display:flex;flex-direction:column;background:var(--surface);
        border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.trow{position:relative;display:grid;grid-template-columns:4px minmax(0,1fr) auto auto;
      gap:12px;align-items:center;background:var(--surface);padding:9px 13px;
      width:100%;text-align:left;border:none;border-top:1px solid var(--rule-2);font-size:13px}
.trow:first-child{border-top:none}
.trow:hover{background:var(--sunken)}
.trow .tsec{width:4px;height:22px;display:block}
.trow .tbody{display:block;min-width:0}
.trow .tn{display:block;font-family:var(--disp);font-size:14.5px;font-weight:700;
          line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .tart{display:block;font-size:10.5px;color:var(--ink-3);margin-top:2px;
            overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .f{font-family:var(--mono);font-size:13px;color:var(--ink-2);text-align:right;
         line-height:1.35;font-variant-numeric:tabular-nums;white-space:nowrap}
.trow .f em{font-style:normal;font-size:10.5px;color:var(--ink-4);font-family:var(--gothic)}
.trow .acc{font-family:var(--mono);font-size:14px;font-weight:700;text-align:right;
           font-variant-numeric:tabular-nums;min-width:2.6em;white-space:nowrap}
.trow .acc em{font-style:normal;font-size:10.5px;font-weight:400}
.trow .tbar{position:absolute;left:0;right:0;bottom:0;height:2px;background:transparent}
.trow .tbar i{display:block;height:100%}
.tag.theme{border-color:var(--pri);background:var(--pri-soft);color:var(--pri)}


/* 診断 */
.dlist{display:flex;flex-direction:column;gap:9px}
.dcard{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);
       padding:13px 15px}
.dcard.good{opacity:.9}
.dh{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:9px}
.dk{font-size:10.5px;color:var(--on-pri);background:var(--pri);
    border-radius:2px;padding:3px 8px;font-weight:700}
.dt{font-family:var(--disp);font-size:16px;font-weight:700;flex:1;min-width:0}
.dv{font-family:var(--mono);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.dv small{font-size:13px}
.dbar{position:relative;display:block;height:8px;background:var(--sunken);
      border-radius:2px;overflow:visible}
.dbar i{display:block;height:100%;border-radius:2px;transition:width .6s cubic-bezier(.3,0,.2,1)}
.dbar b{position:absolute;top:-4px;width:2px;height:16px;background:var(--ink-3);border-radius:1px}
.dm{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:7px}
.dtip{font-size:13.5px;line-height:1.85;color:var(--ink-2);margin:10px 0 0}
.dgo{margin-top:11px;background:var(--pri);border:none;border-radius:var(--rs);
     padding:8px 16px;font-size:12.5px;color:var(--on-pri);font-weight:700}
.dgo:hover{background:var(--pri-2)}
/* 設問の引っかけ表示 */
.traps{background:var(--sunken);border:1px solid var(--rule-2);border-left:4px solid var(--acc);
       border-radius:0 var(--rs) var(--rs) 0;padding:11px 14px;margin:0 0 15px}
.traps .tl{font-size:11px;color:var(--acc);font-weight:700;margin-bottom:6px}
.traps .ti{font-size:13px;line-height:1.8;color:var(--ink-2);margin-top:5px}
.traps .ti b{color:var(--ink);font-weight:700;margin-right:7px}

/* 到達度 */
.matrix{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
.matrix th{font-weight:500;color:var(--ink-3);font-size:10px;padding:4px 3px;text-align:center;line-height:1.3}
.matrix col.lab{width:56px} .matrix col.tot{width:44px}
.matrix th.row{text-align:right;padding-right:8px;color:var(--ink-2);font-size:11px;font-family:var(--mono)}
.matrix td{padding:1.5px}
.cell{display:block;width:100%;border:1px solid var(--rule-2);border-radius:2px;
      background:var(--sunken);padding:6px 1px;text-align:center;font-family:var(--mono);
      font-size:11px;color:var(--ink-4)}
.cell:hover{border-color:var(--pri);position:relative;z-index:2}
.cell.has{color:var(--on-pri);border-color:transparent}
.cell.perfect{outline:2px solid var(--foil-2);outline-offset:-3px;font-weight:700}

/* 段位 */
.rankbar{display:flex;align-items:center;gap:13px;margin-bottom:13px}
.rankseal{position:relative;width:52px;height:52px;flex-shrink:0;display:grid;place-items:center;
          border:2px solid var(--foil);border-radius:2px;
          background:linear-gradient(145deg,
            color-mix(in srgb,var(--foil-2) 26%,var(--surface)),var(--surface) 62%)}
.rankseal::after{content:"";position:absolute;inset:3px;border:1px solid var(--foil);opacity:.4}
.rankseal span{position:relative;font-family:var(--disp);font-size:18px;font-weight:800;
               color:var(--foil)}
.rankbar .meta{flex:1;min-width:0}
.rankbar .x{display:flex;flex-wrap:wrap;align-items:baseline;gap:3px 12px;
            font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-bottom:6px}
.rankbar .x span{white-space:nowrap}       /* 「正答率 —」だけが折り返さないように */
.rankbar .x b{color:var(--ink-2);font-weight:600}
.streak .hint{font-size:11.5px;color:var(--ink-3);text-align:center;
              padding-top:11px;margin-top:12px;border-top:1px solid var(--rule-2);line-height:1.7}
.xpbar{display:block;height:6px;background:var(--sunken);border:1px solid var(--rule-2);overflow:hidden}
.xpbar i{display:block;height:100%;
         background:linear-gradient(90deg,var(--foil),var(--foil-2))}

.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.mode{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);
      padding:11px 13px;text-align:left;display:flex;flex-direction:column;gap:2px}
.mode:hover{border-color:var(--pri);background:var(--sunken)}
.mode .t{font-family:var(--disp);font-size:15px;font-weight:700;letter-spacing:0}
.mode .d{font-size:11.5px;color:var(--ink-2);line-height:1.55}
.mode[disabled]{opacity:.45;cursor:not-allowed}

.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:5px}
.badge{border:1px solid var(--rule-2);border-radius:var(--rs);padding:9px 10px;
       background:var(--surface);opacity:.42}
.badge.on{opacity:1;border-color:var(--foil);
          background:linear-gradient(150deg,color-mix(in srgb,var(--foil-2) 20%,var(--surface)),var(--surface) 64%)}
.badge .bt{font-family:var(--disp);font-size:12.5px;font-weight:700}
.badge.on .bt{color:var(--foil)}
.badge .bd{font-size:10px;color:var(--ink-3);line-height:1.45;margin-top:2px}

/* 設問 */
.qmeta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:11px;font-size:11.5px}

<script>
const DB = /*__DATA__*/;
const META = /*__META__*/;
const THEMES = /*__TOPICS__*/;
const TRAPS = /*__TRAPS__*/;
const TRAPNAME = Object.fromEntries(TRAPS.map(t=>[t.id,t]));
const BY = Object.fromEntries(DB.map(q=>[q.id,q]));

const SECS=['法令','貸付実務','資金需要者保護','財務会計'];
const SECVAR={'法令':'--sec1','貸付実務':'--sec2','資金需要者保護':'--sec3','財務会計':'--sec4'};
const MARKS=['①','②','③','④'];
const FMTLBL={single:'単純択一',combo:'組合せ',count:'個数'};
const KEY='kashikin.progress.v3';
const DAY=86400000;

const RANKS=[[0,'十級'],[100,'九級'],[250,'八級'],[450,'七級'],[700,'六級'],[1000,'五級'],
             [1400,'四級'],[1900,'三級'],[2500,'二級'],[3200,'一級'],[4000,'初段'],
             [5000,'二段'],[6200,'三段'],[7600,'四段'],[9200,'五段']];
function rankOf(xp){let i=0;while(i+1<RANKS.length&&xp>=RANKS[i+1][0])i++;
  const n=RANKS[i+1];return{grade:RANKS[i][1],base:RANKS[i][0],next:n?n[0]:null,nextName:n?n[1]:null};}

const tried=s=>Object.keys(s.q).filter(k=>s.q[k].n>0).length;
function secAcc85(s,sec){const qs=DB.filter(q=>q.sectionShort===sec&&(s.q[q.id]||{}).n>0);
  if(qs.length<100)return false;
  const n=qs.reduce((a,q)=>a+s.q[q.id].n,0),g=qs.reduce((a,q)=>a+s.q[q.id].ng,0);
  return n&&(n-g)/n>=0.85;}
const BADGES=[
 {id:'first',t:'初挑戦',d:'1問目に解答',f:s=>tried(s)>=1},
 {id:'q100',t:'百問',d:'100問に解答',f:s=>tried(s)>=100},
 {id:'q500',t:'五百問',d:'500問に解答',f:s=>tried(s)>=500},
 {id:'q1000',t:'千問走破',d:'全1000問に解答',f:s=>tried(s)>=1000},
 {id:'kai1',t:'一回完答',d:'ある回の50問すべてに解答',f:s=>META.years.some(y=>DB.filter(q=>q.kai===y.kai).every(q=>(s.q[q.id]||{}).n>0))},
 {id:'perf',t:'満点の回',d:'ある回を全問一発正解',f:s=>META.years.some(y=>DB.filter(q=>q.kai===y.kai).every(q=>{const r=s.q[q.id];return r&&r.n>0&&r.ng===0}))},
 {id:'mock',t:'模試合格',d:'模試で合格基準点を突破',f:s=>s.exams.some(e=>e.score>=e.pass)},
 {id:'mock5',t:'模試五冠',d:'5回分の模試に合格',f:s=>new Set(s.exams.filter(e=>e.score>=e.pass).map(e=>e.title)).size>=5},
 {id:'d7',t:'七日連続',d:'7日続けて学習',f:s=>s.best>=7},
 {id:'d30',t:'三十日連続',d:'30日続けて学習',f:s=>s.best>=30},
 {id:'law',t:'法令の達人',d:'法令分野で正答率85%以上（100問以上）',f:s=>secAcc85(s,'法令')},
 {id:'combo10',t:'十連正解',d:'10問連続で正解',f:s=>s.bestCombo>=10},
];

/* ===== 保存 ===== */
const blank=()=>({q:{},ms:{},exams:[],xp:0,days:{},streak:0,best:0,last:null,badges:{},
                  goal:20,combo:0,bestCombo:0,cfg:{n:20,mode:'auto',scope:'all'}});
let S=(()=>{try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&v.q)return Object.assign(blank(),v);}catch(e){}return blank();})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
const rec=id=>S.q[id]||(S.q[id]={n:0,ng:0,last:null,flag:false,ease:2.5,iv:0,due:0,reps:0});
const dkey=d=>`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
const today=()=>dkey(new Date());
function touchDay(k){
  const t=today();
  if(S.last!==t){const y=new Date();y.setDate(y.getDate()-1);
    S.streak=(S.last===dkey(y))?S.streak+1:1;
    S.best=Math.max(S.best||0,S.streak);S.last=t;}
  S.days[t]=(S.days[t]||0)+(k||1);
}

/* ===== 出題エンジン =====
   忘却曲線に沿って復習日を決め、分野ごとの正答率で重みを付けて次の問題を選ぶ。
   文章を生成するのではなく、解答履歴と問題文から機械的に算出している。 */
function schedule(r,ok){
  if(ok){
    r.reps=(r.reps||0)+1;
    r.ease=Math.min(2.8,(r.ease||2.5)+0.06);
    r.iv = r.reps===1?1 : r.reps===2?3 : Math.max(1,Math.round((r.iv||1)*r.ease));
  }else{ r.reps=0; r.ease=Math.max(1.4,(r.ease||2.5)-0.22); r.iv=0; }
  r.due=Date.now()+r.iv*DAY;
}
const dueNow=()=>DB.filter(q=>{const r=S.q[q.id];return r&&r.n>0&&(r.due||0)<=Date.now();});
function sectionAcc(){
  const o={};
  SECS.forEach(s=>{
    const qs=DB.filter(q=>q.sectionShort===s&&(S.q[q.id]||{}).n>0);
    const n=qs.reduce((a,q)=>a+S.q[q.id].n,0),g=qs.reduce((a,q)=>a+S.q[q.id].ng,0);
    o[s]={n,acc:n?(n-g)/n:null,done:qs.length,total:DB.filter(q=>q.sectionShort===s).length};
  });
  return o;
}
function pickQuestions(n,mode,scope){
  let pool=DB.slice();
  if(scope&&scope!=='all'){
    if(scope.startsWith('kai:'))pool=pool.filter(q=>q.kai===+scope.slice(4));
    else if(scope.startsWith('th:'))pool=pool.filter(q=>q.theme===scope.slice(3));
    else pool=pool.filter(q=>q.sectionShort===scope);
  }
  const acc=sectionAcc();
  const weight=q=>{
    const r=S.q[q.id];let s=1;
    if(!r||!r.n) s+=(mode==='fresh'?6:2);
    else{
      if((r.due||0)<=Date.now()) s+=5;              // 復習の期日が来ている
      s+=(r.ng/Math.max(1,r.n))*4;                  // 間違えるほど優先
      s+=Math.max(0,3-(r.reps||0))*0.6;             // 定着が浅いほど優先
    }
    const a=acc[q.sectionShort];
    if(a&&a.acc!=null) s+=(1-a.acc)*3;              // 弱い分野を厚く
    if(mode==='hot') s+=(q.topicRank||0)*0.35;      // 頻出論点を優先
    if(mode==='fresh'&&r&&r.n) s*=0.15;
    if(mode==='weak'&&!(r&&r.ng)) s*=0.2;
    return s*(0.75+Math.random()*0.5);
  };
  return pool.map(q=>[weight(q),q]).sort((a,b)=>b[0]-a[0]).slice(0,n).map(x=>x[1]);
}


/* ===== 誤答傾向の診断 =====
   解答履歴を、引っかけの型・テーマ・出題形式・否定形・解答時間の5つの軸で集計し、
   足を引っ張っている順にアドバイスを組み立てる。LLMは使わず、
   問題文から抽出した引っかけの型と、あなた自身の正誤だけを材料にしている。 */
function diagnose(){
  const done = DB.filter(q=>(S.q[q.id]||{}).n>0);
  if(done.length<20) return {ready:false, need:20-done.length, cards:[]};
  const rate = qs => {
    const n=qs.reduce((a,q)=>a+S.q[q.id].n,0), g=qs.reduce((a,q)=>a+S.q[q.id].ng,0);
    return n?{n, ng:g, acc:(n-g)/n}:null;
  };
  const all = rate(done), cards=[];

  // 1) 引っかけの型
  TRAPS.forEach(t=>{
    const qs=done.filter(q=>q.traps.includes(t.id));
    const r=rate(qs);
    if(!r||r.n<5) return;
    cards.push({kind:'引っかけ', key:t.id, title:t.name, acc:r.acc, n:r.n, ng:r.ng,
      gap:all.acc-r.acc, tip:t.tip,
      pick:()=>shuffle(DB.filter(q=>q.traps.includes(t.id)))});
  });
  // 2) テーマ
  THEMES.forEach(t=>{
    const qs=done.filter(q=>q.theme===t.name);
    const r=rate(qs);
    if(!r||r.n<5) return;
    cards.push({kind:'テーマ', key:'th:'+t.name, title:t.name, acc:r.acc, n:r.n, ng:r.ng,
      gap:all.acc-r.acc,
      tip:`このテーマは過去20回中${t.kaiCount}回・計${t.count}問出ています。`+
          (t.arts.length?`根拠は ${t.arts.map(a=>a.a+'（'+a.n+'）').join('、')} です。`:'')+
          '出題頻度が高いので、ここを埋めると点が伸びます。',
      pick:()=>shuffle(DB.filter(q=>q.theme===t.name))});
  });
  // 3) 出題形式
  [['count','個数問題','ａ〜ｄを1つずつ○×で確定させないと当たりません。'+
      '設問カードの記号を押して○×を付けながら読む癖をつけてください。'],
   ['combo','組合せ問題','2つ確実に切れれば正解できます。自信のある記述から潰してください。'],
   ['single','単純択一','消去法より、各肢を単独で○×判定するほうが速く正確です。']
  ].forEach(([f,name,tip])=>{
    const qs=done.filter(q=>q.format===f);
    const r=rate(qs);
    if(!r||r.n<5) return;
    cards.push({kind:'出題形式', key:'fmt:'+f, title:name, acc:r.acc, n:r.n, ng:r.ng,
      gap:all.acc-r.acc, tip, pick:()=>shuffle(DB.filter(q=>q.format===f))});
  });
  // 4) 否定形
  const neg=rate(done.filter(q=>q.negative)), pos=rate(done.filter(q=>!q.negative));
  if(neg&&pos&&neg.n>=8&&neg.acc<pos.acc-0.05){
    cards.push({kind:'読み方', key:'neg', title:'「適切でないもの」を選ぶ問題',
      acc:neg.acc, n:neg.n, ng:neg.ng, gap:pos.acc-neg.acc,
      tip:`肯定形は${Math.round(pos.acc*100)}%取れているのに、否定形は${Math.round(neg.acc*100)}%です。`+
          '設問の「適切でないもの」を読み飛ばしています。まず末尾の一文を読んでから肢に入ってください。',
      pick:()=>shuffle(DB.filter(q=>q.negative))});
  }
  // 5) 解答時間
  const ms=Object.entries(S.ms||{}).filter(([id])=>BY[id]);
  if(ms.length>=20){
    const fast=ms.filter(([,v])=>v.t/v.c<25000).map(([id])=>BY[id]);
    const slow=ms.filter(([,v])=>v.t/v.c>90000).map(([id])=>BY[id]);
    const rf=rate(fast.filter(q=>(S.q[q.id]||{}).n>0));
    if(rf&&rf.n>=8&&rf.acc<all.acc-0.1)
      cards.push({kind:'解き方', key:'fast', title:'25秒未満で答えた問題',
        acc:rf.acc, n:rf.n, ng:rf.ng, gap:all.acc-rf.acc,
        tip:'速く答えた問題の正答率が全体より低く出ています。本番は1問あたり2分24秒使えます。'+
            '見た瞬間に選ばず、全肢に目を通してから決めてください。',
        pick:()=>shuffle(fast)});
    if(slow.length>=8)
      cards.push({kind:'解き方', key:'slow', title:'1分半以上かかった問題',
        acc:(rate(slow)||{acc:0}).acc, n:slow.length, ng:0, gap:0.001,
        tip:`${slow.length}問で1分半以上かかっています。本番は50問120分＝1問2分24秒。`+
            'この分野は時間を食う前提で、後回しにする判断も持っておいてください。',
        pick:()=>shuffle(slow)});
  }
  cards.sort((a,b)=>b.gap*Math.min(1,b.n/20)-a.gap*Math.min(1,a.n/20));
  return {ready:true, all, cards:cards.filter(c=>c.gap>0.02).slice(0,6),
          strong:cards.filter(c=>c.gap<-0.05).sort((a,b)=>a.gap-b.gap).slice(0,3)};
}

/* ===== 合格可能性の推定 =====
   分野別の正答率から、本番の分野構成(27/15/5/3)で50問解いた場合の得点分布を
   正規近似し、合格基準点を上回る確率を出す。履歴が薄いうちは表示しない。 */
const MIX={'法令':27,'貸付実務':15,'資金需要者保護':5,'財務会計':3};
const PASSLINE=31;
function erf(x){const s=x<0?-1:1;x=Math.abs(x);
  const t=1/(1+0.3275911*x);
  return s*(1-((((1.061405429*t-1.453152027)*t+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x));}
function passChance(){
  const acc=sectionAcc();
  const total=Object.values(acc).reduce((a,x)=>a+x.n,0);
  if(total<60)return null;
  const overall=Object.values(acc).reduce((t,x)=>t+(x.acc!=null?x.acc*x.n:0),0)/total;
  let m=0,v=0;
  for(const [s,cnt] of Object.entries(MIX)){
    const a=acc[s],k=8;
    const p=((a.acc!=null?a.acc*a.n:0)+overall*k)/((a.n||0)+k);   // 薄い分野は全体平均に寄せる
    m+=cnt*p; v+=cnt*p*(1-p);
  }
  const sd=Math.sqrt(Math.max(v,0.5));
  const z=(PASSLINE-0.5-m)/sd;
  return {p:Math.max(0,Math.min(100,Math.round((1-0.5*(1+erf(z/Math.SQRT2)))*100))),
          score:m.toFixed(1), n:total};
}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function sentences(t){const o=[];let b='',d=0;
  for(const c of t){b+=c;
    if('（(「『［['.includes(c))d++;
    else if('）)」』］]'.includes(c))d=Math.max(0,d-1);
    else if(c==='。'&&d===0){o.push(b);b='';}}
  if(b)o.push(b);return o;}
const dimDefs=h=>h.replace(/（[^（）]*?(?:以下[^（）]*?という|本問において[^（）]*?という)[^（）]*?）/g,m=>`<span class="dim">${m}</span>`);
const cues=h=>h.replace(/(適切でないもの|合致しないもの|該当しないもの|含まれないもの)/g,'<span class="cue">$1</span>')
                .replace(/(適切なものの個数|適切なものの組み合わせ|適切なもの)/g,'<span class="cue2">$1</span>');
const proseHTML=(t,o={})=>sentences(t).map((s,i)=>{
  let h=dimDefs(esc(s)); if(o.cue)h=cues(h);
  return `<span class="s${i===0?' lead':''}">${h}</span>`;}).join('');

/* ===== 論点 ===== */
/* ホームに出すテーマを選ぶ。出題数が多く、まだ手をつけていないものを優先し、
   分野が1つに偏らないよう各分野から最低1つは入れる。 */
function pickThemes(n){
  const score=t=>{
    const qs=DB.filter(q=>q.theme===t.name);
    const d=qs.filter(q=>(S.q[q.id]||{}).n>0).length;
    const ng=qs.filter(q=>(S.q[q.id]||{}).ng>0).length;
    return t.count*(1-d/qs.length*0.7)+ng*4;
  };
  const ranked=THEMES.map(t=>[score(t),t]).sort((a,b)=>b[0]-a[0]).map(x=>x[1]);
  const out=[],seen=new Set();
  SECS.forEach(sec=>{const t=ranked.find(t=>t.sec===sec&&!seen.has(t.name));
    if(t){out.push(t);seen.add(t.name);}});
  for(const t of ranked){ if(out.length>=n) break; if(!seen.has(t.name)){out.push(t);seen.add(t.name);} }
  return out.slice(0,n).sort((a,b)=>SECS.indexOf(a.sec)-SECS.indexOf(b.sec)||b.count-a.count);
}
function topicRows(list){
  return list.map((t,i)=>{
    const qs=DB.filter(q=>q.theme===t.name);
    const d=qs.filter(q=>(S.q[q.id]||{}).n>0);
    const n=d.reduce((a,q)=>a+S.q[q.id].n,0),g=d.reduce((a,q)=>a+S.q[q.id].ng,0);
    const p=n?pct(n-g,n):null;
    const art=(t.arts||[]).map(x=>`${x.a}（${x.n}）`).join('　');
    return `<button class="trow" data-topic="${esc(t.name)}">
      <span class="tsec" style="background:var(${SECVAR[t.sec]||'--pri'})"></span>
      <span class="tbody"><span class="tn">${esc(t.name)}</span>
        ${art?`<span class="tart">${esc(art)}</span>`:''}</span>
      <span class="f">${t.count}<em>問</em>　<em>${t.kaiCount}回</em></span>
      ${p==null?'<span class="acc"></span>'
        :`<span class="acc" style="color:${p>=70?'var(--ok)':'var(--ng)'}">${p}<em>%</em></span>`}
      ${d.length?`<span class="tbar"><i style="width:${d.length/qs.length*100}%;background:var(${SECVAR[t.sec]||'--pri'})"></i></span>`:''}</button>`;
  }).join('');
}

/* ===== セッション ===== */
function startSession(qs,mode,title,kai){
  if(!qs||!qs.length){toast('該当する問題がありません');return;}
  ses={qs,mode,title,kai:kai||0,i:0,ans:new Array(qs.length).fill(null),
       shown:new Array(qs.length).fill(false),marks:qs.map(()=>({})),
       ms:new Array(qs.length).fill(0),t0:Date.now(),
       limit:mode==='exam'?120*60*1000:null,gain:0};
  homeBtn.hidden=false;readBtn.hidden=false;
  if(mode==='exam')tick();
  renderQ();
}
function tick(){clearInterval(timerId);
  timerId=setInterval(()=>{
    if(!ses||ses.mode!=='exam'){clearInterval(timerId);return;}
    const left=ses.limit-(Date.now()-ses.t0);
    if(left<=0){clearInterval(timerId);finishExam();return;}
    const el=document.getElementById('tm');
    if(el){el.textContent=`残り ${Math.floor(left/60000)}:${String(Math.floor(left%60000/1000)).padStart(2,'0')}`;
      el.classList.toggle('warn',left<600000);}
  },250);}
const lap=()=>{if(ses){ses.ms[ses.i]+=Date.now()-qT0;qT0=Date.now();}};
function logTime(id,ms){if(ms<1000||ms>15*60000)return;
  const m=S.ms[id]||(S.ms[id]={t:0,c:0}); m.t+=ms; m.c++;}

function renderQ(){
  const q=ses.qs[ses.i],picked=ses.ans[ses.i],shown=ses.shown[ses.i],r=S.q[q.id]||{};
  const y=META.years.find(v=>v.kai===q.kai);
  qT0=Date.now();
  topInfo.innerHTML=(ses.mode==='exam'
      ?`<span class="counter"><b>${ses.i+1}</b> / ${ses.qs.length}</span><span class="timer" id="tm" style="margin-left:8px"></span>`
      :`<span class="counter"><span class="who">${esc(ses.title)}　</span><b>${ses.i+1}</b> / ${ses.qs.length}</span>`)
    +(S.combo>=3?`<span class="combo" style="margin-left:8px">${S.combo}連正解</span>`:'');

  const tableHTML=q.table?`<div class="qtable"><table>
      <caption>${esc(q.table.title)}　${esc(q.table.caption)}</caption>
      <thead><tr>${q.table.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead>
      <tbody>${q.table.rows.map(w=>`<tr>${w.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'';
  const keys=Object.keys(q.statements),mk=ses.marks[ses.i];
  const stmtHTML=keys.length?`<div class="stmts">${keys.map(k=>`
      <div class="stmt" data-v="${mk[k]||''}">
        <button class="mk" data-stmt="${k}" title="○ / × を切り替えて整理できます">${mk[k]==='o'?'○':mk[k]==='x'?'×':k}</button>
        <div class="bd">${proseHTML(q.statements[k])}</div></div>`).join('')}</div>
      ${Object.keys(mk).length?`<div class="tally">○ <b>${Object.values(mk).filter(v=>v==='o').length}</b>　× ${Object.values(mk).filter(v=>v==='x').length}</div>`:''}`:'';
  const optHTML=MARKS.map((m,ix)=>{
    const nn=ix+1;let cls='opt',mark='';
    if(shown){
      if(nn===q.answer)cls+=' correct'; else if(nn===picked)cls+=' wrong';
      if(nn===picked)cls+=' picked';
      if(nn===q.answer)mark=circleSVG(); else if(nn===picked)mark=crossSVG();
    }else if(nn===picked)cls+=' picked correct';
    return `<button class="${cls}" data-n="${nn}" ${shown?'disabled':''}>
      <span class="m">${m}</span><span class="bd">${proseHTML(q.options[m])}</span>${mark}</button>`;}).join('');
  const verdict=shown?`<div class="verdict ${picked===q.answer?'ok':'ng'}">
      <span class="r">${picked===q.answer?'正解':'不正解'}</span>
      <span class="a">正答 ${MARKS[q.answer-1]}${picked&&picked!==q.answer?`　選択 ${MARKS[picked-1]}`:''}　${mmss(ses.ms[ses.i])}</span>
      ${picked===q.answer?`<span class="xp">+${r.n===1?10:4} XP</span>`:''}</div>`:'';
  const trap=(shown&&q.traps.length)?`<div class="traps">
      <div class="tl">この問題で狙われている点</div>
      ${q.traps.map(t=>`<div class="ti"><b>${TRAPNAME[t].name}</b>${esc(TRAPNAME[t].tip)}</div>`).join('')}
    </div>`:'';
  const after=(shown&&ses.mode!=='exam')?`<div class="after">
      ${q.similar&&q.similar.length?`<button id="simBtn">似ている問題 ${q.similar.length}問</button>`:''}
      <button data-topic="${esc(q.theme)}">「${esc(q.theme)}」をまとめて</button>
      ${(q.arts||[]).slice(0,2).map(x=>`<button disabled>${esc(x.a)}（${esc(x.n)}）</button>`).join('')}
      ${r.iv?`<button disabled>次の復習は ${r.iv}日後</button>`:''}</div>`:'';
  const navHTML=`<div class="nav">${ses.qs.map((qq,ix)=>{
      let c='';
      if(ses.mode==='exam'){if(ses.ans[ix])c='done';}
      else if(ses.shown[ix])c=(ses.ans[ix]===ses.qs[ix].answer)?'ok':'ng';
      if((S.q[qq.id]||{}).flag)c+=' flag';
      if(ix===ses.i)c+=' cur';
      return `<button class="${c}" data-jump="${ix}">${ix+1}</button>`;}).join('')}</div>`;

  app.className='wrap';
  app.innerHTML=`
    <div class="qmeta">
      <span class="tag sec" style="background:var(${SECVAR[q.sectionShort]})">${q.sectionShort}</span>
      <span class="tag">${y.label} 問${q.num}</span>
      <span class="tag">${FMTLBL[q.format]}</span>
      ${q.negative?'<span class="tag neg">否定形</span>':''}
      <span class="tag theme">${esc(q.theme)}</span>
      ${(q.topicRank||0)>=12?`<span class="tag hot">頻出</span>`:''}
      ${r.n?`<span class="tag">${r.n}回目${r.ng?`・誤${r.ng}`:''}</span>`:''}
    </div>
    ${verdict}
    <div class="stem">${proseHTML(q.stem,{cue:true})}</div>
    ${tableHTML}${stmtHTML}
    ${q.note?`<div class="note">${proseHTML(q.note)}</div>`:''}
    <div class="opts">${optHTML}</div>
    ${trap}${after}${navHTML}`;

  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  app.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{lap();ses.i=+b.dataset.jump;renderQ();});
  app.querySelectorAll('[data-stmt]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.stmt,c=mk[k];
    if(!c)mk[k]='o'; else if(c==='o')mk[k]='x'; else delete mk[k];
    renderQ();});
  const sb=document.getElementById('simBtn');
  if(sb)sb.onclick=()=>startSession([q,...q.similar.map(i=>BY[i]).filter(Boolean)],'practice','類題');
  bindTopics();
  renderBar();window.scrollTo(0,0);
}
const circleSVG=()=>`<svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="14" style="--len:88"/></svg>`;
const crossSVG =()=>`<svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><path d="M9 9 L31 31" style="--len:32"/><path class="s2" d="M31 9 L9 31" style="--len:32"/></svg>`;

function choose(n){
  const q=ses.qs[ses.i];
  lap();
  if(ses.mode==='exam'){ses.ans[ses.i]=(ses.ans[ses.i]===n?null:n);renderQ();return;}
  if(ses.shown[ses.i])return;
  ses.ans[ses.i]=n;ses.shown[ses.i]=true;
  const r=rec(q.id),first=r.n===0;r.n++;r.last=Date.now();
  const ok=n===q.answer; if(!ok)r.ng++;
  schedule(r,ok); logTime(q.id,ses.ms[ses.i]);
  const gain=ok?(first?10:4):1;
  S.xp+=gain;ses.gain+=gain;
  S.combo=ok?S.combo+1:0;S.bestCombo=Math.max(S.bestCombo||0,S.combo);
  touchDay();
  const rb=rankOf(S.xp-gain).grade,ra=rankOf(S.xp).grade;
  const got=checkBadges();save();renderQ();
  if(rb!==ra)toast(`<b>${ra}</b> に昇級しました`);
  else if(got.length)toast(`実績 <b>${got[0].t}</b> を獲得`);
  else if(S.combo>0&&S.combo%10===0)toast(`<b>${S.combo}問</b>連続正解`);
  else if((S.days[today()]||0)===S.goal)toast(`今日の目標 <b>${S.goal}問</b> 達成`);
}

function renderBar(){
  const q=ses.qs[ses.i],flagged=(S.q[q.id]||{}).flag,last=ses.i===ses.qs.length-1;
  barSlot.innerHTML=`<div class="bar"><div class="inner">
      <button class="ghost" id="prev" ${ses.i?'':'disabled'}>前へ</button>
      <button class="ghost" id="flag" aria-pressed="${flagged?'true':'false'}">付箋</button>
      <span class="spacer"></span>
      ${ses.mode==='exam'
        ?(last?'<button class="next" id="submit">採点する</button>':'<button class="next" id="next">次へ</button>')
        :(last?'<button class="next" id="submit">結果を見る</button>':`<button class="next" id="next">${ses.shown[ses.i]?'次へ':'とばす'}</button>`)}
    </div></div>`;
  const G=id=>document.getElementById(id);
  if(G('prev'))G('prev').onclick=()=>{lap();ses.i--;renderQ();};
  G('flag').onclick=()=>{const r=rec(q.id);r.flag=!r.flag;save();renderQ();};
  if(G('next'))G('next').onclick=()=>{lap();ses.i++;renderQ();};
  if(G('submit'))G('submit').onclick=()=>ses.mode==='exam'?finishExam():finishPractice();
}

function finishExam(){
  clearInterval(timerId);lap();
  let gain=0;
  ses.qs.forEach((q,i)=>{const r=rec(q.id),first=r.n===0;r.n++;r.last=Date.now();
    const ok=ses.ans[i]===q.answer;if(!ok)r.ng++;schedule(r,ok);logTime(q.id,ses.ms[i]);
    gain+=ok?(first?10:4):1;});
  S.xp+=gain;ses.gain=gain;touchDay(ses.qs.length);
  const score=ses.qs.filter((q,i)=>ses.ans[i]===q.answer).length;
  const y=META.years.find(v=>v.kai===ses.kai),pass=y?y.pass:30;
  S.exams.unshift({t:Date.now(),title:ses.title,score,total:ses.qs.length,pass});
  S.exams=S.exams.slice(0,60);
  const got=checkBadges();save();
  renderResult(score,pass);if(got.length)toast(`実績 <b>${got[0].t}</b> を獲得`);
}
function finishPractice(){lap();
  const done=ses.shown.filter(Boolean).length;
  renderResult(ses.qs.filter((q,i)=>ses.shown[i]&&ses.ans[i]===q.answer).length,null,done);}

function renderStats(){
  homeBtn.hidden=false;barSlot.innerHTML='';topInfo.innerHTML='';readBtn.hidden=true;
  const agg=qs=>{const d=qs.filter(q=>(S.q[q.id]||{}).n>0);
    const n=d.reduce((a,q)=>a+S.q[q.id].n,0),g=d.reduce((a,q)=>a+S.q[q.id].ng,0);
    return{done:d.length,total:qs.length,acc:pct(n-g,n),n};};
  const bySec=SECS.map(s=>({s,...agg(DB.filter(q=>q.sectionShort===s))}));
  const byKai=META.years.map(y=>({y,...agg(DB.filter(q=>q.kai===y.kai))}));
  app.className='wrap';
  app.innerHTML=`<h1 class="h1">成績</h1><p class="lede">正答率は延べ解答回数に対する割合です。</p>
    <h2 class="h2">分野別</h2>
    <div class="breakdown">${bySec.map(b=>`
      <div class="br"><span class="n">${b.s}</span>
        <span class="track"><span class="fill" style="width:${b.acc}%;background:var(${SECVAR[b.s]})"></span></span>
        <span class="v">${b.n?b.acc+'%':'—'}</span></div>
      <div class="br sub"><span class="n">　解答済</span>
        <span class="track"><span class="fill" style="width:${pct(b.done,b.total)}%;background:var(--ink-3);opacity:.55"></span></span>
        <span class="v">${b.done}/${b.total}</span></div>`).join('')}</div>
    <h2 class="h2">回別</h2>
    <div class="breakdown">${byKai.map(b=>`
      <div class="br"><span class="n">${b.y.label}</span>
        <span class="track"><span class="fill" style="width:${b.acc}%;background:var(--pri)"></span></span>
        <span class="v">${b.n?b.acc+'%':'—'}</span></div>`).join('')}</div>
    <h2 class="h2">模試の記録</h2>
    ${S.exams.length?`<div class="list">${S.exams.map(e=>`
        <div class="li"><span class="id">${new Date(e.t).toLocaleDateString('ja-JP')}</span>
          <span class="tx">${esc(e.title)}</span>
          <span class="ans"><span class="${e.score>=e.pass?'yes':'no'}">${e.score}/${e.total}</span>　基準 ${e.pass}</span></div>`).join('')}</div>`
      :'<p class="empty">まだ模試の記録がありません。</p>'}`;
}

/* ===== 全体操作 ===== */
document.getElementById('brandBtn').onclick=()=>{if(!ses)renderHome();else homeBtn.click();};
homeBtn.onclick=()=>{
  if(ses&&ses.mode==='exam'&&!confirm('模試を中断してホームに戻ります。よろしいですか？'))return;
  clearInterval(timerId);renderHome();};
const prefs=(()=>{try{return JSON.parse(localStorage.getItem('kashikin.prefs'))||{};}catch(e){return{};}})();
const applyPrefs=()=>{const R=document.documentElement;
  if(prefs.theme)R.setAttribute('data-theme',prefs.theme);
  R.setAttribute('data-size',prefs.size||'m');
  R.setAttribute('data-dim',prefs.dim===false?'off':'on');};
const savePrefs=()=>{try{localStorage.setItem('kashikin.prefs',JSON.stringify(prefs));}catch(e){}applyPrefs();};
applyPrefs();
document.getElementById('themeBtn').onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const sys=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
  prefs.theme=cur?(cur==='dark'?'light':'dark'):(sys==='dark'?'light':'dark');savePrefs();};
readBtn.onclick=()=>{
  const o=['s','m','l'],i=o.indexOf(prefs.size||'m');
  if(i<o.length-1)prefs.size=o[i+1];
  else{prefs.size='s';prefs.dim=(prefs.dim===false);}
  savePrefs();toast(`文字 ${({s:'小',m:'中',l:'大'})[prefs.size]}　定義かっこ ${prefs.dim===false?'通常':'うすく'}`);};
document.addEventListener('keydown',e=>{
  if(!ses||e.metaKey||e.ctrlKey||e.altKey)return;
  if(/^[1-4]$/.test(e.key)){e.preventDefault();choose(+e.key);}
  else if(e.key==='ArrowRight'||e.key==='Enter'){if(ses.i<ses.qs.length-1){e.preventDefault();lap();ses.i++;renderQ();}}
  else if(e.key==='ArrowLeft'){if(ses.i>0){e.preventDefault();lap();ses.i--;renderQ();}}
  else if(e.key==='f'){e.preventDefault();const r=rec(ses.qs[ses.i].id);r.flag=!r.flag;save();renderQ();}
});
checkBadges(); save();   // 起動時にも実績を判定（過去の記録を引き継いだ場合に備えて）
renderHome();
</script>
